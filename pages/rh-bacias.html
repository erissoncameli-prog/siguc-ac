<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SIGUC-AC · Bacias Hidrográficas</title>
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/agua-painel.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="../js/observability.js"></script>
<script src="../js/queryLogger.js"></script>
<script src="../js/config.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/mapa-recorte.js"></script>
<script src="../js/grafico-teclado.js"></script>
<script src="../js/agua-iqa-visual.js"></script>
<script src="../js/agua-relatorio-dados.js"></script>
<script src="../js/agua-painel.js"></script>
<style>
/* Só o que é DESTA tela — cards, mapa e gráficos vêm de
   css/agua-painel.css + js/agua-painel.js + js/agua-iqa-visual.js,
   compartilhados com agua-relatorios.html e agua-publico.html. */

/* Grade de bacias: uma coluna por bacia monitorada (hoje 3 + "sem
   bacia"). auto-fit em vez de número fixo — quando o polígono oficial
   entrar e o cadastro ganhar mais bacias, a tela acompanha sozinha. */
.rhb-bacias { display:grid; grid-template-columns:repeat(auto-fit, minmax(268px, 1fr)); gap:16px; margin-bottom:16px }
.rhb-bacia-card { cursor:pointer; border:1px solid var(--borda); transition:border-color .15s, box-shadow .15s }
.rhb-bacia-card:hover { border-color:var(--borda-forte); box-shadow:var(--sombra-md) }
.rhb-bacia-card.ativo { border-color:var(--adash-azul); box-shadow:0 0 0 1px var(--adash-azul) }
.rhb-bacia-nome { font-family:'Source Serif 4', Georgia, serif; font-size:19px; font-weight:700; color:var(--cinza-900); margin:0 }
.rhb-bacia-sub { font-size:11.5px; color:var(--cinza-500); margin:2px 0 12px }
.rhb-bacia-num { display:flex; gap:16px; flex-wrap:wrap; margin-bottom:10px }
.rhb-num-val { font-size:22px; font-weight:700; color:var(--cinza-900); line-height:1.1; font-variant-numeric:tabular-nums }
.rhb-num-lab { font-size:10.5px; color:var(--cinza-500); text-transform:uppercase; letter-spacing:.04em }
.rhb-bacia-iqa { display:flex; align-items:baseline; gap:8px; margin-bottom:8px }
.rhb-bacia-iqa strong { font-size:27px; font-variant-numeric:tabular-nums; line-height:1 }
.rhb-quarentena { font-size:11px; color:var(--aviso); font-weight:600 }
.rhb-sem-bacia { border-style:dashed }

/* Tabela comparativa — mesma linguagem visual de .adash-tabela-linha
   do painel, mas com uma coluna a mais (bacia). */
.rhb-tab { width:100%; border-collapse:collapse; font-size:13px }
.rhb-tab th { text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--cinza-500); font-weight:700; padding:0 10px 8px 0; white-space:nowrap }
.rhb-tab td { padding:9px 10px 9px 0; border-top:1px solid var(--borda); vertical-align:middle }
.rhb-tab td.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap }
.rhb-tab tr.ativo td { background:var(--azul-bg) }
.rhb-tab-nome { font-weight:600; color:var(--cinza-900) }
.rhb-tab-rios { font-size:11px; color:var(--cinza-500) }

.rhb-serie-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:16px }
.rhb-aviso {
  display:flex; gap:10px; align-items:flex-start; background:var(--ouro-bg); border:1px solid #F0D98C;
  border-radius:12px; padding:12px 14px; margin-bottom:16px; font-size:12.5px; color:#6B5310; line-height:1.55;
}
.rhb-aviso svg { width:17px; height:17px; flex:none; margin-top:1px }
.rhb-aviso strong { display:block; color:#4A3A08 }
</style>
</head>
<body>
<div id="app"></div>
<script>
;(async function () {
  const usuario = await carregarUsuario()
  if (!usuario) { window.location.href = '../index.html'; return }

  const { data: nivel } = await db.rpc('nivel_efetivo', { p_usuario: usuario.id, p_modulo_chave: 'bacias' })
  if (!nivel || nivel === 'sem_acesso') {
    document.body.innerHTML = '<div style="padding:60px;text-align:center;font-family:\'DM Sans\',sans-serif;color:#6B7280">Você não tem acesso ao módulo Bacias Hidrográficas.</div>'
    return
  }

  document.getElementById('app').innerHTML =
    gerarLayout('Bacias Hidrográficas', 'rh-bacias') +
    `<div class="fade-in adash">
      <div class="adash-head">
        <div>
          <h1 class="adash-titulo">Bacias Hidrográficas do Acre</h1>
          <p class="adash-sub">Comparativo entre as bacias monitoradas pela SEMA: onde estão os pontos de
            coleta, quanto cada bacia já foi medida e como o IQA evoluiu em cada uma. IQA e conformidade
            CONAMA vêm prontos do banco — nunca recalculados aqui — e coleta em conferência entra marcada,
            nunca escondida.</p>
        </div>
        <div class="adash-head-acoes">
          <button class="adash-pill" type="button" onclick="alternarExplicacaoIqa()" data-icon="help">Entenda o cálculo</button>
          <a class="adash-pill adash-pill-primary" href="../pages/agua-relatorios.html" data-icon="file-text">Relatório completo</a>
        </div>
      </div>

      <div class="rhb-aviso">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <div>
          <strong>A divisão por bacia ainda vem do cadastro do ponto, não de um polígono oficial.</strong>
          O limite geográfico de cada bacia (ottobacias da ANA) não está carregado no sistema — quando
          estiver, a bacia de cada ponto passa a ser determinada por posição, e esta tela ganha os
          contornos no mapa. Os números abaixo já são reais: saem das coletas de <code>agua_coletas</code>.
        </div>
      </div>

      <div class="adash-card adash-mapa-card">
        <div class="adash-card-topo">
          <div><p class="adash-card-tit">Pontos de coleta e rede hidrográfica</p>
            <p class="adash-card-tit-sub" id="rhb-mapa-sub">Carregando pontos...</p></div>
          <span class="adash-card-mais">•••</span>
        </div>
        <div class="adash-mapa-wrap"><div id="rhb-mapa"></div></div>
      </div>

      <div id="rhb-conteudo"><div class="adash-vazio">Carregando bacias...</div></div>
    </div>
    <div class="modal-overlay" id="rhb-iqa-modal"><div class="modal" style="max-width:560px">${aguaPainelExplicacaoIqaHTML()}</div></div>`

  bIconsAplicar(document.getElementById('app'))

  window.alternarExplicacaoIqa = function () {
    document.getElementById('rhb-iqa-modal').classList.toggle('aberto')
  }

  // ── Estado ───────────────────────────────────────────────────────
  // `_baciaSel` recorta só a EXIBIÇÃO (cards em destaque + pinos no
  // mapa); a comparação entre bacias continua inteira na tabela —
  // escolher uma bacia nunca esconde as outras da comparação, senão a
  // tela perde a razão de existir.
  let _coletas = []
  let _baciaSel = null
  let _pontosGeomPorId = {}
  let _mapaCtl = null

  // Mapa: MESMA função do painel de Relatórios/público
  // (js/agua-painel.js), com `referenciaSempre` — aqui o assunto é a
  // rede hidrográfica, então rios/limites ficam visíveis também no
  // mapa de ruas, não só no satélite.
  // Fail-open: se o Leaflet não carregar (CDN fora do ar, rede de
  // campo ruim), o mapa some mas os números continuam na tela — nunca
  // deixar o painel inteiro em branco por causa da camada visual.
  try {
    _mapaCtl = aguaPainelMapaCriar('rhb-mapa', 'rhb-mapa-sub', { referenciaSempre: true })
  } catch (e) {
    console.warn('[rh-bacias] mapa indisponível:', e.message)
    document.querySelector('.adash-mapa-card')?.setAttribute('hidden', '')
  }

  async function carregarGeometrias() {
    try {
      const { data, error } = await db.from('agua_pontos_coleta').select('id,geom').eq('ativo', true)
      if (error) throw error
      ;(data || []).forEach(p => {
        const ll = geoLatLngDeGeom(p.geom)
        if (ll) _pontosGeomPorId[p.id] = ll
      })
    } catch (e) {
      console.warn('[rh-bacias] pontos (coordenadas) indisponíveis:', e.message)
    }
  }

  function fmtIqa(v) { return v == null ? '—' : v.toFixed(1) }
  function fmtPct(v) { return v == null ? '—' : Math.round(v) + '%' }

  // ── Render ───────────────────────────────────────────────────────
  function render() {
    const bacias = aguaRelPorBacia(_coletas)
    const alvo = document.getElementById('rhb-conteudo')
    if (!bacias.length) {
      alvo.innerHTML = '<div class="adash-vazio">Nenhuma coleta cadastrada ainda.</div>'
      return
    }

    const totalPontos = new Set(_coletas.map(c => c.ponto_id)).size
    const monitoradas = bacias.filter(b => !b.semBacia).length

    const cards = bacias.map(b => `
      <div class="adash-card rhb-bacia-card${b.semBacia ? ' rhb-sem-bacia' : ''}${_baciaSel === b.bacia ? ' ativo' : ''}"
           onclick="selecionarBacia('${b.bacia.replace(/'/g, "\\'")}')" role="button" tabindex="0">
        <p class="rhb-bacia-nome">${esc(b.label)}</p>
        <p class="rhb-bacia-sub">${b.nRios} ${b.nRios === 1 ? 'rio monitorado' : 'rios monitorados'}${b.ultimaCampanha ? ' · última: ' + esc(b.ultimaCampanha) : ''}</p>
        <div class="rhb-bacia-iqa">
          <strong style="color:${b.iqaMedio == null ? AGUA_SEM_IQA_COR : 'var(--cinza-900)'}">${fmtIqa(b.iqaMedio)}</strong>
          <span class="rhb-num-lab">IQA médio</span>
        </div>
        <div class="rhb-bacia-num">
          <div><div class="rhb-num-val">${formatNum(b.nPontos)}</div><div class="rhb-num-lab">Pontos</div></div>
          <div><div class="rhb-num-val">${formatNum(b.nColetas)}</div><div class="rhb-num-lab">Coletas</div></div>
          <div><div class="rhb-num-val">${fmtPct(b.pctConforme)}</div><div class="rhb-num-lab">Conforme</div></div>
        </div>
        ${b.quarentena ? `<p class="rhb-quarentena">${b.quarentena} em conferência</p>` : ''}
      </div>`).join('')

    // Barras do IQA médio por bacia — escala de um tom só (nunca a
    // paleta de faixa): classificar uma MÉDIA numa faixa seria
    // recalcular no cliente o que agua_iqa_faixa() faz no banco.
    const barras = aguaIqaBarrasHTML(bacias.map(b => ({
      label: b.label.length > 12 ? b.label.slice(0, 11) + '…' : b.label,
      titulo: b.label,
      valor: b.iqaMedio,
      valorTexto: fmtIqa(b.iqaMedio),
      fraco: b.quarentena > 0,
    })), { max: 100, height: 200, vazio: 'Sem IQA calculado em nenhuma bacia' })

    const linhas = bacias.map(b => `
      <tr class="${_baciaSel === b.bacia ? 'ativo' : ''}">
        <td>
          <div class="rhb-tab-nome">${esc(b.label)}</div>
          ${b.rios.length ? `<div class="rhb-tab-rios">${esc(b.rios.slice(0, 4).join(', '))}${b.rios.length > 4 ? ` +${b.rios.length - 4}` : ''}</div>` : ''}
        </td>
        <td class="num">${formatNum(b.nPontos)}</td>
        <td class="num">${formatNum(b.nColetas)}</td>
        <td class="num">${formatNum(b.nCampanhas)}</td>
        <td class="num">${fmtIqa(b.iqaMedio)}</td>
        <td class="num">${fmtPct(b.pctConforme)}</td>
        <td class="num">${b.quarentena ? formatNum(b.quarentena) : '—'}</td>
      </tr>`).join('')

    const series = bacias.map(b => `
      <div class="adash-card">
        <div class="adash-card-topo">
          <div><p class="adash-card-tit">${esc(b.label)}</p>
            <p class="adash-card-tit-sub">IQA médio da bacia por campanha</p></div>
        </div>
        ${aguaIqaGraficoHTML(aguaRelSerieBacia(_coletas, b.bacia), { width: 330, height: 165, semLegenda: true })}
      </div>`).join('')

    // Violações CONAMA somadas por bacia — reaproveita o mesmo ranking
    // do painel (aguaRelViolacoesRanking), por bacia em vez do recorte
    // inteiro.
    const violacoes = bacias.map(b => {
      const rank = aguaRelViolacoesRanking({ violacoesPorParametro: b.violacoesPorParametro }, 4)
      return `<div class="adash-lista-linha">
          <span class="adash-lista-nome">${esc(b.label)}</span>
          <span class="adash-lista-val">${rank.length ? esc(rank.map(r => `${r.label} (${r.n})`).join(' · ')) : 'Nenhuma violação registrada'}</span>
        </div>`
    }).join('')

    alvo.innerHTML = `
      <div class="rhb-bacias">${cards}</div>

      <div class="adash-card" style="margin-bottom:16px">
        <div class="adash-card-topo">
          <div><p class="adash-card-tit">Comparativo entre bacias</p>
            <p class="adash-card-tit-sub">${monitoradas} bacia${monitoradas === 1 ? '' : 's'} com ponto cadastrado · ${formatNum(totalPontos)} pontos · ${formatNum(_coletas.length)} coletas</p></div>
        </div>
        <div style="overflow-x:auto">
          <table class="rhb-tab">
            <thead><tr>
              <th>Bacia</th><th style="text-align:right">Pontos</th><th style="text-align:right">Coletas</th>
              <th style="text-align:right">Campanhas</th><th style="text-align:right">IQA médio</th>
              <th style="text-align:right">Conforme</th><th style="text-align:right">Em conferência</th>
            </tr></thead>
            <tbody>${linhas}</tbody>
          </table>
        </div>
      </div>

      <div class="adash-card" style="margin-bottom:16px">
        <div class="adash-card-topo">
          <div><p class="adash-card-tit">IQA médio por bacia</p>
            <p class="adash-card-tit-sub">Média das coletas com índice calculado — a média não é classificada em faixa</p></div>
        </div>
        ${barras}
      </div>

      <div class="rhb-serie-grid" style="margin-bottom:16px">${series}</div>

      <div class="adash-card">
        <div class="adash-card-topo">
          <div><p class="adash-card-tit">Parâmetros fora do limite CONAMA, por bacia</p>
            <p class="adash-card-tit-sub">Conformidade é leitura SEPARADA do IQA — uma bacia pode ter IQA bom e violar um limite</p></div>
        </div>
        ${violacoes}
      </div>`

    bIconsAplicar(alvo)
  }

  function atualizarMapa() {
    // `aguaRelMontar` agrupa por ponto e é o mesmo formato que o mapa
    // do painel consome — com `bacia` quando há uma selecionada.
    if (!_mapaCtl) return
    const rel = aguaRelMontar(_coletas, _baciaSel ? { bacia: _baciaSel } : {})
    _mapaCtl.atualizar(rel, _pontosGeomPorId)
  }

  // Clicar num card/bacia recorta o MAPA (e destaca o card); clicar de
  // novo na mesma bacia volta ao Acre inteiro.
  window.selecionarBacia = function (bacia) {
    _baciaSel = _baciaSel === bacia ? null : bacia
    render()
    atualizarMapa()
  }

  // ── Carga ────────────────────────────────────────────────────────
  try {
    const [coletas] = await Promise.all([aguaRelBuscarTodasColetas(db), carregarGeometrias()])
    _coletas = coletas
  } catch (e) {
    document.getElementById('rhb-conteudo').innerHTML =
      `<div class="adash-vazio">Não foi possível carregar as coletas: ${esc(e.message)}</div>`
    return
  }
  render()
  atualizarMapa()
})()
</script>
</body>
</html>
