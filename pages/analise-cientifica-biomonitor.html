<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SIGUC-AC · Relatório Científico da Temporada</title>
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/biomonitor-mesa-theme.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/observability.js"></script>
<script src="../js/queryLogger.js"></script>
<script src="../js/config.js"></script>
<script src="../js/config-sistema.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/biomonitor-especies.js"></script>
<script src="../js/biomonitor-fundamentacao.js"></script>
<script src="../js/grafico-teclado.js"></script>
<script src="../js/biomonitor-analise-ciencia.js"></script>
<script src="../js/biomonitor-analise.js"></script>
<script src="../js/biomonitor-analise-comparativa.js"></script>
<style>
/* ── Relatório Científico da Temporada ──
   Documento de leitura longa: coluna de texto ~72ch, índice lateral fixo
   no computador, 5 partes (A–E). Revisão de 10/2026 com a skill
   ui-ux-pro-max + regras do projeto:
   • número de KPI em DM Sans com algarismos tabulares (nunca Fraunces
     nem monoespaçada — regra do sistema); Fraunces só nos títulos;
   • selos Observado / Referência / Estimado no lugar de só texto;
   • cor de espécie da paleta validada para daltonismo
     (js/biomonitor-analise-ciencia.js);
   • tabela sempre dentro de .table-wrap (sem rolagem da página no celular). */
.ac-filtros {
  display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end;
  background:var(--branco); border-radius:var(--raio-lg);
  padding:14px 16px; margin-bottom:22px; border:1px solid var(--borda);
}
.ac-filtros label { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--cinza-600); font-weight:500; }
.ac-filtros select { background:var(--branco); border:1px solid var(--borda-forte); color:var(--cinza-900); border-radius:var(--raio); padding:7px 10px; font-size:13px; min-width:160px; min-height:34px; }
.ac-loading { padding:60px 20px; text-align:center; color:var(--cinza-500); font-size:14px; }

/* Multi-seleção de temporadas (chips) — 2+ marcadas vira Relatório Comparativo */
.ac-temp-chips { display:flex; flex-wrap:wrap; gap:6px; max-width:460px; }
.ac-temp-chip { border:1px solid var(--borda-forte); background:var(--branco); color:var(--cinza-700);
  border-radius:999px; padding:5px 12px; font-size:12px; cursor:pointer; transition:background .15s, border-color .15s; line-height:1.3; min-height:28px; }
.ac-temp-chip:hover { border-color:var(--bio-prim,#1A6B8C); }
.ac-temp-chip.ativo { background:var(--bio-prim,#1A6B8C); border-color:var(--bio-prim,#1A6B8C); color:#fff; font-weight:600; }
.ac-temp-hint { font-size:11px; color:var(--cinza-500); margin-top:2px; font-weight:400; }

/* ── Relatório Comparativo entre Temporadas (js/biomonitor-analise-comparativa.js) ── */
.ac-cmp-badge { font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; padding:1px 6px; border-radius:999px; margin-left:5px; white-space:nowrap; vertical-align:1px; }
.ac-cmp-badge.andamento { background:#FEF3C7; color:#92400E; }
.ac-cmp-delta { display:inline-flex; align-items:center; gap:3px; font-weight:700; color:var(--c,#6B7280); white-space:nowrap; }
.ac-table th.ac-cmp-th-temp { text-align:right; }
.ac-cmp-th-and { display:block; font-size:9px; font-weight:600; color:#92400E; text-transform:none; letter-spacing:0; }
.ac-capa-temp-lista { margin-top:14px; font-size:13px; color:#1A6B8C; display:flex; flex-direction:column; gap:3px; font-weight:600; }
.ac-fase-cards { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:18px 0; }
@media (max-width:720px){ .ac-fase-cards { grid-template-columns:1fr; } }
.ac-fase-card { background:var(--branco); border:1px solid var(--borda); border-left:4px solid var(--c); border-radius:var(--raio-lg); padding:13px 15px; }
.ac-fase-top { display:flex; justify-content:space-between; align-items:center; }
.ac-fase-lbl { font-weight:700; color:var(--cinza-900); font-size:14px; }
.ac-fase-badge { font-size:9px; font-weight:800; background:var(--c); color:#fff; padding:2px 7px; border-radius:999px; letter-spacing:.05em; }
.ac-fase-sub { font-size:11px; color:var(--cinza-500); margin:2px 0 10px; }
.ac-fase-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
.ac-fase-grid > div { display:flex; flex-direction:column; }
.ac-fase-grid b { font-size:1.1rem; color:var(--cinza-900); font-family:var(--font-sans); font-variant-numeric:tabular-nums; }
.ac-fase-grid span { font-size:10.5px; color:var(--cinza-500); }

/* ── Cabeçalho ── */
.ac-doc-head { border-bottom:2px solid var(--ouro,#C9A84C); padding-bottom:16px; margin-bottom:24px; display:flex; flex-direction:column; gap:8px; }
.ac-doc-brand { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--cinza-500); font-weight:700; }
.ac-doc-title { font-size:1.9rem; margin:0; color:var(--cinza-900); font-family:var(--font-display); font-weight:600; line-height:1.15; text-wrap:balance; }
.ac-doc-meta { display:flex; flex-wrap:wrap; gap:6px 20px; font-size:13px; color:var(--cinza-600); }
.ac-doc-meta strong { color:var(--cinza-900); }
.ac-doc-nota { margin:4px 0 0; font-size:12px; color:var(--cinza-600); line-height:1.5; max-width:70ch; }
.ac-selos-legenda { display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px; font-size:11.5px; color:var(--cinza-500); }

/* Selos */
.ac-selo { display:inline-flex; align-items:center; font-size:10px; font-weight:700; letter-spacing:.02em; padding:1px 7px; border-radius:999px; border:1px solid currentColor; line-height:1.5; vertical-align:1px; white-space:nowrap; }
.ac-selo-obs { color:#1F7A55; }
.ac-selo-ref { color:#4B5563; border-style:dashed; }
.ac-selo-est { color:#9A5B00; background:#FFF7E6; }

/* ── Documento: índice + corpo ── */
.ac-doc { display:grid; grid-template-columns:minmax(0,1fr); gap:32px; }
.ac-corpo { min-width:0; display:flex; flex-direction:column; gap:8px; }
.ac-indice { display:none; }
@media (min-width:1280px) {
  .ac-doc { grid-template-columns:200px minmax(0,1fr); }
  .ac-indice { display:block; position:sticky; top:76px; align-self:start; max-height:calc(100vh - 96px); overflow:auto;
    font-size:12.5px; padding-right:8px; border-right:1px solid var(--borda); }
}
.ac-indice-t { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--cinza-500); font-weight:700; margin-bottom:10px; }
.ac-indice-parte { font-weight:700; color:var(--cinza-800); margin:12px 0 4px; display:flex; align-items:center; gap:6px; }
.ac-indice-letra { display:inline-grid; place-items:center; width:20px; height:20px; border-radius:6px; background:var(--cinza-100); color:var(--cinza-700); font-size:11px; }
.ac-indice ul { list-style:none; margin:0; padding:0 0 0 26px; display:flex; flex-direction:column; gap:2px; }
.ac-indice a { color:var(--cinza-600); text-decoration:none; display:block; padding:3px 0; min-height:24px; line-height:1.35; }
.ac-indice a:hover { color:var(--bio-prim,#1A6B8C); }

.ac-parte { display:flex; flex-direction:column; gap:30px; padding-top:10px; }
.ac-parte + .ac-parte { margin-top:18px; border-top:1px solid var(--borda); padding-top:26px; }
.ac-parte-head { display:flex; align-items:center; gap:10px; }
.ac-parte-letra { display:grid; place-items:center; width:30px; height:30px; border-radius:8px; background:#0A1A0F; color:#F0CB6A; font-weight:700; font-size:14px; }
.ac-parte-titulo { font-size:12px; letter-spacing:.1em; text-transform:uppercase; font-weight:700; color:var(--cinza-600); }

/* Seções */
.ac-sec { scroll-margin-top:76px; display:flex; flex-direction:column; gap:12px; }
.ac-sec-head { display:flex; align-items:flex-start; gap:12px; }
.ac-sec-num { flex:0 0 auto; min-width:30px; height:24px; padding:0 6px; border-radius:6px; background:var(--cinza-100); color:var(--cinza-600);
  display:grid; place-items:center; font-weight:700; font-size:12px; font-variant-numeric:tabular-nums; margin-top:3px; }
.ac-sec-title { font-size:1.2rem; margin:0; color:var(--cinza-900); font-family:var(--font-display); font-weight:600; text-wrap:balance; }
.ac-sec-sub { margin:2px 0 0; font-size:12.5px; color:var(--cinza-500); }

.ac-prosa { font-size:14px; line-height:1.7; color:var(--cinza-800); max-width:72ch; margin:0; }
.ac-prosa strong { color:var(--cinza-900); }
.ac-cite { color:var(--cinza-500); font-size:11px; }
.ac-fine { font-size:12px; color:var(--cinza-500); margin:0; max-width:80ch; line-height:1.55; }
.ac-mini-title { font-size:13px; font-weight:700; color:var(--cinza-800); margin:8px 0 0; }

/* Achados */
.ac-achados { background:#F1F8F4; border:1px solid #D3EADC; border-radius:var(--raio-lg); padding:14px 18px; display:flex; flex-direction:column; gap:6px; }
.ac-achados-t { font-weight:700; font-size:13px; color:#1F7A55; }
.ac-achados ul { margin:0; padding-left:18px; display:flex; flex-direction:column; gap:4px; font-size:14px; line-height:1.55; color:var(--cinza-800); max-width:80ch; }

/* Avisos — 3 níveis */
.ac-flag { background:#FFF4ED; border:1px solid #FED7AA; color:#9A3412; border-radius:10px; padding:10px 14px; font-size:13px; line-height:1.55; display:flex; flex-direction:column; gap:4px; }
.ac-flag-warn { background:#FFFBEB; border-color:#FCD34D; color:#854D0E; }
.ac-flag-info { background:#F0F6FC; border-color:#C9DDF2; color:#1E3A5F; }

/* KPIs — número em DM Sans tabular */
.ac-kpis { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px; }
.ac-kpis-4 { grid-template-columns:repeat(4,minmax(0,1fr)); }
@media (max-width:860px){ .ac-kpis-4 { grid-template-columns:repeat(2,minmax(0,1fr)); } }
.ac-kpi { background:var(--branco); border-radius:var(--raio-lg); padding:13px 14px; border:1px solid var(--borda); display:flex; flex-direction:column; gap:6px; position:relative; }
.ac-kpi::before { content:''; position:absolute; left:14px; top:0; width:28px; height:3px; border-radius:0 0 3px 3px; background:var(--c,#1D6FA8); }
.ac-kpi-v { font-family:var(--font-sans); font-size:1.55rem; font-weight:700; color:var(--cinza-900); line-height:1.05; font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
.ac-kpi-l { font-size:12px; color:var(--cinza-600); line-height:1.35; }
.ac-kpi-nota { font-size:11.5px; color:#9A5B00; font-weight:600; line-height:1.35; }

/* Fases (linha de etapas) */
.ac-etapas { list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:0; position:relative; }
@media (max-width:760px){ .ac-etapas { grid-template-columns:1fr; gap:10px; } }
.ac-etapa { position:relative; padding:22px 12px 0 0; display:flex; flex-direction:column; gap:2px; }
.ac-etapa::before { content:''; position:absolute; left:0; right:0; top:7px; height:3px; background:var(--cinza-200); }
.ac-etapa-feito::before, .ac-etapa-atual::before { background:#2A9D6F; }
.ac-etapa-atual::before { background:linear-gradient(90deg,#2A9D6F 50%, var(--cinza-200) 50%); }
.ac-etapa-marca { position:absolute; left:0; top:1px; width:15px; height:15px; border-radius:50%; background:var(--branco); border:3px solid var(--cinza-300); }
.ac-etapa-feito .ac-etapa-marca { background:#2A9D6F; border-color:#2A9D6F; }
.ac-etapa-atual .ac-etapa-marca { border-color:#2A9D6F; box-shadow:0 0 0 4px rgba(42,157,111,.18); }
.ac-etapa-previsto .ac-etapa-marca { border-style:dashed; }
.ac-etapa-t { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.ac-etapa-t b { font-size:14px; color:var(--cinza-900); }
.ac-etapa-st { font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--cinza-500); }
.ac-etapa-atual .ac-etapa-st { color:#1F7A55; }
.ac-etapa-sub { font-size:12px; color:var(--cinza-500); }
.ac-etapa-d { font-size:12.5px; color:var(--cinza-800); font-variant-numeric:tabular-nums; }

/* Espécies */
.ac-esp-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:12px; }
.ac-esp-card { background:var(--branco); border:1px solid var(--borda); border-radius:var(--raio-lg); padding:14px 16px; display:flex; flex-direction:column; gap:10px; }
.ac-esp-head { display:flex; flex-direction:column; }
.ac-esp-nome { font-weight:700; font-size:15px; color:var(--cinza-900); display:flex; align-items:center; gap:7px; }
.ac-esp-ponto { display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--c,#6B7280); flex:0 0 auto; margin-right:6px; vertical-align:0; }
.ac-esp-nome .ac-esp-ponto { margin-right:0; }
.ac-esp-sci { font-style:italic; font-size:12px; color:var(--cinza-500); padding-left:17px; }
.ac-esp-obs { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; padding-bottom:10px; border-bottom:1px dashed var(--borda); }
.ac-esp-obs > div { display:flex; flex-direction:column; min-width:0; }
.ac-esp-obs b { font-size:15px; color:var(--cinza-900); font-variant-numeric:tabular-nums; }
.ac-esp-obs span { font-size:10.5px; color:var(--cinza-500); line-height:1.2; }
.ac-esp-ref { display:flex; flex-direction:column; gap:6px; }
.ac-esp-ref ul { margin:0; padding-left:16px; font-size:12.5px; color:var(--cinza-700); line-height:1.65; }
.ac-esp-ref b { color:var(--cinza-900); font-variant-numeric:tabular-nums; }
.ac-esp-nota { font-size:12px; color:#9A5B00; line-height:1.5; margin:0; }

/* Figuras SVG */
.ac-fig { background:var(--branco); border:1px solid var(--borda); border-radius:var(--raio-lg); padding:14px 16px; display:flex; flex-direction:column; gap:8px; }
.ac-fig svg { display:block; width:100%; max-width:760px; height:auto; }
.ac-legenda { display:flex; flex-wrap:wrap; gap:6px 16px; font-size:12px; color:var(--cinza-600); }

/* Completude */
.ac-barra-cel { display:flex; align-items:center; gap:8px; min-width:150px; }
.ac-barra { flex:1; height:8px; border-radius:4px; background:var(--cinza-100); overflow:hidden; display:block; }
.ac-barra > span { display:block; height:100%; border-radius:4px; }
.ac-barra-v { font-variant-numeric:tabular-nums; font-size:12px; color:var(--cinza-700); min-width:44px; text-align:right; }
.ac-uso { color:var(--cinza-500); font-size:12px; }
.ac-ic { color:var(--cinza-500); font-size:11.5px; }
.ac-pend { color:var(--cinza-500); font-style:italic; }

/* Temperatura */
.ac-temp-grid { display:grid; grid-template-columns:1.6fr 1fr; gap:14px; align-items:center; }
@media (max-width:720px){ .ac-temp-grid { grid-template-columns:1fr; } }
.ac-temp-stats { display:flex; flex-direction:column; gap:10px; }
.ac-temp-stat { background:var(--branco); border:1px solid var(--borda); border-radius:var(--raio-lg); padding:12px 14px; }
.ac-temp-stat b { display:block; font-size:1.35rem; color:var(--cinza-900); font-variant-numeric:tabular-nums; }
.ac-temp-stat span { font-size:12px; color:var(--cinza-500); }

/* Gráficos Chart.js */
.ac-chart-wrap { background:var(--branco); border:1px solid var(--borda); border-radius:var(--raio-lg); padding:14px; position:relative; height:220px; overflow:hidden; }
.ac-chart-wrap canvas { max-width:100% !important; width:100% !important; max-height:100%; }
.ac-chart-rosca { height:240px; max-width:520px; }

/* Tabelas */
.ac-tw { border:1px solid var(--borda); border-radius:var(--raio-lg); background:var(--branco); }
.ac-table { width:100%; border-collapse:collapse; font-size:13px; background:var(--branco); }
.ac-tw .ac-table { margin:0; }
.ac-table th, .ac-table td { padding:8px 12px; text-align:left; border-bottom:1px solid var(--borda); vertical-align:top; }
.ac-table tbody tr:last-child td { border-bottom:0; }
.ac-table th { background:var(--cinza-50); font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--cinza-600); font-weight:700; }
.ac-table td.num, .ac-table th.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
.ac-row-alert td { background:#FFF7ED; }
.ac-tag-exp { font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:#9A5B00; background:#FFF4D6; padding:1px 6px; border-radius:999px; }

/* Recomendações */
.ac-recs { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px; }
.ac-rec { background:var(--branco); border:1px solid var(--borda); border-radius:var(--raio-lg); padding:12px 15px; display:flex; flex-direction:column; gap:4px; }
.ac-rec-t { font-weight:700; font-size:13.5px; color:var(--cinza-900); }
.ac-rec-d { font-size:13px; color:var(--cinza-700); line-height:1.55; }

/* Referências */
.ac-refs { list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:8px; }
.ac-ref { display:flex; gap:10px; font-size:12.5px; color:var(--cinza-700); line-height:1.55; }
.ac-ref-n { flex:0 0 auto; width:22px; height:22px; border-radius:6px; background:var(--cinza-100); color:var(--cinza-600); display:grid; place-items:center; font-size:11px; font-weight:700; font-variant-numeric:tabular-nums; }
.ac-ref-txt a { color:var(--bio-prim,#1A6B8C); word-break:break-all; font-size:11.5px; }
.ac-metodo .ac-prosa { font-size:13px; }

/* Página não pode rolar de lado no celular (lição do relatório CAR na UC) */
.main-content { min-width:0; }

/* ── Capa institucional (só na impressão) ── */
#ac-capa { display:none; }

@media (prefers-reduced-motion: reduce) {
  .ac-temp-chip { transition:none; }
  html { scroll-behavior:auto; }
}

@media print {
  @page {
    size:A4 portrait; margin:16mm 14mm 15mm;
    @top-center  { content:"SEMA-AC · DIMA · Biomonitor Quelônios — Relatório Científico da Temporada"; font-size:8px; color:#6B7280; }
    @bottom-left { content:"Governo do Estado do Acre · SIGUC-AC"; font-size:8px; color:#9CA3AF; }
    @bottom-right{ content:"Página " counter(page) " de " counter(pages); font-size:8px; color:#6B7280; }
  }
  @page:first { @top-center { content:""; } }

  .sidebar, .sidebar-overlay, .topbar, .mobile-menu-btn,
  .sidebar-footer, #siguc-progress-bar,
  .ac-filtros, .no-print, .ac-indice, .ac-doc-head, .gt-dica, .gt-tabela { display:none !important; }
  html, body { background:#fff !important; }
  .app-layout, .main-content, .page-body, #app { display:block !important;
    margin:0 !important; padding:0 !important; width:auto !important;
    max-width:none !important; height:auto !important; overflow:visible !important; }
  .ac-doc { display:block !important; }
  .ac-parte + .ac-parte { break-before:page; border-top:0; margin-top:0; }
  .ac-chart-wrap, .ac-fase-card, .ac-esp-card, .ac-fig, .ac-kpi,
  .ac-rec, .ac-table tr, .ac-achados, .ac-flag { break-inside:avoid; }
  .ac-sec-head, .ac-mini-title { break-after:avoid; }
  .ac-chart-wrap { height:220px; }
  * { -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }

  #ac-capa { display:flex !important; flex-direction:column; min-height:250mm;
    break-after:page; text-align:center; }
  .ac-capa-logos { display:flex; justify-content:space-between; align-items:center; margin:4mm 0 14px; }
  .ac-capa-logos img { height:62px; max-width:150px; object-fit:contain; }
  .ac-capa-hier { border-bottom:2px solid #0A1A0F; padding-bottom:12px; }
  .ac-capa-hier .l1 { font-size:10px; color:#6B7280; text-transform:uppercase; letter-spacing:.06em; }
  .ac-capa-hier .l2 { font-size:14px; font-weight:700; color:#0A1A0F; margin-top:3px; }
  .ac-capa-hier .l3 { font-size:11px; color:#4B5563; }
  .ac-capa-mid { margin:auto 0; display:flex; flex-direction:column; gap:5px; align-items:center; }
  .ac-capa-tipo { font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:#1A6B8C; }
  .ac-capa-titulo { font-family:'Fraunces',Georgia,serif; font-size:30px; color:#0A1A0F; margin:6px 0 0; line-height:1.15; }
  .ac-capa-sub { font-size:14px; color:#4B5563; }
  .ac-capa-temp { margin-top:16px; font-size:18px; font-weight:700; color:#1A6B8C; }
  .ac-capa-meta { margin:18px auto 0; border-collapse:collapse; font-size:11px; }
  .ac-capa-meta td { border:1px solid #E5EBF0; padding:5px 12px; text-align:left; }
  .ac-capa-meta td:first-child { color:#6B7280; font-weight:600; background:#F9FAFB; }
  .ac-capa-rodape { margin-top:auto; font-size:9px; color:#9CA3AF; line-height:1.6;
    border-top:1px solid #E5EBF0; padding-top:8px; }
  .ac-capa-aviso { font-style:italic; margin-top:4px; }
}
</style>
</head>
<body class="bio-mesa-theme">
<div id="app"></div>
<script>
;(async function () {
  const usuario = await carregarUsuario()
  if (!usuario) { window.location.href = '../index.html'; return }
  // Nomes de espécie do catálogo (Administrar › Espécies) antes de montar a tela
  if (typeof bioEspCarregar === 'function') await bioEspCarregar(db)

  document.getElementById('app').innerHTML =
    gerarLayout('Relatório Científico', 'analise-cientifica-biomonitor') +
    `<div class="fade-in">
      <div class="ac-filtros no-print">
        <label>Temporada(s)
          <div id="acf-temporadas" class="ac-temp-chips"></div>
          <span class="ac-temp-hint">Marque 2 ou mais para gerar o Relatório Comparativo entre Temporadas</span>
        </label>
        <label>Programa
          <select id="acf-programa"><option value="">Todos os programas</option></select>
        </label>
        <label>Localização
          <select id="acf-localizacao">
            <option value="">Todas as localizações</option>
            <option value="dentro_uc">Dentro de UC</option>
            <option value="margem_livre">Margem Livre</option>
            <option value="terra_indigena">Terra Indígena</option>
            <option value="area_municipal">Área Municipal</option>
            <option value="outro">Outro</option>
          </select>
        </label>
        <label id="acf-uc-wrap" style="display:none">Unidade de Conservação
          <select id="acf-uc"><option value="">Todas as UCs</option></select>
        </label>
        <label>Praia
          <select id="acf-praia"><option value="">Todas as praias</option></select>
        </label>
        <div style="display:flex;gap:8px;align-items:flex-end;margin-top:2px">
          <button class="btn btn-primary" id="acf-aplicar" style="padding:8px 18px">Gerar relatório</button>
          <button class="btn btn-secondary" onclick="window.print()" style="padding:8px 14px" title="Imprimir / Salvar PDF">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
            Imprimir
          </button>
        </div>
      </div>
      <div id="ac-capa"></div>
      <div id="ac-conteudo"><div class="ac-loading">Escolha os filtros e clique em <strong>Gerar relatório</strong>.</div></div>
    </div>`

  if (typeof bIconsAplicar === 'function') bIconsAplicar(document.getElementById('app'))

  const sel = id => document.getElementById(id)
  let _praias = []
  const _temporadasSel = new Set()

  const [{ data: temporadas }, { data: programas }, { data: ucs }, { data: praias }] = await Promise.all([
    db.from('temporadas_biomonitor').select('id,nome,is_atual').order('ano_base', { ascending: false }),
    db.from('programas_biomonitoramento').select('id,nome').eq('ativo', true),
    db.from('unidades_conservacao').select('id,nome,sigla').order('nome'),
    db.from('praias_monitoramento').select('id,nome,uc_id,tipo_localizacao').eq('ativa', true).order('nome'),
  ])
  _praias = praias || []

  // Chips de temporada: 0 ou 1 marcada = relatório de temporada única (comportamento
  // de sempre); 2+ marcadas = Relatório Comparativo. A atual vem pré-marcada.
  const chipsEl = sel('acf-temporadas')
  ;(temporadas || []).forEach(t => {
    if (t.is_atual) _temporadasSel.add(t.id)
    const chip = document.createElement('button')
    chip.type = 'button'
    chip.className = 'ac-temp-chip' + (t.is_atual ? ' ativo' : '')
    chip.textContent = t.nome
    chip.dataset.id = t.id
    chip.addEventListener('click', () => {
      if (_temporadasSel.has(t.id)) _temporadasSel.delete(t.id)
      else _temporadasSel.add(t.id)
      chip.classList.toggle('ativo', _temporadasSel.has(t.id))
    })
    chipsEl.appendChild(chip)
  })

  ;(programas || []).forEach(p => sel('acf-programa').insertAdjacentHTML('beforeend', `<option value="${p.id}">${esc(p.nome)}</option>`))
  ;(ucs || []).forEach(u => sel('acf-uc').insertAdjacentHTML('beforeend', `<option value="${u.id}">${esc((u.sigla || '') + ' ' + u.nome)}</option>`))

  function popularPraias() {
    const loc = sel('acf-localizacao').value
    const ucId = sel('acf-uc').value
    sel('acf-praia').innerHTML = '<option value="">Todas as praias</option>'
    _praias.filter(p => (!loc || p.tipo_localizacao === loc) && (!ucId || p.uc_id === ucId))
      .forEach(p => sel('acf-praia').insertAdjacentHTML('beforeend', `<option value="${p.id}">${esc(p.nome)}</option>`))
  }
  popularPraias()

  sel('acf-localizacao').addEventListener('change', () => {
    const dentroUC = sel('acf-localizacao').value === 'dentro_uc'
    sel('acf-uc-wrap').style.display = dentroUC ? '' : 'none'
    if (!dentroUC) sel('acf-uc').value = ''
    popularPraias()
  })
  sel('acf-uc').addEventListener('change', popularPraias)

  function filtros() {
    return {
      temporadas: Array.from(_temporadasSel),
      programa: sel('acf-programa').value || null,
      uc: sel('acf-uc').value || null,
      praia: sel('acf-praia').value || null,
      localizacao: sel('acf-localizacao').value || null,
    }
  }

  // 2+ temporadas marcadas → Relatório Comparativo; 0 ou 1 → relatório de
  // temporada única (comportamento original, intacto).
  function gerarRelatorio() {
    const f = filtros()
    if (f.temporadas.length > 1) window.acAplicarComparativo(f.temporadas, f)
    else window.acAplicar({ ...f, temporada: f.temporadas[0] || null })
  }
  sel('acf-aplicar').addEventListener('click', gerarRelatorio)

  // Gera automaticamente na abertura (temporada corrente pré-marcada)
  gerarRelatorio()
})()
</script>
</body>
</html>
