<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SIGUC-AC · Relatórios Biomonitor</title>
<link rel="stylesheet" href="../css/global.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/observability.js"></script>
<script src="../js/queryLogger.js"></script>
<script src="../js/config.js"></script>
<script src="../js/config-sistema.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/biomonitor-timeline.js"></script>
<script src="../js/biomonitor-pdf-fonts.js"></script>
<script src="../js/relatorio-cabecalho-pdf.js"></script>
<script src="../js/biomonitor-relatorio-ninho.js"></script>
<style>
/* ── Relatório Biomonitor ── */
.rel-filtros {
  display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end;
  background:var(--branco); border-radius:var(--raio-lg);
  padding:14px 16px; margin-bottom:20px; border:1px solid var(--borda);
  box-shadow:var(--sombra);
}
.rel-filtros label { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--cinza-500); }
.rel-filtros select { background:var(--branco); border:1px solid var(--borda-forte); color:var(--cinza-900); border-radius:var(--raio); padding:7px 10px; font-size:13px; min-width:160px; }
.rel-nav {
  display:flex; gap:6px; flex-wrap:wrap; margin-bottom:20px;
}
.rel-nav a {
  padding:6px 14px; border-radius:20px; font-size:12px; font-weight:600;
  background:var(--branco); color:var(--cinza-700); text-decoration:none;
  border:1px solid var(--borda); transition:all .15s;
  box-shadow:var(--sombra);
}
.rel-nav a:hover { background:var(--verde-bg); border-color:var(--verde-claro); color:var(--verde); }

/* ── Abas principais (Painel | Detalhado | Mapa) ── */
.rel-tabs { display:flex; gap:4px; margin-bottom:18px; border-bottom:2px solid var(--borda); }
.rel-tab {
  font-size:14px; font-weight:700; color:var(--cinza-500);
  padding:9px 18px 11px; border:0; background:none; cursor:pointer;
  border-bottom:3px solid transparent; margin-bottom:-2px; transition:color .15s;
}
.rel-tab:hover { color:var(--cinza-800); }
.rel-tab.ativo { color:var(--verde); border-bottom-color:var(--ouro); }
.rel-tab-pane[hidden] { display:none; }

/* ── Painel do gestor ── */
.painel-kpis { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin-bottom:16px; }
@media (max-width:820px) { .painel-kpis { grid-template-columns:repeat(2,1fr); } }
.painel-kpi {
  background:var(--branco); border-radius:var(--raio-lg); padding:13px 14px;
  border-top:3px solid var(--kpi-cor,#3b82f6);
  border-left:1px solid var(--borda); border-right:1px solid var(--borda); border-bottom:1px solid var(--borda);
  box-shadow:var(--sombra);
}
.painel-kpi-val { font-size:1.6rem; font-weight:700; color:var(--kpi-cor,#3b82f6); line-height:1; font-family:monospace; }
.painel-kpi-lbl { font-size:11px; color:var(--cinza-500); margin-top:5px; line-height:1.2; }
.painel-kpi-sub { font-size:10px; color:var(--cinza-400); margin-top:2px; line-height:1.25; }

.painel-grid { display:grid; grid-template-columns:1.1fr 1fr; gap:14px; margin-bottom:16px; }
@media (max-width:820px) { .painel-grid { grid-template-columns:1fr; } }
.painel-card { background:var(--branco); border-radius:var(--raio-lg); padding:15px 16px; border:1px solid var(--borda); box-shadow:var(--sombra); }
.painel-card h3 { margin:0 0 2px; font-size:14px; font-weight:700; color:var(--cinza-900); }
.painel-card .cap { font-size:11px; color:var(--cinza-500); margin:0 0 12px; }

.painel-alertas { display:flex; flex-direction:column; gap:7px; }
.painel-alert {
  display:grid; grid-template-columns:6px 1fr auto; gap:10px; align-items:center;
  padding:9px 11px; border-radius:9px; border:1px solid var(--borda);
}
.painel-alert .pa-sev { align-self:stretch; border-radius:3px; }
.painel-alert .pa-t { font-size:12.5px; font-weight:700; color:var(--cinza-900); line-height:1.3; }
.painel-alert .pa-d { font-size:11px; color:var(--cinza-500); margin-top:1px; line-height:1.3; }
.painel-alert .pa-tag {
  font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
  padding:2px 8px; border-radius:999px; white-space:nowrap;
}
.painel-alert.crit { background:#FEF2F2; border-color:#FECACA; }
.painel-alert.crit .pa-sev { background:#DC2626; } .painel-alert.crit .pa-tag { background:#DC2626; color:#fff; }
.painel-alert.alta { background:#FFF7ED; border-color:#FED7AA; }
.painel-alert.alta .pa-sev { background:#EA580C; } .painel-alert.alta .pa-tag { background:#EA580C; color:#fff; }
.painel-alert.ok { background:var(--verde-bg); border-color:var(--verde-claro); }
.painel-alert.ok .pa-sev { background:#2A9D6F; } .painel-alert.ok .pa-tag { background:#2A9D6F; color:#fff; }

.painel-charts { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
@media (max-width:820px) { .painel-charts { grid-template-columns:1fr; } }

/* KPIs */
.rel-kpi-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(145px,1fr)); gap:10px; margin-bottom:14px; }
.rel-kpi {
  background:var(--branco); border-radius:var(--raio-lg); padding:13px 14px;
  border-top:3px solid var(--kpi-cor,#3b82f6);
  border-left:1px solid var(--borda); border-right:1px solid var(--borda); border-bottom:1px solid var(--borda);
  box-shadow:var(--sombra);
}
.rel-kpi-val { font-size:1.55rem; font-weight:700; color:var(--kpi-cor,#3b82f6); line-height:1; }
.rel-kpi-lbl { font-size:11px; color:var(--cinza-500); margin-top:3px; line-height:1.2; }

/* Taxas */
.rel-taxa-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px; margin-bottom:20px; }
.rel-taxa-card {
  background:var(--branco); border-radius:var(--raio-lg); padding:12px 14px 10px;
  border:1px solid var(--borda); box-shadow:var(--sombra);
}
.rel-taxa-top { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
.rel-taxa-lbl { font-size:12px; font-weight:600; color:var(--cinza-800); }
.rel-taxa-val { font-size:18px; font-weight:700; font-family:monospace; }
.rel-taxa-bar { height:4px; background:var(--cinza-200); border-radius:2px; overflow:hidden; margin-bottom:5px; }
.rel-taxa-fill { height:100%; border-radius:2px; width:0; transition:width .7s ease; }
.rel-taxa-desc { font-size:10px; color:var(--cinza-500); }

/* Seções */
.rel-sec { margin-bottom:28px; scroll-margin-top:70px; }
.rel-sec-title {
  font-size:.95rem; font-weight:700; letter-spacing:.04em;
  text-transform:uppercase; color:var(--verde);
  display:flex; align-items:center; gap:10px; margin-bottom:12px;
}
.rel-sec-title::after { content:''; flex:1; height:1px; background:var(--borda); }

/* Gráficos */
.rel-charts-row { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px; }
.rel-charts-row.triple { grid-template-columns:1fr 1fr 1fr; }
@media (max-width:900px) {
  .rel-charts-row, .rel-charts-row.triple { grid-template-columns:1fr; }
}
.rel-chart-card { background:var(--branco); border-radius:var(--raio-lg); padding:14px 16px; border:1px solid var(--borda); box-shadow:var(--sombra); }
.rel-chart-title { font-size:12px; font-weight:700; color:var(--cinza-800); margin:0 0 10px; }
.rel-chart-sub { font-size:10px; color:var(--cinza-500); margin:-6px 0 8px; }
.rel-chart-wrap { position:relative; height:220px; }
.rel-chart-wrap.tall { height:280px; }
.rel-chart-wrap.short { height:160px; }

/* Berçário KPIs */
.berc-kpi-row { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:14px; }
@media (max-width:700px) { .berc-kpi-row { grid-template-columns:repeat(2,1fr); } }

/* Tabelas */
.rel-table-wrap { background:var(--branco); border-radius:var(--raio-lg); overflow:hidden; border:1px solid var(--borda); box-shadow:var(--sombra); }
.rel-table { width:100%; border-collapse:collapse; font-size:12px; }
.rel-table thead th {
  background:var(--cinza-50); padding:8px 10px; text-align:left;
  font-weight:700; color:var(--cinza-500); white-space:nowrap; font-size:11px;
  text-transform:uppercase; letter-spacing:.04em;
}
.rel-table tbody td { padding:7px 10px; border-top:1px solid var(--borda); color:var(--cinza-900); }
.rel-table tbody tr:hover td { background:var(--cinza-50); }
.rel-table td.num { text-align:right; font-family:monospace; }
.rel-table td.rate { text-align:right; font-weight:700; font-family:monospace; }
.badge-esp {
  display:inline-flex; align-items:center; justify-content:center;
  width:26px; height:26px; border-radius:6px; font-size:10px; font-weight:700;
  background:var(--ouro-bg); color:var(--ouro); margin-right:6px;
}

/* Status no carregamento */
.rel-loading { text-align:center; padding:48px; color:var(--cinza-500); font-size:.9rem; }

/* ── Mapa Geoespacial ── */
.mapa-outer {
  display:grid; grid-template-columns:268px 1fr; gap:12px;
  height:68vh; min-height:480px;
}
@media (max-width:820px) { .mapa-outer { grid-template-columns:1fr; height:auto; } }

.mapa-panel-esq {
  display:flex; flex-direction:column; gap:8px;
  overflow-y:auto; max-height:68vh;
}

.mapa-panel-bloco {
  background:var(--branco); border:1px solid var(--borda);
  border-radius:var(--raio-lg); padding:10px 12px; flex-shrink:0;
  box-shadow:var(--sombra);
}

.mapa-panel-header {
  font-size:10px; font-weight:700; text-transform:uppercase;
  letter-spacing:.06em; color:var(--cinza-500); margin-bottom:8px;
}

.mapa-busca {
  width:100%; background:var(--cinza-50); border:1px solid var(--borda-forte);
  color:var(--cinza-900); border-radius:var(--raio); padding:6px 9px; font-size:12px;
  margin-bottom:7px; box-sizing:border-box;
}
.mapa-busca::placeholder { color:var(--cinza-400); }
.mapa-busca:focus { outline:none; border-color:var(--verde-claro); }

.mapa-praia-btns { display:flex; gap:5px; margin-bottom:7px; }
.mapa-praia-btn {
  flex:1; padding:4px 8px; font-size:11px; border-radius:6px;
  border:1px solid var(--borda); background:var(--cinza-50);
  color:var(--cinza-700); cursor:pointer; transition:background .15s;
}
.mapa-praia-btn:hover { background:var(--cinza-100); }

.mapa-praia-lista {
  display:flex; flex-direction:column; gap:1px;
  max-height:190px; overflow-y:auto;
}
.mapa-praia-lista::-webkit-scrollbar { width:3px; }
.mapa-praia-lista::-webkit-scrollbar-thumb { background:var(--cinza-300); border-radius:2px; }

.mapa-praia-item {
  display:flex; align-items:center; gap:7px; padding:5px 4px;
  border-radius:6px; cursor:pointer; transition:background .1s;
}
.mapa-praia-item:hover { background:var(--cinza-50); }
.mapa-praia-item input[type="checkbox"] {
  width:14px; height:14px; accent-color:var(--verde-claro); flex-shrink:0; cursor:pointer;
}
.mapa-praia-item-nome { font-size:12px; color:var(--cinza-800); flex:1; line-height:1.2; }
.mapa-praia-item-cnt { font-size:10px; color:var(--cinza-500); font-family:monospace; }

.mapa-toggle {
  display:flex; align-items:center; gap:7px; font-size:12px;
  color:var(--cinza-700); cursor:pointer; padding:4px 0;
}
.mapa-toggle input { width:14px; height:14px; accent-color:var(--verde-claro); cursor:pointer; }

.mapa-area {
  position:relative; border-radius:var(--raio-lg); overflow:hidden;
  border:1px solid var(--borda);
  display:flex; flex-direction:column; background:var(--cinza-100);
}
#mapa-bio { flex:1; min-height:360px; }

.mapa-filtros-ponto {
  background:var(--branco); border-top:1px solid var(--borda);
  padding:8px 12px; display:flex; flex-wrap:wrap; gap:8px; align-items:center;
  flex-shrink:0;
}
.mapa-filtro-grupo { display:flex; align-items:center; gap:5px; flex-wrap:wrap; }
.mapa-filtro-label { font-size:10px; color:var(--cinza-500); font-weight:700; letter-spacing:.03em; }

.mapa-chip {
  padding:3px 9px; border-radius:20px; font-size:10px; font-weight:700;
  border:1px solid var(--borda-forte); background:var(--cinza-50);
  color:var(--cinza-700); cursor:pointer; transition:all .15s; user-select:none;
}
.mapa-chip.ativo { background:var(--verde-claro); border-color:var(--verde-claro); color:#fff; }
.mapa-chip:hover:not(.ativo) { background:var(--cinza-100); }

/* ── Slide Panel ── */
.mapa-slide-panel {
  position:fixed; right:0; top:0; bottom:0; width:360px;
  background:var(--branco); border-left:1px solid var(--borda);
  box-shadow:-4px 0 20px rgba(0,0,0,.1); z-index:2100;
  transform:translateX(102%); transition:transform .3s cubic-bezier(.4,0,.2,1);
  display:flex; flex-direction:column;
}
.mapa-slide-panel.aberto { transform:translateX(0); }
@media (max-width:500px) { .mapa-slide-panel { width:100%; } }

.mapa-slide-header {
  display:flex; align-items:flex-start; justify-content:space-between;
  padding:15px 16px 11px; border-bottom:1px solid var(--borda); gap:8px;
}
.mapa-slide-titulo-wrap { flex:1; min-width:0; }
.mapa-slide-num { font-size:.85rem; font-weight:700; color:var(--cinza-900); }
.mapa-slide-sub { font-size:11px; color:var(--cinza-500); margin-top:2px; }
.mapa-slide-acoes { display:flex; gap:5px; align-items:center; flex-shrink:0; }

.mapa-btn-comparar {
  padding:5px 9px; border-radius:7px; font-size:10px; font-weight:700;
  border:1px solid var(--ouro); background:var(--ouro-bg);
  color:var(--ouro); cursor:pointer; transition:all .15s; white-space:nowrap;
}
.mapa-btn-comparar.ativo { background:var(--ouro); color:#fff; border-color:var(--ouro); }
.mapa-btn-comparar:hover:not(.ativo) { background:#FFF3CD; }

.mapa-slide-fechar {
  width:26px; height:26px; border-radius:7px; border:1px solid var(--borda);
  background:var(--cinza-50); color:var(--cinza-500); cursor:pointer; font-size:15px;
  display:flex; align-items:center; justify-content:center;
}
.mapa-slide-fechar:hover { background:var(--cinza-100); color:var(--cinza-800); }

.mapa-slide-tabs { display:flex; border-bottom:1px solid var(--borda); padding:0 14px; }
.mapa-tab {
  padding:8px 11px; font-size:11.5px; font-weight:700; color:var(--cinza-500);
  border:none; background:transparent; cursor:pointer;
  border-bottom:2px solid transparent; margin-bottom:-1px; transition:all .15s;
}
.mapa-tab.ativo { color:var(--verde-medio); border-bottom-color:var(--verde-medio); }

.mapa-slide-corpo { flex:1; overflow-y:auto; padding:14px 16px; }
.mapa-slide-corpo::-webkit-scrollbar { width:3px; }
.mapa-slide-corpo::-webkit-scrollbar-thumb { background:var(--cinza-300); border-radius:2px; }

.slide-kpi-row { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-bottom:12px; }
.slide-kpi { background:var(--cinza-50); border:1px solid var(--borda); border-radius:8px; padding:9px 11px; }
.slide-kpi-val { font-size:1.15rem; font-weight:700; line-height:1; color:var(--cinza-900); }
.slide-kpi-lbl { font-size:10px; color:var(--cinza-500); margin-top:2px; }

.slide-hist-item {
  display:flex; align-items:flex-start; gap:9px; padding:7px 0;
  border-bottom:1px solid var(--borda); font-size:11.5px;
}
.slide-hist-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; margin-top:4px; }
.slide-hist-data { color:var(--cinza-500); min-width:68px; font-size:11px; }
.slide-hist-desc { flex:1; color:var(--cinza-800); line-height:1.4; }
.slide-badge {
  display:inline-block; padding:2px 7px; border-radius:10px;
  font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
}

.slide-alerta {
  display:flex; align-items:center; gap:7px; padding:6px 9px;
  border-radius:7px; margin-bottom:5px; font-size:11px;
}
.slide-alerta.critica { background:#FEF2F2; border:1px solid #FECACA; color:#DC2626; }
.slide-alerta.alta    { background:#FFF7ED; border:1px solid #FED7AA; color:#C2410C; }
.slide-alerta.media   { background:var(--aviso-bg); border:1px solid #FDE68A; color:var(--aviso); }
.slide-alerta.baixa   { background:var(--cinza-50); border:1px solid var(--borda); color:var(--cinza-600); }

.slide-foto-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:5px; }
.slide-foto {
  aspect-ratio:1; border-radius:6px; object-fit:cover;
  cursor:pointer; transition:opacity .15s; width:100%;
}
.slide-foto:hover { opacity:.8; }

/* ── Barra de Comparação ── */
.mapa-comp-bar {
  position:fixed; bottom:0; left:0; right:0;
  background:var(--branco); border-top:2px solid var(--ouro);
  box-shadow:0 -4px 16px rgba(0,0,0,.1); z-index:2000;
  transform:translateY(102%); transition:transform .3s cubic-bezier(.4,0,.2,1);
  max-height:52vh; display:flex; flex-direction:column;
}
.mapa-comp-bar.aberta { transform:translateY(0); }

.mapa-comp-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:9px 16px; border-bottom:1px solid var(--borda); flex-shrink:0;
}
.mapa-comp-titulo { font-size:12px; font-weight:700; color:var(--ouro); }
.mapa-comp-limpar {
  font-size:11px; padding:3px 9px; border-radius:6px;
  border:1px solid var(--borda); background:transparent;
  color:var(--cinza-500); cursor:pointer; transition:background .15s;
}
.mapa-comp-limpar:hover { background:var(--cinza-50); color:var(--cinza-800); }
.mapa-comp-wrap { overflow:auto; flex:1; }
.mapa-comp-wrap::-webkit-scrollbar { height:3px; }
.mapa-comp-wrap::-webkit-scrollbar-thumb { background:var(--cinza-300); border-radius:2px; }

.mapa-comp-table { width:100%; border-collapse:collapse; font-size:11.5px; }
.mapa-comp-table th {
  background:var(--cinza-50); padding:6px 10px; text-align:left;
  font-weight:700; color:var(--cinza-500); white-space:nowrap;
  font-size:10px; text-transform:uppercase; letter-spacing:.04em;
  position:sticky; top:0; z-index:1;
}
.mapa-comp-table td { padding:6px 10px; border-top:1px solid var(--borda); white-space:nowrap; color:var(--cinza-900); }
.mapa-comp-table td.num { text-align:right; font-family:monospace; }
.mapa-comp-table .rank-1 { color:var(--ouro); font-weight:700; }
.mapa-comp-table .rank-2 { color:var(--verde-medio); font-weight:600; }
.mapa-comp-table .alrt { font-size:9px; padding:1px 5px; border-radius:3px; margin-left:4px; }
.mapa-comp-table .alrt-c { background:#FEE2E2; color:#DC2626; }
.mapa-comp-table .alrt-a { background:#FFEDD5; color:#C2410C; }

/* ── Popup de Praia (Leaflet) ── */
.popup-praia { min-width:230px; font-size:12.5px; }
.popup-nome { font-size:13.5px; font-weight:700; margin-bottom:2px; color:#111; }
.popup-sub { color:#777; font-size:11px; margin-bottom:9px; }
.popup-kpi-grid { display:grid; grid-template-columns:1fr 1fr; gap:5px; margin-bottom:9px; }
.popup-kpi { background:#f3f3f3; border-radius:5px; padding:5px 8px; }
.popup-kpi-val { font-size:1.05rem; font-weight:700; color:#1a6b8c; }
.popup-kpi-lbl { font-size:9.5px; color:#888; }
.popup-esp-row { display:flex; align-items:center; gap:5px; margin-bottom:3px; font-size:11px; color:#333; }
.popup-esp-track { flex:1; height:4px; background:#e5e5e5; border-radius:2px; overflow:hidden; }
.popup-esp-fill { height:100%; border-radius:2px; }
.popup-hist-wrap { margin:8px 0 5px; }
.popup-hist-title { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:#888; margin-bottom:5px; }
.popup-hist-bars { display:flex; align-items:flex-end; gap:3px; height:40px; }
.popup-hist-col { display:flex; flex-direction:column; align-items:center; gap:2px; flex:1; }
.popup-hist-bar { width:100%; border-radius:2px 2px 0 0; min-height:2px; }
.popup-hist-ano { font-size:9px; color:#999; }
.popup-btn { display:block; text-align:center; padding:6px; background:#1a6b8c; color:#fff; border-radius:6px; font-size:11px; font-weight:700; margin-top:8px; cursor:pointer; border:none; width:100%; }
.popup-btn:hover { background:#155a7a; }

/* ── Botão Voltar no slide panel ── */
.mapa-slide-voltar {
  display:none; padding:3px 9px 3px 6px; border-radius:6px; font-size:10px;
  font-weight:700; border:1px solid var(--borda);
  background:var(--cinza-50); color:var(--cinza-600);
  cursor:pointer; margin-bottom:6px; transition:background .15s; white-space:nowrap;
}
.mapa-slide-voltar:hover { background:var(--cinza-100); color:var(--cinza-800); }

/* ── Linha de ninho na aba Ninhos da praia ── */
.slide-ninho-item {
  display:flex; align-items:center; gap:9px; padding:8px 11px;
  border-radius:8px; cursor:pointer; transition:background .12s;
  border:1px solid var(--borda); margin-bottom:5px;
}
.slide-ninho-item:hover { background:var(--cinza-50); border-color:var(--verde-claro); }
.slide-ninho-dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
.slide-ninho-info { flex:1; min-width:0; }
.slide-ninho-num { font-size:12px; font-weight:700; color:var(--cinza-900); }
.slide-ninho-sub { font-size:10px; color:var(--cinza-500); margin-top:1px; }
.slide-ninho-seta { color:var(--cinza-400); font-size:16px; flex-shrink:0; }

/* Impressão */
@media print {
  .rel-filtros, .rel-nav, .rel-tabs, .sidebar, #sidebar-wrapper, .page-header,
  .mapa-slide-panel, .mapa-comp-bar, .mapa-panel-esq, .mapa-filtros-ponto { display:none !important; }
  body { background:#fff !important; color:#111 !important; }
  .rel-kpi, .rel-taxa-card, .rel-chart-card, .rel-table-wrap { background:#f9f9f9 !important; border:1px solid #ddd !important; }
  .rel-kpi-val, .rel-taxa-val { color:#1a6b8c !important; }
  .rel-sec-title { color:#1F4E2C !important; }
  .rel-table thead th { background:#eee !important; color:#555 !important; }
  .page-content { margin-left:0 !important; padding:16px !important; }
  .mapa-area { height:60vh !important; }
}
</style>
</head>
<body>
<div id="app"></div>
<script>
;(async function () {
  const usuario = await carregarUsuario()
  if (!usuario) { window.location.href = '../index.html'; return }

  document.getElementById('app').innerHTML =
    gerarLayout('Relatórios Biomonitor', 'relatorios-biomonitor') +
    `<div class="fade-in">

      <!-- Filtros -->
      <div class="rel-filtros">
        <label>Temporada
          <select id="fil-temporada"><option value="">Todas as temporadas</option></select>
        </label>
        <label>Programa
          <select id="fil-programa"><option value="">Todos os programas</option></select>
        </label>
        <label>Localização
          <select id="fil-localizacao">
            <option value="">Todas as localizações</option>
            <option value="dentro_uc">Dentro de UC</option>
            <option value="margem_livre">Margem Livre</option>
            <option value="terra_indigena">Terra Indígena</option>
            <option value="area_municipal">Área Municipal</option>
            <option value="outro">Outro</option>
          </select>
        </label>
        <label id="fil-uc-wrap" style="display:none">Unidade de Conservação
          <select id="fil-uc"><option value="">Todas as UCs</option></select>
        </label>
        <label>Praia
          <select id="fil-praia"><option value="">Todas as praias</option></select>
        </label>
        <div style="display:flex;gap:8px;align-items:flex-end;margin-top:2px">
          <button class="btn btn-primary" onclick="aplicar()" style="padding:8px 18px">Aplicar</button>
          <button class="btn btn-secondary" onclick="window.print()" style="padding:8px 14px" title="Imprimir / Salvar PDF">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
            Imprimir
          </button>
          <button class="btn btn-secondary" onclick="exportarCSV()" style="padding:8px 14px">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            CSV
          </button>
        </div>
      </div>

      <!-- Abas principais -->
      <div class="rel-tabs">
        <button class="rel-tab ativo" id="tab-btn-painel" onclick="relTab('painel')">Painel</button>
        <button class="rel-tab" id="tab-btn-detalhado" onclick="relTab('detalhado')">Detalhado</button>
        <button class="rel-tab" id="tab-btn-mapa" onclick="relTab('mapa')">Mapa</button>
        <button class="rel-tab" id="tab-btn-fichas" onclick="relTab('fichas')">Fichas de Ninho</button>
      </div>

      <!-- Aba: Painel -->
      <div id="painel-conteudo" class="rel-tab-pane">
        <div class="rel-loading">Aplicar filtros para carregar o painel…</div>
      </div>

      <!-- Aba: Detalhado -->
      <div id="detalhado-conteudo" class="rel-tab-pane" hidden>
        <!-- Âncoras de navegação rápida -->
        <div class="rel-nav">
          <a href="#sec-geral">Visão Geral</a>
          <a href="#sec-taxas">Taxas Científicas</a>
          <a href="#sec-fenologia">Fenologia</a>
          <a href="#sec-especies">Por Espécie</a>
          <a href="#sec-locais">Por Praia / UC</a>
          <a href="#sec-bercario">Berçário</a>
          <a href="#sec-monitores">Monitores</a>
        </div>
        <div id="rel-conteudo">
          <div class="rel-loading">Aplicar filtros para carregar o relatório…</div>
        </div>
      </div>

      <!-- Aba: Mapa -->
      <div id="mapa-conteudo" class="rel-tab-pane" hidden>
        <div class="rel-loading">Aplicar filtros e abrir esta aba para carregar o mapa…</div>
      </div>

      <!-- Aba: Fichas de Ninho -->
      <div id="fichas-conteudo" class="rel-tab-pane" hidden>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">
          <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--cinza-500);cursor:pointer">
            <input type="checkbox" id="fichas-marcar-todos" onchange="fichasMarcarTodos(this.checked)">
            Selecionar todos os ninhos listados
          </label>
          <button class="btn btn-primary" id="fichas-gerar-btn" onclick="fichasGerarPDF()" disabled>Gerar PDF (0 selecionados)</button>
        </div>
        <div id="fichas-lista" style="display:flex;flex-direction:column;gap:8px">
          <p style="color:var(--cinza-500)">Aplique os filtros acima e abra esta aba para listar os ninhos.</p>
        </div>
      </div>
    </div>

    <!-- Slide Panel — persiste fora do rel-conteudo -->
    <div class="mapa-slide-panel" id="mapa-slide-panel">
      <div class="mapa-slide-header">
        <div class="mapa-slide-titulo-wrap">
          <button class="mapa-slide-voltar" id="mapa-slide-voltar" onclick="mapaVoltarPraia()">← Praia</button>
          <div class="mapa-slide-num" id="mapa-slide-num"></div>
          <div class="mapa-slide-sub" id="mapa-slide-sub"></div>
        </div>
        <div class="mapa-slide-acoes">
          <button class="mapa-btn-comparar" id="mapa-btn-comparar" onclick="mapaToggleComparar()">+ Comparar</button>
          <button class="mapa-slide-fechar" onclick="mapaFecharSlide()">×</button>
        </div>
      </div>
      <div class="mapa-slide-tabs" id="mapa-slide-tabs"></div>
      <div class="mapa-slide-corpo" id="mapa-slide-corpo"></div>
    </div>

    <!-- Barra de Comparação — persiste fora do rel-conteudo -->
    <div class="mapa-comp-bar" id="mapa-comp-bar">
      <div class="mapa-comp-header">
        <span class="mapa-comp-titulo" id="mapa-comp-titulo">Comparando 0 ninhos</span>
        <button class="mapa-comp-limpar" onclick="mapaClearComparacao()">Limpar seleção</button>
      </div>
      <div class="mapa-comp-wrap">
        <table class="mapa-comp-table" id="mapa-comp-table">
          <thead id="mapa-comp-thead"></thead>
          <tbody id="mapa-comp-tbody"></tbody>
        </table>
      </div>
    </div>`

  bIconsAplicar(document.getElementById('app'))

  // ── Carrega filtros ─────────────────────────────────────────────
  let _praias_todas = []
  const [
    { data: temporadas },
    { data: programas },
    { data: ucs },
    { data: praias },
  ] = await Promise.all([
    db.from('temporadas_biomonitor').select('id,nome,is_atual').order('ano_base', { ascending: false }),
    db.from('programas_biomonitoramento').select('id,nome').eq('ativo', true),
    db.from('unidades_conservacao').select('id,nome,sigla').order('nome'),
    db.from('praias_monitoramento').select('id,nome,uc_id,tipo_localizacao').eq('ativa', true).order('nome'),
  ])

  _praias_todas = praias || []

  const sel = id => document.getElementById(id)
  ;(temporadas || []).forEach(t => sel('fil-temporada').insertAdjacentHTML('beforeend', `<option value="${t.id}"${t.is_atual ? ' selected' : ''}>${t.nome}</option>`))
  ;(programas  || []).forEach(p => sel('fil-programa').insertAdjacentHTML('beforeend', `<option value="${p.id}">${p.nome}</option>`))
  ;(ucs        || []).forEach(u => sel('fil-uc').insertAdjacentHTML('beforeend', `<option value="${u.id}">${u.sigla || ''} ${u.nome}</option>`))

  // Praias cascateiam pela Localização + UC selecionadas
  function popularPraias() {
    const loc  = sel('fil-localizacao').value
    const ucId = sel('fil-uc').value
    sel('fil-praia').innerHTML = '<option value="">Todas as praias</option>'
    _praias_todas
      .filter(p => (!loc || p.tipo_localizacao === loc) && (!ucId || p.uc_id === ucId))
      .forEach(p => sel('fil-praia').insertAdjacentHTML('beforeend', `<option value="${p.id}">${p.nome}</option>`))
  }
  popularPraias()

  // Localização é o pré-filtro: só mostra o seletor de UC quando "Dentro de UC"
  sel('fil-localizacao').addEventListener('change', () => {
    const dentroUC = sel('fil-localizacao').value === 'dentro_uc'
    sel('fil-uc-wrap').style.display = dentroUC ? '' : 'none'
    if (!dentroUC) sel('fil-uc').value = ''
    popularPraias()
  })

  sel('fil-uc').addEventListener('change', popularPraias)

  // ── Estado global ───────────────────────────────────────────────
  let _dados = null
  let _charts = {}
  let _descAgg = { natural:0, predacao:0, humana:0, total:0,
    porCausa: { predacao:0, alagamento:0, erosao:0, humana:0, natural:0 } }
  let _metasPraia = []
  let _chartJsCarregado = false
  let _bercMortalidade = []
  let _bercCrescimento = []

  // ── Estado das abas + dados do Painel ───────────────────────────
  let _tabAtual       = 'painel'
  let _graphed        = { painel:false, detalhado:false }
  let _painelPraias   = []
  let _painelPrevisao = []

  // Carrega os dados extras do Painel (ovos por causa/praia + previsão de
  // eclosão). bio_dashboard_praias respeita temporada/UC/praia; a previsão
  // filtra temporada no servidor e UC/praia no cliente.
  async function carregarPainelDados() {
    const tmp  = sel('fil-temporada').value || null
    const ucId = sel('fil-uc').value        || null
    const prr  = sel('fil-praia').value     || null

    const { data: dp } = await db.rpc('bio_dashboard_praias', {
      p_temporada_id: tmp, p_uc_id: ucId, p_praia_id: prr,
    })
    _painelPraias = Array.isArray(dp) ? dp : []

    let qp = db.from('vw_ninhos_previsao_eclosao')
      .select('dias_para_eclosao,faixa_risco,situacao,especie,numero_atual,numero_ninho,praia_atual_nome,status,praia_id,praia_atual_id')
    if (tmp) qp = qp.eq('temporada_id', tmp)
    const { data: pv } = await qp
    let rows = pv || []
    if (prr) {
      rows = rows.filter(r => r.praia_id === prr || r.praia_atual_id === prr)
    } else if (ucId) {
      const ucPraias = new Set(_praias_todas.filter(p => p.uc_id === ucId).map(p => p.id))
      rows = rows.filter(r => ucPraias.has(r.praia_id) || ucPraias.has(r.praia_atual_id))
    }
    _painelPrevisao = rows.filter(r => r.faixa_risco && !['inativo','sem_previsao'].includes(r.faixa_risco))
  }

  // Mortalidade e curva de crescimento por berçário físico — a RPC
  // bio_relatorio_completo agrega todos os berçários juntos, então essas
  // comparações são montadas no client a partir da view canônica
  // vw_lotes_bercario_mortalidade (mortalidade) e de ocorrencias_bercario
  // tipo=biometria (crescimento), respeitando os filtros de temporada/UC.
  async function carregarDadosBercarios() {
    const tmp  = sel('fil-temporada').value || null
    const ucId = sel('fil-uc').value        || null

    const { data: mortRaw } = await db.from('vw_lotes_bercario_mortalidade')
      .select('bercario_id,bercario_nome,bercario_uc_id,qtd_entrada,mortes,temporada_id')
    let mort = (mortRaw || []).filter(m => m.bercario_id)
    if (tmp)  mort = mort.filter(m => m.temporada_id === tmp)
    if (ucId) mort = mort.filter(m => m.bercario_uc_id === ucId)

    const porBercMort = {}
    mort.forEach(m => {
      const key = m.bercario_id
      if (!porBercMort[key]) porBercMort[key] = { nome: m.bercario_nome, entrada: 0, mortes: 0 }
      porBercMort[key].entrada += m.qtd_entrada || 0
      porBercMort[key].mortes  += m.mortes || 0
    })
    _bercMortalidade = Object.values(porBercMort)
      .filter(b => b.entrada > 0)
      .map(b => ({ nome: b.nome, pct: Math.round((b.mortes / b.entrada) * 1000) / 10, entrada: b.entrada }))
      .sort((a, b) => b.pct - a.pct)

    const { data: lotesRaw } = await db.from('lotes_bercario')
      .select('id,bercario_id,bercarios(nome,uc_id),ninhos_quelonios(temporada_id)')
    let lotes = (lotesRaw || []).filter(l => l.bercario_id)
    if (tmp)  lotes = lotes.filter(l => l.ninhos_quelonios?.temporada_id === tmp)
    if (ucId) lotes = lotes.filter(l => l.bercarios?.uc_id === ucId)

    const nomePorLote = {}
    lotes.forEach(l => { nomePorLote[l.id] = l.bercarios?.nome || '—' })
    const loteIds = lotes.map(l => l.id)

    let biometriaRaw = []
    if (loteIds.length) {
      const { data } = await db.from('ocorrencias_bercario')
        .select('lote_id,data_ocorrencia,comprimento_medio_cm')
        .eq('tipo', 'biometria')
        .in('lote_id', loteIds)
      biometriaRaw = data || []
    }

    const porBercData = {}
    biometriaRaw.forEach(o => {
      if (o.comprimento_medio_cm == null) return
      const nome = nomePorLote[o.lote_id]
      if (!nome) return
      porBercData[nome] = porBercData[nome] || {}
      const d = o.data_ocorrencia
      ;(porBercData[nome][d] = porBercData[nome][d] || []).push(o.comprimento_medio_cm)
    })

    const rankEntrada = {}
    Object.values(porBercMort).forEach(b => { rankEntrada[b.nome] = b.entrada })

    _bercCrescimento = Object.entries(porBercData)
      .map(([nome, porData]) => ({
        nome,
        pontos: Object.keys(porData).sort().map(d => ({
          data: d,
          comp: Math.round((porData[d].reduce((s, v) => s + v, 0) / porData[d].length) * 10) / 10,
        })),
      }))
      .sort((a, b) => (rankEntrada[b.nome] || 0) - (rankEntrada[a.nome] || 0))
      .slice(0, 8)
  }

  async function carregarChartJS() {
    if (_chartJsCarregado) return
    await new Promise((res, rej) => {
      const s = document.createElement('script')
      s.src = 'https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js'
      s.onload = res; s.onerror = rej
      document.head.appendChild(s)
    })
    _chartJsCarregado = true
  }

  function destruirCharts() {
    Object.values(_charts).forEach(c => { try { c.destroy() } catch(_) {} })
    _charts = {}
  }

  // ── Aplicar filtros → chamar RPC ────────────────────────────────
  window.aplicar = async function() {
    const el = document.getElementById('rel-conteudo')
    const elPainel = document.getElementById('painel-conteudo')
    elPainel.innerHTML = '<div class="rel-loading">Carregando dados…</div>'
    el.innerHTML = '<div class="rel-loading">Carregando dados…</div>'
    destruirCharts()

    const { data, error } = await db.rpc('bio_relatorio_completo', {
      p_temporada_id:     sel('fil-temporada').value    || null,
      p_programa_id:      sel('fil-programa').value     || null,
      p_uc_id:            sel('fil-uc').value           || null,
      p_praia_id:         sel('fil-praia').value        || null,
      p_tipo_localizacao: sel('fil-localizacao').value  || null,
    })

    if (error || !data) {
      elPainel.innerHTML = `<div class="rel-loading">Sem dados para os filtros selecionados.</div>`
      el.innerHTML = `<div class="rel-loading">Sem dados para os filtros selecionados.</div>`
      return
    }

    _dados = data

    // Descartes de ovos por causa (consulta direta à view). Traz `causa`
    // (fina) além de `motivo` (grossa) — perdas naturais lançadas na
    // postura (etapa registro) não têm causa fina e viram um balde
    // próprio "Natural (postura)" no gráfico de colunas, em vez de sumir.
    let qd = db.from('vw_descartes_ovos').select('motivo,causa,qtd')
    const tmp = sel('fil-temporada').value; if (tmp) qd = qd.eq('temporada_id', tmp)
    const prr = sel('fil-praia').value;     if (prr) qd = qd.eq('praia_id', prr)
    const { data: descRows } = await qd
    _descAgg = { natural:0, predacao:0, humana:0, total:0,
      porCausa: { predacao:0, alagamento:0, erosao:0, humana:0, natural:0 } }
    ;(descRows || []).forEach(r => {
      const q = r.qtd || 0
      if (r.motivo in _descAgg) _descAgg[r.motivo] += q
      _descAgg.total += q
      const causa = ['predacao','alagamento','erosao','humana'].includes(r.causa) ? r.causa : 'natural'
      _descAgg.porCausa[causa] += q
    })

    // Metas por praia (só faz sentido com uma temporada específica)
    _metasPraia = []
    if (tmp) {
      const { data: metas } = await db.from('vw_temporada_praias')
        .select('praia_id,praia_nome,meta_ninhos,ativa').eq('temporada_id', tmp)
      _metasPraia = (metas || []).filter(m => m.ativa !== false && m.meta_ninhos != null && m.meta_ninhos > 0)
    }

    await carregarChartJS()
    await carregarPainelDados()
    await carregarDadosBercarios()

    // Monta o HTML das três abas (sem desenhar gráficos ainda) e ativa a
    // aba corrente — os gráficos de cada aba são desenhados só quando ela
    // fica visível (evita canvas de tamanho zero no Chart.js).
    renderTudo(data, el)
    renderPainel(data)
    _graphed = { painel:false, detalhado:false }
    mostrarTab(_tabAtual)
  }

  // ── Abas ─────────────────────────────────────────────────────────
  window.relTab = function(nome) { _tabAtual = nome; mostrarTab(nome) }

  function mostrarTab(nome) {
    ;['painel','detalhado','mapa','fichas'].forEach(t => {
      const pane = document.getElementById(t + '-conteudo')
      if (pane) pane.hidden = (t !== nome)
      document.getElementById('tab-btn-' + t)?.classList.toggle('ativo', t === nome)
    })
    if (nome === 'painel'    && _dados && !_graphed.painel)    { desenharPainel(_dados);    _graphed.painel = true }
    if (nome === 'detalhado' && _dados && !_graphed.detalhado) { desenharDetalhado(_dados); _graphed.detalhado = true }
    if (nome === 'mapa') mapaEnsureInit()
    if (nome === 'fichas') fichasCarregar()
  }

  // ── Aba: Fichas de Ninho ─────────────────────────────────────────
  // Reaproveita os mesmos filtros do topo (temporada/UC/praia/localização)
  // para listar os ninhos e permitir gerar a ficha PDF individual ou em
  // lote (ex.: "todos os ninhos da praia") via js/biomonitor-relatorio-ninho.js.
  let _fichasNinhos = []

  function praiaIdsFiltradas() {
    const loc  = sel('fil-localizacao').value
    const ucId = sel('fil-uc').value
    const prr  = sel('fil-praia').value
    if (prr) return [prr]
    if (!loc && !ucId) return null
    return _praias_todas
      .filter(p => (!loc || p.tipo_localizacao === loc) && (!ucId || p.uc_id === ucId))
      .map(p => p.id)
  }

  async function fichasCarregar() {
    const cont = document.getElementById('fichas-lista')
    cont.innerHTML = '<p style="color:var(--cinza-500)">Carregando...</p>'

    const tmp = sel('fil-temporada').value || null
    let q = db.from('vw_ninhos_validacao')
      .select('id,numero_ninho,especie,praia_nome,praia_atual_nome,praia_id,praia_atual_id,status,status_validacao,data_encontro,monitor_nome')
      .order('numero_ninho')
    if (tmp) q = q.eq('temporada_id', tmp)
    const { data, error } = await q
    if (error) { toast(error.message, 'error'); return }

    const praiaIds = praiaIdsFiltradas()
    _fichasNinhos = praiaIds
      ? (data || []).filter(n => praiaIds.includes(n.praia_id) || praiaIds.includes(n.praia_atual_id))
      : (data || [])

    document.getElementById('fichas-marcar-todos').checked = false
    renderFichasLista()
  }

  function renderFichasLista() {
    const cont = document.getElementById('fichas-lista')
    if (!_fichasNinhos.length) {
      cont.innerHTML = '<p style="color:var(--cinza-500)">Nenhum ninho encontrado com esses filtros.</p>'
      fichasAtualizarSelecao()
      return
    }
    cont.innerHTML = _fichasNinhos.map(n => `
      <label style="display:flex;align-items:center;gap:10px;background:var(--branco);border:1px solid var(--borda);border-radius:8px;padding:10px 12px;cursor:pointer;box-shadow:var(--sombra)">
        <input type="checkbox" class="fichas-check" value="${n.id}" onchange="fichasAtualizarSelecao()">
        <div style="flex:1;min-width:0">
          <strong>${esc(n.numero_ninho)}</strong>
          <span style="color:var(--cinza-500);font-size:12px"> · ${esc(n.especie)} · ${esc(n.praia_atual_nome || n.praia_nome || '—')}</span>
        </div>
        <span style="font-size:11px;color:var(--cinza-500)">${formatData(n.data_encontro)}</span>
        <button type="button" class="btn btn-sm btn-secondary" onclick="event.preventDefault();bioAbrirRelatorioNinho(db,'${n.id}')">Gerar PDF</button>
      </label>`).join('')
    fichasAtualizarSelecao()
  }

  window.fichasMarcarTodos = function(checked) {
    document.querySelectorAll('.fichas-check').forEach(cb => { cb.checked = checked })
    fichasAtualizarSelecao()
  }

  window.fichasAtualizarSelecao = function() {
    const n = document.querySelectorAll('.fichas-check:checked').length
    const btn = document.getElementById('fichas-gerar-btn')
    btn.textContent = `Gerar PDF (${n} selecionado${n !== 1 ? 's' : ''})`
    btn.disabled = n === 0
  }

  window.fichasGerarPDF = async function() {
    const ids = [...document.querySelectorAll('.fichas-check:checked')].map(cb => cb.value)
    await bioAbrirRelatorioNinhos(db, ids)
  }

  // ── Renderização principal ──────────────────────────────────────
  function renderTudo(d, el) {
    const k = d.kpis || {}
    _mapaLeafletInst = null  // força reinicialização do mapa ao re-aplicar filtros
    el.innerHTML = `
      ${htmlSecGeral(k)}
      ${htmlSecDescartes(_descAgg, d)}
      ${htmlSecTaxas(k)}
      ${htmlSecFenologia()}
      ${htmlSecEspecies(d.por_especie || [])}
      ${htmlSecMetas(d.por_praia || [])}
      ${htmlSecLocais()}
      ${htmlSecBercario(k)}
      ${htmlSecMonitores(d.por_monitor || [])}
    `
    document.getElementById('mapa-conteudo').innerHTML = htmlSecMapa()
  }

  // Desenha os gráficos e tabelas da aba Detalhado (chamado só quando a
  // aba fica visível, para o Chart.js medir o canvas corretamente).
  function desenharDetalhado(d) {
    const k = d.kpis || {}
    grafFenologia(d.por_mes || [], d.por_ano || [])
    grafDesfecho(k)
    grafStatus(k)
    grafDescartesCausa()
    grafEspeciesBar(d.por_especie || [])
    grafEspeciesRadar(d.por_especie || [])
    grafPraiasH(d.por_praia || [])
    grafUCsH(d.por_uc || [])
    grafBiometria(d.biometria_serie || [])
    grafOcorrencias(d.ocorrencias_tipos || [])
    grafMonitores(d.por_monitor || [])
    grafDestino(k)
    grafBercMortalidade(_bercMortalidade)
    grafBercCrescimento(_bercCrescimento)
    grafSoltosEspecie(d.bercario_soltos_por_especie || [], 'graf-soltos-esp')
    grafTaxaSoltura(d.taxa_soltura_por_bercario || [], 'graf-taxa-solt-berc', t => t.bercario_nome || '—')
    grafTaxaSoltura(d.taxa_soltura_por_especie || [], 'graf-taxa-solt-esp', t => espLabel(t.especie))
    grafCrescEspecie(d.crescimento_por_especie || [], 'graf-cresc-comp', 'comp_medio', 'cm')
    grafCrescEspecie(d.crescimento_por_especie || [], 'graf-cresc-peso', 'peso_medio', 'g')
    grafGanhoBerc(d.ganho_por_bercario || [], 'graf-ganho-comp', 'delta_comp', 'n_comp', 'cm')
    grafGanhoBerc(d.ganho_por_bercario || [], 'graf-ganho-peso', 'delta_peso', 'n_peso', 'g')
    renderTabelaPraias(d.por_praia || [])
    renderTabelaUCs(d.por_uc || [])
  }

  // ── Utilitários de renderização ─────────────────────────────────
  function v(val, suf) { return val != null ? val + (suf || '') : '—' }
  function pct(val) { return val != null ? val + '%' : '—' }
  function kpiCard(lbl, val, cor) {
    return `<div class="rel-kpi" style="--kpi-cor:${cor}"><div class="rel-kpi-val">${val}</div><div class="rel-kpi-lbl">${lbl}</div></div>`
  }
  function taxaCard(lbl, elId, pctVal, cor, desc) {
    return `
      <div class="rel-taxa-card">
        <div class="rel-taxa-top">
          <span class="rel-taxa-lbl">${lbl}</span>
          <span class="rel-taxa-val" id="${elId}" style="color:${cor}">${pct(pctVal)}</span>
        </div>
        <div class="rel-taxa-bar"><div class="rel-taxa-fill" id="${elId}-bar" style="background:${cor};width:${Math.min(pctVal || 0, 100)}%"></div></div>
        <span class="rel-taxa-desc">${desc}</span>
      </div>`
  }

  const ESP_LABEL = {
    tracaja:'Tracajá', tartaruga:'Tartaruga', cabecudo:'Cabeçudo',
    pitiU:'Pitiú', cupido:'Cupido', jabuti_pe_elefante:'Jabuti',
    jabuti_piranga:'Jabuti-piranga', mucua:'Muçuã', outro:'Outro'
  }
  const ESP_COR = {
    tracaja:'#2A9D6F', tartaruga:'#1A6B8C', cabecudo:'#C9A84C',
    pitiU:'#7ECEE8', cupido:'#D97706', jabuti_pe_elefante:'#6366f1',
    jabuti_piranga:'#8b5cf6', mucua:'#ec4899', outro:'#9CA3AF'
  }
  function espLabel(e) { return ESP_LABEL[e] || e }
  function espCor(e) { return ESP_COR[e] || '#9CA3AF' }

  // ── Seção: Visão Geral ───────────────────────────────────────────
  // `dados` (bio_relatorio_completo) traz três blocos que só existiam na
  // Análise Científica antes desta entrega — respeitam TODOS os filtros
  // do relatório (temporada/programa/UC/praia/localização), diferente da
  // quebra fina acima (`_descAgg`, consulta direta a vw_descartes_ovos,
  // que só filtra temporada/praia).
  function htmlSecEtapaCausaHTML(dados) {
    const etapas = dados.descartes_por_etapa || []
    const destr = dados.ninhos_destruidos_por_causa || []
    const pf = dados.predacao_fases || {}
    const ETAPA_LBL = { registro: 'No registro da postura', visita: 'Em visita de monitoramento', eclosao: 'Na eclosão' }
    const etapaHtml = etapas.length ? `
      <p class="rel-chart-sub" style="margin:14px 0 8px">Descartes por etapa do monitoramento</p>
      <div class="rel-kpi-grid">
        ${etapas.map(e => kpiCard(ETAPA_LBL[e.etapa] || e.etapa, v(e.qtd), '#38bdf8')).join('')}
      </div>` : ''
    const destrHtml = destr.length ? `
      <p class="rel-chart-sub" style="margin:14px 0 8px">Ninhos destruídos por causa</p>
      <div class="rel-kpi-grid">
        ${destr.map(n => kpiCard(n.causa === '—' ? 'Não informada' : n.causa, v(n.n), '#ef4444')).join('')}
      </div>` : ''
    const fasesHtml = (pf.incubacao || pf.eclosao || pf.soltura) ? `
      <p class="rel-chart-sub" style="margin:14px 0 8px">Predação por fase</p>
      <div class="rel-kpi-grid">
        ${kpiCard('Incubação — por animais', v(pf.incubacao?.animais), '#fb923c')}
        ${kpiCard('Incubação — por pessoas', v(pf.incubacao?.pessoas), '#a78bfa')}
        ${kpiCard('Eclosão — por animais', v(pf.eclosao?.por_animais), '#fb923c')}
        ${kpiCard('Eclosão — por pessoas', v(pf.eclosao?.por_pessoas), '#a78bfa')}
        ${kpiCard('Soltura — com predação', v(pf.soltura?.com), '#ef4444')}
      </div>` : ''
    if (!etapaHtml && !destrHtml && !fasesHtml) return ''
    return `${etapaHtml}${destrHtml}${fasesHtml}`
  }

  function htmlSecDescartes(a, dados) {
    const pctOf = n => a.total ? Math.round(100 * n / a.total) : 0
    // Causa fina (predação/alagamento/erosão/humana/natural) — inclui
    // perdas naturais lançadas direto na postura, não só nas visitas.
    const f = a.porCausa
    const totF = f.predacao + f.alagamento + f.erosao + f.humana + f.natural
    const pctF = n => totF ? Math.round(100 * n / totF) : 0
    const finaHtml = totF ? `
      <p class="rel-chart-sub" style="margin:6px 0 8px">Perdas por causa fina (postura, visitas e registro)</p>
      <div class="rel-kpi-grid">
        ${kpiCard('Predação',         `${f.predacao} (${pctF(f.predacao)}%)`,     '#ef4444')}
        ${kpiCard('Alagamento',       `${f.alagamento} (${pctF(f.alagamento)}%)`, '#1A6B8C')}
        ${kpiCard('Erosão',           `${f.erosao} (${pctF(f.erosao)}%)`,         '#C9A84C')}
        ${kpiCard('Ação humana',      `${f.humana} (${pctF(f.humana)}%)`,         '#7B57B0')}
        ${kpiCard('Natural (postura)',`${f.natural} (${pctF(f.natural)}%)`,       '#38bdf8')}
      </div>` : ''
    return `<div class="rel-sec" id="sec-descartes">
      <div class="rel-sec-title">Descarte de ovos por causa</div>
      <div class="painel-grid">
        <div>
          <div class="rel-kpi-grid">
            ${kpiCard('Total descartado', v(a.total),    '#ef4444')}
            ${kpiCard('Causa natural',    `${a.natural} (${pctOf(a.natural)}%)`,   '#38bdf8')}
            ${kpiCard('Predação',         `${a.predacao} (${pctOf(a.predacao)}%)`, '#fb923c')}
            ${kpiCard('Ação humana',      `${a.humana} (${pctOf(a.humana)}%)`,     '#a78bfa')}
          </div>
          ${finaHtml}
          ${htmlSecEtapaCausaHTML(dados || {})}
        </div>
        <div class="rel-chart-card"><p class="rel-chart-title">Perdas por causa</p><div class="rel-chart-wrap" id="wrap-desc-causa"><canvas id="graf-desc-causa"></canvas></div></div>
      </div>
    </div>`
  }

  // ── Seção: Taxas Científicas ─────────────────────────────────────
  function htmlSecTaxas(k) {

        ${taxaCard('Mortalidade Embrionária',k.taxa_mortalidade_embrionaria_pct+'—',k.taxa_mortalidade_embrionaria_pct,'#ef4444','(Mortos + não nascidos) / total de ovos que chegaram à eclosão')}
        ${taxaCard('Sucesso de Nidificação',k.taxa_sucesso_nidificacao_pct+'—',k.taxa_sucesso_nidificacao_pct,'#1A6B8C','Ninhos eclodidos / total de ninhos monitorados')}
        ${taxaCard('Taxa de Fertilidade',k.taxa_fertilidade_pct+'—',k.taxa_fertilidade_pct,'#C9A84C','Ovos íntegros / ovos totais na postura')}
        ${taxaCard('Eficiência do Ninho',k.eficiencia_ninho_pct+'—',k.eficiencia_ninho_pct,'#7ECEE8','Filhotes vivos / ovos íntegros registrados')}

        ${taxaCard('Sobrevivência em Berçário',k.taxa_sobrevivencia_bercario_pct+'—',k.taxa_sobrevivencia_bercario_pct,'#2A9D6F','Filhotes soltados / filhotes que entraram no berçário')}
        ${taxaCard('Mortalidade em Berçário',k.taxa_mortalidade_bercario_pct+'—',k.taxa_mortalidade_bercario_pct,'#ef4444','Mortes no berçário / filhotes que entraram')}

  // ── Seção: Por Praia / UC ─────────────────────────────────────────
  function htmlSecMetas(porPraia) {
    if (!_metasPraia.length) return ''
    const reg = {}; (porPraia || []).forEach(p => { reg[p.praia_id] = p.ninhos_total || 0 })
    const linhas = _metasPraia
      .slice()
      .sort((a, b) => (reg[b.praia_id] || 0) / (b.meta_ninhos || 1) - (reg[a.praia_id] || 0) / (a.meta_ninhos || 1))
      .map(m => {
        const feito = reg[m.praia_id] || 0
        const meta  = m.meta_ninhos
        const pct   = Math.min(100, Math.round(100 * feito / meta))
        const atingiu = feito >= meta
        const cor   = atingiu ? '#2A9D6F' : pct >= 60 ? '#C9A84C' : '#1A6B8C'
        return `<div style="margin-bottom:12px">
          <div style="display:flex;justify-content:space-between;align-items:center;font-size:.88rem;margin-bottom:4px">
            <span>${esc(m.praia_nome || '—')}${atingiu ? ' <span style="color:#2A9D6F">✓</span>' : ''}</span>
            <span style="color:#6B7280"><strong style="color:${cor}">${feito}</strong> / ${meta} ninhos · ${pct}%</span>
          </div>
          <div style="height:10px;border-radius:6px;background:rgba(127,127,127,.16);overflow:hidden">
            <div style="height:100%;width:${pct}%;background:${cor};border-radius:6px;transition:width .4s"></div>
          </div>
        </div>`
      }).join('')
    return `<div class="rel-sec" id="sec-metas">
      <div class="rel-sec-title">Metas por praia — temporada</div>
      <p class="rel-chart-sub" style="margin:-2px 0 12px">Ninhos registrados frente à meta definida para cada praia nesta temporada.</p>
      ${linhas}
    </div>`
  }

  // ── Gráficos ─────────────────────────────────────────────────────
  // Tooltip fixo por clique — em telas touch o hover é impreciso demais
  // pra acertar uma fatia/coluna fina. Clicar mostra o tooltip "preso"
  // no ponto; clicar fora dele esconde.
  function attachClickTooltip(chart) {
    chart.canvas.onclick = evt => {
      const pts = chart.getElementsAtEventForMode(evt, 'nearest', { intersect: true }, true)
      if (!pts.length) {
        chart.setActiveElements([])
        chart.tooltip?.setActiveElements([], { x: 0, y: 0 })
        chart.update()
        return
      }
      const active = pts.map(p => ({ datasetIndex: p.datasetIndex, index: p.index }))
      chart.setActiveElements(active)
      chart.tooltip?.setActiveElements(active, { x: evt.offsetX, y: evt.offsetY })
      chart.update()
    }
  }

  function mkChart(id, cfg) {
    const el = document.getElementById(id)
    if (!el) return
    _charts[id]?.destroy()
    cfg.options = cfg.options || {}
    cfg.options.plugins = cfg.options.plugins || {}
    // Tooltip padrão com % do total, só quando o gráfico não define o seu.
    if (!cfg.options.plugins.tooltip && (cfg.type === 'doughnut' || cfg.type === 'pie')) {
      cfg.options.plugins.tooltip = {
        callbacks: {
          label(ctx) {
            const total = (ctx.dataset.data || []).reduce((s, x) => s + (x || 0), 0)
            const val = ctx.parsed
            const p = total ? Math.round(100 * val / total) : 0
            return `${ctx.label}: ${val} (${p}%)`
          }
        }
      }
    }
    _charts[id] = new Chart(el.getContext('2d'), cfg)
    attachClickTooltip(_charts[id])
  }

          borderRadius:4
        }]
      },
      options:{
        indexAxis:'y', responsive:true, maintainAspectRatio:false, animation:{duration:500},
        plugins:{ legend:{display:false} },
        scales:{
          x:{ beginAtZero:true, grid:{color:gridColor}, ticks:{color:'#6B7280', font:tickFont}, title:{display:true,text:'%',color:'#9CA3AF',font:{size:9}} },
          y:{ grid:{display:false}, ticks:{color:'#6B7280', font:tickFont} }
        }
      }
    })
  }

  const BERC_CORES = ['#1A6B8C','#2A9D6F','#C9A84C','#7ECEE8','#D97706','#8b5cf6','#ec4899','#6366f1']

  function grafBercCrescimento(series) {
    if (!series.length) return
    const datas = [...new Set(series.flatMap(s => s.pontos.map(p => p.data)))].sort()
    mkChart('graf-berc-crescimento', {
      type:'line',
      data:{
        labels: datas,
        datasets: series.map((s, i) => ({
          label: s.nome,
          data: datas.map(d => s.pontos.find(p => p.data === d)?.comp ?? null),
          borderColor: BERC_CORES[i % BERC_CORES.length],
          backgroundColor: BERC_CORES[i % BERC_CORES.length],
          borderWidth:2, tension:.35, pointRadius:3, spanGaps:true
        }))
      },
      options:{
        responsive:true, maintainAspectRatio:false, animation:{duration:600},
        plugins:{ legend:legendOpts },
        scales:{
          x:{ grid:{display:false}, ticks:{color:'#6B7280', font:tickFont} },
          y:{ grid:{color:gridColor}, ticks:{color:'#6B7280', font:tickFont}, beginAtZero:true, title:{display:true,text:'Comprimento (cm)',color:'#9CA3AF',font:{size:9}} }
        }
      }
    })
  }

  // ── Soltura e crescimento por espécie (web: painel + detalhado) ──
  function grafSoltosEspecie(arr, canvasId) {
    if (!arr || !arr.length) return
    mkChart(canvasId || 'graf-soltos-esp', {
      type:'bar',
      data:{
        labels: arr.map(s => espLabel(s.especie)),
        datasets:[
          { label:'Via berçário', data: arr.map(s => s.via_bercario || 0), backgroundColor:'#2A9D6F', borderRadius:4 },
          { label:'Direto no rio', data: arr.map(s => s.direto_rio || 0), backgroundColor:'#1A6B8C', borderRadius:4 },
        ]
      },
      options:{
        indexAxis:'y', responsive:true, maintainAspectRatio:false, animation:{duration:600},
        plugins:{ legend:{...legendOpts, position:'bottom'} },
        scales:{
          x:{ stacked:true, beginAtZero:true, grid:{color:gridColor}, ticks:{color:'#6B7280', font:tickFont} },
          y:{ stacked:true, grid:{display:false}, ticks:{color:'#6B7280', font:tickFont} }
        }
      }
    })
  }

  // Barra horizontal de taxa (%) colorida por espécie. `rotulo` escolhe
  // o label do eixo (nome do berçário ou da espécie).
  function grafTaxaSoltura(arr, canvasId, rotulo) {
    if (!arr || !arr.length) return
    mkChart(canvasId, {
      type:'bar',
      data:{
        labels: arr.map(rotulo),
        datasets:[{ data: arr.map(t => t.taxa_pct || 0), backgroundColor: arr.map(t => espCor(t.especie)), borderRadius:4 }]
      },
      options:{
        indexAxis:'y', responsive:true, maintainAspectRatio:false, animation:{duration:500},
        plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label(ctx){
          const t = arr[ctx.dataIndex]
          return ` ${espLabel(t.especie)}: ${t.taxa_pct ?? 0}% (${t.soltos}/${t.entrada})`
        } } } },
        scales:{
          x:{ beginAtZero:true, suggestedMax:100, grid:{color:gridColor}, ticks:{color:'#6B7280', font:tickFont}, title:{display:true,text:'%',color:'#9CA3AF',font:{size:9}} },
          y:{ grid:{display:false}, ticks:{color:'#6B7280', font:tickFont} }
        }
      }
    })
  }

  // Curva de crescimento: uma linha por espécie num eixo X de datas
  // compartilhado (comp_medio ou peso_medio). Escalas cm e g nunca
  // dividem o mesmo eixo — por isso comprimento e peso são gráficos
  // separados.
  function grafCrescEspecie(arr, canvasId, campo, unidade) {
    const pts = (arr || []).filter(s => s[campo] != null)
    if (!pts.length) return
    const datas = [...new Set(pts.map(s => s.data))].sort()
    const especies = [...new Set(pts.map(s => s.especie))]
    mkChart(canvasId, {
      type:'line',
      data:{
        labels: datas,
        datasets: especies.map(esp => ({
          label: espLabel(esp),
          data: datas.map(dt => pts.find(s => s.especie === esp && s.data === dt)?.[campo] ?? null),
          borderColor: espCor(esp), backgroundColor: espCor(esp),
          borderWidth:2, tension:.35, pointRadius:3, spanGaps:true
        }))
      },
      options:{
        responsive:true, maintainAspectRatio:false, animation:{duration:600},
        plugins:{ legend:legendOpts },
        scales:{
          x:{ grid:{display:false}, ticks:{color:'#6B7280', font:tickFont} },
          y:{ grid:{color:gridColor}, ticks:{color:'#6B7280', font:tickFont}, beginAtZero:true, title:{display:true,text:unidade,color:'#9CA3AF',font:{size:9}} }
        }
      }
    })
  }

  // Barra horizontal de ganho (Δ) por berçário, colorida por espécie.
  function grafGanhoBerc(arr, canvasId, campo, campoN, unidade) {
    const rows = (arr || []).filter(g => g[campo] != null && (g[campoN] || 0) > 0)
    if (!rows.length) return
    mkChart(canvasId, {
      type:'bar',
      data:{
        labels: rows.map(g => g.bercario_nome || '—'),
        datasets:[{ data: rows.map(g => g[campo]), backgroundColor: rows.map(g => espCor(g.especie)), borderRadius:4 }]
      },
      options:{
        indexAxis:'y', responsive:true, maintainAspectRatio:false, animation:{duration:500},
        plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label(ctx){
          const g = rows[ctx.dataIndex]
          return ` ${espLabel(g.especie)}: +${g[campo]} ${unidade} (${g[campoN]} filhote${g[campoN] !== 1 ? 's' : ''})`
        } } } },
        scales:{
          x:{ beginAtZero:true, grid:{color:gridColor}, ticks:{color:'#6B7280', font:tickFont}, title:{display:true,text:unidade,color:'#9CA3AF',font:{size:9}} },
          y:{ grid:{display:false}, ticks:{color:'#6B7280', font:tickFont} }
        }
      }
    })
  }

  function grafOcorrencias(oc) {
    if (!oc.length) return
    const TIPOS = { alimentacao:'Alimentação', biometria:'Biometria', mortalidade:'Mortalidade', doenca:'Doença', tratamento:'Tratamento', observacao:'Observação' }
    const CORES = { alimentacao:'#2A9D6F', biometria:'#1A6B8C', mortalidade:'#ef4444', doenca:'#f97316', tratamento:'#7ECEE8', observacao:'#9CA3AF' }
    mkChart('graf-oc', {
      type:'bar',
      data:{
        labels: oc.map(o => TIPOS[o.tipo] || o.tipo),
        datasets:[{ data:oc.map(o => o.total), backgroundColor: oc.map(o => CORES[o.tipo]||'#9CA3AF'), borderRadius:4 }]
      },
      options:{
        responsive:true, maintainAspectRatio:false, animation:{duration:500},
        plugins:{ legend:{display:false} },
        scales:{
          x:{ grid:{display:false}, ticks:{color:'#6B7280', font:tickFont} },
          y:{ grid:{color:gridColor}, ticks:{color:'#6B7280', font:tickFont}, beginAtZero:true }
        }
      }
    })
  }

  function grafDestino(k) {
    mkChart('graf-destino', {
      type:'doughnut',
      data:{
        labels:['Soltura direta ao rio','Via berçário'],
        datasets:[{ data:[k.solturas_direto_rio||0, k.solturas_via_bercario||0],
          backgroundColor:['#1A6B8C','#2A9D6F'], borderWidth:2, borderColor:'rgba(0,0,0,.3)', hoverOffset:8 }]
      },
      options:{ cutout:'60%', plugins:{ legend:{...legendOpts, position:'bottom'} }, animation:{duration:600} }
    })

  function grafMonitores(mon) {

    if (!top.length) return
    const wrap = document.getElementById('wrap-mon')
    if (wrap) wrap.style.height = (top.length * 28 + 40) + 'px'

      data:{
        labels: top.map(m => m.monitor_nome || '?'),

          { label:'Ninhos',   data:top.map(m => m.ninhos),       backgroundColor:'#1A6B8C99', borderRadius:3 },

      },

          x:{ grid:{color:gridColor}, ticks:{color:'#6B7280', font:tickFont}, beginAtZero:true },
          y:{ grid:{display:false}, ticks:{color:'#6B7280', font:tickFont, maxRotation:0} }

  // ═══════════════════════════════════════════════════════════════
  // PAINEL DO GESTOR
  // ═══════════════════════════════════════════════════════════════

  // Agrega perdas por causa fina + totais de ovos das praias do Painel.
  function painelAgregados() {
    const P = _painelPraias || []
    const soma = f => P.reduce((s, x) => s + (x[f] || 0), 0)
    return {
      perdas: {
        predacao:   soma('perdas_predacao'),
        alagamento: soma('perdas_alagamento'),
        erosao:     soma('perdas_erosao'),
        humana:     soma('perdas_humana'),
      },
      inundados:     soma('inundados'),
      predados:      soma('predados'),
      falha_eclosao: soma('falha_eclosao'),
    }
  }

  // Monta a lista consolidada de alertas ativos (críticos primeiro).
  function painelAlertas(ag) {
    const atrasados = _painelPrevisao.filter(r => r.faixa_risco === 'atrasado').length
    const hoje      = _painelPrevisao.filter(r => r.faixa_risco === 'hoje').length
    const A = []
    if (atrasados)         A.push({ sev:'crit', tag:'Crítico', t:`${atrasados} ninho(s) com eclosão atrasada`, d:'Passaram do máximo de incubação sem nascimento — verificar em campo' })
    if (ag.inundados)      A.push({ sev:'alta', tag:'Alto',    t:`${ag.inundados} ninho(s) com alagamento`,     d:'Alagamento ou sinal de inundação registrado nas visitas' })
    if (ag.predados)       A.push({ sev:'alta', tag:'Alto',    t:`${ag.predados} ninho(s) com predação`,        d:'Predação registrada na incubação ou em visita' })
    if (hoje)              A.push({ sev:'alta', tag:'Alto',    t:`${hoje} ninho(s) com eclosão prevista para hoje`, d:'Acompanhar nascimento e destino dos filhotes' })
    if (ag.falha_eclosao)  A.push({ sev:'alta', tag:'Alto',    t:`${ag.falha_eclosao} ninho(s) com falha de eclosão`, d:'Eclosão registrada com 0 filhotes vivos' })
    return A
  }

  // Buckets de previsão para o painel "Eclosão — próximos 7 dias".
  function painelEclosao() {
    const dias = r => r.dias_para_eclosao
    return [
      { chave:'atraso', cor:'#ef4444', tag:'Atraso', lbl:'Atrasados',       rows:_painelPrevisao.filter(r => r.faixa_risco === 'atrasado') },
      { chave:'hoje',   cor:'#2A9D6F', tag:'Hoje',   lbl:'Hoje',            rows:_painelPrevisao.filter(r => r.faixa_risco === 'hoje') },
      { chave:'d13',    cor:'#1A6B8C', tag:'Próx.',  lbl:'Em 1–3 dias',     rows:_painelPrevisao.filter(r => dias(r) >= 1 && dias(r) <= 3) },
      { chave:'d47',    cor:'#C9A84C', tag:'Semana', lbl:'Em 4–7 dias',     rows:_painelPrevisao.filter(r => dias(r) >= 4 && dias(r) <= 7) },
    ].filter(b => b.rows.length)
  }

  function painelKpi(lbl, val, cor, sub) {
    return `<div class="painel-kpi" style="--kpi-cor:${cor}">
      <div class="painel-kpi-val">${val}</div>
      <div class="painel-kpi-lbl">${lbl}</div>
      ${sub ? `<div class="painel-kpi-sub">${sub}</div>` : ''}
    </div>`
  }

  function renderPainel(d) {
    const k  = d.kpis || {}
    const ag = painelAgregados()
    const alertas = painelAlertas(ag)
    const nCrit = alertas.filter(a => a.sev === 'crit').length
    const nAlta = alertas.filter(a => a.sev === 'alta').length
    const baixados = Math.max((k.total_ovos_postura || 0) - (k.total_ovos_viaveis || 0), 0)

    // KPIs
    const kpis = `<div class="painel-kpis">
      ${painelKpi('Ninhos monitorados', v(k.total_ninhos), '#2A9D6F', `${k.pendentes||0} encontrados · ${k.transferidos||0} transferidos`)}
      ${painelKpi('Ovos viáveis', v(k.total_ovos_viaveis), '#1E6B4A', `postura ${formatNum(k.total_ovos_postura||0)} − ${formatNum(baixados)} baixados`)}
      ${painelKpi('Filhotes vivos', v(k.total_filhotes_vivos), '#C9A84C', `${v(k.bercario_total_soltado)} soltos via berçário`)}
      ${painelKpi('Sucesso de nidificação', pct(k.taxa_sucesso_nidificacao_pct), '#1A6B8C', 'ninhos eclodidos ÷ monitorados')}
      ${painelKpi('Alertas ativos', String(alertas.length), alertas.length ? (nCrit ? '#DC2626' : '#EA580C') : '#2A9D6F', `${nCrit} crítico(s) · ${nAlta} alto(s)`)}
    </div>`

    // Alertas
    const alertasHtml = alertas.length
      ? alertas.map(a => `<div class="painel-alert ${a.sev}">
          <div class="pa-sev"></div>
          <div><div class="pa-t">${a.t}</div><div class="pa-d">${a.d}</div></div>
          <span class="pa-tag">${a.tag}</span>
        </div>`).join('')
      : `<div class="painel-alert ok"><div class="pa-sev"></div>
          <div><div class="pa-t">Nenhum alerta ativo</div><div class="pa-d">Nenhuma eclosão atrasada, alagamento ou predação pendente nos filtros atuais</div></div>
          <span class="pa-tag">OK</span></div>`

    // Eclosão — próximos 7 dias
    const buckets = painelEclosao()
    const eclHtml = buckets.length
      ? buckets.map(b => {
          const espCnt = {}
          b.rows.forEach(r => { const e = espLabel(r.especie); espCnt[e] = (espCnt[e]||0)+1 })
          const det = Object.entries(espCnt).map(([e,n]) => `${e} (${n})`).join(' · ')
          return `<div class="painel-alert">
            <div class="pa-sev" style="background:${b.cor}"></div>
            <div><div class="pa-t">${b.lbl} — ${b.rows.length} ninho(s)</div><div class="pa-d">${det || '—'}</div></div>
            <span class="pa-tag" style="background:${b.cor};color:#fff">${b.tag}</span>
          </div>`
        }).join('')
      : `<div class="painel-alert"><div class="pa-sev" style="background:#9CA3AF"></div>
          <div><div class="pa-t">Sem eclosões previstas para os próximos 7 dias</div><div class="pa-d">Nenhum ninho em incubação com previsão nesta janela</div></div>
          <span class="pa-tag" style="background:#9CA3AF;color:#fff">—</span></div>`

    document.getElementById('painel-conteudo').innerHTML = `
      <div style="display:flex;justify-content:flex-end;margin-bottom:10px">
        <button class="btn btn-secondary" onclick="bioGerarPDFPainel()" style="padding:8px 14px" title="Gerar PDF do Painel">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          Gerar PDF
        </button>
      </div>
      ${kpis}
      <div class="painel-grid">
        <div class="painel-card">
          <h3>Alertas ativos</h3>
          <p class="cap">Consolidado — críticos primeiro, ordenados por severidade.</p>
          <div class="painel-alertas">${alertasHtml}</div>
        </div>
        <div class="painel-card">
          <h3>Eclosão — próximos 7 dias</h3>
          <p class="cap">Previsão por espécie (data de encontro + incubação média).</p>
          <div class="painel-alertas">${eclHtml}</div>
        </div>
      </div>
      <div class="painel-charts">
        <div class="painel-card"><h3>Desfecho dos ninhos</h3><p class="cap">Distribuição por status.</p><div class="rel-chart-wrap"><canvas id="graf-p-desfecho"></canvas></div></div>
        <div class="painel-card"><h3>Perdas de ovos por causa</h3><p class="cap">Ovos baixados nas visitas/registro · por temporada/UC/praia.</p><div class="rel-chart-wrap"><canvas id="graf-p-perdas"></canvas></div></div>
        <div class="painel-card"><h3>Fenologia da temporada</h3><p class="cap">Ninhos encontrados e filhotes vivos por mês.</p><div class="rel-chart-wrap"><canvas id="graf-p-fenologia"></canvas></div></div>
        <div class="painel-card"><h3>Ovos por praia (top 8)</h3><p class="cap">Postura × viáveis × perdidos · por temporada/UC/praia.</p><div class="rel-chart-wrap tall"><canvas id="graf-p-ovospraia"></canvas></div></div>
        <div class="painel-card"><h3>Taxa de soltura por espécie</h3><p class="cap">Filhotes soltos ÷ entrados no berçário (%).</p>${_arr('taxa_soltura_por_especie') ? `<div class="rel-chart-wrap"><canvas id="graf-p-taxa-solt"></canvas></div>` : _vazio('Nenhum lote em berçário nos filtros atuais.')}</div>
        <div class="painel-card"><h3>Crescimento por espécie</h3><p class="cap">Comprimento médio (cm) dos filhotes no berçário ao longo do tempo.</p>${_arr('crescimento_por_especie') ? `<div class="rel-chart-wrap"><canvas id="graf-p-cresc"></canvas></div>` : _vazio('Sem biometria registrada nos filtros atuais.')}</div>
      </div>`
  }

  function desenharPainel(d) {
    const k  = d.kpis || {}
    const ag = painelAgregados()

    // Rosca — desfecho dos ninhos
    mkChart('graf-p-desfecho', {
      type:'doughnut',
      data:{
        labels:['Eclodido','Em berçário','Soltado','Transferido','Encontrado','Perdido'],
        datasets:[{ data:[k.eclodidos_status||0, k.em_bercario||0, k.soltados||0, k.transferidos||0, k.pendentes||0, k.perdidos||0],
          backgroundColor:['#2A9D6F','#8b5cf6','#7ECEE8','#1A6B8C','#C9A84C','#ef4444'], borderWidth:2, borderColor:'rgba(0,0,0,.15)', hoverOffset:8 }]
      },
      options:{ cutout:'58%', responsive:true, maintainAspectRatio:false, plugins:{ legend:{...legendOpts, position:'right'} }, animation:{duration:600} }
    })

    // Pizza — perdas por causa fina
    const pv = [ag.perdas.predacao, ag.perdas.alagamento, ag.perdas.erosao, ag.perdas.humana]
    const totPerdas = pv.reduce((s,x)=>s+x,0)
    const elPerdas = document.getElementById('graf-p-perdas')
    if (!totPerdas && elPerdas) {
      elPerdas.closest('.rel-chart-wrap').innerHTML = '<div class="rel-loading" style="padding:40px 10px">Nenhuma perda de ovos registrada nos filtros atuais.</div>'
    } else {
      mkChart('graf-p-perdas', {
        type:'pie',
        data:{
          labels:['Predação','Alagamento','Erosão','Ação humana'],
          datasets:[{ data:pv, backgroundColor:['#ef4444','#1A6B8C','#C9A84C','#7B57B0'], borderWidth:2, borderColor:'rgba(0,0,0,.15)', hoverOffset:8 }]
        },
        options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{...legendOpts, position:'right'} }, animation:{duration:600} }
      })
    }

    // Linha — fenologia
    const mes = d.por_mes || []
    if (mes.length) {
      mkChart('graf-p-fenologia', {
        type:'line',
        data:{
          labels: mes.map(m => m.mes),
          datasets:[
            { label:'Ninhos encontrados', data:mes.map(m => m.ninhos), borderColor:'#1A6B8C', backgroundColor:'rgba(26,107,140,.14)', fill:true, tension:.3, pointRadius:3 },
            { label:'Filhotes vivos',    data:mes.map(m => m.filhotes), borderColor:'#2A9D6F', backgroundColor:'rgba(42,157,111,.1)', fill:true, tension:.3, pointRadius:3 },
          ]
        },
        options:{
          responsive:true, maintainAspectRatio:false, animation:{duration:600},
          plugins:{ legend:legendOpts },
          scales:{ x:{ grid:{color:gridColor}, ticks:{color:'#6B7280', font:tickFont} },
            y:{ grid:{color:gridColor}, ticks:{color:'#6B7280', font:tickFont}, beginAtZero:true } }
        }
      })
    }

    // Colunas — ovos por praia (top 8 por postura)
    const praias = (_painelPraias || []).slice().sort((a,b)=>(b.ovos_monitorados||0)-(a.ovos_monitorados||0)).slice(0,8)
    if (praias.length) {
      mkChart('graf-p-ovospraia', {
        type:'bar',
        data:{
          labels: praias.map(p => p.sigla || p.praia || '?'),
          datasets:[
            { label:'Postura',  data:praias.map(p => p.ovos_monitorados||0), backgroundColor:'#C9A84C99', borderColor:'#C9A84C', borderWidth:1, borderRadius:4 },
            { label:'Viáveis',  data:praias.map(p => p.ovos_viaveis||0),     backgroundColor:'#2A9D6F99', borderColor:'#2A9D6F', borderWidth:1, borderRadius:4 },
            { label:'Perdidos', data:praias.map(p => p.ovos_perdidos||0),    backgroundColor:'#ef444499', borderColor:'#ef4444', borderWidth:1, borderRadius:4 },
          ]
        },
        options:{
          responsive:true, maintainAspectRatio:false, animation:{duration:600},
          plugins:{ legend:legendOpts },
          scales:{ x:{ grid:{display:false}, ticks:{color:'#6B7280', font:tickFont} },
            y:{ grid:{color:gridColor}, ticks:{color:'#6B7280', font:tickFont}, beginAtZero:true } }
        }
      })
    }

    // Berçário por espécie — taxa de soltura e crescimento (comprimento)
    grafTaxaSoltura(d.taxa_soltura_por_especie || [], 'graf-p-taxa-solt', t => espLabel(t.especie))
    grafCrescEspecie(d.crescimento_por_especie || [], 'graf-p-cresc', 'comp_medio', 'cm')
  }

  // ── PDF do Painel — mesmo motor jsPDF do relatório de ninhos (js/
  // biomonitor-relatorio-ninho.js, já carregado nesta página), reaproveitando
  // os gráficos Chart.js já desenhados na tela (via toBase64Image) em vez de
  // desenhar tudo de novo — evita duplicar 6 gráficos e mantém paginação
  // sem cortar cards/gráficos (o problema do antigo window.print()).
  function _painelTextoFiltros() {
    const opt = id => { const s = sel(id); return s.selectedIndex > 0 ? s.options[s.selectedIndex].text : null }
    return [opt('fil-temporada'), opt('fil-programa'), opt('fil-localizacao'), opt('fil-uc'), opt('fil-praia')]
      .filter(Boolean).join(' · ') || 'Todos os registros (sem filtro)'
  }

  function _painelSecaoKpis(ctx, k, alertas) {
    const nCrit = alertas.filter(a => a.sev === 'crit').length
    const nAlta = alertas.filter(a => a.sev === 'alta').length
    const baixados = Math.max((k.total_ovos_postura || 0) - (k.total_ovos_viaveis || 0), 0)
    _biopdfTitulo(ctx, 'Indicadores Gerais')
    _biopdfTabela(ctx, {
      head: [['Indicador', 'Valor', 'Detalhe']],
      body: [
        ['Ninhos monitorados', v(k.total_ninhos), `${k.pendentes || 0} encontrados · ${k.transferidos || 0} transferidos`],
        ['Ovos viáveis', v(k.total_ovos_viaveis), `postura ${formatNum(k.total_ovos_postura || 0)} − ${formatNum(baixados)} baixados`],
        ['Filhotes vivos', v(k.total_filhotes_vivos), `${v(k.bercario_total_soltado)} soltos via berçário`],
        ['Sucesso de nidificação', pct(k.taxa_sucesso_nidificacao_pct), 'ninhos eclodidos ÷ monitorados'],
        ['Alertas ativos', String(alertas.length), `${nCrit} crítico(s) · ${nAlta} alto(s)`],
      ],
      columnStyles: { 0: { fontStyle: 'bold', cellWidth: 55 } },
    })
  }

  function _painelSecaoAlertas(ctx, alertas) {
    _biopdfTitulo(ctx, 'Alertas Ativos')
    if (!alertas.length) {
      _biopdfParagrafoMuted(ctx, 'Nenhum alerta ativo — nenhuma eclosão atrasada, alagamento ou predação pendente nos filtros atuais.')
      return
    }
    _biopdfTabela(ctx, {
      head: [['Severidade', 'Alerta', 'Detalhe']],
      body: alertas.map(a => [a.tag, a.t, a.d]),
      columnStyles: { 0: { cellWidth: 20 }, 1: { cellWidth: 55 } },
    })
  }

  function _painelSecaoEclosao(ctx) {
    const buckets = painelEclosao()
    _biopdfTitulo(ctx, 'Eclosão — Próximos 7 Dias')
    if (!buckets.length) {
      _biopdfParagrafoMuted(ctx, 'Sem eclosões previstas para os próximos 7 dias nos filtros atuais.')
      return
    }
    _biopdfTabela(ctx, {
      head: [['Faixa', 'Ninhos', 'Espécies']],
      body: buckets.map(b => {
        const espCnt = {}
        b.rows.forEach(r => { const e = espLabel(r.especie); espCnt[e] = (espCnt[e] || 0) + 1 })
        return [b.lbl, String(b.rows.length), Object.entries(espCnt).map(([e, n]) => `${e} (${n})`).join(' · ') || '—']
      }),
      columnStyles: { 0: { cellWidth: 28 }, 1: { cellWidth: 20 } },
    })
  }

  // Captura os gráficos Chart.js já renderizados na tela (o usuário precisa
  // ter aberto a aba Painel antes) como imagem, em vez de redesenhar tudo —
  // dispensa reimplementar 6 gráficos no motor jsPDF.
  function _painelCapturarGrafico(id) {
    const chart = _charts[id]
    const canvas = document.getElementById(id)
    if (!chart || !canvas?.width) return null
    return { dataUrl: chart.toBase64Image('image/png', 1), ratio: canvas.height / canvas.width }
  }

  function _painelSecaoGraficos(ctx, itens) {
    const disponiveis = itens.map(it => {
      const g = _painelCapturarGrafico(it.id)
      return g ? { ...it, ...g } : null
    }).filter(Boolean)
    if (!disponiveis.length) return
    _biopdfTitulo(ctx, 'Gráficos')
    const { pdf } = ctx
    const gap = 6
    const largura = (ctx.W - BIOPDF_M * 2 - gap) / 2
    for (let i = 0; i < disponiveis.length; i += 2) {
      const par = disponiveis.slice(i, i + 2)
      const legLinhas = par.map(p => pdf.splitTextToSize(p.legenda, largura))
      const nLinhasLeg = Math.max(...legLinhas.map(l => l.length))
      const alturaImg = Math.min(Math.max(...par.map(p => largura * p.ratio)), 75)
      const alturaTitulo = 4 + nLinhasLeg * 3.2
      _biopdfGarantirEspaco(ctx, alturaTitulo + alturaImg + 8)
      par.forEach((p, j) => {
        const x = BIOPDF_M + j * (largura + gap)
        pdf.setFont('DMSans', 'bold'); pdf.setFontSize(8); pdf.setTextColor(...BIOPDF_COR.texto)
        pdf.text(p.titulo, x, ctx.y)
        pdf.setFont('DMSans', 'normal'); pdf.setFontSize(6.8); pdf.setTextColor(...BIOPDF_COR.muted2)
        pdf.text(legLinhas[j], x, ctx.y + 3.6)
        pdf.addImage(p.dataUrl, 'PNG', x, ctx.y + alturaTitulo, largura, alturaImg)
      })
      ctx.y += alturaTitulo + alturaImg + 8
    }
  }

      pdf.text('RELATÓRIO — BIOMONITOR', BIOPDF_M, ctx.y)

      const k = _dados.kpis || {}

      _painelSecaoKpis(ctx, k, alertas)

      _painelSecaoGraficos(ctx, [

        { id: 'graf-p-perdas', titulo: 'Perdas de ovos por causa', legenda: 'Ovos baixados nas visitas/registro.' },

        { id: 'graf-p-ovospraia', titulo: 'Ovos por praia (top 8)', legenda: 'Postura × viáveis × perdidos.' },
        { id: 'graf-p-taxa-solt', titulo: 'Taxa de soltura por espécie', legenda: 'Filhotes soltos ÷ entrados no berçário (%).' },
        { id: 'graf-p-cresc', titulo: 'Crescimento por espécie', legenda: 'Comprimento médio (cm) no berçário ao longo do tempo.' },
      ])
      _biopdfAssinatura(ctx)

      _biopdfAplicarCabecalhoRodapeGlobal(ctx, logos)
      _biopdfAbrirPreview(pdf, `painel-biomonitor-${new Date().toISOString().slice(0, 10)}.pdf`)
    } catch (e) {
