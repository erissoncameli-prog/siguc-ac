  // ── Carrega Leaflet lazily ─────────────────────────────────────
  async function mapaCarregarLeaflet() {
    if (_mapaLeafletOK) return
    await Promise.all([
      new Promise((res, rej) => {
        if (document.querySelector('link[href*="leaflet"]')) { res(); return }
        const l = document.createElement('link')
        l.rel = 'stylesheet'; l.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'
        l.onload = res; l.onerror = rej; document.head.appendChild(l)
      }),
      new Promise((res, rej) => {
        if (window.L) { res(); return }
        const s = document.createElement('script')
        s.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'
        s.onload = res; s.onerror = rej; document.head.appendChild(s)
      })
    ])
    // Leaflet.heat
    await new Promise((res, rej) => {
      if (window.L && L.heatLayer) { res(); return }
      const s = document.createElement('script')
      s.src = 'https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js'
      s.onload = res; s.onerror = () => res()  // heat é opcional
      document.head.appendChild(s)
    })
    _mapaLeafletOK = true
  }

  // ── Inicializa o mapa ─────────────────────────────────────────
  window.mapaEnsureInit = async function() {
    const container = document.getElementById('mapa-bio')
    if (!container) return
    // O painel lateral e a barra de comparação usam position:fixed e
    // precisam se referenciar à viewport. Reanexa ambos no <body> para
    // não ficarem presos a um ancestral com transform (ex.: .page-body),
    // o que faria a barra abrir fora da área visível durante a rolagem.
    ;['mapa-slide-panel', 'mapa-comp-bar'].forEach(id => {
      const el = document.getElementById(id)
      if (el && el.parentElement !== document.body) document.body.appendChild(el)
    })
    await mapaCarregarLeaflet()
    if (!_mapaLeafletInst || !document.contains(_mapaLeafletInst.getContainer())) {
      if (_mapaLeafletInst) { try { _mapaLeafletInst.remove() } catch(e) {} }
      _mapaLeafletInst = L.map('mapa-bio', { center: [-9.0, -70.5], zoom: 6, zoomControl: true })
      L.tileLayer('https://{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
        maxZoom: 21, subdomains: ['mt0','mt1','mt2','mt3'], attribution: '© Google'
      }).addTo(_mapaLeafletInst)
      _mapaCamadas.poligonos = L.layerGroup().addTo(_mapaLeafletInst)
      _mapaCamadas.ninhos    = L.layerGroup().addTo(_mapaLeafletInst)
      _mapaCamadas.transf    = L.layerGroup().addTo(_mapaLeafletInst)
      _mapaCamadas.calor     = null
    }
    await mapaCarregarDados()
    // A aba Mapa fica oculta até ser aberta; ao exibir, o Leaflet precisa
    // recalcular o tamanho do container para os tiles preencherem a área.
    setTimeout(() => { try { _mapaLeafletInst && _mapaLeafletInst.invalidateSize() } catch(e) {} }, 160)
  }

  // ── Carrega dados das RPCs ─────────────────────────────────────
  async function mapaCarregarDados() {
    const params = {
      p_temporada_id: sel('fil-temporada').value || null,
      p_programa_id:  sel('fil-programa').value  || null,
      p_uc_id:        sel('fil-uc').value        || null,
    }

    const { data: praias, error: ep } = await db.rpc('bio_mapa_praias', params)
    if (ep || !praias) return

    _mapaPraiaData = praias
    _mapaPraiasSel = new Set(_mapaPraiaData.map(p => p.id))

    mapaRenderListaPraias()
    mapaRenderPoligonos()
    await mapaCarregarNinhos()
  }

  async function mapaCarregarNinhos() {
    if (!_mapaLeafletInst) return
    const ids = _mapaPraiasSel.size ? [..._mapaPraiasSel] : null
    const { data: ninhos } = await db.rpc('bio_mapa_ninhos', {
      p_praia_ids:    ids,
      p_temporada_id: sel('fil-temporada').value || null,
      p_especies:     _mapaFiltEsp.size    ? [..._mapaFiltEsp]    : null,
      p_statuses:     _mapaFiltStatus.size ? [..._mapaFiltStatus] : null,
      p_meses:        _mapaFiltMes.size    ? [..._mapaFiltMes].map(Number) : null,
    })
    _mapaNinhoData = ninhos || []
    mapaRenderNinhos()
    mapaRenderTransf()
  }

  // ── Render: lista de praias ────────────────────────────────────
  function mapaRenderListaPraias(filtro) {
    const lista = document.getElementById('mapa-praia-lista')
    if (!lista) return
    const q = (filtro || '').toLowerCase()
    const visiveis = _mapaPraiaData.filter(p =>
      !q || p.nome.toLowerCase().includes(q)
    )
    if (!visiveis.length) {
      lista.innerHTML = '<div style="color:#6B7280;font-size:11px;padding:8px 4px">Nenhuma praia encontrada.</div>'
      return
    }
    lista.innerHTML = visiveis.map(p => `
      <label class="mapa-praia-item">
        <input type="checkbox" ${_mapaPraiasSel.has(p.id) ? 'checked' : ''}
          onchange="mapaTogglePraia('${p.id}',this.checked)">
        <span class="mapa-praia-item-nome">${esc(p.nome)}</span>
        <span class="mapa-praia-item-cnt">${p.ninhos_total}</span>
      </label>`).join('')
  }

  window.mapaFiltrarListaPraias = function(q) { mapaRenderListaPraias(q) }

  window.mapaTodasPraias = function(marcar) {
    if (marcar) _mapaPraiasSel = new Set(_mapaPraiaData.map(p => p.id))
    else _mapaPraiasSel.clear()
    mapaRenderListaPraias(document.getElementById('mapa-busca-praia')?.value)
    mapaRenderPoligonos()
    mapaCarregarNinhos()
  }

  window.mapaTogglePraia = function(id, checked) {
    if (checked) _mapaPraiasSel.add(id)
    else _mapaPraiasSel.delete(id)
    mapaRenderPoligonos()
    mapaCarregarNinhos()
  }

  // ── Render: polígonos das praias ───────────────────────────────
  function mapaRenderPoligonos() {
    if (!_mapaCamadas.poligonos) return
    _mapaCamadas.poligonos.clearLayers()
    let bounds = null

    const maxNinhos = Math.max(..._mapaPraiaData.map(p => p.ninhos_total), 1)
    const corPoligono = (n) => {
      const r = n / maxNinhos
      if (r >= 0.75) return { fill: '#ef4444', borda: '#b91c1c' }
      if (r >= 0.40) return { fill: '#C9A84C', borda: '#92700a' }
      if (r >= 0.10) return { fill: '#52B788', borda: '#2E7D5B' }
      return { fill: '#7ECEE8', borda: '#1A6B8C' }
    }

    _mapaPraiaData.forEach(p => {
      if (!_mapaPraiasSel.has(p.id)) return
      const { fill, borda } = corPoligono(p.ninhos_total)
      let centro = (p.lat != null && p.lng != null) ? L.latLng(p.lat, p.lng) : null

      if (p.area_geojson) {
        try {
          const poly = L.geoJSON(p.area_geojson, {
            style: { color: borda, weight: 2.5, fillColor: fill, fillOpacity: .38 }
          })
          poly.addTo(_mapaCamadas.poligonos)
          poly.on('click', () => mapaAbrirPraia(p))
          const b = poly.getBounds()
          if (b.isValid()) { bounds = bounds ? bounds.extend(b) : b; if (!centro) centro = b.getCenter() }
        } catch(e) {}
      }

      if (centro) {
        const mk = L.circleMarker(centro, { radius: 7, color: borda, fillColor: fill, fillOpacity: .9, weight: 2 })
        mk.addTo(_mapaCamadas.poligonos)
        mk.on('click', () => mapaAbrirPraia(p))
        if (!bounds) bounds = L.latLngBounds(centro, centro)
        else bounds.extend(centro)
      }
    })

    if (bounds && bounds.isValid()) {
      try { _mapaLeafletInst.fitBounds(bounds, { padding: [40, 40], maxZoom: 14 }) } catch(e) {}
    }
  }

  // ── Render: marcadores de ninhos ───────────────────────────────
  function mapaRenderNinhos() {
    if (!_mapaCamadas.ninhos) return
    _mapaCamadas.ninhos.clearLayers()
    if (_mapaCamadas.calor) _mapaCamadas.calor.clearLayers()

    const heatPts = []

    _mapaNinhoData.forEach(n => {
      if (!n.lat || !n.lng) return
      const cor = ESP_MAPA_COR[n.especie] || '#9CA3AF'
      const temAlerta = n.alertas && n.alertas.length

      const icon = L.divIcon({
        className: '',
        iconSize: [14, 14],
        iconAnchor: [7, 7],
        html: `<div style="width:14px;height:14px;border-radius:50%;background:${cor};
          border:2px solid ${temAlerta ? '#ef4444' : 'rgba(255,255,255,.8)'};
          box-shadow:0 1px 4px rgba(0,0,0,.4)"></div>`
      })

      const mk = L.marker([n.lat, n.lng], { icon })
      mk.addTo(_mapaCamadas.ninhos)
      mk.on('click', () => mapaAbrirNinho(n))

      heatPts.push([n.lat, n.lng, 0.6])
    })

    // Heatmap
    if (heatPts.length && L.heatLayer && document.getElementById('ml-calor')?.checked) {
      if (_mapaCamadas.calor) _mapaCamadas.calor.remove()
      _mapaCamadas.calor = L.heatLayer(heatPts, { radius: 30, blur: 20, maxZoom: 14 })
        .addTo(_mapaLeafletInst)
    }
  }

  // ── Render: linhas de transferência ───────────────────────────
  function mapaRenderTransf() {
    if (!_mapaCamadas.transf) return
    _mapaCamadas.transf.clearLayers()

    const coords = {}
    _mapaPraiaData.forEach(p => {
      const c = p.area_geojson ? null : (p.lat && p.lng ? L.latLng(p.lat, p.lng) : null)
      if (c) coords[p.id] = c
    })
    _mapaPraiaData.forEach(p => {
      if (!coords[p.id] && p.lat && p.lng) coords[p.id] = L.latLng(p.lat, p.lng)
    })

    const pares = {}
    _mapaNinhoData.forEach(n => {
      if (!n.transferencia) return
      if (!n.praia_id) return
      const keyFwd = n.praia_id + '|ninho'
      pares[keyFwd] = (pares[keyFwd] || 0) + 1
    })
  }

  // ── Atualiza visibilidade das camadas ─────────────────────────
  window.mapaAtualizarCamadas = function() {
    if (!_mapaLeafletInst) return
    const cb = id => document.getElementById(id)?.checked
    _mapaCamadas.poligonos && (cb('ml-poligonos') ? _mapaCamadas.poligonos.addTo(_mapaLeafletInst) : _mapaCamadas.poligonos.remove())
    _mapaCamadas.ninhos    && (cb('ml-ninhos')    ? _mapaCamadas.ninhos.addTo(_mapaLeafletInst)    : _mapaCamadas.ninhos.remove())
    _mapaCamadas.transf    && (cb('ml-transf')    ? _mapaCamadas.transf.addTo(_mapaLeafletInst)    : _mapaCamadas.transf.remove())
    if (cb('ml-calor') && _mapaNinhoData.length && L.heatLayer) {
      if (!_mapaCamadas.calor || !_mapaLeafletInst.hasLayer(_mapaCamadas.calor)) {
        const pts = _mapaNinhoData.filter(n => n.lat && n.lng).map(n => [n.lat, n.lng, 0.6])
        if (_mapaCamadas.calor) _mapaCamadas.calor.remove()
        _mapaCamadas.calor = L.heatLayer(pts, { radius: 30, blur: 20 }).addTo(_mapaLeafletInst)
      }
    } else if (_mapaCamadas.calor && _mapaLeafletInst.hasLayer(_mapaCamadas.calor)) {
      _mapaCamadas.calor.remove()
    }
  }

  // ── Chips de filtro ───────────────────────────────────────────
  window.mapaToggleChip = function(el, tipo) {
    el.classList.toggle('ativo')
    const ativo = el.classList.contains('ativo')
    if (tipo === 'esp')    { ativo ? _mapaFiltEsp.add(el.dataset.esp)       : _mapaFiltEsp.delete(el.dataset.esp) }
    if (tipo === 'status') { ativo ? _mapaFiltStatus.add(el.dataset.status) : _mapaFiltStatus.delete(el.dataset.status) }
    if (tipo === 'mes')    { ativo ? _mapaFiltMes.add(el.dataset.mes)       : _mapaFiltMes.delete(el.dataset.mes) }
    mapaCarregarNinhos()
  }

  // ── Popup da praia ────────────────────────────────────────────
  function popupPraiaHTML(p) {
    const v = (x, s) => x != null ? x + (s || '') : '—'
    const pct = x => x != null ? x + '%' : '—'

    // Histórico anual — mini barras
    const hist = (p.historico_anual || []).filter(h => h.ninhos > 0)
    const maxH = Math.max(...hist.map(h => h.ninhos), 1)
    const barrasHtml = hist.length ? `
      <div class="popup-hist-wrap">
        <div class="popup-hist-title">Histórico anual (ninhos)</div>
        <div class="popup-hist-bars">
          ${hist.slice(-6).map(h => `
            <div class="popup-hist-col">
              <div class="popup-hist-bar" title="${h.ninhos} ninhos em ${h.ano}"
                style="background:#1A6B8C;height:${Math.round(40 * h.ninhos / maxH)}px"></div>
              <div class="popup-hist-ano">${String(h.ano).slice(2)}</div>
            </div>`).join('')}
        </div>
      </div>` : ''

    // Espécies
    const total = p.ninhos_total || 1
    const espHtml = (p.por_especie || []).slice(0, 4).map(e => `
      <div class="popup-esp-row">
        <span style="color:${ESP_MAPA_COR[e.especie]||'#9CA3AF'};font-weight:700;min-width:24px">${e.especie?.slice?.(0,2).toUpperCase() || '?'}</span>
        <div class="popup-esp-track"><div class="popup-esp-fill" style="width:${Math.round(100*e.total/total)}%;background:${ESP_MAPA_COR[e.especie]||'#9CA3AF'}"></div></div>
        <span style="min-width:30px;text-align:right;color:#555">${e.total}</span>
      </div>`).join('')

    const div = document.createElement('div')
    div.className = 'popup-praia'
    div.innerHTML = `
      <div class="popup-nome">${esc(p.nome)}${p.experimental ? ' <span style="color:#9a6b00;font-size:10px">· exp.</span>' : ''}</div>
      <div class="popup-sub">${esc(p.sigla || p.codigo || '')}${p.uc_sigla ? ' · ' + p.uc_sigla : ''}${p.municipio ? ' · ' + p.municipio : ''}</div>
      <div class="popup-kpi-grid">
        <div class="popup-kpi"><div class="popup-kpi-val">${v(p.ninhos_total)}</div><div class="popup-kpi-lbl">ninhos</div></div>
        <div class="popup-kpi"><div class="popup-kpi-val">${v(p.filhotes_vivos)}</div><div class="popup-kpi-lbl">filhotes vivos</div></div>
        <div class="popup-kpi"><div class="popup-kpi-val" style="color:#2A9D6F">${pct(p.taxa_eclosao_pct)}</div><div class="popup-kpi-lbl">taxa eclosão</div></div>
        <div class="popup-kpi"><div class="popup-kpi-val">${v(p.comprimento_m,'m')}</div><div class="popup-kpi-lbl">comprimento</div></div>
      </div>
      ${espHtml ? `<div style="margin-bottom:6px">${espHtml}</div>` : ''}
      ${barrasHtml}
      <div style="font-size:10px;color:#888;margin-bottom:5px">
        Temp. média: <strong>${v(p.temp_media_c,'°C')}</strong>
        &nbsp;·&nbsp; Dist. rio: <strong>${v(p.dist_rio_media_m,'m')}</strong>
      </div>
      <button class="popup-btn" onclick="mapaFiltrarPraia('${p.id}')">Ver ninhos desta praia</button>`
    return div
  }

  window.mapaFiltrarPraia = function(id) {
    _mapaPraiasSel = new Set([id])
    mapaRenderListaPraias()
    mapaRenderPoligonos()
    mapaCarregarNinhos()
    document.querySelectorAll('#sec-mapa .leaflet-popup-close-button').forEach(b => b.click())
  }

  // ── Slide Panel ───────────────────────────────────────────────

  // Abre painel no modo PRAIA (clicar no polígono ou marcador)
  window.mapaAbrirPraia = function(p) {
    _mapaSlidePraia = p
    _mapaSlideMode  = 'praia'
    _mapaSlideTab   = 'resumo'

    document.getElementById('mapa-slide-num').textContent = p.nome
    document.getElementById('mapa-slide-sub').textContent =
      [p.uc_sigla || p.uc_nome, p.municipio].filter(Boolean).join(' · ')

    document.getElementById('mapa-slide-voltar').style.display = 'none'
    document.getElementById('mapa-btn-comparar').style.display = 'none'

    document.getElementById('mapa-slide-tabs').innerHTML = `
      <button class="mapa-tab ativo" id="mtab-resumo" onclick="mapaTab('resumo')">Resumo</button>
      <button class="mapa-tab" id="mtab-ninhos" onclick="mapaTab('ninhos')">Ninhos</button>
      <button class="mapa-tab" id="mtab-historico" onclick="mapaTab('historico')">Histórico</button>`

    mapaRenderSlideCorpo()
    document.getElementById('mapa-slide-panel').classList.add('aberto')
  }

  // Volta para o painel da praia a partir de um ninho
  window.mapaVoltarPraia = function() {
    if (_mapaSlidePraia) mapaAbrirPraia(_mapaSlidePraia)
  }

  // Abre ninho por id (chamado da lista de ninhos da praia)
  window.mapaAbrirNinhoById = function(id) {
    const n = _mapaNinhoData.find(x => x.id === id)
    if (n) mapaAbrirNinho(n)
  }

  // Abre painel no modo NINHO (clicar num marcador)
  window.mapaAbrirNinho = function(n) {
    _mapaSlideNinho = n
    _mapaSlideMode  = 'ninho'
    _mapaSlideTab   = 'ident'
    // Garante contexto de praia para botão "Voltar"
    _mapaSlidePraia = _mapaPraiaData.find(p => p.id === n.praia_id) || _mapaSlidePraia || null

    document.getElementById('mapa-slide-num').textContent = n.numero_ninho || 'Ninho s/n'
    document.getElementById('mapa-slide-sub').textContent =
      `${ESP_MAPA_LABEL[n.especie] || n.especie} · ${n.praia_nome || '—'}`

    document.getElementById('mapa-slide-voltar').style.display = _mapaSlidePraia ? '' : 'none'
    document.getElementById('mapa-btn-comparar').style.display = ''

    document.getElementById('mapa-slide-tabs').innerHTML = `
      <button class="mapa-tab ativo" id="mtab-ident" onclick="mapaTab('ident')">Identificação</button>
      <button class="mapa-tab" id="mtab-cond" onclick="mapaTab('cond')">Condições</button>
      <button class="mapa-tab" id="mtab-fotos" onclick="mapaTab('fotos')">Fotos</button>`

    const btn = document.getElementById('mapa-btn-comparar')
    const jaEsta = _mapaComparacao.some(c => c.id === n.id)
    btn.textContent = jaEsta ? '✓ Comparando' : '+ Comparar'
    btn.classList.toggle('ativo', jaEsta)

    mapaRenderSlideCorpo()
    document.getElementById('mapa-slide-panel').classList.add('aberto')
  }

  window.mapaFecharSlide = function() {
    document.getElementById('mapa-slide-panel').classList.remove('aberto')
  }

  window.mapaTab = function(tab) {
    _mapaSlideTab = tab
    document.querySelectorAll('.mapa-tab').forEach(t => t.classList.remove('ativo'))
    document.getElementById('mtab-' + tab)?.classList.add('ativo')
    mapaRenderSlideCorpo()
  }

  function mapaRenderSlideCorpo() {

    // ── Modo Praia ──────────────────────────────────────────────

            <div class="slide-kpi"><div class="slide-kpi-val" style="color:#2A9D6F">${vf(p.filhotes_vivos)}</div><div class="slide-kpi-lbl">filhotes vivos</div></div>
          </div>
          <div class="slide-kpi-row">

      corpo.innerHTML = `

            <div class="slide-kpi-lbl">taxa eclosão</div>

          <div class="slide-kpi">
            <div class="slide-kpi-val">${vf(n.incubacao_dias,' d')}</div>
            <div class="slide-kpi-lbl">incubação</div>
          </div>
        </div>
        ${alertasHtml ? `<div style="margin-bottom:12px">${alertasHtml}</div>` : ''}
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#6B7280;margin-bottom:8px">Histórico</div>
        ${histHtml || '<div style="color:#6B7280;font-size:11px">Sem eventos registrados.</div>'}
        ${n.observacoes ? `<div style="margin-top:10px;font-size:11px;color:#6B7280;line-height:1.5">${esc(n.observacoes)}</div>` : ''}
        <div style="margin-top:10px;font-size:10px;color:#6B7280">Monitor: ${esc(n.monitor_nome || '—')} · Grupo: ${esc(n.grupo_nome || '—')}</div>`
    }

    else if (_mapaSlideTab === 'cond') {
      const alertaCor = (c) => {
        if (c == null) return '#9CA3AF'
        if (c > 35 || c < 28) return '#ef4444'
        if (c > 33) return '#C9A84C'
        return '#2A9D6F'
      }
      corpo.innerHTML = `
        <div class="slide-kpi-row">
          <div class="slide-kpi">
            <div class="slide-kpi-val" style="color:${alertaCor(n.temperatura_c)}">${vf(n.temperatura_c,'°C')}</div>
            <div class="slide-kpi-lbl">temperatura substrato</div>
          </div>
          <div class="slide-kpi">
            <div class="slide-kpi-val">${vf(n.umidade_pct,'%')}</div>
            <div class="slide-kpi-lbl">umidade</div>
          </div>
        </div>
        <div class="slide-kpi-row">
          <div class="slide-kpi">
            <div class="slide-kpi-val">${vf(n.profundidade_cm,'cm')}</div>
            <div class="slide-kpi-lbl">profundidade</div>
          </div>
          <div class="slide-kpi">
            <div class="slide-kpi-val" style="color:#38bdf8">${vf(n.dist_rio_m,'m')}</div>
            <div class="slide-kpi-lbl">distância ao rio</div>
          </div>
        </div>
        <div class="slide-kpi-row">
          <div class="slide-kpi">
            <div class="slide-kpi-val">${vf(n.ovos_integros)}</div>
            <div class="slide-kpi-lbl">ovos íntegros</div>
          </div>
          <div class="slide-kpi">
            <div class="slide-kpi-val" style="color:#f87171">${vf(n.ovos_descartados)}</div>
            <div class="slide-kpi-lbl">ovos descartados</div>
          </div>
        </div>
        <div style="margin:10px 0 6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#6B7280">Localização GPS</div>
        <div style="font-size:12px;color:#111827;font-family:monospace">
          ${n.lat != null ? n.lat.toFixed(6) : '—'}, ${n.lng != null ? n.lng.toFixed(6) : '—'}
          ${n.precisao_gps_m != null ? `<br><span style="font-size:10px;color:#6B7280">Precisão: ±${n.precisao_gps_m}m</span>` : ''}
        </div>
        ${n.eclosao ? `
        <div style="margin:12px 0 6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#6B7280">Eclosão</div>
        <div class="slide-kpi-row">
          <div class="slide-kpi">
            <div class="slide-kpi-val" style="color:#2A9D6F">${vf(n.eclosao.filhotes_vivos)}</div>
            <div class="slide-kpi-lbl">filhotes vivos</div>
          </div>
          <div class="slide-kpi">
            <div class="slide-kpi-val" style="color:#f87171">${vf(n.eclosao.filhotes_mortos)}</div>
            <div class="slide-kpi-lbl">filhotes mortos</div>
          </div>
        </div>
        <div class="slide-kpi-row">
          <div class="slide-kpi">
            <div class="slide-kpi-val">${vf(n.eclosao.ovos_nao_nascidos)}</div>
            <div class="slide-kpi-lbl">ovos não eclodidos</div>
          </div>
          <div class="slide-kpi">
            <div class="slide-kpi-val">${vf(n.eficiencia_pct,'%')}</div>
            <div class="slide-kpi-lbl">eficiência</div>
          </div>
        </div>` : ''}`
    }

    else if (_mapaSlideTab === 'fotos') {
      const urls = n.foto_urls || []
      corpo.innerHTML = urls.length
        ? `<div class="slide-foto-grid">${urls.map(u =>
            `<img class="slide-foto" src="${esc(u)}" loading="lazy" onclick="window.open('${esc(u)}','_blank')" onerror="this.style.display='none'">`
          ).join('')}</div>`
        : '<div style="color:#6B7280;font-size:12px;padding:16px 0">Nenhuma foto registrada para este ninho.</div>'
    }
  }

  // ── Comparação automática ─────────────────────────────────────
  window.mapaToggleComparar = function() {
    const n = _mapaSlideNinho
    if (!n) return
    const idx = _mapaComparacao.findIndex(c => c.id === n.id)
    if (idx >= 0) _mapaComparacao.splice(idx, 1)
    else _mapaComparacao.push(n)

    const btn = document.getElementById('mapa-btn-comparar')
    const jaEsta = _mapaComparacao.some(c => c.id === n.id)
    btn.textContent = jaEsta ? '✓ Comparando' : '+ Comparar'
    btn.classList.toggle('ativo', jaEsta)

    mapaRenderComparacao()
  }

  window.mapaClearComparacao = function() {
    _mapaComparacao = []
    mapaRenderComparacao()
    const btn = document.getElementById('mapa-btn-comparar')
    if (btn) { btn.textContent = '+ Comparar'; btn.classList.remove('ativo') }
  }

  function mapaRenderComparacao() {
    const bar = document.getElementById('mapa-comp-bar')
    const titulo = document.getElementById('mapa-comp-titulo')
    if (!bar) return

    if (_mapaComparacao.length < 2) {
      bar.classList.remove('aberta')
      titulo.textContent = _mapaComparacao.length === 1 ? 'Selecione mais 1 ninho para comparar' : 'Comparação'
      if (_mapaComparacao.length === 1) bar.classList.add('aberta')
      else return
    } else {
      bar.classList.add('aberta')
    }

    const ninhos = _mapaComparacao
    titulo.textContent = `Comparando ${ninhos.length} ninho${ninhos.length > 1 ? 's' : ''}`

    // Agrupa por espécie para calcular ranking
    const rankPor = (campo, menor = false) => {
      const porEsp = {}
      ninhos.forEach(n => { if (!porEsp[n.especie]) porEsp[n.especie] = []; porEsp[n.especie].push(n) })
      const rank = {}
      Object.values(porEsp).forEach(grupo => {
        const sorted = [...grupo].sort((a, b) =>
          menor ? (a[campo] ?? Infinity) - (b[campo] ?? Infinity)
                : (b[campo] ?? -Infinity) - (a[campo] ?? -Infinity)
        )
        sorted.forEach((n, i) => { rank[n.id] = rank[n.id] || {}; rank[n.id][campo] = i + 1 })
      })
      return rank
    }

    const rOvos    = rankPor('qtd_ovos')
    const rInteg   = rankPor('ovos_integros')
    const rFilh    = rankPor('eclosao_filhotes')  // will compute
    const rTaxa    = rankPor('taxa_eclosao_pct')
    const rTemp    = rankPor('temperatura_c', true)
    const rDist    = rankPor('dist_rio_m', true)
    const rEfic    = rankPor('eficiencia_pct')

    ninhos.forEach(n => { n.eclosao_filhotes = n.eclosao?.filhotes_vivos ?? null })
    const rFilhotes = rankPor('eclosao_filhotes')

    const rCell = (val, rankObj, ninho, suf, menor) => {
      const r = rankObj[ninho.id]?.[Object.keys(rankObj[ninho.id]||{})[0]]
      const vStr = val != null ? val + (suf || '') : '—'
      if (val == null) return `<td class="num">${vStr}</td>`
      const cls = r === 1 ? 'rank-1' : r === 2 ? 'rank-2' : ''
      const rBadge = r ? `<sup style="font-size:9px;opacity:.6"> #${r}</sup>` : ''
      return `<td class="num ${cls}">${vStr}${rBadge}</td>`
    }

    const thead = document.getElementById('mapa-comp-thead')
    const tbody = document.getElementById('mapa-comp-tbody')
    if (!thead || !tbody) return

    thead.innerHTML = `<tr>
      <th style="min-width:110px">Campo</th>
      ${ninhos.map(n => `<th style="min-width:110px">${esc(n.numero_ninho || 'Ninho')}<br><span style="font-weight:400;text-transform:none;color:#9CA3AF;font-size:9px">${esc(n.praia_nome||'')} · ${ESP_MAPA_LABEL[n.especie]||n.especie}</span></th>`).join('')}
    </tr>`

    const rows = [
      { label: 'Espécie',          fn: n => ESP_MAPA_LABEL[n.especie] || n.especie, style: (n) => `color:${ESP_MAPA_COR[n.especie]||'#9CA3AF'};font-weight:700` },
      { label: 'Data encontro',    fn: n => n.data_encontro ? new Date(n.data_encontro).toLocaleDateString('pt-BR') : '—' },
      { label: 'Status',           fn: n => n.status || '—', style: n => `color:${STATUS_MAPA_COR[n.status]||'#9CA3AF'}` },
      { label: 'Ovos total',       fn: n => n.qtd_ovos, suf: '', rank: rOvos, campo: 'qtd_ovos' },
      { label: 'Ovos íntegros',    fn: n => n.ovos_integros, rank: rInteg, campo: 'ovos_integros' },
      { label: 'Filhotes vivos',   fn: n => n.eclosao?.filhotes_vivos, rank: rFilhotes, campo: 'eclosao_filhotes' },
      { label: 'Taxa eclosão',     fn: n => n.taxa_eclosao_pct, suf: '%', rank: rTaxa, campo: 'taxa_eclosao_pct' },
      { label: 'Eficiência',       fn: n => n.eficiencia_pct, suf: '%', rank: rEfic, campo: 'eficiencia_pct' },
      { label: 'Incubação',        fn: n => n.incubacao_dias, suf: ' d' },
      { label: 'Temperatura',      fn: n => n.temperatura_c, suf: '°C', rank: rTemp, campo: 'temperatura_c' },
      { label: 'Umidade',          fn: n => n.umidade_pct, suf: '%' },
      { label: 'Distância ao rio', fn: n => n.dist_rio_m, suf: ' m', rank: rDist, campo: 'dist_rio_m' },
      { label: 'Ovos descartados', fn: n => n.ovos_descartados },
      { label: 'Alertas ativos',   fn: n => (n.alertas||[]).length || '—' },
    ]

    tbody.innerHTML = rows.map(row => {
      const cells = ninhos.map(n => {
        const val = row.fn(n)
        if (row.rank && row.campo) {
          const r = row.rank[n.id]
          const allRanks = Object.values(row.rank[n.id] || {})
          const rank = allRanks[0]
          const cls = rank === 1 ? 'rank-1' : rank === 2 ? 'rank-2' : ''
          const str = val != null ? val + (row.suf || '') : '—'
          const badge = rank && val != null ? `<sup style="font-size:9px;opacity:.5"> #${rank}</sup>` : ''
          return `<td class="num ${cls}">${str}${badge}</td>`
        }
        const str = typeof val === 'number' ? val + (row.suf || '') : (val ?? '—')
        const stl = row.style ? ` style="${row.style(n)}"` : ''
        return `<td class="num"${stl}>${str}</td>`
      }).join('')
      return `<tr><td style="color:#6B7280;font-size:10.5px;white-space:nowrap">${row.label}</td>${cells}</tr>`
    }).join('')
  }

  // ── Exportar PDF (mapa) ────────────────────────────────────────
  window.mapaExportarPDF = function() { window.print() }

  // ── Exportar Excel/CSV do mapa ────────────────────────────────
  window.mapaExportarExcel = function() {
    if (!_mapaPraiaData.length && !_mapaNinhoData.length) {
      alert('Carregue o mapa primeiro.'); return
    }

    // Planilha 1: Praias
    const hPraias = 'Praia,Sigla,UC,Município,Ninhos,Encontrados,Transferidos,Eclodidos,Perdidos,Ovos,Íntegros,Filhotes Vivos,Filhotes Mortos,Taxa Eclosão (%),Dist. Rio Média (m),Temp Média (°C),Comprimento (m),Área (ha)'
    const rPraias = _mapaPraiaData.filter(p => _mapaPraiasSel.has(p.id)).map(p => [
      p.nome, p.sigla, p.uc_nome, p.municipio,
      p.ninhos_total, p.ninhos_encontrados, p.ninhos_transferidos, p.ninhos_eclodidos, p.ninhos_perdidos,
      p.ovos_postura, p.ovos_integros, p.filhotes_vivos, p.filhotes_mortos, p.taxa_eclosao_pct,
      p.dist_rio_media_m, p.temp_media_c, p.comprimento_m, p.area_ha
    ].map(x => `"${x ?? ''}"`).join(','))

    // Planilha 2: Ninhos
    const hNinhos = 'Ninho,Espécie,Praia,UC,Monitor,Data Encontro,Status,Lat,Lng,Ovos,Íntegros,Descartados,Filhotes Vivos,Filhotes Mortos,Taxa Eclosão (%),Eficiência (%),Incubação (dias),Temperatura (°C),Umidade (%),Dist. Rio (m),Profundidade (cm),Data Eclosão,Predação,Alertas'
    const rNinhos = _mapaNinhoData.map(n => [
      n.numero_ninho, n.especie, n.praia_nome, n.uc_nome, n.monitor_nome,
      n.data_encontro, n.status, n.lat, n.lng,
      n.qtd_ovos, n.ovos_integros, n.ovos_descartados,
      n.eclosao?.filhotes_vivos, n.eclosao?.filhotes_mortos,
      n.taxa_eclosao_pct, n.eficiencia_pct, n.incubacao_dias,
      n.temperatura_c, n.umidade_pct, n.dist_rio_m, n.profundidade_cm,
      n.eclosao?.data, n.eclosao?.predacao,
      (n.alertas||[]).map(a => a.titulo).join('; ')
    ].map(x => `"${x ?? ''}"`).join(','))

    const csv = [
      '=== PRAIAS ===', hPraias, ...rPraias,
      '', '=== NINHOS ===', hNinhos, ...rNinhos
    ].join('\n')

    const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' })
    const a = document.createElement('a')
    a.href = URL.createObjectURL(blob)
    a.download = `biomonitor_mapa_${new Date().toISOString().slice(0,10)}.csv`
    a.click()
  }

  // ── Exportar CSV ─────────────────────────────────────────────────
  window.exportarCSV = function() {
    if (!_dados) { alert('Aplique os filtros primeiro.'); return }
    const d = _dados
    const praias = d.por_praia || []
    const header = 'Praia,Código,UC,Ninhos,Eclodidos,Perdidos,Filhotes Vivos,Taxa Eclosão (%),Média Ovos,Dist. Rio (m),Ninhos/km'
    const rows = praias.map(p => [
      p.praia_nome, p.praia_codigo, p.uc_nome, p.ninhos_total, p.eclodidos, p.perdidos,
      p.filhotes_vivos, p.taxa_eclosao_pct, p.media_ovos, p.dist_rio_media_m, p.densidade_ninhos_km
    ].map(v => `"${v??''}"`).join(','))

    const esp = d.por_especie || []
    const headerEsp = '\n\nEspécie,Nome científico,Ninhos,Eclodidos,Perdidos,Filhotes,Média ovos,Taxa eclosão (%),Eficiência (%),Incubação (dias)'
    const rowsEsp = esp.map(e => [
      espLabel(e.especie), e.especie, e.total, e.eclodidos, e.perdidos,
      e.filhotes_vivos, e.media_ovos_postura, e.taxa_eclosao_pct, e.eficiencia_pct, e.incubacao_media_dias
    ].map(v => `"${v??''}"`).join(','))

    const csv = [header, ...rows, headerEsp, ...rowsEsp].join('\n')
    const blob = new Blob(['﻿'+csv], { type:'text/csv;charset=utf-8' })
    const a = document.createElement('a')
    a.href = URL.createObjectURL(blob)
    a.download = `biomonitor_relatorio_${new Date().toISOString().slice(0,10)}.csv`
    a.click()
  }
})()
</script>
