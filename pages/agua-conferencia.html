<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SIGUC-AC · Qualidade da Água — Conferência de Quarentena</title>
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/guia-app.css">
<link rel="stylesheet" href="../css/agua-painel.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/observability.js"></script>
<script src="../js/queryLogger.js"></script>
<script src="../js/config.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/guia-app.js"></script>
<script src="../js/agua-guias-mesa.js"></script>
<script>guiaAutoDefinir(AGUA_GUIAS_MESA)</script>
<script src="../js/reautenticar.js"></script>
<script src="../js/agua-alertas.js"></script>
<script src="../js/grafico-teclado.js"></script>
<script src="../js/agua-iqa-visual.js"></script>
<script src="../js/agua-laudo-kpis.js"></script>
<script src="../js/fotos-privadas.js"></script>
</head>
<body>
<div id="app"></div>

<!-- Modal de conferência -->
<div class="modal-overlay" id="modal-ag">
  <div class="modal" style="max-width:680px">
    <div class="modal-header">
      <div class="modal-title">Conferir coleta — linha <span id="ag-linha"></span> da planilha</div>
      <button class="modal-close" onclick="fecharModalAg()">×</button>
    </div>
    <div class="modal-body">
      <div id="ag-motivo" style="background:#FEF3C7;border:1px solid #FDE68A;border-radius:8px;padding:10px 12px;font-size:13px;color:#92400E;margin-bottom:16px;white-space:pre-wrap"></div>
      <div style="font-size:12px;color:#6B7280;margin-bottom:12px" id="ag-contexto"></div>
      <div id="ag-alertas"></div>

      <div class="grid-2">
        <div class="form-group"><label class="form-label">Data da coleta</label>
          <input class="form-control" id="ag-data" type="date"></div>
        <div class="form-group"><label class="form-label">Hora</label>
          <input class="form-control" id="ag-hora" type="time"></div>
      </div>

      <div class="form-section-label" style="margin-top:8px">Laboratório responsável e laudo</div>
      <div class="grid-2">
        <div class="form-group"><label class="form-label">Laboratório</label>
          <select class="form-control" id="ag-laboratorio"><option value="">Selecione...</option></select></div>
        <div class="form-group"><label class="form-label">&nbsp;</label>
          <a id="ag-arquivo-atual" class="btn btn-sm btn-secondary" style="display:none" target="_blank" rel="noopener">Ver laudo anexado</a>
          <span id="ag-sem-laudo" style="font-size:12px;color:#9CA3AF">Nenhum laudo anexado nesta coleta.</span></div>
      </div>

      <div class="form-section-label" style="margin-top:8px">Campo</div>
      <div class="grid-3" id="ag-campo"></div>

      <div class="form-section-label" style="margin-top:16px">Laboratório</div>
      <div class="grid-3" id="ag-lab"></div>

      <div class="form-group" style="margin-top:12px"><label class="form-label">Observações desta conferência</label>
        <textarea class="form-control" id="ag-observacoes" rows="2" placeholder="Ex.: conferido com o laudo físico — valor confere, mantido em quarentena por unidade divergente."></textarea></div>
    </div>
    <div class="modal-footer" style="justify-content:space-between">
      <button class="btn btn-secondary" onclick="salvarAg(false)" id="btn-manter">Salvar e manter em quarentena</button>
      <button class="btn btn-primary" onclick="salvarAg(true)" id="btn-promover">Corrigido — promover a completo</button>
    </div>
  </div>
</div>

<script>
// ── Qualidade da Água · tela de conferência de quarentena ──────
// Fase 1 do plano em docs/qualidade-agua/plano.md, decisão 7 do
// escopo. Lista as coletas que a migration 253 pôs em quarentena
// (valor impossível ou sólidos em suspensão com unidade suspeita) e
// deixa um técnico decidir, com o laudo físico em mãos: corrigir e
// promover a `completo`, ou manter quarentenada com justificativa.
// Sem tela, quarentena vira gaveta sem fundo.
//
// Simples de propósito — a mesa completa (cadastro de pontos/labs,
// lançamento de laudo) é a Fase 2. Acesso via pode_editar('agua'):
// enquanto o módulo estiver inativo no catálogo (`modulos.agua`),
// isso só resolve para super_admin (ver cabeçalho da migration 248).

const CAMPO_FIELDS = [
  ['temp_ar', 'Temp. ar (°C)'], ['temp_amostra', 'Temp. amostra (°C)'],
  ['ph', 'pH'], ['od', 'OD (mg/L)'],
  ['turbidez', 'Turbidez (UNT)'], ['condutividade_eletrica', 'Condutividade (µS/cm)'],
]
const LAB_FIELDS = [
  ['dbo', 'DBO (mg/L)'], ['nitrogenio_total', 'Nitrogênio total'], ['nitrogenio_amoniacal', 'Nitrogênio amoniacal'],
  ['nitratos', 'Nitratos'], ['fosforo_total', 'Fósforo total'], ['ortofosfato_dissolvido', 'Ortofosfato dissolvido'],
  ['solidos_dissolvidos_totais', 'Sólidos dissolvidos totais'], ['solidos_suspensao_totais', 'Sólidos em suspensão totais'],
  ['coliformes_termotolerantes', 'Coliformes termotolerantes'], ['coliformes_totais', 'Coliformes totais'],
  ['escherichia_coli', 'Escherichia coli'], ['alcalinidade_total', 'Alcalinidade total'],
  ['carbono_organico_total', 'Carbono orgânico total'], ['cloreto', 'Cloreto'],
  ['condutividade_especifica', 'Condutividade específica'], ['descarga_liquida', 'Descarga líquida'],
]

let _coletas = [], _labs = [], _editandoId = null

;(async function () {
  const usuario = await carregarUsuario()
  if (!usuario) { window.location.href = '../index.html'; return }

  const { data: nivel } = await db.rpc('nivel_efetivo', { p_usuario: usuario.id, p_modulo_chave: 'agua' })
  if (nivel !== 'editar') {
    document.body.innerHTML = '<div style="padding:60px;text-align:center;font-family:\'DM Sans\',sans-serif;color:#6B7280">Sem acesso à conferência de Qualidade da Água.</div>'
    return
  }

  document.getElementById('app').innerHTML =
    gerarLayout('Qualidade da Água — Conferência', 'agua-conferencia') +
    `<div class="fade-in adash">
      <p style="color:#6B7280;font-size:13px;margin:0 0 16px">
        Coletas da série histórica que caíram em quarentena na importação (migration 253) — valor fisicamente
        impossível ou sólidos em suspensão com unidade sob suspeita. Conferir com o laudo físico da linha indicada
        e decidir: corrigir e promover, ou manter quarentenada com justificativa.
      </p>
      <div id="ag-kpis"></div>
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap">
        <input class="form-control" id="ag-filtro" placeholder="Filtrar por ponto, código ANA ou nº da linha..." style="max-width:340px" oninput="renderLista()">
        <span id="ag-contador" style="font-size:12px;color:#6B7280"></span>
      </div>
      <div class="card"><div class="table-wrap"><div class="table-scroll">
        <table>
          <thead><tr><th>Linha</th><th>Código</th><th>Ponto</th><th>Campanha</th><th>Data</th><th>Motivo</th><th>Ações</th></tr></thead>
          <tbody id="tbody-ag"><tr><td colspan="6" style="padding:12px 14px" aria-busy="true" aria-label="Carregando"><div class="skeleton skeleton-linha" style="width:86%"></div><div class="skeleton skeleton-linha" style="width:72%"></div><div class="skeleton skeleton-linha" style="width:90%"></div><div class="skeleton skeleton-linha" style="width:64%"></div></td></tr></tbody>
        </table>
      </div></div></div>
    </div>` +
    '</div></div></div>'

  carregarLogosSidebar()
  await Promise.all([carregarLabsAtivos(), carregarLista()])
})()

async function carregarLabsAtivos() {
  const { data } = await db.from('agua_laboratorios').select('id,nome').eq('ativo', true).order('nome')
  _labs = data || []
  const sel = document.getElementById('ag-laboratorio')
  if (sel) sel.innerHTML = '<option value="">Selecione...</option>' + _labs.map(l => `<option value="${l.id}">${esc(l.nome)}</option>`).join('')
}

async function carregarLista() {
  const [{ data, error }, { data: statusRows }] = await Promise.all([
    db.from('agua_coletas')
      .select('*, agua_pontos_coleta(nome,codigo_ana), agua_campanhas(ano,ordem)')
      .eq('status', 'quarentena')
      .order('linha_origem_planilha'),
    db.from('agua_coletas').select('status'),
  ])
  if (error) { toast(error.message || 'Erro ao carregar', 'error'); return }
  _coletas = data || []
  const counts = aguaContarPorStatus(statusRows)
  const totalColetas = (statusRows || []).length
  document.getElementById('ag-kpis').innerHTML = aguaKpisQuarentenaHTML(_coletas, totalColetas,
    c => `linha ${c.linha_origem_planilha ?? '—'} · ${c.agua_pontos_coleta?.nome || ''}`, counts, 'ag-kpis')
  renderLista()
}

// `quarentena_motivo` pode reunir mais de um achado numa linha só — a
// importação da série histórica (migration 253) concatena os critérios
// com ' | ' (array_to_string(ARRAY[...], ' | ')) quando mais de um bate
// na mesma coleta (ex.: pH impossível E ano da campanha divergente).
// Contar os segmentos dá ao conferente uma ideia do tamanho do
// problema antes de abrir o modal — 1 achado é digitação pontual, 3+
// pode ser um laudo inteiro para revisar.
function aguaContarInconsistencias(motivo) {
  return motivo ? motivo.split(' | ').filter(s => s.trim()).length : 0
}

function renderLista() {
  const termo = (document.getElementById('ag-filtro')?.value || '').trim().toLowerCase()
  const tbody = document.getElementById('tbody-ag')
  const lista = _coletas.filter(c => {
    if (!termo) return true
    return String(c.linha_origem_planilha).includes(termo)
      || (c.agua_pontos_coleta?.nome || '').toLowerCase().includes(termo)
      || (c.agua_pontos_coleta?.codigo_ana || '').includes(termo)
  })
  document.getElementById('ag-contador').textContent = `${lista.length} de ${_coletas.length} em quarentena`
  if (!lista.length) { tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:24px;color:#9CA3AF">Nenhuma coleta em quarentena</td></tr>'; return }
  tbody.innerHTML = lista.map(c => {
    const nInc = aguaContarInconsistencias(c.quarentena_motivo)
    return `
    <tr>
      <td class="mono">${esc(c.linha_origem_planilha ?? '—')}</td>
      <td class="mono" style="font-size:11px">${esc(c.codigo_amostra || '—')}</td>
      <td>${esc(c.agua_pontos_coleta?.nome || '—')} <span style="color:#9CA3AF;font-size:11px">(${esc(c.agua_pontos_coleta?.codigo_ana || '')})</span></td>
      <td style="font-size:12px">${esc(c.agua_campanhas?.ano ?? '')}/${c.agua_campanhas?.ordem === 'segunda' ? '2ª' : '1ª'}</td>
      <td style="font-size:12px">${formatData(c.data_coleta)}</td>
      <td style="font-size:12px;max-width:360px;white-space:normal">
        <span class="badge ${nInc > 1 ? 'badge-erro' : 'badge-cinza'}" title="${nInc} inconsistência${nInc === 1 ? '' : 's'} apontada${nInc === 1 ? '' : 's'} nesta linha" style="margin-right:6px;vertical-align:top">${nInc}</span>
        ${esc((c.quarentena_motivo || '').slice(0, 140))}${(c.quarentena_motivo || '').length > 140 ? '…' : ''}
      </td>
      <td><button class="btn btn-xs btn-ghost" onclick="abrirAg('${c.id}')">Conferir</button></td>
    </tr>`
  }).join('')
}

function formatData(str) {
  if (!str) return '—'
  return new Date(str + 'T00:00:00').toLocaleDateString('pt-BR')
}

function abrirAg(id) {
  _editandoId = id
  const c = _coletas.find(x => x.id === id)
  if (!c) return
  document.getElementById('ag-linha').textContent = c.linha_origem_planilha ?? '—'
  document.getElementById('ag-motivo').textContent = c.quarentena_motivo || '—'
  document.getElementById('ag-contexto').textContent =
    `${c.codigo_amostra ? c.codigo_amostra + ' · ' : ''}${c.agua_pontos_coleta?.nome || ''} (${c.agua_pontos_coleta?.codigo_ana || ''}) · campanha ${c.agua_campanhas?.ano ?? ''}/${c.agua_campanhas?.ordem === 'segunda' ? '2ª' : '1ª'}`
  document.getElementById('ag-data').value = c.data_coleta || ''
  document.getElementById('ag-hora').value = c.hora_coleta ? c.hora_coleta.slice(0, 5) : ''
  document.getElementById('ag-observacoes').value = c.observacoes || ''
  document.getElementById('ag-laboratorio').value = c.laboratorio_id || ''

  const linkLaudo = document.getElementById('ag-arquivo-atual')
  const semLaudo = document.getElementById('ag-sem-laudo')
  const ref = c.laudo_url ? fotoRef(c.laudo_url) : null
  if (ref) {
    linkLaudo.style.display = 'inline-flex'
    semLaudo.style.display = 'none'
    linkLaudo.setAttribute('data-foto-privada', `${ref.bucket}|${ref.path}`)
    assinarFotos(document.getElementById('modal-ag'))
  } else {
    linkLaudo.style.display = 'none'
    linkLaudo.removeAttribute('data-foto-privada')
    semLaudo.style.display = 'inline'
  }

  const campoHTML = ([campo, rotulo]) => `
    <div class="form-group"><label class="form-label">${esc(rotulo)}</label>
      <input class="form-control" id="ag-f-${campo}" type="number" step="any" value="${c[campo] ?? ''}" oninput="agAgendarAvaliacao()">
      <div class="form-hint" id="ag-h-${campo}"></div></div>`
  document.getElementById('ag-campo').innerHTML = CAMPO_FIELDS.map(campoHTML).join('')
  document.getElementById('ag-lab').innerHTML   = LAB_FIELDS.map(campoHTML).join('')

  document.getElementById('modal-ag').classList.add('aberto')
  _alertas = []
  agPintarAlertas()
  agAvaliar()   // a linha já está preenchida: avalia de saída, que é o
                // ponto desta tela — mostrar POR QUE o valor é suspeito
}

function fecharModalAg() {
  document.getElementById('modal-ag').classList.remove('aberto')
  _editandoId = null
}

function valorCampo(campo) {
  const v = document.getElementById(`ag-f-${campo}`).value
  return v === '' ? null : parseFloat(v)
}

// Mesma malha do lançamento de laudo (js/agua-alertas.js, migrations
// 254 e 302/302b). Aqui ela serve para o outro lado do problema:
// a linha JÁ está em quarentena, e o que o conferente precisa ver é
// qual valor é suspeito e contra que referência — não repetir o
// motivo genérico gravado na importação.
let _alertas = [], _timerAval = null

function agAgendarAvaliacao() {
  clearTimeout(_timerAval)
  _timerAval = setTimeout(() => { agAvaliar() }, 500)
}

async function agAvaliar() {
  const c = _coletas.find(x => x.id === _editandoId)
  if (!c) return []
  const valores = {}
  for (const [campo] of [...CAMPO_FIELDS, ...LAB_FIELDS]) valores[campo] = valorCampo(campo)
  _alertas = await aguaAlertasAvaliar(db, {
    pontoId: c.ponto_id, ordem: c.agua_campanhas?.ordem, valores,
    campanhaId: c.campanha_id, coletaId: c.id,
  })
  agPintarAlertas()
  return _alertas
}

function agPintarAlertas() {
  document.getElementById('ag-alertas').innerHTML =
    aguaAlertasResumoHTML(_alertas, { titulo: 'O que ainda está inconsistente nesta linha' })
  for (const [campo] of [...CAMPO_FIELDS, ...LAB_FIELDS]) {
    const hint = document.getElementById(`ag-h-${campo}`)
    if (hint) hint.innerHTML = aguaAlertaHintHTML(aguaAlertaDoCampo(_alertas, campo))
  }
}

async function salvarAg(promover) {
  if (!_editandoId) return
  const payload = { observacoes: document.getElementById('ag-observacoes').value.trim() || null }
  const dataColeta = document.getElementById('ag-data').value
  if (dataColeta) payload.data_coleta = dataColeta
  payload.hora_coleta = document.getElementById('ag-hora').value || null
  payload.laboratorio_id = document.getElementById('ag-laboratorio').value || null
  for (const [campo] of [...CAMPO_FIELDS, ...LAB_FIELDS]) payload[campo] = valorCampo(campo)

  if (promover) {
    // Promover a `completo` é o ato que tira a linha da quarentena —
    // com valor fisicamente impossível ainda no formulário, seria
    // desfazer justamente o que a Fase 1 protegeu. Manter em
    // quarentena continua permitido em qualquer estado: é o registro
    // de "conferi e o laudo diz isso mesmo".
    clearTimeout(_timerAval)
    const alertas = await agAvaliar()
    const bloqueios = aguaAlertasBloqueios(alertas)
    if (bloqueios.length) {
      toast(`Não dá para promover com valor impossível: ${bloqueios.map(a => AGUA_ALERTA_PARAM_ROTULO[a.parametro] || a.parametro).join(', ')}`, 'error')
      return
    }
    const texto = aguaAlertasTextoConfirmacao(alertas)
    if (texto && !confirm(texto)) return

    // Mesma regra de pages/agua-laudos.html (migration 310): promover
    // sem NENHUM resultado de laboratório preenchido devolveria a
    // linha para "completo sem dado" — o banco também bloqueia isso
    // (ck_agua_completo_exige_dado_lab), esta é só a checagem
    // adiantada para o técnico não descobrir só no erro do servidor.
    const temDadoLab = LAB_FIELDS.some(([campo]) => valorCampo(campo) != null)
    if (!temDadoLab) {
      toast('Preencha ao menos um resultado de laboratório antes de promover a completo.', 'error')
      return
    }

    payload.status = 'completo'
    payload.quarentena_motivo = null
  }

  // Janela de 5 min: a conferência edita 339 coletas em quarentena, uma
  // por vez — pedir senha a cada gravação inviabilizaria o trabalho.
  // docs/qualidade-agua/plano-seguranca-dados.md, decisão 1.
  const r = await reautenticar({ janelaMin: 5, motivo: 'salvar esta conferência' })
  if (!r) return

  const btn = document.getElementById(promover ? 'btn-promover' : 'btn-manter')
  btn.disabled = true
  try {
    const { error } = await db.rpc('agua_atualizar_coleta', {
      p_id: _editandoId, p_campos: payload, p_justificativa: r.justificativa,
    })
    if (error) throw error
    toast(promover ? 'Coleta promovida a completo!' : 'Conferência salva — mantida em quarentena.', 'success')
    fecharModalAg()
    await carregarLista()
  } catch (e) {
    const msg = e.message?.includes('REAUTH_NECESSARIA') ? 'Sessão de confirmação expirou — tente novamente.'
      : e.message?.includes('ck_agua_completo_exige_dado_lab') ? 'Preencha ao menos um resultado de laboratório antes de promover a completo.'
      : (e.message || 'Erro ao salvar')
    toast(msg, 'error')
  }
  finally { btn.disabled = false }
}
</script>
</body>
</html>
