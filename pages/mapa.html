<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIGUC-AC — Mapa das Unidades de Conservação</title>
<link href="../css/global.css" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet-minimap@3.6.1/dist/Control.MiniMap.min.css"/>
<style>
/* ── Layout ──────────────────────────────────────────────────── */
.mapa-wrapper{display:flex;flex-direction:column;gap:10px;height:calc(100vh - 108px);min-height:500px;}
.mapa-topbar{display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap;}
.mapa-container{display:flex;gap:12px;flex:1;min-height:0;}
#mapa{flex:1;border-radius:var(--raio-lg);border:1px solid var(--borda);z-index:0;min-height:0;}
.mapa-painel{width:268px;flex-shrink:0;display:flex;flex-direction:column;gap:8px;overflow-y:auto;padding-right:2px;scrollbar-width:none;-ms-overflow-style:none;}
.mapa-painel::-webkit-scrollbar{display:none;}
.mapa-painel-wrap{display:flex;flex-direction:row;gap:5px;flex-shrink:0;min-height:0;}
#mapa-scrollbar-outer{width:8px;flex-shrink:0;position:relative;border-radius:6px;background:var(--cinza-100);cursor:pointer;}
#mapa-scrollbar-thumb{position:absolute;left:1px;right:1px;background:#2D6A4F;border-radius:5px;cursor:pointer;min-height:24px;transition:top .06s linear;opacity:.75;}
#mapa-scrollbar-thumb:hover{opacity:1;}
/* Blocos de filtro */
.filtro-bloco{background:var(--branco);border:1px solid var(--borda);border-radius:var(--raio-lg);overflow:hidden;}
.filtro-bloco-header{display:flex;align-items:center;gap:6px;padding:9px 12px;border-bottom:1px solid var(--borda);cursor:pointer;user-select:none;}
.filtro-bloco-header h4{margin:0;font-size:11px;font-weight:600;color:var(--cinza-500);text-transform:uppercase;letter-spacing:.06em;flex:1;}
.filtro-bloco-body{padding:8px 12px 10px;}
.filtro-item{display:flex;align-items:flex-start;gap:7px;padding:4px 0;font-size:12px;color:var(--cinza-700);}
.filtro-item input[type=checkbox]{accent-color:#1F4E2C;width:13px;height:13px;cursor:pointer;flex-shrink:0;margin-top:2px;}
/* Barra de camadas */
.mapa-layerbar{position:relative;flex-shrink:0;}
.mlb-tabs{display:flex;gap:4px;align-items:center;flex-wrap:wrap;}
.mlb-tab{display:flex;align-items:center;gap:5px;padding:5px 12px;font-size:11px;font-weight:600;font-family:'DM Sans',sans-serif;background:#fff;border:1px solid var(--borda);border-radius:6px;cursor:pointer;color:var(--cinza-600);transition:all .15s;white-space:nowrap;line-height:1;}
.mlb-tab:hover{background:var(--cinza-50);border-color:var(--cinza-300);}
.mlb-tab.ativo{background:#1F4E2C;color:#fff;border-color:#1F4E2C;}
.mlb-badge{font-size:9px;background:rgba(255,255,255,.25);border-radius:99px;padding:1px 5px;font-weight:700;}
.mlb-tab:not(.ativo) .mlb-badge{background:#eff6ff;color:#1d4ed8;}
.mlb-dropdown{position:absolute;top:calc(100% + 4px);left:0;z-index:500;background:#fff;border:1px solid var(--borda);border-radius:10px;box-shadow:0 8px 32px rgba(0,0,0,.18);min-width:320px;max-width:640px;overflow:hidden;animation:mlb-in .15s ease;}
@keyframes mlb-in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.mlb-dropdown-header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--cinza-50);border-bottom:1px solid var(--borda);}
.mlb-dropdown-title{font-size:11px;font-weight:700;color:var(--cinza-700);text-transform:uppercase;letter-spacing:.06em;}
.mlb-close{background:none;border:none;cursor:pointer;font-size:14px;color:var(--cinza-400);padding:0 2px;line-height:1;}
.mlb-close:hover{color:var(--cinza-700);}
.mlb-dropdown-body{padding:10px 12px;display:flex;flex-direction:column;gap:8px;max-height:420px;overflow-y:auto;}
/* Popup */
.mapa-popup{min-width:200px;max-width:280px;font-family:'DM Sans',sans-serif;}
.camada-popup{font-family:'DM Sans',sans-serif;font-size:12px;color:#374151;}
.camada-popup .cp-header{background:#1F4E2C;color:#fff;padding:8px 13px;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;}
.camada-popup .cp-layer{padding:9px 13px 10px;}
.camada-popup .cp-layer-nome{font-size:10px;font-weight:700;color:#2D6A4F;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;padding-bottom:5px;border-bottom:1px solid #e5e7eb;}
.camada-popup .cp-row{display:flex;gap:5px;font-size:11px;color:#374151;margin-bottom:3px;line-height:1.4;align-items:flex-start;}
.camada-popup .cp-row strong{color:#111827;min-width:72px;flex-shrink:0;font-weight:600;}
.camada-popup .cp-badge{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 9px;font-size:10px;font-weight:700;margin-top:5px;border:1px solid;}
/* CAR */
.car-det-panel{position:fixed;top:0;right:-420px;width:360px;height:100vh;background:#fff;z-index:600;display:flex;flex-direction:column;box-shadow:-4px 0 32px rgba(0,0,0,.22);transition:right .28s cubic-bezier(.4,0,.2,1);overflow:hidden;min-width:280px;}
.car-det-panel.aberto{right:0;}
.car-det-resize-handle{position:absolute;top:0;left:0;width:5px;height:100%;cursor:ew-resize;z-index:10;}
.car-det-resize-handle:hover,.car-det-resize-handle.dragging{background:rgba(45,106,79,.35);}
.car-det-header{padding:14px 16px 12px;border-bottom:1px solid var(--borda);flex-shrink:0;background:linear-gradient(135deg,#1a3c2a,#2D6A4F);}
.car-det-header h4{margin:0;font-size:14px;font-weight:700;color:#fff;}
.car-det-header p{margin:3px 0 0;font-size:11px;color:rgba(255,255,255,.7);}
.car-det-body{flex:1;overflow-y:auto;padding:14px 16px;}
.car-det-field{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-bottom:1px solid var(--cinza-100);}
.car-det-field:last-child{border-bottom:none;}
.car-det-label{font-size:10px;font-weight:700;color:var(--cinza-400);text-transform:uppercase;letter-spacing:.06em;}
.car-det-value{font-size:13px;color:var(--cinza-800);font-weight:500;line-height:1.4;}
/* UCs */
.uc-secao-titulo{font-size:10px;font-weight:700;color:var(--cinza-500);text-transform:uppercase;letter-spacing:.06em;padding:6px 0 4px;border-bottom:1px solid var(--cinza-100);margin-bottom:4px;}
.uc-filtro-label{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--cinza-700);cursor:pointer;padding:2px 0;}
.uc-filtro-label input{accent-color:#1F4E2C;width:12px;height:12px;cursor:pointer;flex-shrink:0;}
.uc-label-tt{background:rgba(26,95,56,.88)!important;border:1px solid rgba(26,95,56,.5)!important;border-radius:3px!important;box-shadow:0 1px 5px rgba(0,0,0,.35)!important;font-size:11px!important;font-weight:700!important;color:#fff!important;padding:3px 8px!important;white-space:nowrap!important;pointer-events:none!important;max-width:190px!important;overflow:hidden!important;text-overflow:ellipsis!important;text-transform:uppercase!important;letter-spacing:.04em!important;text-shadow:0 1px 2px rgba(0,0,0,.6)!important;}
.uc-label-tt::before{display:none!important;}
/* Stats card */
#uc-stats-card{position:absolute;bottom:28px;left:10px;z-index:500;width:272px;background:#fff;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,.22);overflow:hidden;font-family:'DM Sans',sans-serif;display:none;}
#uc-stats-card.visivel{display:block;}
.usc-esfera-row{display:flex;align-items:center;gap:6px;font-size:10px;padding:3px 0;}
.usc-esfera-bar{height:5px;border-radius:3px;min-width:4px;transition:width .3s;}
.usc-filtro-badge{display:inline-flex;align-items:center;padding:1px 6px;border-radius:99px;font-size:9px;font-weight:700;border:1px solid;}
/* Editor de delimitação do Acre */
#acre-editor{position:absolute;top:14px;left:14px;z-index:501;width:272px;background:#fff;border-radius:12px;box-shadow:0 4px 28px rgba(0,0,0,.28);overflow:hidden;font-family:'DM Sans',sans-serif;display:none;}
#acre-editor.visivel{display:block;}
.acre-ed-header{background:linear-gradient(135deg,#1a3c2a,#2D6A4F);padding:10px 13px;display:flex;align-items:center;gap:6px;cursor:grab;user-select:none;}
.acre-ed-titulo{font-size:11px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:.06em;flex:1;}
.acre-ed-body{padding:12px 14px;display:flex;flex-direction:column;gap:10px;}
.acre-ed-row{display:flex;align-items:center;gap:8px;}
.acre-ed-lbl{font-size:10px;font-weight:700;color:var(--cinza-500);text-transform:uppercase;letter-spacing:.05em;width:88px;flex-shrink:0;}
.acre-ed-val{font-size:10px;font-weight:700;color:var(--cinza-700);width:30px;text-align:right;flex-shrink:0;}
.acre-ed-slider{flex:1;height:4px;accent-color:#2D6A4F;cursor:pointer;min-width:0;}
.acre-ed-color{width:28px;height:22px;padding:1px;border:1px solid var(--borda);border-radius:4px;cursor:pointer;background:none;flex-shrink:0;}
.acre-ed-select{flex:1;font-size:11px;padding:3px 6px;border:1px solid var(--borda);border-radius:var(--raio);font-family:inherit;cursor:pointer;}
.acre-ed-preview{height:36px;border-radius:6px;border:1px solid var(--borda);background:var(--cinza-50);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--cinza-400);margin-top:2px;overflow:hidden;position:relative;}
#acre-prev-svg{width:100%;height:100%;}
.acre-ed-footer{padding:8px 14px 12px;border-top:1px solid var(--borda);display:flex;gap:6px;}
.acre-ed-footer button{flex:1;padding:6px 0;border-radius:var(--raio);font-size:11px;font-weight:600;cursor:pointer;border:1px solid;transition:all .15s;}
.btn-acre-apply{background:#1F4E2C;color:#fff;border-color:#1F4E2C;}
.btn-acre-apply:hover{background:#164025;}
.btn-acre-reset{background:var(--branco);color:var(--cinza-600);border-color:var(--borda);}
.btn-acre-reset:hover{background:var(--cinza-50);}
.usc-header{background:linear-gradient(135deg,#1a3c2a,#2D6A4F);padding:10px 13px;display:flex;align-items:center;gap:6px;cursor:grab;user-select:none;}
.usc-header-titulo{font-size:11px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:.06em;}
.usc-header-sub{font-size:10px;color:rgba(255,255,255,.65);margin-top:1px;}
.usc-body{padding:10px 13px 12px;display:flex;flex-direction:column;gap:8px;}
.usc-totais{display:flex;gap:8px;}
.usc-total-bloco{flex:1;background:var(--cinza-50);border:1px solid var(--borda);border-radius:8px;padding:7px 10px;text-align:center;}
.usc-total-val{font-size:17px;font-weight:700;color:#1F4E2C;line-height:1;}
.usc-total-lbl{font-size:9px;color:var(--cinza-500);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}
/* Rosa dos ventos */
.rosa-norte{width:52px;height:52px;background:rgba(255,255,255,.92);border-radius:50%;box-shadow:0 2px 10px rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px);}
.rosa-norte svg{width:44px;height:44px;}
/* Mini mapa */
.leaflet-control-minimap{border-radius:8px!important;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.32)!important;border:2px solid rgba(255,255,255,.85)!important;}
/* Sub-bacia labels */
.subbacia-label{background:rgba(255,255,255,.82)!important;border:1px solid rgba(0,0,0,.12)!important;border-radius:4px!important;font-size:11px!important;font-weight:700!important;color:#1a3c2a!important;padding:2px 7px!important;white-space:nowrap!important;pointer-events:none!important;}
.subbacia-label::before{display:none!important;}
/* Popup camadas */
.leaflet-popup.camada-popup-wrap .leaflet-popup-content-wrapper{padding:0;border-radius:10px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.22);}
.leaflet-popup.camada-popup-wrap .leaflet-popup-content{margin:0;min-width:200px;max-width:300px;}
/* Basemap modal */
.mapa-modo-ctrl{background:#fff;border-radius:10px;box-shadow:0 4px 18px rgba(0,0,0,.26);width:230px;overflow:hidden;font-family:'DM Sans',sans-serif;}
.bmg-header{display:flex;align-items:center;justify-content:space-between;padding:8px 10px 6px;border-bottom:1px solid #e5e7eb;cursor:pointer;user-select:none;}
.bmg-header-title{font-size:11px;font-weight:700;color:#374151;text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:5px;}
.bmg-body{padding:6px 8px 8px;}
.bmg-group-title{font-size:9px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.08em;padding:5px 2px 4px;}
.bmg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:2px;}
.bmg-tile{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border-radius:6px;padding:4px 2px;transition:background .15s;border:2px solid transparent;}
.bmg-tile:hover{background:#f3f4f6;}
.bmg-tile.ativo{border-color:#1F4E2C;background:#f0fdf4;}
.bmg-thumb{width:56px;height:40px;border-radius:4px;overflow:hidden;border:1px solid #e5e7eb;}
.bmg-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.bmg-label{font-size:9px;font-weight:500;color:#374151;text-align:center;line-height:1.2;max-width:60px;}
.bmg-tile.ativo .bmg-label{color:#1F4E2C;font-weight:700;}
/* Ocorrência marker */
.oc-marker{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.8);line-height:1;}
/* Mobile */
.btn-filtros-mobile{display:none;position:fixed;bottom:76px;right:16px;z-index:302;background:#2D6A4F;color:#fff;border:none;border-radius:50px;padding:11px 18px;font-size:13px;font-weight:600;cursor:pointer;align-items:center;gap:7px;box-shadow:0 4px 18px rgba(0,0,0,.28);font-family:var(--font-sans);}
.mapa-backdrop{display:none;position:fixed;inset:0;z-index:299;background:rgba(0,0,0,.38);}
.mapa-backdrop.ativo{display:block;}
@media(max-width:768px){
  .mapa-wrapper{height:calc(100vh - 94px);}
  .mapa-painel-wrap{display:none;}
  .mapa-painel-wrap.mobile-aberto{display:flex;flex-direction:column;position:fixed;bottom:0;left:0;right:0;height:62vh;z-index:300;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -4px 24px rgba(0,0,0,.18);overflow:hidden;}
  .mapa-painel-wrap.mobile-aberto::before{content:'';display:block;width:36px;height:4px;background:#d1d5db;border-radius:2px;margin:10px auto 6px;flex-shrink:0;}
  .mapa-painel-wrap.mobile-aberto .mapa-painel{width:100%;flex:1;padding:0 14px 20px;overflow-y:auto;}
  .mapa-painel-wrap.mobile-aberto #mapa-scrollbar-outer{display:none;}
  .btn-filtros-mobile{display:flex;}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/observability.js"></script>
<script src="../js/queryLogger.js"></script>
<script src="../js/config.js"></script>
<script src="../js/layout.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://unpkg.com/leaflet-minimap@3.6.1/dist/Control.MiniMap.min.js"></script>
<script src="../js/mapa-cartografia.js"></script>
</head>
<body>
<div id="app"><div style="display:flex;align-items:center;justify-content:center;height:100vh"><div class="spinner"></div></div></div>

<!-- Painel lateral CAR -->
<div class="car-det-panel" id="car-det-panel">
  <div class="car-det-resize-handle" id="car-resize"></div>
  <div class="car-det-header">
    <h4 id="car-det-titulo">Imóvel Rural</h4>
    <p id="car-det-cod" style="font-size:10px;color:rgba(255,255,255,.6)"></p>
    <button onclick="fecharDetalhesCAR()" style="position:absolute;top:12px;right:14px;background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:6px;padding:4px 8px;cursor:pointer;font-size:12px">✕ Fechar</button>
  </div>
  <div class="car-det-body" id="car-det-body">
    <div style="color:var(--cinza-400);font-size:13px;text-align:center;padding:24px">Selecione um imóvel no mapa</div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════════════
// BASEMAP GALLERY
// ══════════════════════════════════════════════════════════════
const BASEMAP_GROUPS = [
  { grupo:'Imagens', itens:[
    { id:'satelite', label:'Satélite',   emoji:'🛰', thumb:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/4/6/5',    url:'https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', opts:{maxZoom:22,subdomains:['mt0','mt1','mt2','mt3']} },
    { id:'hibrido',  label:'Híbrido',    emoji:'🗺', thumb:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/4/6/5',    url:'https://{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', opts:{maxZoom:22,subdomains:['mt0','mt1','mt2','mt3']} },
    { id:'ruas',     label:'Ruas',       emoji:'🏙', thumb:'https://tile.openstreetmap.org/4/6/6.png',                                                   url:'https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', opts:{maxZoom:22,subdomains:['mt0','mt1','mt2','mt3']} },
  ]},
  { grupo:'Terreno', itens:[
    { id:'topo',   label:'Topografia', emoji:'⛰', thumb:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/4/6/5',            url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',           opts:{maxZoom:22,maxNativeZoom:19,attribution:'ESRI Topo'} },
    { id:'relevo', label:'Relevo',     emoji:'🏔', thumb:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Shaded_Relief/MapServer/tile/4/6/5',       url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Shaded_Relief/MapServer/tile/{z}/{y}/{x}',     opts:{maxZoom:22,maxNativeZoom:13,attribution:'ESRI Relevo'} },
    { id:'osm',    label:'OpenStreet', emoji:'🗾', thumb:'https://tile.openstreetmap.org/4/5/6.png',                                                           url:'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',                                                     opts:{maxZoom:22,maxNativeZoom:19,attribution:'© OSM',subdomains:['a','b','c']} },
  ]},
  { grupo:'Especial', itens:[
    { id:'claro',  label:'Claro',    emoji:'⬜', thumb:'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/4/6/5', url:'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', opts:{maxZoom:22,maxNativeZoom:16,attribution:'ESRI Gray'} },
    { id:'natgeo', label:'Nat. Geo.', emoji:'🌿', thumb:'https://server.arcgisonline.com/ArcGIS/rest/services/NatGeo_World_Map/MapServer/tile/4/6/5',           url:'https://server.arcgisonline.com/ArcGIS/rest/services/NatGeo_World_Map/MapServer/tile/{z}/{y}/{x}',           opts:{maxZoom:22,maxNativeZoom:16,attribution:'ESRI NatGeo'} },
  ]},
];
const MODOS_MAPA = {};
BASEMAP_GROUPS.forEach(g => g.itens.forEach(b => { MODOS_MAPA[b.id] = b; }));
let googleLayer = null, modoMapaAtual = 'satelite';

function _reaplicarTiles(){
  if(googleLayer){ mapaL.removeLayer(googleLayer); googleLayer = null; }
  const bm = MODOS_MAPA[modoMapaAtual];
  googleLayer = L.tileLayer(bm.url, bm.opts);
  googleLayer.addTo(mapaL);
}

// ══════════════════════════════════════════════════════════════
// WMS — Cobertura Vegetal
// ══════════════════════════════════════════════════════════════
const VEG_LAYERS = {
  mapbiomas: { layer:null, make(op){ return L.tileLayer('https://storage.googleapis.com/mapbiomas-public/brasil/collection-8/lclu/coverage/{z}/{x}/{y}.png',{attribution:'MapBiomas Coleção 8',opacity:op/100,maxZoom:22,maxNativeZoom:12}); } },
  prodes:    { layer:null, make(op){ return L.tileLayer.wms('https://terrabrasilis.dpi.inpe.br/geoserver/prodes-amazon-nb/wms',{layers:'prodes-amazon-nb:yearly_deforestation_biome',format:'image/png',transparent:true,version:'1.1.1',attribution:'PRODES/INPE',opacity:op/100,maxZoom:22,maxNativeZoom:15}); } },
  prodes_hist:{ layer:null, make(op){ return L.tileLayer.wms('https://terrabrasilis.dpi.inpe.br/geoserver/prodes-amazon-nb/wms',{layers:'prodes-amazon-nb:accumulated_deforestation_2007_biome',format:'image/png',transparent:true,version:'1.1.1',attribution:'PRODES/INPE Acumulado',opacity:op/100,maxZoom:22,maxNativeZoom:15}); } },
};
function toggleCamadaVeg(id, ativo){
  const cfg = VEG_LAYERS[id]; if(!cfg) return;
  if(ativo){ const op = parseInt(document.getElementById('veg-'+id+'-opacity')?.value||70); cfg.layer=cfg.make(op); cfg.layer.addTo(mapaL); cfg.layer.setZIndex(150); }
  else { if(cfg.layer){ mapaL.removeLayer(cfg.layer); cfg.layer=null; } }
  _atualizarLegendaMapa();
}
function atualizarOpacidadeVeg(id){
  const cfg = VEG_LAYERS[id]; if(!cfg?.layer) return;
  const op = parseInt(document.getElementById('veg-'+id+'-opacity')?.value||70);
  cfg.layer.setOpacity(op/100);
}

function iniciarMapa(){
  mapaL = L.map('mapa',{ center:[-9.5,-70.0], zoom:7 });
  _aplicarBasemap('satelite');
  _adicionarRosaDosVentos();
  _adicionarMiniMapa();
  _adicionarControleBasemap();
  clusters = L.markerClusterGroup({ maxClusterRadius:40, disableClusteringAtZoom:14 });
  mapaL.addLayer(clusters);
  mapaL.createPane('carPane'); mapaL.getPane('carPane').style.zIndex = 450;
  requestAnimationFrame(() => mapaL.invalidateSize());
  mapaL.on('click', onMapaClick);
  _iniciarDragCard('uc-stats-card','usc-drag-handle');
  // Elementos cartográficos obrigatórios
  CART.init(mapaL);
  // Pré-renderizar painel UC no DOM (sem abrir visualmente) e carregar estaduais
  document.getElementById('mlb-dropdown').innerHTML = _renderDropdown('uc');
  toggleUC(true);
}

function _aplicarBasemap(modo){
  modoMapaAtual = modo;
  if(googleLayer){ mapaL.removeLayer(googleLayer); googleLayer = null; }
  const bm = MODOS_MAPA[modo];
  googleLayer = L.tileLayer(bm.url, bm.opts);
  googleLayer.addTo(mapaL);
  document.querySelectorAll('.bmg-tile').forEach(t => t.classList.toggle('ativo', t.dataset.modo===modo));
}

function _adicionarRosaDosVentos(){
  const Ctrl = L.Control.extend({ options:{position:'bottomleft'}, onAdd(){
    const div = L.DomUtil.create('div','rosa-norte'); div.title='Norte';
    div.innerHTML=`<svg viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg">
      <circle cx="22" cy="22" r="20" fill="none" stroke="#e5e7eb" stroke-width="1"/>
      <polygon points="22,3 26,22 22,19 18,22" fill="#dc2626"/>
      <polygon points="22,41 18,22 22,25 26,22" fill="#9ca3af"/>
      <circle cx="22" cy="22" r="3" fill="#1f2937"/>
      <text x="22" y="14" text-anchor="middle" font-size="6" font-weight="700" font-family="DM Sans,sans-serif" fill="#dc2626">N</text>
      <text x="22" y="43" text-anchor="middle" font-size="5.5" font-weight="600" font-family="DM Sans,sans-serif" fill="#6b7280">S</text>
      <text x="41" y="23.5" text-anchor="middle" font-size="5.5" font-weight="600" font-family="DM Sans,sans-serif" fill="#6b7280">L</text>
      <text x="3" y="23.5" text-anchor="middle" font-size="5.5" font-weight="600" font-family="DM Sans,sans-serif" fill="#6b7280">O</text>
    </svg>`;
    L.DomEvent.disableClickPropagation(div); return div;
  }});
  new Ctrl().addTo(mapaL);

function _adicionarMiniMapa(){
  const miniTile = L.tileLayer('https://{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}',{maxZoom:22,subdomains:['mt0','mt1','mt2','mt3']});
  new L.Control.MiniMap(miniTile,{position:'bottomright',width:140,height:110,zoomLevelOffset:-5,toggleDisplay:true,minimized:false,
    aimingRectOptions:{color:'#dc2626',weight:2,opacity:.9,fillOpacity:.1},
    shadowRectOptions:{color:'#dc2626',weight:1,opacity:.4,fillOpacity:0}
  }).addTo(mapaL);
}

function _adicionarControleBasemap(){
  const Ctrl = L.Control.extend({ options:{position:'topright'}, onAdd(){
    const div = L.DomUtil.create('div','mapa-modo-ctrl');
    div.innerHTML = `<div class="bmg-header" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'':'none'">
      <span class="bmg-header-title">🗺 Mapa Base</span><span style="font-size:11px;color:#9ca3af">▾</span></div>
      <div class="bmg-body" style="display:none">` +
      BASEMAP_GROUPS.map(g=>`<div class="bmg-group-title">${escHtml(g.grupo)}</div><div class="bmg-grid">` +
        g.itens.map(b=>`<div class="bmg-tile${b.id===modoMapaAtual?' ativo':''}" data-modo="${b.id}" onclick="_aplicarBasemap('${b.id}')">

  }});

}

async function carregarCamadas(){
  const { data } = await db.from('camadas_mapa').select('*').order('ordem');
  camadas = (data||[]).map(c => ({ ...c, layer:null }));
  camadas.forEach(c => { if(c.visivel) _renderizarCamada(c); });
  renderCamadasHtml();
}

function _renderizarCamada(c){
  if(c.layer){ mapaL.removeLayer(c.layer); c.layer=null; }
  if(!c.geojson) return;
  const sc = c.style_config||{}, fo = sc.fillOpacity!=null?sc.fillOpacity:0.22, sw = sc.strokeWidth!=null?sc.strokeWidth:2;
  const hidden = new Set(sc.hiddenFeatures||[]), featFill = c.feature_colors||{};
  const allF = c.geojson.features||[];
  const hasNames = allF.some(f => f.properties && (f.properties.name||f.properties.Name||f.properties.NAME));
  const paletaFixa = {};
  allF.forEach((f,i) => { const n=f.properties?.name||f.properties?.Name||f.properties?.NAME||''; if(n&&!paletaFixa[n]) paletaFixa[n]=SUBBACIA_PALETTE[i%SUBBACIA_PALETTE.length]; });
  const visF = hidden.size>0 ? allF.filter(f => { const n=f.properties?.name||f.properties?.Name||f.properties?.NAME||''; return !hidden.has(n); }) : allF;
  c.layer = L.geoJSON({...c.geojson,features:visF},{
    style: hasNames
      ? (f) => { const n=f.properties?.name||f.properties?.Name||f.properties?.NAME||''; const fill=featFill[n]||paletaFixa[n]||c.cor; return {color:fill,weight:sw,opacity:.9,fillColor:fill,fillOpacity:fo,dashArray:'5 4'}; }
      : { color:c.cor, weight:sw, opacity:.9, fillColor:c.cor, fillOpacity:fo, dashArray:'5 4' },
    onEachFeature: hasNames ? (f,layer) => {
      const n=f.properties?.name||f.properties?.Name||f.properties?.NAME||'';
      if(n){ layer.bindTooltip(n,{permanent:true,direction:'center',className:'subbacia-label'}); layer.on('add',()=>layer.openTooltip()); }
    } : undefined
  });
  c.layer.addTo(mapaL);
}

function renderCamadasHtml(){
  const el = document.getElementById('bloco-camadas-lista'); if(!el) return;
  if(!camadas.length){ el.innerHTML = '<div style="color:var(--cinza-400);font-size:11px">Nenhuma camada personalizada.</div>'; return; }
  el.innerHTML = camadas.map(c => `
    <div style="display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid var(--cinza-100)">
      <input type="checkbox" ${c.visivel?'checked':''} style="accent-color:${c.cor};width:13px;height:13px;cursor:pointer" onchange="toggleCamada('${c.id}',this.checked)">
      <div style="width:12px;height:12px;border-radius:2px;background:${c.cor};flex-shrink:0"></div>
      <span style="font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(c.nome)}</span>
    </div>`).join('');
}

function toggleCamada(id, vis){
  const c = camadas.find(x=>x.id===id); if(!c) return;
  c.visivel = vis;
  if(vis) _renderizarCamada(c); else { if(c.layer){ mapaL.removeLayer(c.layer); c.layer=null; } }
  _atualizarLegendaMapa();
}

// LEGENDA CARTOGRÁFICA — atualiza dinamicamente conforme camadas
// ══════════════════════════════════════════════════════════════
function _atualizarLegendaMapa(){
  if(typeof CART === 'undefined') return;
  const itens = [];

  // Unidades de Conservação
  if(_ucAtivo && _ucGeojson){
    const feats = _ucGeojson.features || [];
    const temPI = feats.some(f => _ucGrupoId(f.properties?.grupo) === 'pi');
    const temUS = feats.some(f => _ucGrupoId(f.properties?.grupo) === 'us');
    if(temPI) itens.push({ simbolo:'rect', cor:'#059669', opacidade:_ucOpacity, label:'UC — Proteção Integral' });
    if(temUS) itens.push({ simbolo:'rect', cor:'#3b82f6', opacidade:_ucOpacity, label:'UC — Uso Sustentável' });
  }

  // Terras Indígenas
  if(_tiAtivo) itens.push({ simbolo:'rect', cor:'#f59e0b', opacidade:0.4, label:'Terras Indígenas' });

  // Municípios
  if(_munAtivo) itens.push({ simbolo:'rect', cor:'#6366f1', opacidade:0, somente_borda:true, label:'Municípios' });

  // Delimitação do Acre
  if(_acreAtivo) itens.push({ simbolo:'line', cor:_acreEstilo.cor, dash:_acreEstilo.dashArray!=='none', label:'Limite Estadual — Acre' });

  // Ocorrências ativas
  const sevAtivas = Array.from(document.querySelectorAll('[data-oc-sev]:checked')).map(e=>e.dataset.ocSev);
  sevAtivas.forEach(s => {
    const cor = OC_CORES[s]; if(!cor) return;
    itens.push({ simbolo:'circle', cor, label:'Ocorrência — '+s.charAt(0).toUpperCase()+s.slice(1) });
  });

  // Zonas de Manejo
  if(_zonasAtivo) itens.push({ simbolo:'rect', cor:'#7c3aed', opacidade:_zonasOpacity, dash:true, label:'Zonas de Manejo' });

  // CAR
  if(_carLayer) itens.push({ simbolo:'rect', cor:'#d97706', opacidade:0.15, label:'CAR — Imóveis Rurais' });

  // Cobertura Vegetal
  if(VEG_LAYERS.mapbiomas?.layer)  itens.push({ simbolo:'rect', cor:'#16a34a', opacidade:0.7, label:'MapBiomas Coleção 8' });
  if(VEG_LAYERS.prodes?.layer)     itens.push({ simbolo:'rect', cor:'#dc2626', opacidade:0.7, label:'PRODES — Desmatamento' });
  if(VEG_LAYERS.prodes_hist?.layer)itens.push({ simbolo:'rect', cor:'#b45309', opacidade:0.7, label:'PRODES — Acumulado' });

  // Camadas personalizadas
  camadas.filter(c=>c.visivel).forEach(c => {
    itens.push({ simbolo:'rect', cor:c.cor, opacidade:0.4, dash:true, label:c.nome });
  });

  CART.legendaAtualizar(itens);
}

let _todasOcorrencias = [];
async function carregarOcorrencias(){
  const { data } = await db.from('ocorrencias')
    .select('id,titulo,tipo,severidade,status,data_ocorrencia,area_afetada_ha,descricao,uc_id,unidades_conservacao(nome,codigo)')
    .neq('status','arquivada');
  _todasOcorrencias = data||[];
  renderOcorrencias();
  const el = document.getElementById('oc-count-lbl');
  if(el) el.textContent = _todasOcorrencias.length + ' registro(s)';
}

function renderOcorrencias(){
  if(!clusters||!mapaL) return;
  clusters.clearLayers();
  const sevAtivas  = new Set(Array.from(document.querySelectorAll('[data-oc-sev]:checked')).map(e=>e.dataset.ocSev));
  const tiposAtivos = new Set(Array.from(document.querySelectorAll('[data-oc-tipo]:checked')).map(e=>e.dataset.ocTipo));
  _todasOcorrencias
    .filter(o => sevAtivas.has(o.severidade) && tiposAtivos.has(o.tipo))
    .forEach(o => {
      // Sem coordenada: usa centroide aproximado da UC com jitter
      const lat = -9.5 + (Math.random()-.5)*5, lng = -70+(Math.random()-.5)*8;
      const cor = OC_CORES[o.severidade]||'#6b7280';
      const icone = OC_ICONES[o.tipo]||'⚠';
      const marker = L.marker([lat,lng], { icon: L.divIcon({
        className:'',
        html:`<div class="oc-marker" style="background:${cor}">${icone}</div>`,
        iconSize:[28,28], iconAnchor:[14,14], popupAnchor:[0,-16]
      })});
      const ucNome = o.unidades_conservacao?.nome || '—';
      marker.bindPopup(`<div class="camada-popup">
        <div class="cp-header" style="background:${cor}">⚠ Ocorrência</div>
        <div class="cp-layer">
          <div class="cp-layer-nome">${escHtml(o.titulo)}</div>
          <div class="cp-row"><strong>UC</strong><span>${escHtml(ucNome)}</span></div>
          <div class="cp-row"><strong>Tipo</strong><span>${escHtml(o.tipo.replace(/_/g,' '))}</span></div>
          <div class="cp-row"><strong>Data</strong><span>${o.data_ocorrencia||'—'}</span></div>
          ${o.area_afetada_ha?`<div class="cp-row"><strong>Área</strong><span>${Number(o.area_afetada_ha).toLocaleString('pt-BR')} ha</span></div>`:''}
          ${o.descricao?`<div class="cp-row" style="margin-top:4px"><span style="font-size:11px;color:#6B7280">${escHtml(o.descricao.substring(0,140))}${o.descricao.length>140?'…':''}</span></div>`:''}
          <div class="cp-badge" style="background:${cor}11;border-color:${cor};color:${cor}">${escHtml(o.severidade)}</div>
        </div>
      </div>`);
      clusters.addLayer(marker);
    });
  _atualizarLegendaMapa();
}

var _ucCoresLS = {}; try{ _ucCoresLS = JSON.parse(localStorage.getItem('siguc_uc_cores')||'{}'); }catch(e){}
function _ucCorNome(nome, fallback){ return _ucCoresLS[nome]||fallback||'#059669'; }

function _ucGrupoId(g){ if(!g) return 'us'; const v=g.toLowerCase(); return(v==='pi'||v.includes('integral'))?'pi':'us'; }

async function toggleUC(ativo){
  _ucAtivo = ativo;
  if(ativo && !_ucGeojson) await _carregarUC();
  else _renderizarUC();
  if(ativo) document.getElementById('uc-stats-card').classList.add('visivel');
  else document.getElementById('uc-stats-card').classList.remove('visivel');

function ucToggleLabels(v){ _ucLabels=v; _renderizarUC(); }
function ucAlterarOpacidade(v){ _ucOpacity=v/100; document.getElementById('uc-opacity-val').textContent=v+'%'; _renderizarUC(); }

let _ucDetalhes = {};
async function _carregarUC(){
  document.getElementById('uc-loading').style.display='flex';
  try{
    const [r1, r2] = await Promise.all([
      fetch('../data/uc_acre.geojson'),
      fetch('../data/uc_detalhes.json')
    ]);
    if(!r1.ok) throw new Error('HTTP '+r1.status);
    _ucGeojson = await r1.json();
    if(r2.ok){ const d=await r2.json(); delete d._meta; _ucDetalhes=d; }
  }catch(e){
    document.getElementById('uc-loading').style.display='none';
    document.getElementById('uc-stat').textContent='⚠ Erro: '+e.message; return;
  }
  document.getElementById('uc-loading').style.display='none';
  document.getElementById('uc-controles').style.display='';
  _ucConstruirPainel(); _renderizarUC();
  document.getElementById('uc-stats-card').classList.add('visivel');
  // Popular select do CAR com as UCs
  _popularFiltroCarUC();
}

function _ucConstruirPainel(){
  const pi=[], us=[];
  (_ucGeojson.features||[]).forEach(f=>{
    const p=f.properties; const g=_ucGrupoId(p.grupo);
    const item={nome:p.nome||'',sigla:p.sigla||'',esfera:p.esfera||'',cor:_ucCorNome(p.nome,p.cor)};
    (g==='pi'?pi:us).push(item);
  });
  function esferaBadge(e){ const m={federal:'#eff6ff/#1d4ed8/#bfdbfe',estadual:'#fefce8/#854d0e/#fde68a'}[e]||'#f0fdf4/#166534/#86efac'; const[bg,co,brd]=m.split('/'); return `<span style="font-size:8px;padding:1px 4px;border-radius:3px;background:${bg};color:${co};border:1px solid ${brd};flex-shrink:0">${e}</span>`; }
  function buildList(items){ return items.sort((a,b)=>a.nome.localeCompare(b.nome)).map(item=>`
    <div class="uc-filtro-label" style="gap:5px;padding:3px 0;align-items:center">
      <input type="checkbox" checked data-uc-nome="${escHtml(item.nome)}" style="accent-color:${item.cor};width:12px;height:12px;cursor:pointer;flex-shrink:0" onchange="filtrarUC()">
      <div style="background:${item.cor};width:12px;height:12px;border-radius:2px;flex-shrink:0;cursor:pointer" title="Mudar cor" onclick="ucAbrirColorPicker('${escHtml(item.nome).replace(/'/g,"\\'")}',this)"></div>

      ${esferaBadge(item.esfera)}
    </div>`).join(''); }
  const piEl=document.getElementById('uc-tipos-pi'), usEl=document.getElementById('uc-tipos-us');
  if(piEl) piEl.innerHTML=pi.length?buildList(pi):'<span style="font-size:10px;color:var(--cinza-400)">Nenhuma</span>';
  if(usEl) usEl.innerHTML=us.length?buildList(us):'<span style="font-size:10px;color:var(--cinza-400)">Nenhuma</span>';
}

function _renderizarUC(){

  // Sincronizar visibilidade dos itens da lista com as esferas ativas

    const cb=row.querySelector('[data-uc-nome]'); if(!cb) return;

    const feat=(_ucGeojson?.features||[]).find(f=>f.properties.nome===nome);

      if(_ucLabels&&p.centro_lon&&p.centro_lat){

      const _ucNome = p.nome; // captura em closure para o on('add')

    if(esf==='municipal'&&!esfMun) return false;
    if(nomesAtivos.size>0&&!nomesAtivos.has(f.properties.nome)) return false;
    return true;
  });

function _ucStatsAtualizar(filteredFeats){
  const ACRE_HA = 16421980;
  const feats = filteredFeats || [];
  const total = feats.length;
  // Fonte oficial: uc_detalhes (SNUC/ICMBio/SEMA) > GeoJSON > 0
  const areaTotal = feats.reduce((s,f)=>{
    const det=_ucDetalhes[f.properties?.nome]||{};
    return s+(parseFloat(det.area_ha)||parseFloat(f.properties?.area_ha)||0);
  },0);
  const pct = (areaTotal/ACRE_HA)*100;

  // Totais
  document.getElementById('usc-total').textContent = total;
  document.getElementById('usc-area').textContent = (areaTotal/1e6).toFixed(2);
  document.getElementById('usc-pct').textContent = pct.toFixed(1)+'%';
  document.getElementById('usc-sub').textContent = total+' UC'+(total!==1?'s':'')+' · '+areaTotal.toLocaleString('pt-BR',{maximumFractionDigits:0})+' ha';

  // Donut SVG (r=26, circunferência=163.36)
  const CIRC = 163.36;
  const arc = Math.min(pct/100, 1) * CIRC;
  const donutArc = document.getElementById('usc-donut-arc');
  const donutTxt = document.getElementById('usc-donut-txt');
  if(donutArc){ donutArc.setAttribute('stroke-dasharray', arc.toFixed(1)+' '+CIRC.toFixed(1)); }
  if(donutTxt){ donutTxt.textContent = pct.toFixed(1)+'%'; }

  // Filtros ativos (badges de esfera)
  const esfFed = document.getElementById('uc-esfera-federal')?.checked??false;
  const esfEst = document.getElementById('uc-esfera-estadual')?.checked??true;
  const esfMun = document.getElementById('uc-esfera-municipal')?.checked??false;
  const badgeCfg = {
    estadual:{label:'Estadual',bg:'#fefce8',co:'#854d0e',brd:'#fde68a'},
    federal:{label:'Federal',bg:'#eff6ff',co:'#1d4ed8',brd:'#bfdbfe'},
    municipal:{label:'Municipal',bg:'#f0fdf4',co:'#166534',brd:'#86efac'},
  };
  const ativosBadge = [esfEst&&'estadual',esfFed&&'federal',esfMun&&'municipal'].filter(Boolean);
  const filtrosEl = document.getElementById('usc-filtros-ativos');
  if(filtrosEl) filtrosEl.innerHTML = ativosBadge.map(e=>{
    const c=badgeCfg[e];
    return `<span class="usc-filtro-badge" style="background:${c.bg};color:${c.co};border-color:${c.brd}">${c.label}</span>`;
  }).join('');

  // Breakdown por esfera (só mostra se >1 esfera ativa)
  const esfEl = document.getElementById('usc-esferas');
  const esfCores = {estadual:'#d97706',federal:'#2563eb',municipal:'#16a34a'};
  if(esfEl){
    if(ativosBadge.length > 1){
      const byEsfera = {};
      feats.forEach(f=>{
        const esf=(f.properties.esfera||'outro').toLowerCase();
        if(!byEsfera[esf]) byEsfera[esf]={count:0,area:0};
        byEsfera[esf].count++;
        const det=_ucDetalhes[f.properties?.nome]||{};
        byEsfera[esf].area += parseFloat(det.area_ha)||parseFloat(f.properties.area_ha)||0;
      });
      const maxArea = Math.max(...Object.values(byEsfera).map(v=>v.area),1);
      esfEl.style.display='';
      esfEl.innerHTML = '<div style="font-size:9px;font-weight:700;color:var(--cinza-400);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px">Por esfera de gestão</div>' +
        ativosBadge.map(esf=>{
          const d=byEsfera[esf]||{count:0,area:0};
          const barW = areaTotal>0 ? Math.max(4,(d.area/maxArea)*100).toFixed(0) : 4;
          const cor = esfCores[esf]||'#6b7280';
          return `<div class="usc-esfera-row">
            <span style="width:52px;color:var(--cinza-700);text-transform:capitalize;flex-shrink:0">${badgeCfg[esf]?.label||esf}</span>
            <div style="flex:1;display:flex;align-items:center;gap:4px">
              <div class="usc-esfera-bar" style="width:${barW}%;background:${cor}"></div>
            </div>
            <span style="width:22px;text-align:right;font-weight:700;color:${cor}">${d.count}</span>
            <span style="width:52px;text-align:right;color:var(--cinza-500)">${(d.area/1e6).toFixed(2)}M</span>
          </div>`;
        }).join('');
    } else {
      esfEl.style.display='none';
    }
  }

  // PI vs US
  const pi = feats.filter(f=>_ucGrupoId(f.properties?.grupo)==='pi');
  const us = feats.filter(f=>_ucGrupoId(f.properties?.grupo)==='us');
  const piArea = pi.reduce((s,f)=>{ const d=_ucDetalhes[f.properties?.nome]||{}; return s+(parseFloat(d.area_ha)||parseFloat(f.properties.area_ha)||0); },0);
  const usArea = us.reduce((s,f)=>{ const d=_ucDetalhes[f.properties?.nome]||{}; return s+(parseFloat(d.area_ha)||parseFloat(f.properties.area_ha)||0); },0);
  document.getElementById('usc-grupos').innerHTML=`
    <div style="display:flex;justify-content:space-between;font-size:10px;margin-bottom:4px">
      <span style="font-weight:700;color:#dc2626">${pi.length} Proteção Integral</span>
      <span style="color:var(--cinza-500)">${(piArea/1e6).toFixed(2)}M ha</span>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:10px">
      <span style="font-weight:700;color:#2563eb">${us.length} Uso Sustentável</span>
      <span style="color:var(--cinza-500)">${(usArea/1e6).toFixed(2)}M ha</span>
    </div>`;
}

// DELIMITAÇÃO DO ESTADO DO ACRE
// Fonte: IBGE Malhas https://servicodados.ibge.gov.br/api/v3/malhas/estados/12
// ══════════════════════════════════════════════════════════════

async function carregarDelimitacaoAcre(){
  // Recupera estilo salvo no localStorage
  try{ const s=localStorage.getItem('siguc_acre_estilo'); if(s) _acreEstilo={..._acreEstilo,...JSON.parse(s)}; }catch(e){}
  _sincronizarEditor();

  try{
    const r = await fetch('https://servicodados.ibge.gov.br/api/v3/malhas/estados/12?formato=application/vnd.geo+json&resolucao=2');
    if(!r.ok) throw new Error('HTTP '+r.status);
    _acreGeojson = await r.json();
  }catch(e){
    // Fallback: tenta o GeoJSON local de municípios como approximação
    if(!_munGeojson){ try{ const r2=await fetch('../data/municipios_acre.geojson'); _munGeojson=await r2.json(); }catch(e2){} }
    _acreGeojson = _munGeojson;
  }
  _renderizarAcre();
  _iniciarDragEditor();
}

function _renderizarAcre(){
  // Remove camadas anteriores
  _acreLayers.forEach(l=>{ try{ mapaL.removeLayer(l); }catch(e){} });
  _acreLayers = [];
  if(!_acreGeojson || !_acreAtivo) return;

  const e = _acreEstilo;
  const dash = e.dashArray === 'none' ? null : e.dashArray;

  // ── Camada 1: sombra (stroke mais espesso, cor da sombra, sem fill) ────────
  if(e.sombraBlur > 0 || e.sombraOffset > 0){
    const shadowLayer = L.geoJSON(_acreGeojson, {
      style: {
        color: e.sombraCor,
        weight: e.espessura + e.sombraBlur * 0.6,
        opacity: e.sombraOpacidade,
        fillOpacity: 0,
        dashArray: dash,
        lineCap: 'round',
        lineJoin: 'round',
      }
    });
    shadowLayer.addTo(mapaL);
    // Drop-shadow via CSS no pane SVG
    _aplicarFiltroPaneSombra(shadowLayer, e);
    _acreLayers.push(shadowLayer);
  }

  // ── Camada 2: borda principal ─────────────────────────────────────────────
  const borderLayer = L.geoJSON(_acreGeojson, {
    style: {
      color: e.cor,
      weight: e.espessura,
      opacity: e.opacidade,
      fillOpacity: 0,
      dashArray: dash,
      lineCap: 'round',
      lineJoin: 'round',
    }
  });
  borderLayer.addTo(mapaL);
  _acreLayers.push(borderLayer);
}

function _aplicarFiltroPaneSombra(layer, e){
  // Aplica drop-shadow CSS no container SVG da camada
  requestAnimationFrame(() => {
    layer.eachLayer(l => {
      const el = l.getElement ? l.getElement() : null;
      if(el){
        const blur = e.sombraBlur;
        const off  = e.sombraOffset;
        const op   = e.sombraOpacidade;
        const cor  = _hexParaRgba(e.sombraCor, op);
        el.style.filter = `drop-shadow(${off}px ${off}px ${blur}px ${cor}) drop-shadow(-${off/2}px -${off/2}px ${blur}px ${cor})`;
      }
    });
    // fallback: aplica no pane inteiro
    const pane = mapaL.getPane('overlayPane');
    if(pane && _acreLayers.length > 0){
      // Não aplica no pane inteiro para não afetar outras camadas
    }
  });
}

function _hexParaRgba(hex, opacity){
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${opacity})`;
}

function acreToggle(ativo){
  _acreAtivo = ativo;

}

function acreAplicar(){
  const e = _acreEstilo;
  e.cor            = document.getElementById('acre-cor').value;

  e.dashArray      = document.getElementById('acre-dash').value;
  e.sombraCor      = document.getElementById('acre-sombra-cor').value;
  e.sombraBlur     = parseInt(document.getElementById('acre-blur').value);
  e.sombraOpacidade= parseInt(document.getElementById('acre-sop').value) / 100;
  e.sombraOffset   = parseInt(document.getElementById('acre-soff').value);

  document.getElementById('acre-cor-hex').textContent  = e.cor;

}

function acreReset(){
  _acreEstilo = { cor:'#1F4E2C', espessura:4, opacidade:1, dashArray:'none', sombraCor:'#000000', sombraBlur:14, sombraOpacidade:0.55, sombraOffset:3 };
  try{ localStorage.removeItem('siguc_acre_estilo'); }catch(e){}

function _sincronizarEditor(){
  const e = _acreEstilo;
  const get = id => document.getElementById(id);
  if(!get('acre-cor')) return; // Editor ainda não renderizado
  get('acre-cor').value   = e.cor;
  get('acre-esp').value   = e.espessura;    if(get('acre-esp-val'))  get('acre-esp-val').textContent  = e.espessura+'px';
  get('acre-op').value    = Math.round(e.opacidade*100); if(get('acre-op-val'))   get('acre-op-val').textContent   = Math.round(e.opacidade*100)+'%';
  get('acre-dash').value  = e.dashArray;
  get('acre-sombra-cor').value = e.sombraCor;
  get('acre-blur').value  = e.sombraBlur;   if(get('acre-blur-val')) get('acre-blur-val').textContent = e.sombraBlur+'px';
  get('acre-sop').value   = Math.round(e.sombraOpacidade*100); if(get('acre-sop-val'))  get('acre-sop-val').textContent  = Math.round(e.sombraOpacidade*100)+'%';
  get('acre-soff').value  = e.sombraOffset; if(get('acre-soff-val')) get('acre-soff-val').textContent = e.sombraOffset+'px';
  if(get('acre-cor-hex'))  get('acre-cor-hex').textContent  = e.cor;
  if(get('acre-scor-hex')) get('acre-scor-hex').textContent = e.sombraCor;
}

function _iniciarDragCard(cardId, handleId){
  const card=document.getElementById(cardId), handle=document.getElementById(handleId);
  if(!card||!handle) return;
  let drag=false, ox=0, oy=0, sx=0, sy=0;
  handle.addEventListener('mousedown', e=>{
    drag=true; sx=e.clientX; sy=e.clientY;
    const r=card.getBoundingClientRect(); ox=r.left; oy=r.top;
    handle.style.cursor='grabbing'; e.preventDefault();
  });
  document.addEventListener('mousemove', e=>{
    if(!drag) return;
    const nx=ox+(e.clientX-sx), ny=oy+(e.clientY-sy);
    card.style.left=Math.max(0,nx)+'px'; card.style.top=Math.max(0,ny)+'px';
    card.style.right='auto'; card.style.bottom='auto';
  });
  document.addEventListener('mouseup', ()=>{ drag=false; handle.style.cursor='grab'; });
}

function _iniciarDragEditor(){
  const card  = document.getElementById('acre-editor');
  const handle= document.getElementById('acre-ed-drag');
  if(!card || !handle) return;
  let drag=false, ox=0, oy=0, startX=0, startY=0;
  handle.addEventListener('mousedown', e => {
    drag=true; startX=e.clientX; startY=e.clientY;
    const rect=card.getBoundingClientRect(); ox=rect.left; oy=rect.top;
    card.style.cursor='grabbing'; e.preventDefault();
  });
  document.addEventListener('mousemove', e => {
    if(!drag) return;
    const nx = ox + (e.clientX - startX), ny = oy + (e.clientY - startY);
    card.style.left=Math.max(0,nx)+'px'; card.style.top=Math.max(0,ny)+'px';
    card.style.right='auto'; card.style.bottom='auto';
  });
  document.addEventListener('mouseup', () => { drag=false; card.style.cursor=''; });
}

function _renderizarZonas(){
  if(_zonasLayer){ mapaL.removeLayer(_zonasLayer); _zonasLayer = null; }
  if(!_zonasGeojson || !_zonasAtivo) return;

  const tiposAtivos = new Set(
    Array.from(document.querySelectorAll('[data-zona-tipo]:checked')).map(e => e.dataset.zonaTipo)

  let count = 0;
  _zonasLayer = L.geoJSON(_zonasGeojson, {
    style: f => {
      const meta = ZONA_META[f.properties.zona_codigo] || {};
      const cor = meta.cor || '#6b7280';
      return { color: cor, weight: 1.5, opacity: .9, fillColor: cor, fillOpacity: _zonasOpacity, dashArray: '4 3' };
    },
    filter: f => {
      const p = f.properties;

      if(tiposAtivos.size > 0 && !tiposAtivos.has(p.zona_codigo)) return false;

      if(selUC && !selUC.has(p.zona_codigo)) return false;
      count++;
      return true;
    },
    onEachFeature: (f, layer) => {
      const p = f.properties;
      const meta = ZONA_META[p.zona_codigo] || {};
      const cor = meta.cor || '#6b7280';
      const ha = p.hectares ? Number(String(p.hectares).replace(',','.')).toLocaleString('pt-BR',{maximumFractionDigits:0}) : '';
      layer.bindPopup(`<div class="camada-popup">
        <div class="cp-header" style="background:${cor}">🗂 Zona de Manejo</div>
        <div class="cp-layer">
          <div class="cp-layer-nome" style="color:${cor}">${escHtml(p.zona_codigo)} — ${escHtml(p.zona_nome)}</div>

          <div class="cp-badge" style="background:${cor}18;border-color:${cor};color:${cor}">${escHtml(p.zona_codigo)}</div>

      </div>`, {className:'camada-popup-wrap', maxWidth:280});
      layer.on('mouseover', () => layer.setStyle({weight:2.5, fillOpacity: Math.min(_zonasOpacity + 0.2, 1)}));
      layer.on('mouseout',  () => layer.setStyle({weight:1.5, fillOpacity: _zonasOpacity}));
    }

  _zonasLayer.addTo(mapaL);

  const stat = document.getElementById('zonas-stat');
  if(stat) stat.textContent = count + ' zona' + (count !== 1 ? 's' : '') + ' exibida' + (count !== 1 ? 's' : '');
  const badge = document.getElementById('zonas-count-badge');
  if(badge){ badge.textContent = count; badge.style.display = count ? '' : 'none'; }
}

// ══════════════════════════════════════════════════════════════
// Endpoints CAR — tenta em ordem até um funcionar
const CAR_ENDPOINTS = [
  'https://geoserver.car.gov.br/geoserver/sicar/wfs',
  'https://geocar.car.gov.br/geoserver/sicar/wfs',
];
// Nomes de layer conhecidos no SICAR
const CAR_TYPE_NAMES = ['sicar:sicar_imovel','sicar:area_imovel','sicar:imoveis'];
const CAR_PAGE = 500;

function _popularFiltroCarUC(){
  const sel = document.getElementById('car-sel-uc'); if(!sel) return;

  if(!_ucGeojson) await _carregarUC();

// Calcula BBOX de uma UC pelo GeoJSON
function _bboxUC(ucNome){
  const ucFeat = (_ucGeojson?.features||[]).find(f=>f.properties?.nome===ucNome);
  if(!ucFeat?.geometry) return null;
  try{
    const coords=[];
    const ext = g => { if(g.type==='MultiPolygon') g.coordinates.forEach(p=>p.forEach(r=>r.forEach(c=>coords.push(c)))); else if(g.type==='Polygon') g.coordinates.forEach(r=>r.forEach(c=>coords.push(c))); };
    ext(ucFeat.geometry);
    if(!coords.length) return null;
    const lngs=coords.map(c=>c[0]), lats=coords.map(c=>c[1]);
    const pad=0.02;
    return { minLng:Math.min(...lngs)-pad, minLat:Math.min(...lats)-pad, maxLng:Math.max(...lngs)+pad, maxLat:Math.max(...lats)+pad };
  }catch(e){ return null; }
}

// Estratégias de BBOX para WFS — cada item é { bboxStr, srsName }
// WFS 1.1.0 EPSG:4326 = lat-lon (Y,X) por spec OGC → minLat,minLon,maxLat,maxLon
// CRS:84 / urn:CRS84  = lon-lat (X,Y) explícito   → minLon,minLat,maxLon,maxLat
function _buildCarCandidates(base, typeName, bb){
  const { minLng:x0, minLat:y0, maxLng:x1, maxLat:y1 } = bb;
  return [
    // CRS84 (lon-lat explícito) — mais compatível e sem ambiguidade
    { url: `${base}?service=WFS&version=1.1.0&request=GetFeature&typeName=${typeName}&outputFormat=application%2Fjson&srsName=CRS%3A84&BBOX=${x0},${y0},${x1},${y1},CRS:84&maxFeatures=${CAR_PAGE}` },
    // EPSG:4326 lon-lat (implementações lenientes — maioria dos GeoServers brasileiros)
    { url: `${base}?service=WFS&version=1.1.0&request=GetFeature&typeName=${typeName}&outputFormat=application%2Fjson&srsName=EPSG%3A4326&BBOX=${x0},${y0},${x1},${y1},EPSG:4326&maxFeatures=${CAR_PAGE}` },
    // EPSG:4326 lat-lon (spec OGC estrita — servidores que seguem a norma)
    { url: `${base}?service=WFS&version=1.1.0&request=GetFeature&typeName=${typeName}&outputFormat=application%2Fjson&srsName=EPSG%3A4326&BBOX=${y0},${x0},${y1},${x1},EPSG:4326&maxFeatures=${CAR_PAGE}` },
    // WFS 2.0.0 + CRS84
    { url: `${base}?service=WFS&version=2.0.0&request=GetFeature&typeNames=${typeName}&outputFormat=application%2Fjson&srsName=CRS%3A84&BBOX=${x0},${y0},${x1},${y1}&count=${CAR_PAGE}` },
    // Sem BBOX — tudo dentro do estado (fallback pesado, mas garante resultado)
    { url: `${base}?service=WFS&version=1.1.0&request=GetFeature&typeName=${typeName}&outputFormat=application%2Fjson&srsName=CRS%3A84&BBOX=${-74},${-12},${-66},${-7},CRS:84&maxFeatures=${CAR_PAGE}` },
  ];
}

async function _tentarFetchCAR(url){
  const r = await fetch(url, { signal: AbortSignal.timeout(18000) });
  const txt = await r.text();
  if(txt.trimStart().startsWith('<')){
    const match = txt.match(/<ows:ExceptionText[^>]*>([\s\S]*?)<\/ows:ExceptionText>/)
                || txt.match(/<ServiceException[^>]*>([\s\S]*?)<\/ServiceException>/)
                || txt.match(/<Message>([\s\S]*?)<\/Message>/);
    throw new Error(match ? match[1].trim().substring(0,200) : 'Servidor retornou XML em vez de JSON');
  }
  const gj = JSON.parse(txt);
  if(!gj.features) throw new Error('GeoJSON sem features');
  return gj;
}

async function carregarDadosCAR(ucNome){
  if(ucNome==='todas'||!ucNome) return;
  if(_carCarregando) return;
  _carCarregando = true;

  const statusEl = document.getElementById('car-status-txt');
  const setStatus = html => { if(statusEl) statusEl.innerHTML = html; };

  // BBOX da UC — padding generoso para capturar imóveis no entorno
  const rawBbox = _bboxUC(ucNome);
  const bbox = rawBbox
    ? { ...rawBbox, minLng: rawBbox.minLng-0.05, minLat: rawBbox.minLat-0.05, maxLng: rawBbox.maxLng+0.05, maxLat: rawBbox.maxLat+0.05 }
    : { minLng:-74, minLat:-12, maxLng:-66, maxLat:-7 };

  setStatus(`⏳ Buscando imóveis CAR para <strong>${escHtml(ucNome)}</strong>...`);
  if(!rawBbox) setStatus(`⏳ UC não encontrada no GeoJSON — buscando no Acre inteiro...`);

  let resultado = null;
  let ultimoErro = 'Sem resposta';

  // Tenta cada endpoint × cada estratégia de BBOX × cada typeName
  externo: for(const base of CAR_ENDPOINTS){
    for(const typeName of CAR_TYPE_NAMES){
      const candidatos = _buildCarCandidates(base, typeName, bbox);
      for(let i=0; i<candidatos.length; i++){
        const { url } = candidatos[i];
        try{
          setStatus(`⏳ Tentando estratégia ${i+1}/${candidatos.length} · <code style="font-size:9px">${typeName}</code>...`);
          const gj = await _tentarFetchCAR(url);
          if(gj.features.length > 0){
            resultado = gj;
            break externo; // Achou features → para tudo
          }
          // 0 features → tenta próxima estratégia (pode ser ordem errada)
          ultimoErro = `0 imóveis com estratégia ${i+1}`;
        }catch(e){
          ultimoErro = e.message;
        }
      }
    }
  }

  // Fallback via proxy CORS público se todos os diretos falharam ou retornaram 0
  if(!resultado){
    try{
      setStatus('⏳ Tentando via proxy CORS...');
      const bboxStr=`${bbox.minLng},${bbox.minLat},${bbox.maxLng},${bbox.maxLat},CRS:84`;
      const apiUrl = `https://geoserver.car.gov.br/geoserver/sicar/wfs?service=WFS&version=1.1.0&request=GetFeature&typeName=sicar:sicar_imovel&outputFormat=application%2Fjson&srsName=CRS%3A84&BBOX=${bboxStr}&maxFeatures=${CAR_PAGE}`;
      const gj = await _tentarFetchCAR(`https://corsproxy.io/?url=${encodeURIComponent(apiUrl)}`);
      if(gj.features.length > 0) resultado = gj;
      else ultimoErro = 'Proxy retornou 0 imóveis';
    }catch(e2){ ultimoErro = e2.message; }
  }

  if(resultado){
    _carFeatures = resultado.features;
    _aplicarCamadaCAR();
    const n = _carFeatures.length;
    setStatus(`✅ <strong>${n}</strong> imóvel(is) carregado(s)`);
    const badge = document.getElementById('car-count-badge');
    if(badge){ badge.textContent=n; badge.style.display=n?'':'none'; }
    // Zoom para a área carregada
    if(n>0 && mapaL){ try{ mapaL.fitBounds(_carLayer.getBounds(),{padding:[20,20]}); }catch(e){} }
  }else{
    setStatus(`⚠ Nenhum imóvel encontrado — ${escHtml(ultimoErro.substring(0,100))}`);
  }

  _carCarregando = false;
}

function _carCor(condicao){
  const c=(condicao||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  if(c.includes('ativo')) return '#16a34a';
  if(c.includes('aguardando')) return '#d97706';
  if(c.includes('analise')||c.includes('análise')) return '#2563eb';
  return '#9ca3af';
}

function _aplicarCamadaCAR(){
  if(_carLayer){mapaL.removeLayer(_carLayer); _carLayer=null;}
  if(!_carFeatures.length) return;
  const renderer=L.canvas({pane:'carPane'});
  _carLayer=L.geoJSON({type:'FeatureCollection',features:_carFeatures},{
    renderer, pane:'carPane',
    style: f => { const cor=_carCor(f.properties?.condicao||f.properties?.ind_status); return {color:cor,weight:1.5,opacity:1,fillColor:cor,fillOpacity:0.18}; },
    onEachFeature:(f,layer)=>{
      layer.on('click',e=>{ L.DomEvent.stopPropagation(e); _abrirDetalhesCAR(f,layer); });
      layer.on('mouseover',()=>layer.setStyle({fillOpacity:0.4,weight:2.5}));
      layer.on('mouseout',()=>layer.setStyle({fillOpacity:0.18,weight:1.5}));
    }
  });
  _carLayer.addTo(mapaL);
}

function _abrirDetalhesCAR(f,layer){
  const p=f.properties||{};
  const panel=document.getElementById('car-det-panel');
  document.getElementById('car-det-titulo').textContent=p.nom_imovel||p.NOM_IMOVEL||'Imóvel Rural';
  document.getElementById('car-det-cod').textContent=p.cod_imovel||p.COD_IMOVEL||'';
  const cor=_carCor(p.condicao||p.ind_status);
  document.getElementById('car-det-body').innerHTML=`
    ${_carDetField('Cod. Imóvel', p.cod_imovel||p.COD_IMOVEL)}
    ${_carDetField('Nome', p.nom_imovel||p.NOM_IMOVEL)}
    ${_carDetField('Município', p.nom_municipio||p.NOM_MUNICIPIO||p.municipio)}
    ${_carDetField('Área (ha)', p.num_area_t||p.num_area_i ? (parseFloat(p.num_area_t||p.num_area_i||0)).toLocaleString('pt-BR',{maximumFractionDigits:2}) : null)}
    ${_carDetField('Status', `<span style="display:inline-flex;align-items:center;gap:4px;background:${cor}15;color:${cor};border:1px solid ${cor}40;border-radius:99px;padding:2px 10px;font-size:11px;font-weight:700">${escHtml(p.condicao||p.ind_status||'—')}</span>`)}
    ${_carDetField('CPF/CNPJ', _mascarar(p.cpf_cnpj_p||p.CPF_CNPJ_P))}
    ${_carDetField('Tipo', p.cod_tipo||p.tipo_imovel)}
  `;
  panel.classList.add('aberto');
  _carAbertoCod=p.cod_imovel;
}
function _carDetField(lbl,val){ if(!val&&val!==0) return ''; return `<div class="car-det-field"><div class="car-det-label">${escHtml(lbl)}</div><div class="car-det-value">${val}</div></div>`; }
function _mascarar(v){ if(!v) return '—'; const d=String(v).replace(/\D/g,''); if(d.length<6) return d; return d.slice(0,3)+'*'.repeat(d.length-5)+d.slice(-2); }
function fecharDetalhesCAR(){ document.getElementById('car-det-panel').classList.remove('aberto'); _carAbertoCod=null; }
_iniciarResizeCAR();
function _iniciarResizeCAR(){
  const handle=document.getElementById('car-resize'); if(!handle) return setTimeout(_iniciarResizeCAR,200);
  const panel=document.getElementById('car-det-panel');
  let dragging=false, startX=0, startW=0;
  handle.addEventListener('mousedown',e=>{ dragging=true; startX=e.clientX; startW=panel.offsetWidth; handle.classList.add('dragging'); e.preventDefault(); });
  document.addEventListener('mousemove',e=>{ if(!dragging) return; const w=Math.max(280,Math.min(680,startW-(e.clientX-startX))); panel.style.width=w+'px'; });
  document.addEventListener('mouseup',()=>{ dragging=false; handle.classList.remove('dragging'); });
}

// ── Helpers de zonas por UC ───────────────────────────────────────────────────

function _zonasParaUC(ucNome){
  if(!_zonasGeojson) return [];
  return [...new Set(
    (_zonasGeojson.features||[])
      .filter(f => f.properties.uc_nome === ucNome)
      .map(f => f.properties.zona_codigo)
  )];
}

function _preencherZonaSection(section, ucNome){
  const conteudo = section.querySelector('.uc-zona-popup-conteudo');
  const body     = section.querySelector('.uc-zona-popup-body');
  if(!conteudo) return;

  // Sem zonas nem GeoJSON → mostra botão carregar
  if(!_zonasGeojson){
    conteudo.innerHTML = `<button class="zona-btn-carregar" style="background:#f0fdf4;border:1px solid #86efac;color:#166534;border-radius:6px;padding:4px 12px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;width:100%">
      ⬇ Carregar zonas de manejo
    </button>`;
    conteudo.querySelector('.zona-btn-carregar').addEventListener('click', async () => {
      await toggleZonas(true);
      const cb = document.getElementById('zonas-toggle');
      if(cb) cb.checked = true;
      _preencherZonaSection(section, ucNome); // re-renderiza após carregar
    });
    return;
  }

  const zonas = _zonasParaUC(ucNome);

  // UC sem zonas → oculta seção inteira
  if(!zonas.length){
    section.style.display = 'none';
    return;
  }

  // UC com zonas → monta checkboxes
  section.style.display = '';
  const sel = _zonasSelecaoPorUC[ucNome] || new Set(zonas);
  const todasAtivas = zonas.every(z => sel.has(z));

  const wrap = document.createElement('div');

  // Checkbox "Selecionar todas"
  const lblTodas = document.createElement('label');
  lblTodas.style.cssText = 'display:flex;align-items:center;gap:6px;padding:3px 0 5px;border-bottom:1px solid #f3f4f6;cursor:pointer;font-weight:600;color:#374151;margin-bottom:2px';
  const cbTodas = document.createElement('input');
  cbTodas.type = 'checkbox'; cbTodas.checked = todasAtivas;
  cbTodas.style.cssText = 'accent-color:#1F4E2C;width:12px;height:12px;cursor:pointer';
  cbTodas.addEventListener('change', () => {
    if(!_zonasSelecaoPorUC[ucNome]) _zonasSelecaoPorUC[ucNome] = new Set(zonas);
    _zonasSelecaoPorUC[ucNome] = cbTodas.checked ? new Set(zonas) : new Set();
    wrap.querySelectorAll('[data-zona-cb]').forEach(cb => cb.checked = cbTodas.checked);
  });
  lblTodas.append(cbTodas, 'Selecionar todas');
  wrap.appendChild(lblTodas);

  // Checkboxes individuais
  zonas.forEach(cod => {
    const meta = ZONA_META[cod] || {nome: cod, cor:'#6b7280'};
    const lbl  = document.createElement('label');
    lbl.style.cssText = 'display:flex;align-items:center;gap:6px;padding:2px 0;cursor:pointer;color:#374151';
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = sel.has(cod);
    cb.dataset.zonaCb = cod;
    cb.style.cssText = `accent-color:${meta.cor};width:11px;height:11px;cursor:pointer;flex-shrink:0`;
    cb.addEventListener('change', () => {
      if(!_zonasSelecaoPorUC[ucNome]) _zonasSelecaoPorUC[ucNome] = new Set(zonas);
      cb.checked ? _zonasSelecaoPorUC[ucNome].add(cod) : _zonasSelecaoPorUC[ucNome].delete(cod);
      cbTodas.checked = zonas.every(z => _zonasSelecaoPorUC[ucNome].has(z));
    });
    const dot = document.createElement('div');
    dot.style.cssText = `width:10px;height:10px;border-radius:2px;background:${meta.cor};flex-shrink:0`;
    const txt = document.createElement('span');
    txt.style.fontSize = '11px'; txt.textContent = meta.nome;
    lbl.append(cb, dot, txt);
    wrap.appendChild(lbl);
  });

  // Botão Aplicar
  const btnDiv = document.createElement('div');
  btnDiv.style.cssText = 'margin-top:6px;padding-top:4px;border-top:1px solid #f3f4f6';
  const btn = document.createElement('button');
  btn.textContent = 'Aplicar filtro';
  btn.style.cssText = 'width:100%;background:#1F4E2C;color:#fff;border:none;border-radius:6px;padding:5px 0;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit';
  btn.addEventListener('click', () => {
    // Filtra APENAS esta UC
    _zonasFiltroUC = ucNome;
    const selEl = document.getElementById('zonas-sel-uc');
    if(selEl) selEl.value = ucNome;
    if(!_zonasAtivo){
      toggleZonas(true);
      const c = document.getElementById('zonas-toggle');
      if(c) c.checked = true;
    } else {
      _renderizarZonas();
    }
    btn.textContent = '✓ Aplicado!';
    setTimeout(() => btn.textContent = 'Aplicar filtro', 1500);
  });
  btnDiv.appendChild(btn);
  wrap.appendChild(btnDiv);

  conteudo.innerHTML = '';
  conteudo.appendChild(wrap);
}

// ══════════════════════════════════════════════════════════════
// SCROLLBAR CUSTOMIZADA DO PAINEL
// ══════════════════════════════════════════════════════════════
function initScrollbarCustom(){
  const outer=document.getElementById('mapa-scrollbar-outer');
  const thumb=document.getElementById('mapa-scrollbar-thumb');
  const painel=document.getElementById('mapa-painel');
  if(!outer||!thumb||!painel) return;
  function atualizar(){
    const ratio=painel.clientHeight/painel.scrollHeight;
    if(ratio>=1){ outer.style.display='none'; return; }
    outer.style.display='';
    const thumbH=Math.max(24,outer.clientHeight*ratio);
    thumb.style.height=thumbH+'px';
    const maxTop=outer.clientHeight-thumbH;
    thumb.style.top=(painel.scrollTop/(painel.scrollHeight-painel.clientHeight)*maxTop)+'px';
  }
  painel.addEventListener('scroll',atualizar);
  new ResizeObserver(atualizar).observe(painel);
  atualizar();
  let drag=false, startY=0, startScroll=0;
  thumb.addEventListener('mousedown',e=>{ drag=true; startY=e.clientY; startScroll=painel.scrollTop; e.preventDefault(); });
  document.addEventListener('mousemove',e=>{ if(!drag) return; const dy=e.clientY-startY; const ratio=(painel.scrollHeight-painel.clientHeight)/(outer.clientHeight-thumb.offsetHeight||1); painel.scrollTop=startScroll+dy*ratio; });
  document.addEventListener('mouseup',()=>{ drag=false; });
  outer.addEventListener('click',e=>{ if(e.target===thumb) return; const rect=outer.getBoundingClientRect(); const clickRatio=(e.clientY-rect.top)/outer.clientHeight; painel.scrollTop=clickRatio*(painel.scrollHeight-painel.clientHeight); });
}
