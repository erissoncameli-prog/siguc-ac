<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SIGUC-AC · Painel Público da Qualidade da Água</title>
<meta name="description" content="Painel público da Qualidade da Água dos rios do Acre — IQA, conformidade CONAMA e exportação em PDF/PPTX. Secretaria de Estado de Meio Ambiente do Acre.">
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/agua-painel.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="../js/observability.js"></script>
<script src="../js/queryLogger.js"></script>
<script src="../js/config.js"></script>
<script src="../js/agua-iqa-visual.js"></script>
<script src="../js/agua-relatorio-dados.js"></script>
<script src="../js/agua-painel.js"></script>
<script src="../js/biomonitor-pdf-fonts.js"></script>
<script src="../js/relatorio-cabecalho-pdf.js"></script>
<script src="../js/agua-relatorio-pdf.js"></script>
<script src="../js/agua-relatorio-pptx.js"></script>
<script src="../js/agua-relatorio-xlsx.js"></script>
<style>
/* Os cards do painel (.adash-*/.adet-*) vêm de css/agua-painel.css —
   a MESMA folha de pages/agua-relatorios.html e pages/rh-bacias.html,
   nunca copiada aqui. Só a MOLDURA é própria desta tela: sem sidebar
   (página autônoma, sem sessão), com cabeçalho/rodapé institucional
   (.apub-*). */

/* ── Moldura pública: cabeçalho institucional + faixa + rodapé ────── */
body { background:var(--cinza-50) }
.apub-topo {
  background:#164070; color:#fff; padding:16px 24px;
  display:flex; align-items:center; gap:16px;
}
.apub-topo img { height:40px; width:auto; object-fit:contain; flex-shrink:0 }
.apub-topo-tit { flex:1; min-width:0 }
.apub-topo-tit strong { display:block; font-size:14.5px; font-weight:700 }
.apub-topo-tit span { display:block; font-size:11.5px; opacity:.72; margin-top:1px }

.apub-faixa {
  background:#2563A8; color:#fff; padding:22px 24px 26px; text-align:center;
}
.apub-faixa h1 { font-family:'Source Serif 4', Georgia, serif; font-size:26px; margin:0 0 6px; font-weight:700 }
.apub-faixa p { font-size:13px; opacity:.88; max-width:60ch; margin:0 auto }

.apub-content { max-width:1400px; margin:0 auto; width:100%; padding:24px 28px }

.apub-rodape {
  border-top:1px solid var(--borda); margin-top:24px; padding:20px 28px 32px;
  max-width:1400px; margin-left:auto; margin-right:auto;
  display:flex; flex-wrap:wrap; gap:8px 20px; justify-content:space-between; align-items:center;
  font-size:11.5px; color:var(--cinza-500);
}
.apub-rodape a { color:#2563A8; text-decoration:none; font-weight:600 }
.apub-rodape a:hover { text-decoration:underline }

.apub-carregando { text-align:center; padding:80px 20px; color:var(--cinza-500); font-size:13px }

@media (max-width: 1180px) {
  .adash-grid { grid-template-columns:1fr 1fr }
  .adash-span2 { grid-column:span 2 }
}
@media (max-width: 760px) {
  .adash-grid { grid-template-columns:1fr }
  .adash-span2, .adash-span3 { grid-column:span 1 }
  .adash-head-acoes { margin-left:0; width:100% }
  .adash-barras { flex-direction:column }
  .adash-barras-resumo { flex:none }
  .adash-tabela-linha { grid-template-columns:1.4fr .8fr; row-gap:2px }
  .adash-mapa-wrap { height:280px }
  .apub-content { padding:16px 14px }
  .apub-topo { padding:12px 16px }
  .apub-faixa { padding:18px 16px 22px }
}
</style>
</head>
<body>
<div id="app"><div class="apub-carregando">Carregando painel...</div></div>
<script>
;(async function () {
  // Página PÚBLICA e AUTÔNOMA — de propósito, sem carregarUsuario(),
  // sem gerarLayout(), sem gate de LGPD/perfil (esses só existem
  // dentro de carregarUsuario(), nunca chamada aqui). O acesso a dado
  // é decidido no banco (RPCs agua_publico_*, SECURITY DEFINER —
  // migration 297), não por sessão: com `db` sem sessão (anon), as
  // três RPCs respondem e a tabela/view internas continuam bloqueadas
  // por RLS, como confirmado ao aplicar a migration.
  await _dbReady
  if (!db) {
    document.getElementById('app').innerHTML = '<div class="apub-carregando">Não foi possível conectar ao banco de dados. Tente novamente em instantes.</div>'
    return
  }

  document.getElementById('app').innerHTML = `
    <div class="apub-topo">
      <img id="apub-logo-gov" alt="" hidden>
      <div class="apub-topo-tit"><strong>Governo do Estado do Acre</strong><span>Secretaria de Estado de Meio Ambiente — SEMA-AC</span></div>
      <img id="apub-logo-secr" alt="" hidden>
    </div>
    <div class="apub-faixa">
      <h1>Qualidade da Água dos Rios do Acre</h1>
      <p>Índice de Qualidade da Água (IQA) e conformidade com os limites do CONAMA, por bacia hidrográfica e ponto de coleta — dado público, atualizado conforme as campanhas de campo da SEMA-AC.</p>
    </div>
    <div class="apub-content">
      <div class="fade-in adash">
        <div class="adash-head">
          <div>
            <h1 class="adash-titulo">Painel da Qualidade da Água</h1>
            <p class="adash-sub">Panorama do Acre inteiro ou de uma bacia hidrográfica, no recorte de campanhas
              escolhido — por padrão, todo o período disponível. IQA e conformidade CONAMA vêm prontos do
              banco — nunca recalculados aqui — e coleta em conferência aparece marcada, nunca escondida.</p>
          </div>
          <div class="adash-head-acoes">
            <div class="adash-pill adash-pill-select">
              <select id="rl-bacia" aria-label="Bacia hidrográfica"><option value="">Carregando...</option></select>
              <span class="adash-chev" data-icon="chevron-down"></span>
            </div>
            <button class="adash-pill" type="button" onclick="alternarExplicacaoIqa()" data-icon="help">Entenda o cálculo</button>
            <button class="adash-pill" id="rl-btn-filtros" type="button" onclick="alternarFiltros()" data-icon="sliders">
              Filtros <span class="adash-pill-n" id="rl-filtros-n" hidden>0</span>
            </button>
            <div class="adash-export">
              <button class="adash-pill adash-pill-primary" id="rl-btn-export" type="button" onclick="alternarExport()" disabled data-icon="download">Exportar</button>
              <div class="adash-menu" id="rl-export-menu" hidden>
                <button type="button" id="rl-btn-pdf" onclick="gerarPdf()" data-icon="file-text">Relatório em PDF</button>
                <button type="button" id="rl-btn-pptx" onclick="gerarPptx()" data-icon="monitor">Apresentação em PPTX</button>
                <button type="button" id="rl-btn-xlsx" onclick="gerarXlsx()" data-icon="table">Planilha Excel (.xlsx)</button>
              </div>
            </div>
          </div>
        </div>

        <div class="adash-filtros" id="rl-filtros" hidden>
          <label>Bacia<select id="rl-bacia-filtro" disabled><option value="">Todas</option></select></label>
          <label>Campanha inicial<select id="rl-de" disabled><option value="">—</option></select></label>
          <label>Campanha final<select id="rl-ate" disabled><option value="">—</option></select></label>
          <label>Rio<select id="rl-rio" disabled><option value="">Todos</option></select></label>
          <label>Status<select id="rl-status" disabled><option value="">Todos</option></select></label>
          <label>Faixa do IQA<select id="rl-iqa-faixa" disabled><option value="">Todas</option></select></label>
          <label>Conformidade CONAMA<select id="rl-conama" disabled><option value="">Todas</option></select></label>
          <button type="button" class="adash-filtros-limpar" onclick="limparFiltrosBusca()">Limpar filtros</button>
        </div>

        <div class="adash-card adash-mapa-card">
          <div class="adash-card-topo">
            <div><p class="adash-card-tit">Mapa dos pontos de coleta</p>
              <p class="adash-card-tit-sub" id="rl-mapa-sub">Carregando pontos...</p></div>
            <span class="adash-card-mais">•••</span>
          </div>
          <div class="adash-mapa-wrap"><div id="rl-mapa"></div></div>
        </div>

        <div id="rl-conteudo"><div class="adash-vazio">Carregando painel...</div></div>
      </div>
    </div>
    <div class="apub-rodape">
      <span>Fonte: SEMA-AC / DIMA — Sistema de Gestão de Unidades de Conservação do Acre (SIGUC-AC). Coleta em conferência aparece marcada, nunca escondida.</span>
      <a href="privacidade.html" target="_blank" rel="noopener">Política de Privacidade</a>
    </div>
    <div class="modal-overlay" id="rl-iqa-modal"><div class="modal" style="max-width:560px">${aguaPainelExplicacaoIqaHTML()}</div></div>
    <div class="modal-overlay" id="adet-modal"><div class="modal" id="adet-modal-inner" style="max-width:600px"></div></div>`

  bIconsAplicar(document.getElementById('app'))

  window.alternarExplicacaoIqa = function () {
    document.getElementById('rl-iqa-modal').classList.toggle('aberto')
  }

  // ── Detalhe do ponto (popup ao clicar no pino) ──────────────────
  // Mesmo renderer de pages/agua-relatorios.html (js/agua-painel.js);
  // exportação usa o cabeçalho e o protocolo fixo já lidos para o PDF
  // por bacia (_cab/PROTOCOLO_PUBLICO, mais abaixo) — nunca chama
  // gerar_protocolo_relatorio() aqui (regra da Fase pública).
  let _coletaDetalheAtual = null
  window.abrirDetalheColetaPainel = function (ponto, coleta) {
    _coletaDetalheAtual = coleta
    document.getElementById('adet-modal-inner').innerHTML = aguaPainelColetaDetalheHTML(ponto, coleta)
    document.getElementById('adet-modal').classList.add('aberto')
    bIconsAplicar(document.getElementById('adet-modal-inner'))
  }
  window.fecharDetalheColetaPainel = function () {
    document.getElementById('adet-modal').classList.remove('aberto')
  }
  window.exportarFichaColetaPainel = async function () {
    if (!_coletaDetalheAtual || !_cab) return
    const btn = document.getElementById('adet-btn-exportar')
    if (btn) { btn.disabled = true; btn.textContent = 'Gerando...' }
    try {
      const pdf = await aguaRelMontarPdfColeta(_coletaDetalheAtual, _cab, PROTOCOLO_PUBLICO)
      aguaRelBaixarPdf(pdf, `iqa-${(_coletaDetalheAtual.ponto_nome || 'ponto').toLowerCase().replace(/[^a-z0-9]+/g, '-')}-${_coletaDetalheAtual.data_coleta || ''}.pdf`)
    } catch (e) {
      console.error(e); alert('Não foi possível gerar o PDF: ' + e.message)
    } finally {
      if (btn) { btn.disabled = false; btn.innerHTML = ''; btn.setAttribute('data-icon', 'download'); btn.appendChild(document.createTextNode('Exportar PDF')); bIconsAplicar(btn) }
    }
  }

  const sel = id => document.getElementById(id)

  // ── Cabeçalho institucional (logos exibidas + timbre do PDF/PPTX) ──
  let _cab = null
  try {
    const { data, error } = await db.rpc('agua_publico_cabecalho')
    if (error) throw error
    _cab = data || {}
    if (_cab.logoGoverno) { const img = sel('apub-logo-gov'); img.src = _cab.logoGoverno; img.alt = 'Governo do Acre'; img.hidden = false }
    if (_cab.logoSecr) { const img = sel('apub-logo-secr'); img.src = _cab.logoSecr; img.alt = 'SEMA-AC'; img.hidden = false }
  } catch (e) {
    console.warn('[agua-publico] cabeçalho institucional indisponível:', e.message)
  }

  // ── Mapa ───────────────────────────────────────────────────────
  const _mapaPainelCtl = aguaPainelMapaCriar('rl-mapa', 'rl-mapa-sub')
  let _pontosGeomPorId = {}
  try {
    const { data, error } = await db.rpc('agua_publico_pontos')
    if (error) throw error
    ;(data || []).forEach(p => { if (p.lat != null && p.lng != null) _pontosGeomPorId[p.id] = [p.lat, p.lng] })
  } catch (e) {
    console.warn('[agua-publico] pontos (coordenadas) indisponíveis:', e.message)
  }
  function atualizarMapaPainel(rel) { _mapaPainelCtl.atualizar(rel, _pontosGeomPorId, (ponto, coleta) => window.abrirDetalheColetaPainel(ponto, coleta)) }

  // ── Todas as coletas públicas, buscadas UMA vez ───────────────────
  // A RPC não filtra por bacia (ao contrário de aguaRelBuscarColetasDaBacia,
  // usada pela tela de mesa) — o recorte por bacia é sempre client-side,
  // via `opts.bacia` de aguaRelMontar, mesmo caminho que "Acre todo" já
  // usa na tela de mesa. Menos ida ao banco, mesmo resultado.
  let _todasColetas = []
  try {
    const { data, error } = await db.rpc('agua_publico_coletas')
    if (error) throw error
    _todasColetas = data || []
  } catch (e) {
    sel('rl-conteudo').innerHTML = `<div class="adash-vazio">Erro ao carregar coletas: ${esc(e.message)}</div>`
    return
  }

  let _relatorioAtual = null
  let _labelBaciaAtual = ''
  let _chipCampanha = null
  let _pontoSerie = null
  let _filtrosAbertos = false

  const bacias = aguaRelListarBacias(_todasColetas)
  const totalPontos = new Set(_todasColetas.map(c => c.ponto_id)).size
  sel('rl-bacia').innerHTML = `<option value="">Acre todo (${totalPontos} ponto${totalPontos !== 1 ? 's' : ''})</option>` +
    bacias.map(b => `<option value="${esc(b.bacia)}">${esc(b.label)} (${b.nPontos} ponto${b.nPontos !== 1 ? 's' : ''})</option>`).join('')

  sel('rl-status').innerHTML += Object.entries(AGUA_REL_STATUS_LABEL)
    .map(([v, l]) => `<option value="${v}">${esc(l)}</option>`).join('')
  sel('rl-iqa-faixa').innerHTML += AGUA_IQA_FAIXA_ORDEM
    .map(f => `<option value="${esc(f)}">${esc(f)}</option>`).join('')
  sel('rl-conama').innerHTML += Object.entries(AGUA_REL_CONAMA_LABEL)
    .map(([v, l]) => `<option value="${v}">${esc(l)}</option>`).join('')

  sel('rl-bacia').addEventListener('change', aplicarBacia)
  ;['rl-de', 'rl-ate', 'rl-bacia-filtro', 'rl-rio', 'rl-status', 'rl-iqa-faixa', 'rl-conama']
    .forEach(id => sel(id).addEventListener('change', recalcularRelatorio))

  document.addEventListener('click', ev => {
    if (!ev.target.closest('.adash-export')) sel('rl-export-menu').hidden = true
  })

  window.alternarFiltros = function () {
    _filtrosAbertos = !_filtrosAbertos
    sel('rl-filtros').hidden = !_filtrosAbertos
    sel('rl-btn-filtros').classList.toggle('adash-pill-ativo', _filtrosAbertos)
  }
  window.alternarExport = function () {
    const m = sel('rl-export-menu'); m.hidden = !m.hidden
  }

  // Recorta `_todasColetas` pela bacia do cabeçalho (client-side — a
  // RPC já trouxe tudo de uma vez) e repopula os seletores de campanha
  // e rio, exatamente como a tela de mesa faz depois de cada fetch.
  function aplicarBacia() {
    const chave = sel('rl-bacia').value // '' = Acre todo
    _relatorioAtual = null; _chipCampanha = null; _pontoSerie = null
    atualizarBotoes()
    const ehAcreTodo = !chave
    _labelBaciaAtual = ehAcreTodo ? 'Acre (todas as bacias)' : (chave === AGUA_REL_SEM_BACIA ? 'Sem bacia definida' : chave)
    const coletasDaBacia = ehAcreTodo ? _todasColetas : _todasColetas.filter(c => aguaRelChaveBacia(c.ponto_bacia) === chave)

    const campanhas = aguaRelCampanhasDe(coletasDaBacia)
    const opts = campanhas.map(c => `<option value="${c.campanha_id}">${esc(aguaRelLabelCampanha(c))}</option>`).join('')
    sel('rl-de').innerHTML = opts; sel('rl-ate').innerHTML = opts
    if (campanhas.length) {
      sel('rl-de').value = campanhas[0].campanha_id
      sel('rl-ate').value = campanhas[campanhas.length - 1].campanha_id
    }
    sel('rl-rio').innerHTML = '<option value="">Todos</option>' +
      aguaRelRiosDe(coletasDaBacia).map(r => `<option value="${esc(r)}">${esc(r)}</option>`).join('')

    const camposBacia = sel('rl-bacia-filtro')
    if (ehAcreTodo) {
      camposBacia.innerHTML = '<option value="">Todas</option>' +
        aguaRelListarBacias(_todasColetas).map(b => `<option value="${esc(b.bacia)}">${esc(b.label)}</option>`).join('')
      camposBacia.value = ''
      camposBacia.disabled = false
    } else {
      camposBacia.innerHTML = '<option value="">Todas</option>'
      camposBacia.value = ''
      camposBacia.disabled = true
    }

    sel('rl-status').value = ''; sel('rl-iqa-faixa').value = ''; sel('rl-conama').value = ''
    ;['rl-de', 'rl-ate', 'rl-rio', 'rl-status', 'rl-iqa-faixa', 'rl-conama'].forEach(id => { sel(id).disabled = false })
    recalcularRelatorio()
  }

  function recalcularRelatorio() {
    const chave = sel('rl-bacia').value
    const ehAcreTodo = !chave
    const coletasDaBacia = ehAcreTodo ? _todasColetas : _todasColetas.filter(c => aguaRelChaveBacia(c.ponto_bacia) === chave)
    _relatorioAtual = aguaRelMontar(coletasDaBacia, {
      campanhaDeId: sel('rl-de').value || null,
      campanhaAteId: sel('rl-ate').value || null,
      bacia: sel('rl-bacia-filtro').disabled ? null : (sel('rl-bacia-filtro').value || null),
      rio: sel('rl-rio').value || null,
      status: sel('rl-status').value || null,
      iqaFaixa: sel('rl-iqa-faixa').value || null,
      conamaStatus: sel('rl-conama').value || null,
    })
    const ids = new Set(_relatorioAtual.campanhas.map(c => c.campanha_id))
    if (_chipCampanha && !ids.has(_chipCampanha)) _chipCampanha = null
    if (_pontoSerie && !_relatorioAtual.pontos.some(p => p.ponto_id === _pontoSerie)) _pontoSerie = null
    renderPainel(_relatorioAtual)
    atualizarMapaPainel(_relatorioAtual)
    atualizarBotoes()
  }

  window.limparFiltrosBusca = function () {
    sel('rl-bacia-filtro').value = ''; sel('rl-rio').value = ''; sel('rl-status').value = ''
    sel('rl-iqa-faixa').value = ''; sel('rl-conama').value = ''
    recalcularRelatorio()
  }
  window.selecionarChipCampanha = function (id) { _chipCampanha = id || null; renderPainel(_relatorioAtual) }
  window.selecionarPontoSerie = function (id) { _pontoSerie = id || null; renderPainel(_relatorioAtual) }

  function labelBaciaExportacao() {
    const f = _relatorioAtual && _relatorioAtual.filtros.bacia
    if (f) return f === AGUA_REL_SEM_BACIA ? 'Sem bacia definida' : f
    return _labelBaciaAtual
  }

  function atualizarBotoes() {
    const tem = !!(_relatorioAtual && _relatorioAtual.coletas.length)
    sel('rl-btn-export').disabled = !tem
    sel('rl-btn-pdf').disabled = !tem
    sel('rl-btn-pptx').disabled = !tem
    sel('rl-btn-xlsx').disabled = !tem
    if (!tem) sel('rl-export-menu').hidden = true
    const nFiltros = _relatorioAtual
      ? Object.values(_relatorioAtual.filtros).filter(Boolean).length : 0
    const chip = sel('rl-filtros-n')
    chip.hidden = nFiltros === 0
    chip.textContent = nFiltros
  }

  function renderPainel(rel) {
    sel('rl-conteudo').innerHTML = aguaPainelHTML(rel, { chipCampanha: _chipCampanha, pontoSerie: _pontoSerie, baseLegal: _cab?.baseLegal })
    bIconsAplicar(sel('rl-conteudo'))
  }

  function periodoTxt(rel) {
    if (!rel.campanhas.length) return 'Sem campanhas no período'
    const ini = aguaRelLabelCampanha(rel.campanhas[0])
    const fim = aguaRelLabelCampanha(rel.campanhas[rel.campanhas.length - 1])
    return ini === fim ? ini : `${ini} — ${fim}`
  }

  // Sem protocolo institucional: gerar_protocolo_relatorio() incrementa
  // uma sequência compartilhada por TODOS os relatórios do sistema —
  // não é apropriado deixar visitante anônimo incrementá-la a cada
  // exportação (ver migration 297). O rodapé do documento público usa
  // um texto fixo no lugar do número de protocolo.
  const PROTOCOLO_PUBLICO = 'Acesso público — não protocolado'

  function nomeArquivo() {
    return `qualidade-agua-${labelBaciaExportacao()}`.toLowerCase()
      .normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w-]+/g, '-')
  }

  window.gerarPdf = async function () {
    if (!_relatorioAtual || !_cab) return
    sel('rl-export-menu').hidden = true
    const btn = sel('rl-btn-pdf')
    btn.disabled = true; const htmlOrig = btn.innerHTML
    btn.textContent = 'Gerando PDF...'
    try {
      const pdf = await aguaRelMontarPdf(_relatorioAtual, labelBaciaExportacao(), periodoTxt(_relatorioAtual), _cab, PROTOCOLO_PUBLICO)
      aguaRelBaixarPdf(pdf, `${nomeArquivo()}.pdf`)
      toast('PDF gerado.', 'success')
    } catch (e) {
      toast('Erro ao gerar PDF: ' + e.message, 'error')
    } finally {
      btn.disabled = false; btn.innerHTML = htmlOrig; bIconsAplicar(btn)
    }
  }

  window.gerarPptx = async function () {
    if (!_relatorioAtual) return
    sel('rl-export-menu').hidden = true
    const btn = sel('rl-btn-pptx')
    btn.disabled = true; const htmlOrig = btn.innerHTML
    btn.textContent = 'Gerando PPTX...'
    try {
      const blob = await aguaRelMontarPptx(_relatorioAtual, labelBaciaExportacao(), periodoTxt(_relatorioAtual), PROTOCOLO_PUBLICO)
      aguaRelBaixarPptx(blob, `${nomeArquivo()}.pptx`)
      toast('PPTX gerado.', 'success')
    } catch (e) {
      toast('Erro ao gerar PPTX: ' + e.message, 'error')
    } finally {
      btn.disabled = false; btn.innerHTML = htmlOrig; bIconsAplicar(btn)
    }
  }

  window.gerarXlsx = async function () {
    if (!_relatorioAtual || !_cab) return
    sel('rl-export-menu').hidden = true
    const btn = sel('rl-btn-xlsx')
    btn.disabled = true; const htmlOrig = btn.innerHTML
    btn.textContent = 'Gerando planilha...'
    try {
      const buffer = await aguaRelMontarXlsx(_relatorioAtual, labelBaciaExportacao(), periodoTxt(_relatorioAtual), _cab, PROTOCOLO_PUBLICO)
      aguaRelBaixarXlsx(buffer, `${nomeArquivo()}.xlsx`)
      toast('Planilha gerada.', 'success')
    } catch (e) {
      toast('Erro ao gerar a planilha: ' + e.message, 'error')
    } finally {
      btn.disabled = false; btn.innerHTML = htmlOrig; bIconsAplicar(btn)
    }
  }

  // Boot: escopo padrão = Acre todo, carregado de cara.
  aplicarBacia()
})()
</script>
</body>
</html>
