<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SIGUC-AC · Alertas Ambientais</title>
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/observability.js"></script>

<script src="../js/config.js"></script>

<style>
.alerta-wrapper { display:flex; flex-direction:column; gap:12px; height:calc(100vh - 108px); min-height:500px; }
.alerta-topbar  { display:flex; align-items:center; gap:8px; flex-wrap:wrap; flex-shrink:0; }
.alerta-body    { display:flex; gap:12px; flex:1; min-height:0; }
#alerta-mapa    { flex:1; border-radius:var(--raio-lg); border:1px solid var(--borda); z-index:0; }
.alerta-painel  { width:300px; flex-shrink:0; display:flex; flex-direction:column; gap:8px; overflow-y:auto; }

/* KPI cards */
.kpi-row  { display:flex; gap:8px; flex-shrink:0; }
.kpi-card { flex:1; background:#fff; border:1px solid var(--borda); border-radius:10px; padding:10px 14px; text-align:center; }
.kpi-val  { font-size:22px; font-weight:800; color:#1F4E2C; line-height:1; }
.kpi-lbl  { font-size:10px; color:#9CA3AF; text-transform:uppercase; letter-spacing:.06em; margin-top:3px; }
.kpi-card.critica .kpi-val { color:#DC2626; }
.kpi-card.alta    .kpi-val { color:#F97316; }

/* Lista de alertas */
.alerta-item {
  background:#fff; border:1px solid var(--borda); border-radius:8px;
  padding:10px 12px; cursor:pointer; transition:border-color .15s;
  border-left:4px solid #E5E7EB;
}
.alerta-item:hover { border-color:var(--verde-c); }
.alerta-item.sev-critica { border-left-color:#DC2626; }
.alerta-item.sev-alta    { border-left-color:#F97316; }
.alerta-item.sev-media   { border-left-color:#F59E0B; }
.alerta-item.sev-baixa   { border-left-color:#059669; }
.alerta-item-header { display:flex; align-items:center; gap:6px; margin-bottom:4px; }
.alerta-item-tipo   { font-size:11px; font-weight:700; color:#374151; flex:1; }
.alerta-item-fonte  { font-size:9px; font-weight:700; background:#EDE9FE; color:#5B21B6; padding:1px 6px; border-radius:20px; }
.alerta-item-uc     { font-size:11px; color:#6B7280; }
.alerta-item-meta   { display:flex; gap:8px; margin-top:4px; font-size:10px; color:#9CA3AF; }

/* Filtros */
.fil-group { background:#fff; border:1px solid var(--borda); border-radius:8px; padding:10px 12px; }
.fil-label  { font-size:10px; font-weight:700; color:#9CA3AF; text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px; }

/* Marcador no mapa */
.alerta-dot { width:12px; height:12px; border-radius:50%; border:2px solid rgba(255,255,255,.8); box-shadow:0 1px 4px rgba(0,0,0,.4); }

/* Painel análise ambiental */
.analise-panel{position:fixed;top:0;right:0;width:420px;height:100vh;background:#fff;z-index:650;display:flex;flex-direction:column;box-shadow:-4px 0 32px rgba(0,0,0,.22);transition:transform .28s cubic-bezier(.4,0,.2,1);overflow:hidden;min-width:300px;max-width:640px;transform:translateX(100%);}
.analise-panel.aberto{transform:translateX(0);}
.analise-tabs-bar{display:flex;border-bottom:1px solid var(--borda);flex-shrink:0;background:#fff;}
.analise-tab{flex:1;padding:10px 0;font-size:12px;font-weight:500;border:none;background:transparent;cursor:pointer;border-bottom:2px solid transparent;color:#6B7280;font-family:'DM Sans',sans-serif;transition:all .15s;}
.analise-tab.ativo{color:#1F4E2C;border-bottom-color:#1F4E2C;}
.analise-tab:hover:not(.ativo){background:#f9fafb;}
.analise-body{flex:1;overflow-y:auto;padding:14px 16px;}
</style>
</head>
<body>
<div id="app"></div>
<div id="analise-overlay" onclick="fecharAnalise()" style="display:none;position:fixed;inset:0;z-index:640;background:rgba(0,0,0,.2)"></div>
<div id="analise-panel" class="analise-panel">
  <div id="analise-header"></div>
  <div class="analise-tabs-bar">
    <button class="analise-tab ativo" id="atab-prodes" onclick="tabAnalise('prodes')">🌳 PRODES</button>
    <button class="analise-tab" id="atab-focos" onclick="tabAnalise('focos')">🔥 Focos</button>
    <button class="analise-tab" id="atab-legal" onclick="tabAnalise('legal')">⚖ Legal</button>
  </div>
  <div id="analise-body" class="analise-body"></div>
</div>

<script>
const COR_SEV   = { critica:'#DC2626', alta:'#F97316', media:'#F59E0B', baixa:'#059669' }
const COR_TIPO  = { queimada:'#DC2626', desmatamento:'#166534', degradacao:'#92400E' }
const ICONE_TIPO = { queimada:'🔥', desmatamento:'🌳', degradacao:'🍂' }
const LABEL_FONTE = { FIRMS:'FIRMS/NASA', DETER:'DETER/INPE', BDQUEIMADAS:'BDQueimadas', PRODES:'PRODES' }

function _alertaIcone(tipo, severidade) {
  const emoji = ICONE_TIPO[tipo] ?? '⚠'
  const cor   = COR_TIPO[tipo]   ?? '#6B7280'
  const borda = COR_SEV[severidade] ?? '#6B7280'
  const sz    = severidade === 'critica' ? 32 : severidade === 'alta' ? 27 : 22
  return L.divIcon({
    className: '',
    html: `<div style="
      width:${sz}px;height:${sz}px;border-radius:50%;
      background:${cor};border:3px solid ${borda};
      display:flex;align-items:center;justify-content:center;
      font-size:${sz * 0.55}px;line-height:1;
      box-shadow:0 2px 6px rgba(0,0,0,.45);
      cursor:pointer">${emoji}</div>`,
    iconSize: [sz, sz],
    iconAnchor: [sz/2, sz/2],
    popupAnchor: [0, -sz/2 - 4]
  })
}

let _alertas = [], _mapaL = null, _marcadores = [], _perfilUsuario = ''
let _ucGeojsonAlerta = null  // GeoJSON das UCs para cruzamento local

// Algoritmo ray-casting: ponto dentro de polígono (anel de coordenadas)
function _pipRing(pt, ring) {
  let inside = false
  const [x, y] = pt
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [xi, yi] = ring[i], [xj, yj] = ring[j]
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside
  }
  return inside
}

function _pipGeom(pt, geom) {
  if (!geom) return false
  const rings = geom.type === 'Polygon'
    ? geom.coordinates
    : geom.type === 'MultiPolygon'
      ? geom.coordinates.flat(1)
      : []
  // Verifica exterior de cada polígono (ignora buracos para simplicidade)
  return rings.some(r => _pipRing(pt, r))
}

function ucNomeParaCoordenada(lat, lng) {
  if (!_ucGeojsonAlerta?.features) return null
  const pt = [lng, lat]
  const feat = _ucGeojsonAlerta.features.find(f => _pipGeom(pt, f.geometry))
  return feat ? (feat.properties?.nome || feat.properties?.NAME || feat.properties?.name || null) : null
}

async function _carregarUCGeojson() {
  if (_ucGeojsonAlerta) return
  try {
    const r = await fetch('../data/uc_acre.geojson')
    _ucGeojsonAlerta = await r.json()
  } catch {}
}

;(async function () {
  const usuario = await carregarUsuario()
  if (!usuario) { window.location.href = '../index.html'; return }
  _perfilUsuario = usuario.perfil

  document.getElementById('app').innerHTML =
    gerarLayout('Alertas Ambientais', 'alertas-ambientais') +
    `<div class="alerta-wrapper fade-in">

      <!-- Topbar -->
      <div class="alerta-topbar">
        <div style="flex:1">
          <h2 style="margin:0;font-size:17px;font-weight:600;color:var(--cinza-900)">Alertas Ambientais</h2>
          <p style="margin:2px 0 0;font-size:11px;color:var(--cinza-500)">Focos de calor e desmatamento — FIRMS · DETER · BDQueimadas</p>
        </div>
        ${['super_admin','gestor'].includes(usuario.perfil) ? `
        <button id="btn-disparar" class="btn btn-primary" onclick="dispararMonitoramento()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          Monitorar Agora
        </button>` : ''}
      </div>

      <!-- KPIs -->
      <div class="kpi-row" id="kpi-row">
        <div class="kpi-card"><div class="kpi-val" id="kpi-total">—</div><div class="kpi-lbl">Total</div></div>
        <div class="kpi-card critica"><div class="kpi-val" id="kpi-criticos">—</div><div class="kpi-lbl">Críticos</div></div>
        <div class="kpi-card alta"><div class="kpi-val" id="kpi-altos">—</div><div class="kpi-lbl">Altos</div></div>
        <div class="kpi-card"><div class="kpi-val" id="kpi-ucs">—</div><div class="kpi-lbl">UCs afetadas</div></div>
      </div>

      <!-- Body: mapa + painel -->
      <div class="alerta-body">
        <div id="alerta-mapa"></div>

        <div class="alerta-painel">

          <!-- Filtros -->
          <div class="fil-group">
            <div class="fil-label">Período</div>
            <select class="form-control" id="fil-dias" onchange="filtrar()" style="font-size:12px">
              <option value="1">Últimas 24h</option>
              <option value="7" selected>Últimos 7 dias</option>
              <option value="30">Últimos 30 dias</option>
              <option value="0">Todos</option>
            </select>
          </div>

          <div class="fil-group">
            <div class="fil-label">Severidade</div>
            <div style="display:flex;flex-wrap:wrap;gap:4px">
              ${['critica','alta','media','baixa'].map(s => `
              <label style="display:flex;align-items:center;gap:4px;font-size:11px;cursor:pointer">
                <input type="checkbox" checked data-sev="${s}" onchange="filtrar()" style="accent-color:${COR_SEV[s]}">
                <span style="color:${COR_SEV[s]};font-weight:600">${s}</span>
              </label>`).join('')}
            </div>
          </div>

          <div class="fil-group">
            <div class="fil-label">Localização</div>
            <div style="display:flex;flex-direction:column;gap:3px">
              <label style="display:flex;align-items:center;gap:5px;font-size:11px;cursor:pointer">
                <input type="radio" name="fil-loc" value="todos" checked onchange="filtrar()" style="accent-color:#52B788">
                <span>Todos os alertas</span>
              </label>
              <label style="display:flex;align-items:center;gap:5px;font-size:11px;cursor:pointer">
                <input type="radio" name="fil-loc" value="em_uc" onchange="filtrar()" style="accent-color:#52B788">
                <span>🌿 Somente dentro de UCs</span>
              </label>
              <label style="display:flex;align-items:center;gap:5px;font-size:11px;cursor:pointer">
                <input type="radio" name="fil-loc" value="fora_uc" onchange="filtrar()" style="accent-color:#52B788">
                <span>⚠ Somente fora de UCs</span>
              </label>
            </div>
          </div>

          <div class="fil-group">
            <div class="fil-label">Fonte</div>
            <div style="display:flex;flex-direction:column;gap:3px">
              ${[
                ['FIRMS',      '🛰 FIRMS / NASA',        '#7c3aed'],
                ['DETER',      '🌳 DETER / INPE',        '#dc2626'],
                ['BDQUEIMADAS','🔥 BDQueimadas / INPE',  '#ea580c'],
                ['PRODES',     '📊 PRODES / INPE',       '#b45309'],
              ].map(([f, label, cor]) => `
              <label style="display:flex;align-items:center;gap:6px;font-size:11px;cursor:pointer;padding:2px 0">
                <input type="checkbox" checked data-fonte="${f}" onchange="filtrar()" style="accent-color:${cor}">
                <span>${label}</span>
              </label>`).join('')}
            </div>
          </div>

          <!-- Lista -->
          <div style="font-size:10px;font-weight:700;color:#9CA3AF;text-transform:uppercase;letter-spacing:.06em">Registros</div>
          <div id="lista-alertas" style="display:flex;flex-direction:column;gap:6px;overflow-y:auto;flex:1">
            <div style="text-align:center;padding:24px;color:#9CA3AF;font-size:13px">Carregando...</div>
          </div>
        </div>
      </div>
    </div>` +
    '</div></div></div>'

  carregarLogosSidebar()
  iniciarMapa()
  await carregar()
})()

function iniciarMapa() {
  _mapaL = L.map('alerta-mapa', { center: [-9.5, -70.0], zoom: 7 })
  L.tileLayer('https://{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
    maxZoom: 22, subdomains: ['mt0','mt1','mt2','mt3']
  }).addTo(_mapaL)

  // Carregar GeoJSON das UCs como referência
  fetch('../data/uc_acre.geojson').then(r => r.json()).then(gj => {
    L.geoJSON(gj, {
      style: { color:'#52B788', weight:1.5, opacity:.7, fillColor:'#52B788', fillOpacity:.08 }
    }).addTo(_mapaL)
  }).catch(() => {})
}

async function carregar() {
  await _carregarUCGeojson()

  const { data, error } = await db.from('alertas_ambientais')
    .select('*')
    .eq('ativo', true)
    .order('data_deteccao', { ascending: false })
    .limit(500)

  if (error) { toast('Erro ao carregar alertas: ' + error.message, 'error'); return }
  _alertas = data || []
  filtrar()
}

function _alertaEmUC(a) {
  if (a.uc_id || a.uc_nome) return true
  // fallback: cruzamento local pelo GeoJSON
  if (!a.geom) return false
  try {
    let lat, lng
    if (typeof a.geom === 'object' && a.geom.coordinates) {
      lng = a.geom.coordinates[0]; lat = a.geom.coordinates[1]
    } else {
      const m = String(a.geom).match(/POINT\(([^ ]+) ([^ )]+)\)/)
      if (m) { lng = parseFloat(m[1]); lat = parseFloat(m[2]) }
      else return false
    }
    return !!ucNomeParaCoordenada(lat, lng)
  } catch { return false }
}

function filtrar() {
  const dias   = parseInt(document.getElementById('fil-dias').value)
  const sevs   = new Set([...document.querySelectorAll('[data-sev]:checked')].map(e => e.dataset.sev))
  const fontes = new Set([...document.querySelectorAll('[data-fonte]:checked')].map(e => e.dataset.fonte))
  const loc    = document.querySelector('[name="fil-loc"]:checked')?.value ?? 'todos'
  const corte  = dias > 0 ? new Date(Date.now() - dias * 86400000).toISOString() : null

  const filtrados = _alertas.filter(a => {
    if (!sevs.has(a.severidade))  return false
    if (!fontes.has(a.fonte))     return false
    if (corte && a.data_deteccao < corte) return false
    if (loc === 'em_uc'   && !_alertaEmUC(a)) return false
    if (loc === 'fora_uc' &&  _alertaEmUC(a)) return false
    return true
  })

  atualizarKPIs(filtrados)
  renderMarcadores(filtrados)
  renderLista(filtrados)
}

function atualizarKPIs(lista) {
  document.getElementById('kpi-total').textContent = lista.length
  document.getElementById('kpi-criticos').textContent = lista.filter(a => a.severidade === 'critica').length
  document.getElementById('kpi-altos').textContent = lista.filter(a => a.severidade === 'alta').length
  const ucs = new Set(lista.filter(a => a.uc_id).map(a => a.uc_id))
  document.getElementById('kpi-ucs').textContent = ucs.size
}

function renderMarcadores(lista) {
  _marcadores.forEach(m => _mapaL.removeLayer(m))
  _marcadores = []

  lista.forEach(a => {
    if (!a.geom) return
    // geom vem como texto WKT ou objeto — tentamos parsear
    let lat, lng
    try {
      if (a.geom && typeof a.geom === 'object' && a.geom.coordinates) {
        // GeoJSON: {"type":"Point","coordinates":[lng,lat]}
        lng = a.geom.coordinates[0]
        lat = a.geom.coordinates[1]
      } else {
        // WKT fallback: "POINT(lng lat)"
        const m = String(a.geom).match(/POINT\(([^ ]+) ([^ )]+)\)/)
        if (m) { lng = parseFloat(m[1]); lat = parseFloat(m[2]) }
        else return
      }
      if (!lat || !lng) return
    } catch { return }

    const cor      = COR_SEV[a.severidade]  ?? '#6B7280'
    const corTipo  = COR_TIPO[a.tipo]       ?? '#6B7280'
    const ucNome   = a.uc_nome || ucNomeParaCoordenada(lat, lng)
    const coordStr = `${lat.toFixed(5)}, ${lng.toFixed(5)}`
    const marker = L.marker([lat, lng], { icon: _alertaIcone(a.tipo, a.severidade) })

    marker.bindPopup(`
      <div style="font-family:'DM Sans',sans-serif;min-width:200px">
        <div style="background:${corTipo};color:#fff;padding:6px 10px;margin:-7px -11px 8px;border-radius:4px 4px 0 0;font-weight:700;font-size:12px">
          ${ICONE_TIPO[a.tipo] ?? '⚠'} ${a.tipo.charAt(0).toUpperCase()+a.tipo.slice(1)}
        </div>
        <div style="font-size:12px;color:#374151;display:flex;flex-direction:column;gap:3px">
          <div><strong>UC:</strong> ${esc(ucNome ?? 'Fora de UC')}</div>
          <div><strong>Fonte:</strong> ${esc(LABEL_FONTE[a.fonte] ?? a.fonte)}</div>
          <div><strong>Data evento:</strong> ${a.data_referencia}</div>
          ${a.area_ha ? `<div><strong>Área:</strong> ${Number(a.area_ha).toLocaleString('pt-BR')} ha</div>` : ''}
          <div style="font-size:10px;color:#9CA3AF;margin-top:2px">📍 ${coordStr}</div>
          <div style="margin-top:4px;display:flex;gap:5px;align-items:center;flex-wrap:wrap">
            <span style="background:${corTipo}22;color:${corTipo};border:1px solid ${corTipo};border-radius:20px;padding:1px 8px;font-size:10px;font-weight:700">${ICONE_TIPO[a.tipo]??'⚠'} ${a.tipo}</span>
            <span style="background:${cor}22;color:${cor};border:1px solid ${cor};border-radius:20px;padding:1px 8px;font-size:10px;font-weight:700">${a.severidade}</span>
          </div>
          <a href="../pages/mapa.html?alerta_projeto=${encodeURIComponent(a.id)}"
            style="display:block;margin-top:8px;text-align:center;padding:6px 0;background:#1F4E2C;color:#fff;border-radius:6px;font-size:11px;font-weight:600;text-decoration:none;font-family:'DM Sans',sans-serif">
            📐 Abrir Projeto de Análise
          </a>
          <button onclick="_abrirAnaliseAlerta('${a.id}')"
            style="display:block;width:100%;margin-top:5px;padding:5px 0;background:#fff;color:#1F4E2C;border:1.5px solid #1F4E2C;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif">
            🔬 Ver análise ambiental
          </button>
        </div>
      </div>`)

    marker.addTo(_mapaL)
    _marcadores.push(marker)
  })
}

function renderLista(lista) {
  const el = document.getElementById('lista-alertas')
  if (!lista.length) {
    el.innerHTML = `<div style="text-align:center;padding:32px;color:#9CA3AF;font-size:13px">Nenhum alerta no período</div>`
    return
  }
  el.innerHTML = lista.slice(0, 100).map(a => {
    const cor = COR_SEV[a.severidade] ?? '#6B7280'
    return `<div class="alerta-item sev-${a.severidade}" onclick="focarAlerta('${a.id}')">
      <div class="alerta-item-header">
        <span class="alerta-item-tipo">${ICONE_TIPO[a.tipo] ?? '⚠'} ${a.tipo}</span>
        <span class="alerta-item-fonte">${esc(a.fonte)}</span>
      </div>
      <div class="alerta-item-uc">${esc(a.uc_nome ?? 'Fora de UC cadastrada')}</div>
      <div class="alerta-item-meta">
        <span>${a.data_referencia}</span>
        ${a.area_ha ? `<span>· ${Number(a.area_ha).toLocaleString('pt-BR')} ha</span>` : ''}
        <span style="color:${cor};font-weight:700">· ${a.severidade}</span>
      </div>
    </div>`
  }).join('')

  if (lista.length > 100) {
    el.innerHTML += `<div style="text-align:center;font-size:11px;color:#9CA3AF;padding:8px">Exibindo 100 de ${lista.length} alertas</div>`
  }
}

function focarAlerta(id) {
  const a = _alertas.find(x => x.id === id)
  if (!a?.geom) return
  try {
    let lat, lng
    if (a.geom && typeof a.geom === 'object' && a.geom.coordinates) {
      lng = a.geom.coordinates[0]; lat = a.geom.coordinates[1]
    } else {
      const m = String(a.geom).match(/POINT\(([^ ]+) ([^ )]+)\)/)
      if (m) { lng = parseFloat(m[1]); lat = parseFloat(m[2]) }
    }
    if (lat && lng) { _mapaL.setView([lat, lng], 12); _abrirAnaliseAlerta(id) }
  } catch {}
}

// ─── Análise Ambiental de Alertas ───────────────────────────────────────────

let _analiseAberta   = null
let _analiseDados    = null
let _analiseTabAtiva = 'prodes'
const _analiseCache  = {}

function _coordsAlertaAnal(a) {
  try {
    if (a.geom && typeof a.geom === 'object' && a.geom.coordinates)
      return { lng: a.geom.coordinates[0], lat: a.geom.coordinates[1] }
    const m = String(a.geom||'').match(/POINT\(([^ ]+) ([^ )]+)\)/)
    if (m) return { lng: parseFloat(m[1]), lat: parseFloat(m[2]) }
  } catch {}
  return null
}

function _bboxAlerta(a) {
  const coords = _coordsAlertaAnal(a)
  if (!coords) return null
  const { lat, lng } = coords
  const buf = 0.05
  let bbox = [lng - buf, lat - buf, lng + buf, lat + buf]
  if ((a.uc_id || a.uc_nome) && _ucGeojsonAlerta?.features) {
    const nome = a.uc_nome
    const feat = nome ? _ucGeojsonAlerta.features.find(f => {
      const n = f.properties?.nome || f.properties?.NAME || f.properties?.name || ''
      return n === nome || n.toLowerCase().includes(nome.toLowerCase().slice(0, 10))
    }) : null
    if (feat?.geometry) {
      const flat = feat.geometry.type === 'Polygon'
        ? feat.geometry.coordinates.flat(1)
        : feat.geometry.type === 'MultiPolygon'
          ? feat.geometry.coordinates.flat(2)
          : []
      if (flat.length) {
        const lons = flat.map(c => c[0]), lats = flat.map(c => c[1])
        bbox = [Math.min(...lons), Math.min(...lats), Math.max(...lons), Math.max(...lats)]
      }
    }
  }
  return bbox
}

function _geomAreaHa(geometry) {
  const LAT_M = 111200, LON_M = 109800
  const ring = r => {
    let a = 0
    for (let i = 0, j = r.length - 1; i < r.length; j = i++)
      a += (r[j][0] + r[i][0]) * (r[j][1] - r[i][1])
    return Math.abs(a / 2) * LON_M * LAT_M / 10000
  }
  if (!geometry) return 0
  if (geometry.type === 'Polygon')      return ring(geometry.coordinates[0])
  if (geometry.type === 'MultiPolygon') return geometry.coordinates.reduce((s, p) => s + ring(p[0]), 0)
  return 0
}

      <button onclick="fecharAnalise()" style="background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:6px;cursor:pointer;padding:4px 9px;font-size:14px;line-height:1;flex-shrink:0">✕</button>

  document.getElementById('analise-panel').classList.add('aberto')
  tabAnalise('prodes')

  if (_analiseCache[id]) {
    _analiseDados = _analiseCache[id]
    _renderAbaAnalise(_analiseTabAtiva, _analiseDados, a)
    return
  }

  const [pr, fo] = await Promise.allSettled([
    _fetchProdesAlerta(bbox),

  ])

  _analiseDados = {
    prodes: pr.status === 'fulfilled' ? pr.value : { erro: 'Falha na consulta PRODES' },
    focos:  fo.status === 'fulfilled' ? fo.value : { historico:[], recentes:{total:0,focos:[]}, erro:'Falha na consulta' },
    bbox
  }
  _analiseCache[id] = _analiseDados
  _renderAbaAnalise(_analiseTabAtiva, _analiseDados, a)
}

function tabAnalise(tab) {
  _analiseTabAtiva = tab
  ;['prodes','focos','legal'].forEach(t => document.getElementById('atab-'+t)?.classList.toggle('ativo', t===tab))
  if (_analiseAberta && _analiseDados) _renderAbaAnalise(tab, _analiseDados, _analiseAberta)
}

function _renderAbaAnalise(tab, dados, a) {
  const bod = document.getElementById('analise-body')
  if (!bod) return
  if (tab === 'prodes') bod.innerHTML = _htmlProdesAlerta(dados.prodes, a)
  else if (tab === 'focos') bod.innerHTML = _htmlFocosAlerta(dados.focos, dados.prodes)
  else bod.innerHTML = _htmlLegalAlerta(a, dados.prodes)
}

function fecharAnalise() {
  document.getElementById('analise-panel').classList.remove('aberto')
  document.getElementById('analise-overlay').style.display = 'none'
  _analiseAberta = null
  _analiseDados  = null
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharAnalise() })

async function _fetchProdesAlerta(bbox) {
  try {
    const r = await fetch('/api/prodes-proxy', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ bbox }),
      signal: AbortSignal.timeout(30000)
    })
    if (!r.ok) return { erro: `HTTP ${r.status}` }
    return await r.json()
  } catch(e) {
    return { erro: e.name==='TimeoutError' ? 'Tempo limite — servidor INPE pode estar lento. Tente novamente.' : e.message }
  }
}

async function _fetchFocosAlerta(bbox) {
  const [x0,y0,x1,y1] = bbox
  try {
    const r = await fetch(`/api/focos-proxy?minLon=${x0}&minLat=${y0}&maxLon=${x1}&maxLat=${y1}`, {
      signal: AbortSignal.timeout(15000)
    })
    if (!r.ok) return { historico:[], recentes:{total:0,focos:[]}, erro:`HTTP ${r.status}` }
    return await r.json()
  } catch(e) {
    return { historico:[], recentes:{total:0,focos:[]}, erro: e.message }
  }
}

      await carregar()
    } else {
      toast('Erro: ' + (data?.erro ?? 'Falha no monitoramento'), 'error')
    }
  } catch (e) {
    toast('Erro ao disparar: ' + e.message, 'error')
  } finally {
    btn.disabled = false
    btn.textContent = 'Monitorar Agora'
    btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg> Monitorar Agora`
  }
}
</script>
</body>
</html>
