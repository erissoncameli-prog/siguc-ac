<body>
<div id="app"></div>

<script>
;(async function () {
  const usuario = await carregarUsuario()
  if (!usuario) { window.location.href = '../index.html'; return }

  document.getElementById('app').innerHTML =
    gerarLayout('Meus Dados', 'meus-dados') +
    `<div class="fade-in">
      <div class="md-card">
        <p class="md-intro">
          O que o SIGUC-AC guarda sobre você, e o canal para pedir acesso, correção,
          exclusão ou informação sobre compartilhamento — direitos do Art. 18 da LGPD.
          Veja também a <a href="privacidade.html" target="_blank">Política de Privacidade</a> completa.
        </p>
        <div id="lgpd-md-root"></div>
      </div>
    </div>`

  lgpdMontarMeusDados('lgpd-md-root')
})()
</script>
