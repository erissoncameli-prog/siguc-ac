<style>
.rel-topbar { display:flex; gap:10px; flex-wrap:wrap; align-items:center;
              background:var(--branco); border:1px solid var(--borda);
              border-radius:var(--raio-lg); padding:14px 16px; margin-bottom:18px }
.rel-topbar label { font-size:.78rem; font-weight:600; color:var(--cinza-500);
                    text-transform:uppercase; letter-spacing:.05em; margin-right:6px }
.rel-topbar select, .rel-topbar input[type=date] {
  padding:6px 10px; border-radius:7px; border:1.5px solid var(--borda);
  font-size:.84rem; background:var(--branco); font-family:inherit }
.periodo-custom { display:flex; gap:6px; align-items:center }
.chart-card { background:var(--branco); border:1px solid var(--borda);
              border-radius:var(--raio-lg); padding:16px;

               text-transform:uppercase; letter-spacing:.06em; margin-bottom:12px }
.chart-empty { font-size:.82rem; color:var(--cinza-400); padding:8px 0; text-align:center }
.chart-canvas-wrap { position:relative; width:100% }
.chart-grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px }
@media(max-width:820px){ .chart-grid-2{ grid-template-columns:1fr } }
.rel-table { width:100%; border-collapse:collapse; font-size:.82rem }
.rel-table th { padding:8px 10px; text-align:left; font-size:.72rem; font-weight:700;
                color:var(--cinza-500); text-transform:uppercase; letter-spacing:.05em;
                border-bottom:1.5px solid var(--borda); white-space:nowrap; cursor:pointer;
                user-select:none }
.rel-table th:hover { color:var(--floresta) }
.rel-table th.sort-asc::after  { content:' ▲'; font-size:.6rem }
.rel-table th.sort-desc::after { content:' ▼'; font-size:.6rem }
.rel-table td { padding:9px 10px; border-bottom:1px solid var(--cinza-100);
                color:var(--cinza-800) }
.rel-table tr:last-child td { border-bottom:none }
.rel-table tr:hover td { background:var(--cinza-50) }
.rel-table td.num { text-align:right; font-variant-numeric:tabular-nums }

.rank-tab { padding:7px 14px; font-size:.8rem; font-weight:600; border:none; border-radius:8px;

.alerta-item:last-child { border-bottom:none }

.alerta-badge.critico { background:#fee2e2; color:#b91c1c }
.alerta-badge.aviso   { background:#fef3c7; color:#92400e }
.btn-export { display:flex; align-items:center; gap:5px; padding:7px 14px;
              border-radius:8px; border:1.5px solid var(--borda); background:var(--branco);
              font-size:.82rem; font-weight:600; cursor:pointer; color:var(--cinza-700);

.btn-export:hover { background:var(--cinza-50) }

@keyframes skel{ from{background-position:200% 0} to{background-position:-200% 0} }
.link-mapa { color:var(--verde-c); font-size:.78rem; text-decoration:none }
.link-mapa:hover { text-decoration:underline }
</style>

<body>
<div id="app"></div>
<script>
// ════════════════════════════════════════════════════════════════
// Estado global
// ════════════════════════════════════════════════════════════════
let _usuario    = null
let _viagens     = []   // vw_frota_viagens_detalhe no período
let _abastec     = []   // vw_frota_abastecimentos_detalhe no período
let _manutPend   = []   // vw_frota_manutencoes_pendentes (sem filtro de período — estado atual)
let _veiculos    = []   // frota_veiculos
let _motoristas  = []   // frota_motoristas
let _ordensServ  = []   // frota_ordens_servico no período
let _documentos  = []   // frota_veiculo_documentos (vencimento — sem filtro de período)
let _multas      = []   // frota_multas no período (entra no custo total de propriedade)
let _setores     = []   // unidades_organizacionais
let _carregando  = false
let _rankAtivo   = 'veiculos-viagens'

// Rótulos vêm de js/frota-viagens-status.js (definição única). Só a
// paleta da rosca é daqui. 'Não realizada' é cinza ESCURO de propósito:
// separa de 'Cancelada' (#6b7280) por luminosidade, não por matiz — a
// distinção sobrevive a daltonismo.
const STATUS_VIAGEM_LAB = FV_STATUS_LABEL
const STATUS_VIAGEM_COR = {
  solicitada:'#f59e0b', aprovada:'#3B82C4', recusada:'#ef4444',
  em_andamento:'#7c3aed', concluida:'#059669', cancelada:'#6b7280',
  nao_realizada:'#374151',
}
const STATUS_VEIC_LAB = {
  disponivel:'Disponível', em_viagem:'Em viagem', em_manutencao:'Em manutenção',
  cedido:'Cedido', baixado:'Baixado',
}
const STATUS_VEIC_COR = {
  disponivel:'#059669', em_viagem:'#7c3aed', em_manutencao:'#f59e0b',
  cedido:'#3B82C4', baixado:'#6b7280',
}
const TIPO_MANUT_LAB = { preventiva:'Preventiva', corretiva:'Corretiva' }

// ════════════════════════════════════════════════════════════════
// Inicialização
// ════════════════════════════════════════════════════════════════
;(async function () {
  _usuario = await carregarUsuario()
  if (!_usuario) { window.location.href = '../index.html'; return }

  document.getElementById('app').innerHTML =
    gerarLayout('Painel de Frota','frota-dashboard') + htmlPagina()

  document.getElementById('sel-periodo').addEventListener('change', e => {
    const custom = document.getElementById('periodo-custom')
    custom.style.display = e.target.value === 'custom' ? 'flex' : 'none'
    if (e.target.value !== 'custom') carregarDashboard()
  })
  document.getElementById('btn-gerar').addEventListener('click', carregarDashboard)
  document.getElementById('sel-setor').addEventListener('change', carregarDashboard)
  document.getElementById('sel-tipo').addEventListener('change', carregarDashboard)
  document.getElementById('btn-exportar').addEventListener('click', exportarCSV)

  // Delegação: os botões .rank-tab são (re)criados dentro de #dash-conteudo
  // a cada render, então o listener fica no ancestral estável.
  document.getElementById('dash-conteudo').addEventListener('click', e => {
    const t = e.target.closest('.rank-tab')
    if (!t) return
    document.querySelectorAll('.rank-tab').forEach(x => x.classList.remove('ativo'))
    t.classList.add('ativo')
    _rankAtivo = t.dataset.rank
    renderRankings()
  })

  setPeriodoMes()
  await carregarSetores()
  await carregarDashboard()

  if (window._sigucBar) _sigucBarCompleta()
})()

// ════════════════════════════════════════════════════════════════
// HTML estático
// ════════════════════════════════════════════════════════════════

  return `<div class="page-content">
  <div class="page-header" style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px">

      <h1 class="page-title">Painel de Frota</h1>
      <p class="page-subtitle">Visão gerencial de viagens, combustível, manutenção e uso da frota</p>
    </div>
    <button class="btn-export" id="btn-exportar">${bico('download')} Exportar CSV</button>
  </div>

  <div class="rel-topbar">
    <div>
      <label>Período</label>
      <select id="sel-periodo">
        <option value="mes">Mês atual</option>
        <option value="30d">Últimos 30 dias</option>
        <option value="90d">Últimos 90 dias</option>
        <option value="ano">Este ano</option>
        <option value="custom">Personalizado</option>
      </select>
    </div>
    <div class="periodo-custom" id="periodo-custom" style="display:none">
      <input type="date" id="periodo-ini" value="${m1}">
      <span style="font-size:.8rem;color:var(--cinza-400)">até</span>
      <input type="date" id="periodo-fim" value="${m2}">
      <button class="btn btn-sm btn-primary" id="btn-gerar">Gerar</button>
    </div>
    <div>
      <label>Setor</label>
      <select id="sel-setor"><option value="">Todos</option></select>
    </div>
    <div>
      <label>Tipo</label>
      <select id="sel-tipo">
        <option value="">Todos</option>
        <option value="carro">Carro</option>
        <option value="caminhonete">Caminhonete</option>
        <option value="van">Van</option>
        <option value="onibus">Ônibus</option>
        <option value="caminhao">Caminhão</option>
        <option value="motocicleta">Motocicleta</option>
        <option value="quadriciclo">Quadriciclo</option>
        <option value="embarcacao">Embarcação</option>
        <option value="outro">Outro</option>
      </select>
    </div>
    <span id="periodo-label" style="font-size:.82rem;color:var(--cinza-500)"></span>
  </div>

  <div id="dash-loading">
    <div style="display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin-bottom:18px">
      ${Array(8).fill('<div class="skel" style="height:80px;border-radius:10px"></div>').join('')}
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
      ${Array(4).fill('<div class="skel" style="height:200px;border-radius:12px"></div>').join('')}
    </div>
  </div>

  <div id="dash-conteudo" hidden></div>
</div>`
}

// ════════════════════════════════════════════════════════════════
// Período
// ════════════════════════════════════════════════════════════════
function setPeriodoMes() {
  const hoje = new Date()
  const ini  = new Date(hoje.getFullYear(), hoje.getMonth(), 1)
  document.getElementById('periodo-ini').value = ini.toISOString().slice(0,10)
  document.getElementById('periodo-fim').value = hoje.toISOString().slice(0,10)
}

function getPeriodo() {
  const sel  = document.getElementById('sel-periodo').value
  const hoje = new Date()
  let ini, fim = hoje

  if (sel === 'custom') {
    return {
      ini: document.getElementById('periodo-ini').value,
      fim: document.getElementById('periodo-fim').value,
    }
  }
  if (sel === 'mes') ini = new Date(hoje.getFullYear(), hoje.getMonth(), 1)
  if (sel === '30d') ini = new Date(hoje - 30*86400*1000)
  if (sel === '90d') ini = new Date(hoje - 90*86400*1000)
  if (sel === 'ano') ini = new Date(hoje.getFullYear(), 0, 1)
  return { ini: ini.toISOString().slice(0,10), fim: fim.toISOString().slice(0,10) }
}

function exibirPeriodoLabel(ini, fim) {
  const fmt = d => new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'})
  document.getElementById('periodo-label').textContent = `${fmt(ini)} → ${fmt(fim)}`
}

// ════════════════════════════════════════════════════════════════
// Carregamento de dados
// ════════════════════════════════════════════════════════════════
async function carregarSetores() {
  const { data } = await db.from('unidades_organizacionais').select('id,sigla,nome').eq('ativo', true).order('nome')
  _setores = data || []
  const sel = document.getElementById('sel-setor')
  sel.innerHTML = '<option value="">Todos</option>' +
    _setores.map(s => `<option value="${s.id}">${esc(s.sigla || s.nome)}</option>`).join('')
}

async function carregarDashboard() {
  if (_carregando) return
  _carregando = true

  const { ini, fim } = getPeriodo()
  exibirPeriodoLabel(ini, fim)
  const setorId = document.getElementById('sel-setor').value
  const tipo    = document.getElementById('sel-tipo').value

  document.getElementById('dash-loading').hidden = false
  document.getElementById('dash-conteudo').hidden = true

  const iniTs = ini + 'T00:00:00', fimTs = fim + 'T23:59:59'

  const [veicRes, motRes, viagRes, abastRes, osRes, manutRes, docRes, multaRes] = await Promise.all([
    db.from('frota_veiculos').select('id,placa,modelo,tipo,status,setor_id,medidor,ativo').eq('ativo', true),
    db.from('frota_motoristas').select('id,nome,setor_id,status,cnh_validade,habilitacao_fluvial_validade').eq('ativo', true),
    db.from('vw_frota_viagens_detalhe')
      .select('id,status,status_efetivo,motivo_nao_realizacao,veiculo_id,veiculo_placa,veiculo_modelo,veiculo_tipo,veiculo_medidor,motorista_id,motorista_nome,setor_solicitante_id,setor_nome,setor_sigla,solicitante_nome,destino,finalidade,cidade_origem,cidade_destino,data_saida_prevista,data_retorno_prevista,checkout_em,checkin_em,km_saida,km_chegada,horas_saida,horas_chegada,avarias,motivo_recusa,motivo_cancelamento,criado_em,aprovado_em')
      .gte('data_saida_prevista', iniTs).lte('data_saida_prevista', fimTs)
      .order('data_saida_prevista', { ascending: false }).limit(5000),
    db.from('vw_frota_abastecimentos_detalhe')
      .select('id,veiculo_id,placa,modelo,medidor,motorista_id,motorista_nome,data_hora,litros_final,valor_final,tanque_cheio,medida_no_abastecimento,status,contrato_numero,fonte_tipo,fonte_codigo,fonte_descricao,motivo_rejeicao')
      .gte('data_hora', iniTs).lte('data_hora', fimTs)
      .order('data_hora', { ascending: true }).limit(5000),
    // vw_frota_os_detalhe, não frota_ordens_servico: a tabela NÃO tem
    // coluna `custo` (só custo_mao_obra), então o select antigo era
    // rejeitado pelo PostgREST, _ordensServ vinha vazio e TODO o custo
    // de manutenção do painel aparecia como zero. custo_total da view
    // já soma mão de obra + peças.
    db.from('vw_frota_os_detalhe').select('id,veiculo_id,tipo,status,custo_total,custo_pecas,custo_mao_obra,data_abertura,data_conclusao')
      .gte('data_abertura', ini).lte('data_abertura', fim).limit(5000),
    db.from('vw_frota_manutencoes_pendentes').select('*'),
    db.from('frota_veiculo_documentos').select('veiculo_id,tipo,descricao,data_vencimento'),
    db.from('frota_multas').select('id,veiculo_id,valor,status,data_infracao')
      .gte('data_infracao', ini).lte('data_infracao', fim).limit(5000),
  ])

  _veiculos   = veicRes.data   || []
  _motoristas = motRes.data    || []
  _ordensServ = osRes.data     || []
  _manutPend  = manutRes.data  || []
  _documentos = docRes.data    || []
  _multas     = multaRes.data  || []

  // Filtro por setor/tipo — aplicado no cliente (setor pode vir do
  // solicitante da viagem ou da lotação do veículo/motorista)
  let veiculosF = _veiculos
  if (setorId) veiculosF = veiculosF.filter(v => v.setor_id === setorId)
  if (tipo)    veiculosF = veiculosF.filter(v => v.tipo === tipo)
  const idsVeicF = new Set(veiculosF.map(v => v.id))

  _viagens = (viagRes.data || []).filter(v =>
    (!setorId || v.setor_solicitante_id === setorId) &&
    (!tipo || v.veiculo_tipo === tipo)
  )
  _abastec = (abastRes.data || []).filter(a =>
    (!tipo || idsVeicF.has(a.veiculo_id)) && (!setorId || idsVeicF.has(a.veiculo_id))
  )
  if (!setorId && !tipo) _abastec = abastRes.data || []

  _veiculosF = veiculosF

  document.getElementById('dash-loading').hidden = true
  document.getElementById('dash-conteudo').hidden = false
  _carregando = false

  renderDashboard()
}
let _veiculosF = []

// ════════════════════════════════════════════════════════════════
// KPIs
// ════════════════════════════════════════════════════════════════
function kmPercorridoTotal() {
  let km = 0
  _viagens.forEach(v => {
    if (v.veiculo_medidor === 'hodometro' && v.km_saida != null && v.km_chegada != null) {
      km += Math.max(0, Number(v.km_chegada) - Number(v.km_saida))
    }
  })
  return km
}
function horasPercorridoTotal() {
  let h = 0
  _viagens.forEach(v => {
    if (v.veiculo_medidor === 'horimetro' && v.horas_saida != null && v.horas_chegada != null) {
      h += Math.max(0, Number(v.horas_chegada) - Number(v.horas_saida))
    }
  })
  return h
}

// Consumo médio = km total ÷ litros totais, via frotaConsumoVeiculo
// (js/frota-consumo.js) — mesma função da mesa e do app do motorista.
// Só abastecimentos validados, como o resto dos números do dashboard.
// Retorna o objeto do cálculo (ou null) para que o KPI da frota possa
// somar distâncias e litros em vez de tirar média das médias.
function consumoPorVeiculo(veiculoId, medidor) {
  const regs = _abastec.filter(a => a.veiculo_id === veiculoId && a.status === 'validado')
  return frotaConsumoVeiculo(regs, medidor)
}

function renderKpis() {
  const total = _viagens.length
  const concluidas = _viagens.filter(v => fvStatus(v) === 'concluida').length
  const canceladas = _viagens.filter(v => ['cancelada','recusada'].includes(fvStatus(v))).length
  // Aprovadas que nunca saíram (migration 241): veículo e motorista
  // reservados sem deslocamento — desperdício que o painel escondia
  // dentro de "Aprovada".
  const naoRealizadas = _viagens.filter(v => fvStatus(v) === 'nao_realizada').length
  const pctConcl = total ? Math.round(concluidas/total*100) : 0
  const pctCanc  = total ? Math.round(canceladas/total*100) : 0
  const pctNaoRe = total ? Math.round(naoRealizadas/total*100) : 0

  const veicAtivos = _veiculos.length
  const veicDisp   = _veiculos.filter(v => v.status === 'disponivel').length

  const km = kmPercorridoTotal(), horas = horasPercorridoTotal()

  const litrosTotal = _abastec.filter(a=>a.status==='validado').reduce((s,a)=>s+Number(a.litros_final||0),0)
  const valorTotal  = _abastec.filter(a=>a.status==='validado').reduce((s,a)=>s+Number(a.valor_final||0),0)

  const custoManut = _ordensServ.filter(o=>o.status==='concluida').reduce((s,o)=>s+Number(o.custo_total||0),0)

  const manutVencida = _manutPend.filter(m => (m.restante_uso!=null && m.restante_uso<0) || (m.restante_dias!=null && m.restante_dias<0)).length
  const manutProxima = _manutPend.filter(m => (m.restante_dias!=null && m.restante_dias>=0 && m.restante_dias<30) && !((m.restante_uso!=null && m.restante_uso<0))).length

  const hoje = new Date()
  const em30 = new Date(hoje.getTime()+30*86400*1000)
  const habVencendo = _motoristas.filter(m => {
    const c = m.cnh_validade ? new Date(m.cnh_validade) : null
    const f = m.habilitacao_fluvial_validade ? new Date(m.habilitacao_fluvial_validade) : null
    return (c && c <= em30) || (f && f <= em30)
  }).length

  const abastPendentes = _abastec.filter(a=>a.status==='pendente').length

  // Consumo médio geral (km/L) — agregado da frota com hodômetro:
  // soma dos km ÷ soma dos litros, não média das médias (senão uma
  // moto que rodou 200 km pesaria igual a uma caminhonete com 20.000)
  const consumos = _veiculosF.filter(v=>v.medidor==='hodometro').map(v=>consumoPorVeiculo(v.id,'hodometro'))
  const consumoGeral = frotaConsumoAgregado(consumos, 'hodometro')

  document.getElementById('kpi-area').innerHTML = `
    <div class="kpi-grid">
      <div class="kpi-card"><div class="kpi-label">Viagens no período</div><div class="kpi-valor">${total}</div></div>
      <div class="kpi-card azul"><div class="kpi-label">Concluídas</div><div class="kpi-valor">${concluidas} <span style="font-size:.9rem;color:var(--cinza-400)">(${pctConcl}%)</span></div></div>
      <div class="kpi-card erro"><div class="kpi-label">Canceladas/recusadas</div><div class="kpi-valor">${canceladas} <span style="font-size:.9rem;color:var(--cinza-400)">(${pctCanc}%)</span></div></div>
      <div class="kpi-card erro"><div class="kpi-label">Não realizadas</div><div class="kpi-valor">${naoRealizadas} <span style="font-size:.9rem;color:var(--cinza-400)">(${pctNaoRe}%)</span></div></div>
      <div class="kpi-card"><div class="kpi-label">Veículos ativos</div><div class="kpi-valor">${veicAtivos} <span style="font-size:.9rem;color:var(--cinza-400)">(${veicDisp} disp.)</span></div></div>
      <div class="kpi-card"><div class="kpi-label">Km rodados</div><div class="kpi-valor">${formatNum(km,0)}</div></div>
      <div class="kpi-card"><div class="kpi-label">Horas rodadas</div><div class="kpi-valor">${formatNum(horas,1)}</div></div>
      <div class="kpi-card ouro"><div class="kpi-label">Gasto com combustível</div><div class="kpi-valor" style="font-size:20px">${formatBRL(valorTotal)}</div></div>
      <div class="kpi-card"><div class="kpi-label">Litros abastecidos</div><div class="kpi-valor">${formatNum(litrosTotal,0)}</div></div>
      <div class="kpi-card ${consumoGeral!=null ? '' : ''}"><div class="kpi-label">Consumo médio (km/L)</div><div class="kpi-valor">${consumoGeral!=null?formatNum(consumoGeral,2):'—'}</div></div>
      <div class="kpi-card roxo"><div class="kpi-label">Custo de manutenção</div><div class="kpi-valor" style="font-size:20px">${formatBRL(custoManut)}</div></div>
      <div class="kpi-card erro"><div class="kpi-label">Manutenção vencida</div><div class="kpi-valor">${manutVencida}</div></div>
      <div class="kpi-card ouro"><div class="kpi-label">Manutenção próxima (30d)</div><div class="kpi-valor">${manutProxima}</div></div>
      <div class="kpi-card erro"><div class="kpi-label">CNH/habilitação vencendo</div><div class="kpi-valor">${habVencendo}</div></div>
      <div class="kpi-card ouro"><div class="kpi-label">Abastecimentos pendentes</div><div class="kpi-valor">${abastPendentes}</div></div>
    </div>
  `
}

let _charts = {}
function destroyCharts() { Object.values(_charts).forEach(c => c.destroy()); _charts = {} }
function initChart(id, config) {
  const canvas = document.getElementById(id)
  if (!canvas) return
  if (_charts[id]) _charts[id].destroy()
  Chart.defaults.font.family = "'DM Sans', system-ui, sans-serif"
  Chart.defaults.font.size = 11
  Chart.defaults.color = '#6b7280'
  _charts[id] = new Chart(canvas.getContext('2d'), config)
}

  initChart('chart-status-viagem', {

function tabela(headers, rows) {
  if (!rows.length) return '<div class="chart-empty">Sem dados no período</div>'
  return `<table class="rel-table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td${i>0?' class="num"':''}>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`
}

function renderRankings() {
  const cont = document.getElementById('rank-corpo')
  if (!cont) return
  const map = {
    'veiculos-viagens':      rankVeiculosViagens,
    'veiculos-uso':          rankVeiculosUso,
    'veiculos-custo':        rankVeiculosCusto,
    'veiculos-consumo':      rankVeiculosConsumo,
    'veiculos-custo-km':     rankVeiculosCustoKm,
    'veiculos-os':           rankVeiculosOS,
    'motoristas-viagens':    rankMotoristasViagens,
    'motoristas-rejeitados': rankMotoristasRejeitados,
    'setores':               rankSetores,
  }
  cont.innerHTML = (map[_rankAtivo] || rankVeiculosViagens)()
}

function rankVeiculosViagens() {
  const acc = {}
  _viagens.filter(v=>v.status==='concluida').forEach(v => {
    const key = v.veiculo_id
    if (!key) return
    acc[key] = acc[key] || { placa:v.veiculo_placa, modelo:v.veiculo_modelo, n:0 }
    acc[key].n++
  })
  const rows = Object.values(acc).sort((a,b)=>b.n-a.n).slice(0,10)
    .map((v,i) => [i+1, `${esc(v.placa)} — ${esc(v.modelo)}`, v.n])
  return tabela(['#','Veículo','Viagens concluídas'], rows.map(r=>[r[0],r[1],r[2]]))
}

function rankVeiculosUso() {
  const acc = {}
  _viagens.forEach(v => {
    if (!v.veiculo_id) return
    acc[v.veiculo_id] = acc[v.veiculo_id] || { placa:v.veiculo_placa, modelo:v.veiculo_modelo, medidor:v.veiculo_medidor, uso:0 }
    if (v.veiculo_medidor==='hodometro' && v.km_saida!=null && v.km_chegada!=null) acc[v.veiculo_id].uso += Math.max(0, v.km_chegada-v.km_saida)
    if (v.veiculo_medidor==='horimetro' && v.horas_saida!=null && v.horas_chegada!=null) acc[v.veiculo_id].uso += Math.max(0, v.horas_chegada-v.horas_saida)
  })
  const rows = Object.values(acc).sort((a,b)=>b.uso-a.uso).slice(0,10)
    .map((v,i)=>[i+1, `${esc(v.placa)} — ${esc(v.modelo)}`, `${formatNum(v.uso,1)} ${v.medidor==='horimetro'?'h':'km'}`])
  return tabela(['#','Veículo','Uso no período'], rows)
}

function rankVeiculosCusto() {
  const acc = {}
  _veiculosF.forEach(v => { acc[v.id] = { placa:v.placa, modelo:v.modelo, combustivel:0, manutencao:0 } })
  _abastec.filter(a=>a.status==='validado').forEach(a => { if (acc[a.veiculo_id]) acc[a.veiculo_id].combustivel += Number(a.valor_final||0) })
  _ordensServ.filter(o=>o.status==='concluida').forEach(o => { if (acc[o.veiculo_id]) acc[o.veiculo_id].manutencao += Number(o.custo_total||0) })
  const rows = Object.values(acc).map(v=>({...v, total: v.combustivel+v.manutencao}))
    .sort((a,b)=>b.total-a.total).filter(v=>v.total>0).slice(0,10)
    .map((v,i)=>[i+1, `${esc(v.placa)} — ${esc(v.modelo)}`, formatBRL(v.combustivel), formatBRL(v.manutencao), formatBRL(v.total)])
  return tabela(['#','Veículo','Combustível','Manutenção','Total'], rows)
}

// Uso do veículo no período, a partir das viagens concluídas: km para
// hodômetro, horas para horímetro (embarcações). É o denominador do
// custo por km — precisa vir da viagem, não do medidor do veículo, que
// é acumulado desde sempre.
function usoNoPeriodo(veiculoId, medidor) {
  return _viagens
    .filter(v => v.veiculo_id === veiculoId && v.status === 'concluida')
    .reduce((s, v) => {
      const ini = medidor === 'horimetro' ? v.horas_saida : v.km_saida
      const fim = medidor === 'horimetro' ? v.horas_chegada : v.km_chegada
      if (ini == null || fim == null) return s
      return s + Math.max(0, Number(fim) - Number(ini))
    }, 0)
}

// Custo total de propriedade por km (ou por hora, em embarcação):
// combustível validado + manutenção concluída + multas, dividido pelo
// uso do período. É o número que a direção pede e que o painel ainda
// não dava — havia custo total e havia consumo, mas nada relacionando
// os dois ao quanto o veículo de fato rodou.
//
// Só entra veículo com uso > 0 no período: sem denominador o valor
// seria infinito, e um veículo parado com uma OS cara apareceria como
// o mais caro da frota, o que é o oposto da leitura correta.
function rankVeiculosCustoKm() {
  const acc = {}
  _veiculosF.forEach(v => {
    acc[v.id] = { placa: v.placa, modelo: v.modelo, medidor: v.medidor,
                  combustivel: 0, manutencao: 0, multas: 0,
                  uso: usoNoPeriodo(v.id, v.medidor) }
  })
  _abastec.filter(a => a.status === 'validado')
    .forEach(a => { if (acc[a.veiculo_id]) acc[a.veiculo_id].combustivel += Number(a.valor_final || 0) })
  _ordensServ.filter(o => o.status === 'concluida')
    .forEach(o => { if (acc[o.veiculo_id]) acc[o.veiculo_id].manutencao += Number(o.custo_total || 0) })
  _multas.forEach(m => { if (acc[m.veiculo_id]) acc[m.veiculo_id].multas += Number(m.valor || 0) })

  const linhas = Object.values(acc)
    .map(v => ({ ...v, total: v.combustivel + v.manutencao + v.multas }))
    .filter(v => v.uso > 0 && v.total > 0)
    .map(v => ({ ...v, porUso: v.total / v.uso }))
    .sort((a, b) => b.porUso - a.porUso)
    .slice(0, 10)

  if (!linhas.length) {
    return '<div style="padding:24px;text-align:center;color:#9CA3AF;font-size:13px">' +
      'Sem dados suficientes no período: é preciso ter viagem concluída (com medidor de saída e chegada) e algum custo lançado.</div>'
  }

  const rows = linhas.map((v, i) => [
    i + 1,
    `${esc(v.placa)} — ${esc(v.modelo)}`,
    `${formatNum(v.uso, 0)} ${v.medidor === 'horimetro' ? 'h' : 'km'}`,
    formatBRL(v.total),
    `<strong>${formatBRL(v.porUso)}/${v.medidor === 'horimetro' ? 'h' : 'km'}</strong>`,
  ])
  return tabela(['#', 'Veículo (mais caro primeiro)', 'Uso no período', 'Custo total', 'Custo por km/h'], rows)
}

function rankVeiculosConsumo() {
  const rows = _veiculosF.filter(v=>v.medidor==='hodometro').map(v => {
    const r = consumoPorVeiculo(v.id, 'hodometro')
    return r ? { placa:v.placa, modelo:v.modelo, c:r.consumo } : null
  }).filter(Boolean).sort((a,b)=>a.c-b.c).slice(0,10) // pior primeiro
    .map((v,i)=>[i+1, `${esc(v.placa)} — ${esc(v.modelo)}`, `${formatNum(v.c,2)} km/L`])
  return tabela(['#','Veículo (pior consumo primeiro)','Km/L médio'], rows)
}

function rankVeiculosOS() {
  const acc = {}
  _ordensServ.filter(o=>o.tipo==='corretiva').forEach(o => {
    acc[o.veiculo_id] = (acc[o.veiculo_id]||0) + 1
  })
  const rows = Object.entries(acc).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([veicId,n],i) => {
    const v = _veiculos.find(x=>x.id===veicId)
    return [i+1, v ? `${esc(v.placa)} — ${esc(v.modelo)}` : '—', n]
  })
  return tabela(['#','Veículo','OS corretivas'], rows)
}

function rankMotoristasViagens() {
  const acc = {}
  _viagens.filter(v=>v.status==='concluida').forEach(v => {
    if (!v.motorista_id) return
    acc[v.motorista_id] = acc[v.motorista_id] || { nome:v.motorista_nome, n:0, km:0 }
    acc[v.motorista_id].n++
    if (v.veiculo_medidor==='hodometro' && v.km_saida!=null && v.km_chegada!=null) acc[v.motorista_id].km += Math.max(0, v.km_chegada-v.km_saida)
  })
  const rows = Object.values(acc).sort((a,b)=>b.n-a.n).slice(0,10)
    .map((m,i)=>[i+1, esc(m.nome), m.n, formatNum(m.km,0)])
  return tabela(['#','Motorista','Viagens concluídas','Km rodados'], rows)
}

function rankMotoristasRejeitados() {
  const acc = {}
  _abastec.filter(a=>a.status==='rejeitado').forEach(a => {
    acc[a.motorista_id] = acc[a.motorista_id] || { nome:a.motorista_nome, n:0 }
    acc[a.motorista_id].n++
  })
  const rows = Object.values(acc).sort((a,b)=>b.n-a.n).slice(0,10)
    .map((m,i)=>[i+1, esc(m.nome), m.n])
  return tabela(['#','Motorista','Abastecimentos rejeitados'], rows)
}

function rankSetores() {
  const acc = {}
  _viagens.forEach(v => {
    const key = v.setor_sigla || v.setor_nome || 'Sem setor'
    acc[key] = acc[key] || { n:0, km:0 }
    acc[key].n++
    if (v.veiculo_medidor==='hodometro' && v.km_saida!=null && v.km_chegada!=null) acc[key].km += Math.max(0, v.km_chegada-v.km_saida)
  })
  const rows = Object.entries(acc).sort((a,b)=>b[1].n-a[1].n).slice(0,10)
    .map(([nome,d],i)=>[i+1, esc(nome), d.n, formatNum(d.km,0)])
  return tabela(['#','Setor','Viagens','Km rodados'], rows)
}

// ════════════════════════════════════════════════════════════════
// Listas de alerta / sugestões adicionais
// ════════════════════════════════════════════════════════════════
function listaManutencaoAlerta() {
  const itens = _manutPend.filter(m =>
    (m.restante_uso != null && m.restante_uso < 30) ||
    (m.restante_dias != null && m.restante_dias < 30)
  ).sort((a,b) => (a.restante_dias??9999) - (b.restante_dias??9999)).slice(0,15)

  if (!itens.length) return '<div class="chart-empty">Nenhuma manutenção vencida ou próxima</div>'
  return itens.map(m => {
    const vencida = (m.restante_uso!=null && m.restante_uso<0) || (m.restante_dias!=null && m.restante_dias<0)
    return `<div class="alerta-item">
      <span class="alerta-badge ${vencida?'critico':'aviso'}">${vencida?'Vencida':'Próxima'}</span>
      <div style="flex:1">
        <strong>${esc(m.placa)}</strong> — ${esc(m.item)}
        <div style="font-size:.75rem;color:var(--cinza-500)">
          ${m.restante_dias!=null ? `${m.restante_dias} dia(s)` : ''}
          ${m.restante_uso!=null ? ` · ${formatNum(m.restante_uso,0)} ${m.medidor==='horimetro'?'h':'km'} restantes` : ''}
        </div>
      </div>
    </div>`
  }).join('')
}

function listaHabilitacaoAlerta() {
  const hoje = new Date(); const em30 = new Date(hoje.getTime()+30*86400*1000)
  const itens = _motoristas.filter(m => {
    const c = m.cnh_validade ? new Date(m.cnh_validade) : null
    const f = m.habilitacao_fluvial_validade ? new Date(m.habilitacao_fluvial_validade) : null
    return (c && c <= em30) || (f && f <= em30)
  })
  if (!itens.length) return '<div class="chart-empty">Nenhuma habilitação vencendo</div>'
  return itens.map(m => {
    const venceCnh = m.cnh_validade && new Date(m.cnh_validade) < hoje
    return `<div class="alerta-item">
      <span class="alerta-badge ${venceCnh?'critico':'aviso'}">${venceCnh?'Vencida':'Próxima'}</span>
      <div style="flex:1"><strong>${esc(m.nome)}</strong>
        <div style="font-size:.75rem;color:var(--cinza-500)">
          ${m.cnh_validade ? `CNH: ${new Date(m.cnh_validade+'T12:00:00').toLocaleDateString('pt-BR')}` : ''}
          ${m.habilitacao_fluvial_validade ? ` · Hab. fluvial: ${new Date(m.habilitacao_fluvial_validade+'T12:00:00').toLocaleDateString('pt-BR')}` : ''}
        </div>
      </div>
    </div>`
  }).join('')
}

function listaDocumentosAlerta() {
  const hoje = new Date(); const em30 = new Date(hoje.getTime()+30*86400*1000)
  const itens = _documentos.filter(d => d.data_vencimento && new Date(d.data_vencimento) <= em30)
    .sort((a,b) => new Date(a.data_vencimento) - new Date(b.data_vencimento)).slice(0,15)
  if (!itens.length) return '<div class="chart-empty">Nenhum documento vencendo</div>'
  return itens.map(d => {
    const v = _veiculos.find(x=>x.id===d.veiculo_id)
    const vencido = new Date(d.data_vencimento) < hoje
    return `<div class="alerta-item">
      <span class="alerta-badge ${vencido?'critico':'aviso'}">${vencido?'Vencido':'Próximo'}</span>
      <div style="flex:1"><strong>${v?esc(v.placa):'—'}</strong> — ${esc(d.tipo)}${d.descricao?` (${esc(d.descricao)})`:''}
        <div style="font-size:.75rem;color:var(--cinza-500)">${new Date(d.data_vencimento+'T12:00:00').toLocaleDateString('pt-BR')}</div>
      </div>
    </div>`
  }).join('')
}

function listaAvarias() {
  const itens = _viagens.filter(v => v.avarias && v.avarias.trim())
  if (!itens.length) return '<div class="chart-empty">Nenhuma avaria registrada no período</div>'
  return itens.slice(0,15).map(v => `<div class="alerta-item">
    <span class="alerta-badge critico">Avaria</span>
    <div style="flex:1"><strong>${esc(v.veiculo_placa)}</strong> — ${esc(v.motorista_nome||'—')}
      <div style="font-size:.75rem;color:var(--cinza-500)">${esc(v.avarias)}</div>
    </div>
  </div>`).join('')
}

function listaMotivosRecusa() {
  const acc = {}
  _viagens.filter(v => v.motivo_recusa).forEach(v => {
    const key = v.motivo_recusa.trim()
    acc[key] = (acc[key]||0) + 1
  })
  const entradas = Object.entries(acc).sort((a,b)=>b[1]-a[1]).slice(0,10)
  if (!entradas.length) return '<div class="chart-empty">Nenhuma viagem recusada no período</div>'
  return entradas.map(([motivo,n]) => `<div class="alerta-item">
    <span class="alerta-badge aviso">${n}x</span>
    <div style="flex:1">${esc(motivo)}</div>
  </div>`).join('')
}

function listaOciosos() {
  const usados = new Set()
  _viagens.forEach(v => { if (v.veiculo_id) usados.add(v.veiculo_id) })
  _abastec.forEach(a => { if (a.veiculo_id) usados.add(a.veiculo_id) })
  const ociosos = _veiculosF.filter(v => !usados.has(v.id) && v.status !== 'baixado')
  if (!ociosos.length) return '<div class="chart-empty">Toda a frota teve alguma movimentação no período</div>'
  return ociosos.slice(0,15).map(v => `<div class="alerta-item">
    <span class="alerta-badge aviso">${STATUS_VEIC_LAB[v.status]||v.status}</span>
    <div style="flex:1"><strong>${esc(v.placa)}</strong> — ${esc(v.modelo)}</div>
  </div>`).join('')
}

// ════════════════════════════════════════════════════════════════
// Exportar CSV
// ════════════════════════════════════════════════════════════════
function exportarCSV() {
  const linhas = [['Placa','Modelo','Motorista','Setor','Status','Destino','Cidade origem','Cidade destino','Finalidade','Saída prevista','Retorno previsto','Km saída','Km chegada']]
  _viagens.forEach(v => linhas.push([
    v.veiculo_placa||'', v.veiculo_modelo||'', v.motorista_nome||'', v.setor_sigla||v.setor_nome||'',
    fvLabel(v), v.destino||'', v.cidade_origem||'', v.cidade_destino||'', v.finalidade||'',
    v.data_saida_prevista||'', v.data_retorno_prevista||'',
    v.km_saida??'', v.km_chegada??'',
  ]))
  const csv = linhas.map(l => l.map(c => `"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n')
  const blob = new Blob(['﻿'+csv], { type:'text/csv;charset=utf-8' })
  const url = URL.createObjectURL(blob)
  const a = document.createElement('a')
  a.href = url; a.download = `frota-viagens-${getPeriodo().ini}_a_${getPeriodo().fim}.csv`
  a.click()
  URL.revokeObjectURL(url)
}
