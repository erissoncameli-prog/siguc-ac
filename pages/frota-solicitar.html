<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SIGUC-AC · Solicitar Viagem</title>
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/frota-wise-theme.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/observability.js"></script>
<script src="../js/queryLogger.js"></script>
<script src="../js/config.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/frota-wise.js"></script>
<script src="../js/fotos-privadas.js"></script>
<script src="../js/frota-passageiros.js"></script>
<script>
// Rede de segurança para js/fotos-privadas.js. Se ele não carregar — deploy
// a meio caminho, cache do navegador, bloqueio de rede — as funções
// abaixo ficariam indefinidas, e QUALQUER template que as chame lançaria
// ReferenceError. Como as chamadas ficam dentro de .map() que monta lista
// inteira, o efeito não é "some a foto": some a LISTA TODA, em silêncio.
// Degradar para "sem foto" é sempre melhor que uma tela vazia.
window.frotaFotoAttr = window.frotaFotoAttr || function () { return '' }
window.frotaAssinarFotos = window.frotaAssinarFotos || function () {}
window.frotaFotoUrlAssinada = window.frotaFotoUrlAssinada || async function () { return null }
</script>
</head>
<body>
<div id="app"></div>

<div class="modal-overlay" id="modal-cancelar">
  <div class="modal" style="max-width:420px">
    <div class="modal-header">
      <div class="modal-title">Cancelar solicitação</div>
      <button class="modal-close" onclick="fecharModalCancelar()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group"><label class="form-label">Motivo (opcional)</label>
        <textarea class="form-control" id="c-motivo" rows="3"></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="fecharModalCancelar()">Voltar</button>
      <button class="btn btn-primary" style="background:#DC2626" id="btn-confirmar-cancelar" onclick="confirmarCancelar()">Cancelar Viagem</button>
    </div>
  </div>
</div>

<!-- Acompanhamento da viagem (par de abrirDetalheSolicitante do
     frota-app.html — regra de duplicação do CLAUDE.md) -->
<div class="modal-overlay" id="modal-detalhe">
  <div class="modal" style="max-width:560px">
    <div class="modal-header">
      <div class="modal-title">Acompanhar viagem</div>
      <button class="modal-close" onclick="fecharModalDetalhe()">×</button>
    </div>
    <div class="modal-body" id="det-corpo"></div>
  </div>
</div>

<script>
let _usuario = null, _setores = [], _ucs = [], _minhasViagens = [], _cancelarId = null

const STATUS_LABEL = { solicitada:'Solicitada', aprovada:'Aprovada', recusada:'Recusada',
  em_andamento:'Em andamento', concluida:'Concluída', cancelada:'Cancelada' }
const STATUS_BADGE = { solicitada:'fw-badge fw-badge-manutencao', aprovada:'fw-badge fw-badge-em-rota', recusada:'fw-badge fw-badge-inativo',
  em_andamento:'fw-badge fw-badge-em-rota', concluida:'fw-badge fw-badge-disponivel', cancelada:'badge-cinza' }

;(async function () {
  _usuario = await carregarUsuario()
  if (!_usuario) { window.location.href = '../index.html'; return }

  document.getElementById('app').innerHTML =
    gerarLayout('Solicitar Viagem', 'frota-solicitar') +
    `<div class="fade-in fw-theme" style="max-width:1000px">
      <div class="card" style="margin-bottom:20px">
        <div class="form-section-label" style="padding:0 0 14px">Nova solicitação de viagem</div>
        <div class="grid-2">
          <div class="form-group"><label class="form-label">Setor solicitante</label>
            <select class="form-control" id="f-setor"><option value="">—</option></select></div>
          <div class="form-group"><label class="form-label">Nº de passageiros</label>
            <input class="form-control" id="f-passageiros" type="number" min="1" max="99" placeholder="1" oninput="checarPassageiros()"></div>
        </div>
        <div id="aviso-passageiros" style="display:none;font-size:12px;background:#FEF3C7;color:#92400E;padding:8px 12px;border-radius:8px;margin-bottom:14px">
          Mais de 4 passageiros — o setor de transporte pode precisar escalar mais de um veículo para atender essa viagem.
        </div>
        ${fpFormHTML()}
        <div class="grid-2">
          <div class="form-group"><label class="form-label">Cidade de origem <span class="obrig">*</span></label>
            <input class="form-control" id="f-cidade-origem" list="dl-cidades" value="Rio Branco" placeholder="Rio Branco" oninput="checarIntermunicipal()"></div>
          <div class="form-group"><label class="form-label">Cidade de destino <span class="obrig">*</span></label>
            <input class="form-control" id="f-cidade-destino" list="dl-cidades" placeholder="Ex.: Cruzeiro do Sul" oninput="checarIntermunicipal()"></div>
        </div>
        ${fwDatalistCidades('dl-cidades')}
        <div id="aviso-intermunicipal" style="display:none;font-size:12px;background:#EFF6FF;color:#1E40AF;padding:8px 12px;border-radius:8px;margin-bottom:14px">
          Viagem intermunicipal — ao aprovar, a gestão receberá a sugestão do motorista da vez (escala por rodízio).
        </div>
        <div id="preview-escala" style="display:none;font-size:12px;background:#ECFDF5;border:1px solid #A7F3D0;color:#065F46;padding:8px 12px;border-radius:8px;margin-bottom:14px"></div>
        <div class="form-group"><label class="form-label">Local / ponto de destino <span class="obrig">*</span></label>
          <input class="form-control" id="f-destino" placeholder="Ex.: Sede da UC, endereço, ponto específico..."></div>
        <div class="form-group"><label class="form-label">Unidade de Conservação (se aplicável)</label>
          <select class="form-control" id="f-uc"><option value="">—</option></select></div>
        <div class="form-group"><label class="form-label">Finalidade <span class="obrig">*</span></label>
          <textarea class="form-control" id="f-finalidade" rows="2" placeholder="Descreva o motivo da viagem"></textarea></div>
        <div class="grid-2">
          <div class="form-group"><label class="form-label">Saída prevista <span class="obrig">*</span></label>
            <input class="form-control" id="f-saida" type="datetime-local" onchange="checarDisponibilidade()"></div>
          <div class="form-group"><label class="form-label">Retorno previsto <span class="obrig">*</span></label>
            <input class="form-control" id="f-retorno" type="datetime-local" onchange="checarDisponibilidade()"></div>
        </div>
        <div id="aviso-disponibilidade" style="display:none;font-size:12px;padding:8px 12px;border-radius:8px;margin-bottom:14px"></div>
        <button class="btn btn-primary" id="btn-solicitar" onclick="solicitar()">${bico('truck')} Solicitar Viagem</button>
      </div>

      <div class="card">
        <div class="form-section-label" style="padding:0 0 14px">Minhas solicitações</div>
        <div class="table-wrap"><div class="table-scroll">
          <table>
            <thead><tr><th>Destino</th><th>Período</th><th>Veículo / Motorista</th><th>Status</th><th>Ações</th></tr></thead>
            <tbody id="tbody-minhas"><tr><td colspan="5" style="text-align:center;padding:32px;color:#9CA3AF">Carregando...</td></tr></tbody>
          </table>
        </div></div>
      </div>
    </div>` +
    '</div></div></div>'

  carregarLogosSidebar()
  bIconsAplicar()
  fpRenderLista()
  await Promise.all([carregarSetores(), carregarUCs()])
  await carregarMinhasViagens()
})()

async function carregarSetores() {
  const { data } = await db.from('unidades_organizacionais').select('id,sigla,nome').eq('ativo', true).order('sigla')
  _setores = data || []
  document.getElementById('f-setor').insertAdjacentHTML('beforeend',
    _setores.map(s => `<option value="${s.id}">${esc(s.sigla)} — ${esc(s.nome)}</option>`).join(''))
}

async function carregarUCs() {
  const { data } = await db.from('unidades_conservacao').select('id,nome,codigo').eq('ativo', true).order('codigo')
  _ucs = data || []
  document.getElementById('f-uc').insertAdjacentHTML('beforeend',
    _ucs.map(u => `<option value="${u.id}">${esc(u.codigo)} — ${esc(u.nome)}</option>`).join(''))
}

async function carregarMinhasViagens() {
  const { data } = await db.from('vw_frota_viagens_detalhe')
    .select('*').eq('solicitante_id', _usuario.id).order('data_saida_prevista', { ascending: false }).limit(50)
  _minhasViagens = data || []
  renderMinhasViagens()
}

function renderMinhasViagens() {
  const tbody = document.getElementById('tbody-minhas')
  if (!_minhasViagens.length) { tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:32px;color:#9CA3AF">Nenhuma solicitação ainda</td></tr>'; return }
  tbody.innerHTML = _minhasViagens.map(v => {
    const podeCancelar = ['solicitada','aprovada'].includes(v.status)
    return `<tr style="cursor:pointer" onclick="abrirDetalheSolicitante('${v.id}')">
      <td>${v.cidade_destino ? `<div style="font-size:12px;font-weight:600">${esc(v.cidade_origem||'Rio Branco')} → ${esc(v.cidade_destino)}</div>` : ''}<strong>${esc(v.destino)}</strong><br><span style="font-size:11px;color:#9CA3AF">${esc(v.finalidade)}</span></td>
      <td style="font-size:12px">${formatDataHora(v.data_saida_prevista)}<br>até ${formatDataHora(v.data_retorno_prevista)}</td>
      <td style="font-size:12px">${v.veiculo_placa ? `${esc(v.veiculo_modelo)} <span class="mono">(${esc(v.veiculo_placa)})</span><br>${esc(v.motorista_nome||'—')}` : '<span style="color:#9CA3AF">A definir</span>'}</td>
      <td><span class="badge ${STATUS_BADGE[v.status]||'badge-cinza'}">${STATUS_LABEL[v.status]||v.status}</span>
        ${v.status === 'recusada' && v.motivo_recusa ? `<div style="font-size:11px;color:#9CA3AF;margin-top:4px">${esc(v.motivo_recusa)}</div>` : ''}</td>
      <td onclick="event.stopPropagation()">${podeCancelar ? `<button class="btn btn-xs btn-ghost" style="color:#DC2626" onclick="abrirModalCancelar('${v.id}')">Cancelar</button>` : ''}
        <button class="btn btn-xs btn-ghost" onclick="abrirDetalheSolicitante('${v.id}')">Acompanhar</button></td>
    </tr>`
  }).join('')
}

function formatDataHora(str) {
  if (!str) return '—'
  return new Date(str).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit' })
}

let _ultimaChecagemDisponivel = null

function checarPassageiros() {
  const n = parseInt(document.getElementById('f-passageiros').value) || 0
  document.getElementById('aviso-passageiros').style.display = n > 4 ? '' : 'none'
  agendarPreviewEscala()
}

// Normaliza cidade (mesma regra do banco: sem acento/caixa/espaço) para
// detectar viagem intermunicipal no cliente.
function normCidade(s) {
  return (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim()
}
function checarIntermunicipal() {
  const o = normCidade(document.getElementById('f-cidade-origem').value)
  const d = normCidade(document.getElementById('f-cidade-destino').value)
  document.getElementById('aviso-intermunicipal').style.display = (d && o && d !== o) ? '' : 'none'
  agendarPreviewEscala()
}

// Preview do motorista da vez para o SOLICITANTE. Sugestão informativa —
// a escala final é confirmada pela gestão de frota na aprovação. Quando a
// viagem precisa de 2+ veículos (passageiros não cabem em um), mostra um
// motorista por veículo necessário (RPC marca os N primeiros da fila LRU).
let _previewEscalaTimer = null
function agendarPreviewEscala() {
  clearTimeout(_previewEscalaTimer)
  _previewEscalaTimer = setTimeout(atualizarPreviewEscala, 400)
}
// Avatar tolerante a cache antigo: se o helper de frota-wise.js ainda não
// tiver carregado (versão em cache anterior), mostra só o nome, sem travar.
function _avatarEsc(foto, nome, size) {
  return (typeof fwAvatarMotorista === 'function') ? fwAvatarMotorista(foto, nome, size) : ''
}
async function atualizarPreviewEscala() {
  const box = document.getElementById('preview-escala')
  if (!box) return
  const origem = document.getElementById('f-cidade-origem').value.trim()
  const destino = document.getElementById('f-cidade-destino').value.trim()
  const saida = document.getElementById('f-saida').value
  const retorno = document.getElementById('f-retorno').value
  const pax = parseInt(document.getElementById('f-passageiros').value) || null
  const inter = origem && destino && normCidade(origem) !== normCidade(destino)
  if (!inter || !saida || !retorno || new Date(retorno) <= new Date(saida)) { box.style.display = 'none'; return }
  box.style.display = ''
  box.textContent = 'Consultando o motorista da vez...'
  const { data, error } = await db.rpc('frota_sugerir_motorista_escala', {
    p_cidade_origem: origem, p_cidade_destino: destino,
    p_inicio: new Date(saida).toISOString(), p_fim: new Date(retorno).toISOString(),
    p_passageiros: pax
  })
  if (error) { box.style.display = ''; box.textContent = 'Não foi possível carregar a sugestão de escala agora — a gestão de frota define o motorista na aprovação.'; return }
  const sugeridos = (data || []).filter(x => x.sugerido)
  if (!sugeridos.length) {
    box.innerHTML = '<strong>Motorista da vez</strong><br>Nenhum motorista elegível para o período no momento — a gestão de frota define na aprovação.'
    return
  }
  const lista = sugeridos.map(x => `<span style="display:inline-flex;align-items:center;gap:10px;margin:4px 16px 4px 0">${_avatarEsc(x.foto_url, x.nome, 56)}<strong style="font-size:15px">${esc(x.nome)}</strong></span>`).join('')
  const multi = sugeridos.length > 1
  box.innerHTML =
    `<div>Motorista${multi ? 's' : ''} da vez (sugestão — a confirmar pela gestão de frota):</div><div style="margin-top:6px;display:flex;flex-wrap:wrap;align-items:center">${lista}</div>` +
    (multi ? `<div style="margin-top:4px">Esta viagem deve precisar de ${sugeridos.length} veículos; a gestão confirma a escala final.</div>` : '')
  // Bucket privado (migration 200) — assina as fotos da sugestão.
  frotaAssinarFotos(box)
}

async function checarDisponibilidade() {
  agendarPreviewEscala()
  const saida = document.getElementById('f-saida').value
  const retorno = document.getElementById('f-retorno').value
  const aviso = document.getElementById('aviso-disponibilidade')
  if (!saida || !retorno || new Date(retorno) <= new Date(saida)) { aviso.style.display = 'none'; _ultimaChecagemDisponivel = null; return }

  aviso.style.display = ''
  aviso.style.background = '#F3F4F6'; aviso.style.color = '#6B7280'
  aviso.textContent = 'Verificando disponibilidade de veículos...'
  const { data, error } = await db.rpc('frota_veiculos_disponiveis', {
    p_inicio: new Date(saida).toISOString(), p_fim: new Date(retorno).toISOString()
  })
  if (error) { aviso.style.display = 'none'; return }
  _ultimaChecagemDisponivel = data?.length || 0
  if (_ultimaChecagemDisponivel > 0) {
    aviso.style.background = '#DCFCE7'; aviso.style.color = '#166534'
    aviso.textContent = `${_ultimaChecagemDisponivel} veículo(s) disponível(is) nesse período.`
  } else {
    aviso.style.background = '#FEE2E2'; aviso.style.color = '#991B1B'
    aviso.textContent = 'Nenhum veículo disponível para esse período no momento — o setor de transporte ainda pode conseguir remanejar, mas a solicitação pode demorar mais para ser aprovada.'
  }
}

async function solicitar() {
  const cidadeOrigem = document.getElementById('f-cidade-origem').value.trim()
  const cidadeDestino = document.getElementById('f-cidade-destino').value.trim()
  const destino = document.getElementById('f-destino').value.trim()
  const finalidade = document.getElementById('f-finalidade').value.trim()
  const saida = document.getElementById('f-saida').value
  const retorno = document.getElementById('f-retorno').value
  if (!cidadeOrigem || !cidadeDestino) { toast('Preencha a cidade de origem e de destino', 'error'); return }
  if (!destino || !finalidade || !saida || !retorno) { toast('Preencha destino, finalidade e o período da viagem', 'error'); return }
  if (new Date(retorno) <= new Date(saida)) { toast('O retorno deve ser depois da saída', 'error'); return }
  if (_ultimaChecagemDisponivel === 0 &&
      !confirm('Nenhum veículo está disponível para esse período no momento. Quer enviar a solicitação mesmo assim?')) return

  // Viagem e passageiros numa transação só (RPC da migration 235) —
  // com tabela filha, dois .insert() separados deixariam viagem sem os
  // nomes se o segundo falhasse. A RPC é SECURITY INVOKER: a policy
  // frota_viag_insert (migration 158) continua sendo quem autoriza.
  const pax = fpPayload()
  const payload = {
    p_setor_id: document.getElementById('f-setor').value || null,
    p_cidade_origem: cidadeOrigem,
    p_cidade_destino: cidadeDestino,
    p_destino: destino,
    p_uc_destino_id: document.getElementById('f-uc').value || null,
    p_finalidade: finalidade,
    p_passageiros: parseInt(document.getElementById('f-passageiros').value) || pax.length || null,
    p_saida: new Date(saida).toISOString(),
    p_retorno: new Date(retorno).toISOString(),
    p_lista_pax: pax,
  }
  const btn = document.getElementById('btn-solicitar')
  btn.disabled = true; btn.textContent = 'Enviando...'
  try {
    const { error } = await db.rpc('frota_solicitar_viagem', payload)
    if (error) throw error
    toast('Solicitação enviada ao setor de transporte!', 'success')
    document.getElementById('f-cidade-origem').value = 'Rio Branco'
    document.getElementById('f-cidade-destino').value = ''
    document.getElementById('aviso-intermunicipal').style.display = 'none'
    document.getElementById('preview-escala').style.display = 'none'
    document.getElementById('f-destino').value = ''
    document.getElementById('f-finalidade').value = ''
    document.getElementById('f-saida').value = ''
    document.getElementById('f-retorno').value = ''
    document.getElementById('f-passageiros').value = ''
    fpLimpar()
    document.getElementById('aviso-passageiros').style.display = 'none'
    document.getElementById('f-uc').value = ''
    document.getElementById('aviso-disponibilidade').style.display = 'none'
    _ultimaChecagemDisponivel = null
    await carregarMinhasViagens()
  } catch (e) { toast(e.message || 'Erro ao solicitar viagem', 'error') }
  finally { btn.disabled = false; btn.innerHTML = `${bico('truck')} Solicitar Viagem` }
}

// ── Acompanhamento da viagem (par de abrirDetalheSolicitante do
// frota-app.html — mesma linha do tempo, mesmo conteúdo, adaptado ao
// layout de mesa). Antes a mesa só tinha a tabela plana: quem solicita
// pelo computador — a maioria dos servidores — ficava sem o
// acompanhamento que o app já dava.
const FS_ETAPAS = ['solicitada', 'aprovada', 'em_andamento', 'concluida']

function fsLinkMapa(lat, lng) {
  if (lat == null || lng == null) return ''
  return ` <a href="https://www.google.com/maps?q=${lat},${lng}" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline">${bico('pin')} ver no mapa</a>`
}

function fsLinkWhatsapp(telefone) {
  const digitos = (telefone || '').replace(/\D/g, '')
  if (!digitos) return ''
  const numero = digitos.length <= 11 ? '55' + digitos : digitos
  return `<a href="https://wa.me/${numero}" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline">${bico('chat')} ${esc(telefone)}</a>`
}

function fecharModalDetalhe() { document.getElementById('modal-detalhe').classList.remove('aberto') }

function abrirDetalheSolicitante(id) {
  const v = _minhasViagens.find(x => x.id === id)
  if (!v) return
  const finalizadaFora = v.status === 'recusada' || v.status === 'cancelada'
  const etapaAtual = FS_ETAPAS.indexOf(v.status)
  const podeCancelar = ['solicitada','aprovada'].includes(v.status)

  const timeline = finalizadaFora
    ? `<div class="card" style="margin-bottom:14px;background:${v.status === 'recusada' ? '#FEF2F2' : '#F9FAFB'}">
        <div style="font-weight:700;color:${v.status === 'recusada' ? '#991B1B' : '#374151'}">${STATUS_LABEL[v.status]}</div>
        ${v.status === 'recusada' && v.motivo_recusa ? `<div style="font-size:13px;color:#6B7280;margin-top:4px">${esc(v.motivo_recusa)}</div>` : ''}
        ${v.status === 'cancelada' && v.motivo_cancelamento ? `<div style="font-size:13px;color:#6B7280;margin-top:4px">${esc(v.motivo_cancelamento)}</div>` : ''}
      </div>`
    : `<div class="card" style="margin-bottom:14px">
        <div style="display:flex;justify-content:space-between">
          ${[
            { s: 'solicitada', l: 'Solicitada', em: v.criado_em },
            { s: 'aprovada', l: 'Aprovada', em: v.aprovado_em },
            { s: 'em_andamento', l: 'Em andamento', em: v.checkout_em },
            { s: 'concluida', l: 'Concluída', em: v.checkin_em },
          ].map((etapa, i) => {
            const feita = i <= etapaAtual
            return `<div style="flex:1;text-align:center">
              <div style="width:22px;height:22px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;background:${feita ? 'var(--verde-c,#52B788)' : '#E5E7EB'};color:#fff;font-size:11px">${feita ? bico('check') : ''}</div>
              <div style="font-size:11px;color:${feita ? '#1F4E2C' : '#9CA3AF'};font-weight:${feita ? '700' : '400'}">${etapa.l}</div>
              ${etapa.em ? `<div style="font-size:10px;color:#9CA3AF">${formatDataHora(etapa.em)}</div>` : ''}
            </div>`
          }).join('')}
        </div>
      </div>`

  document.getElementById('det-corpo').innerHTML = `
    ${timeline}
    <div style="font-size:13px;line-height:1.8">
      ${v.cidade_destino ? `<div><strong>Cidade:</strong> ${esc(v.cidade_origem||'Rio Branco')} → ${esc(v.cidade_destino)}</div>` : ''}
      <div><strong>Destino:</strong> ${esc(v.destino)}</div>
      <div><strong>Finalidade:</strong> ${esc(v.finalidade)}</div>
      <div><strong>Período previsto:</strong> ${formatDataHora(v.data_saida_prevista)} → ${formatDataHora(v.data_retorno_prevista)}</div>
      ${v.passageiros ? `<div><strong>Passageiros:</strong> ${v.passageiros}</div>` : ''}
      ${fpResumoHTML(v)}
    </div>
    ${v.veiculo_placa ? `<div class="card" style="margin-top:14px;padding:14px;display:flex;align-items:center;gap:12px">
      <div style="width:40px;height:40px;border-radius:10px;background:rgba(82,183,136,.12);display:flex;align-items:center;justify-content:center;color:var(--verde-c,#52B788);flex-shrink:0">${bico('truck')}</div>
      <div style="font-size:13px">
        <div style="font-weight:700">${esc(v.veiculo_modelo)} <span class="mono" style="color:#9CA3AF">(${esc(v.veiculo_placa)})</span></div>
        ${v.motorista_nome ? `<div style="color:#6B7280">${esc(v.motorista_nome)}${v.motorista_telefone ? ' · '+fsLinkWhatsapp(v.motorista_telefone) : ''}</div>` : ''}
      </div>
    </div>` : ''}
    ${v.checkout_em ? `<div style="font-size:13px;margin-top:10px"><strong>Saída registrada:</strong> ${formatDataHora(v.checkout_em)}${fsLinkMapa(v.lat_saida, v.lng_saida)}</div>` : ''}
    ${v.checkin_em ? `<div style="font-size:13px;margin-top:4px"><strong>Chegada registrada:</strong> ${formatDataHora(v.checkin_em)}${fsLinkMapa(v.lat_chegada, v.lng_chegada)}</div>` : ''}
    ${v.avarias ? `<div style="font-size:13px;color:#DC2626;margin-top:10px"><strong>Avarias registradas:</strong> ${esc(v.avarias)}</div>` : ''}
    <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">
      ${podeCancelar ? `<button class="btn btn-secondary btn-sm" style="color:#DC2626" onclick="fecharModalDetalhe();abrirModalCancelar('${v.id}')">Cancelar viagem</button>` : ''}
      <button class="btn btn-secondary btn-sm" onclick="repetirSolicitacao('${v.id}')">${bico('truck')} Solicitar de novo</button>
    </div>`
  document.getElementById('modal-detalhe').classList.add('aberto')
  bIconsAplicar(document.getElementById('det-corpo'))
}

// Repete a solicitação: preenche o formulário (que na mesa é estático,
// diferente do app, onde a tela é remontada) e leva o foco até ele.
function repetirSolicitacao(id) {
  const v = _minhasViagens.find(x => x.id === id)
  if (!v) return
  fecharModalDetalhe()
  const set = (campo, valor) => { const el = document.getElementById(campo); if (el) el.value = valor ?? '' }
  set('f-setor', v.setor_solicitante_id || '')
  set('f-passageiros', v.passageiros || '')
  fpDefinirLista(fpDaViagem(v))
  set('f-cidade-origem', v.cidade_origem || 'Rio Branco')
  set('f-cidade-destino', v.cidade_destino || '')
  set('f-destino', v.destino || '')
  set('f-finalidade', v.finalidade || '')
  set('f-uc', v.uc_destino_id || '')
  // Datas ficam em branco de propósito: repetir uma viagem é repetir o
  // roteiro, não o período — que quase sempre é outro.
  set('f-saida', ''); set('f-retorno', '')
  checarPassageiros(); checarIntermunicipal()
  document.getElementById('f-saida')?.focus()
  document.getElementById('f-saida')?.scrollIntoView({ behavior: 'smooth', block: 'center' })
  toast('Dados copiados — informe as novas datas da viagem.', 'info')
}

function abrirModalCancelar(id) {
  _cancelarId = id
  document.getElementById('c-motivo').value = ''
  document.getElementById('modal-cancelar').classList.add('aberto')
}
function fecharModalCancelar() { document.getElementById('modal-cancelar').classList.remove('aberto'); _cancelarId = null }

async function confirmarCancelar() {
  if (!_cancelarId) return
  const btn = document.getElementById('btn-confirmar-cancelar')
  btn.disabled = true
  try {
    const { error } = await db.rpc('frota_cancelar_viagem', {
      p_viagem_id: _cancelarId, p_motivo: document.getElementById('c-motivo').value.trim() || null
    })
    if (error) throw error
    toast('Viagem cancelada', 'success')
    fecharModalCancelar(); await carregarMinhasViagens()
  } catch (e) { toast(e.message || 'Erro ao cancelar', 'error') }
  finally { btn.disabled = false }
}
</script>
