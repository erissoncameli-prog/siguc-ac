<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SIGUC-AC · Trocar Senha</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0A1A0F 0%,#1F4E2C 100%)}
.card{background:#fff;border-radius:20px;padding:36px 32px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:28px}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,#2D6A4F,#52B788);border-radius:9px;display:flex;align-items:center;justify-content:center}
.titulo{font-size:22px;font-weight:700;color:#111827;margin-bottom:6px}
.sub{font-size:13px;color:#9CA3AF;margin-bottom:24px}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:11px;font-weight:600;color:#374151;margin-bottom:5px;text-transform:uppercase;letter-spacing:.06em}
.form-input{width:100%;height:42px;border:1.5px solid #E5E7EB;border-radius:8px;padding:0 12px;font-size:13px;color:#111827;outline:none;transition:border-color .2s}
.form-input:focus{border-color:#52B788;box-shadow:0 0 0 3px rgba(82,183,136,.15)}
.btn{width:100%;height:44px;background:linear-gradient(135deg,#1F4E2C,#2D6A4F);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;margin-top:8px}
.btn:hover{opacity:.92}
.btn:disabled{opacity:.5;cursor:not-allowed}
.alerta{padding:10px 14px;border-radius:7px;font-size:12px;margin-bottom:16px;display:none}
.alerta-erro{background:#FEF2F2;border:1px solid #FECACA;color:#991B1B}
.alerta-ok{background:#ECFDF5;border:1px solid #A7F3D0;color:#065F46}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
    </div>
    <div>
      <div style="font-weight:700;font-size:13px;color:#111827;letter-spacing:.1em">SIGUC-AC</div>
      <div style="font-size:10px;color:#9CA3AF">SEMA/AC</div>
    </div>
  </div>
  <div class="titulo">Trocar Senha</div>
  <div class="sub">Por segurança, defina uma nova senha para continuar.</div>
  <div class="alerta alerta-erro" id="msg-erro"></div>
  <div class="alerta alerta-ok" id="msg-ok"></div>
  <div class="form-group"><label class="form-label">Nova Senha</label><input class="form-input" type="password" id="senha1" placeholder="Mínimo 8 caracteres"></div>
  <div class="form-group"><label class="form-label">Confirmar Senha</label><input class="form-input" type="password" id="senha2"></div>
  <button class="btn" id="btn" onclick="trocar()">Salvar Nova Senha</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://atqtybcsvepdabsvgaly.supabase.co'
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF0cXR5YmNzdmVwZGFic3ZnYWx5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0MjMzNzgsImV4cCI6MjA5NTk5OTM3OH0.hWx1AB2rK7xdco1Dgagm0XUOBPQbxZVE614SW4SKoLk'
const { createClient } = supabase
const db = createClient(SUPABASE_URL, SUPABASE_KEY)

async function trocar() {
  const s1 = document.getElementById('senha1').value
  const s2 = document.getElementById('senha2').value
  const erro = document.getElementById('msg-erro')
  const ok = document.getElementById('msg-ok')
  erro.style.display = 'none'; ok.style.display = 'none'
  if (s1.length < 8) { erro.textContent = 'A senha deve ter pelo menos 8 caracteres.'; erro.style.display = 'block'; return }
  if (s1 !== s2) { erro.textContent = 'As senhas não coincidem.'; erro.style.display = 'block'; return }
  const btn = document.getElementById('btn'); btn.disabled = true; btn.textContent = 'Salvando...'
  try {
    const { error } = await db.auth.updateUser({ password: s1 })
    if (error) throw error
    const { data: { session } } = await db.auth.getSession()
    if (session) await db.from('usuarios').update({ deve_trocar_senha: false }).eq('id', session.user.id)
    ok.textContent = 'Senha alterada com sucesso! Redirecionando...'; ok.style.display = 'block'
    setTimeout(() => { window.location.href = 'dashboard.html' }, 2000)
  } catch(e) { erro.textContent = e.message || 'Erro ao trocar senha.'; erro.style.display = 'block' }
  finally { btn.disabled = false; btn.textContent = 'Salvar Nova Senha' }
}
document.getElementById('senha2').addEventListener('keydown', e => { if (e.key === 'Enter') trocar() })
</script>
</body>
</html>
