<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SIGUC-AC · Relatórios de Brigadas</title>
<link rel="stylesheet" href="../css/global.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/observability.js"></script>
<script src="../js/queryLogger.js"></script>
<script src="../js/config.js"></script>
<script src="../js/layout.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<style>
/* ── Tokens de natureza ──────────────────────────────── */
:root {
  --nat-prev:#12A66A; --nat-comb:#EF5B3C; --nat-moni:#3B82C4;
  --nat-prev-bg:rgba(18,166,106,.12); --nat-comb-bg:rgba(239,91,60,.12); --nat-moni-bg:rgba(59,130,196,.12);
}

/* ── Header de filtros ───────────────────────────────── */
.rel-topbar { display:flex; gap:10px; flex-wrap:wrap; align-items:center;
              background:var(--branco); border:1px solid var(--borda);
              border-radius:var(--raio-lg); padding:14px 16px; margin-bottom:18px }
.rel-topbar label { font-size:.78rem; font-weight:600; color:var(--cinza-500);
                    text-transform:uppercase; letter-spacing:.05em }
.rel-topbar select, .rel-topbar input[type=date] {
  padding:6px 10px; border-radius:7px; border:1.5px solid var(--borda);
  font-size:.84rem; background:var(--branco); font-family:inherit }
.periodo-custom { display:flex; gap:6px; align-items:center }

/* ── Tabs ────────────────────────────────────────────── */
.rel-tabs { display:flex; gap:0; border-bottom:2px solid var(--borda); margin-bottom:18px }
.rel-tab { padding:9px 20px; font-size:.85rem; font-weight:600; border:none;
           background:transparent; cursor:pointer; color:var(--cinza-500);
           border-bottom:2.5px solid transparent; margin-bottom:-2px; transition:.15s;
           font-family:inherit }
.rel-tab.ativo { color:var(--floresta); border-bottom-color:var(--verde-c) }
.rel-tab:hover:not(.ativo) { color:var(--cinza-800) }

/* ── Seção de nível ──────────────────────────────────── */
.nivel-sel { display:flex; gap:10px; align-items:center; margin-bottom:16px; flex-wrap:wrap }
.nivel-sel select { padding:7px 12px; border-radius:8px; border:1.5px solid var(--borda);
                    font-size:.87rem; min-width:220px; font-family:inherit }

/* ── Cards KPI de brigadas ───────────────────────────── */
.kpi-row-brig { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr));
                gap:10px; margin-bottom:18px }
.kpi-brig { background:var(--branco); border:1px solid var(--borda); border-radius:10px;
            padding:12px 14px; border-top:3px solid var(--borda) }
.kpi-brig.prev  { border-top-color:var(--nat-prev) }
.kpi-brig.comb  { border-top-color:var(--nat-comb) }
.kpi-brig.moni  { border-top-color:var(--nat-moni) }
.kpi-brig.ok    { border-top-color:#059669 }
.kpi-brig.warn  { border-top-color:#f59e0b }
.kpi-brig.fauna { border-top-color:#7c3aed }
.kpi-brig-n { font-size:1.7rem; font-weight:700; line-height:1.1;
              color:var(--floresta); font-family:'Fraunces',Georgia,serif }
.kpi-brig-l { font-size:.75rem; color:var(--cinza-500); margin-top:2px }

/* ── Gráfico de barras CSS ───────────────────────────── */
.chart-card { background:var(--branco); border:1px solid var(--borda);
              border-radius:var(--raio-lg); padding:16px;
              box-shadow:0 2px 10px rgba(0,0,0,.06), 0 1px 3px rgba(0,0,0,.04) }
.chart-title { font-size:.78rem; font-weight:700; color:var(--cinza-500);
               text-transform:uppercase; letter-spacing:.06em; margin-bottom:12px }
.bar-row { display:flex; align-items:center; gap:8px; margin-bottom:9px }
.bar-label { font-size:.78rem; color:var(--cinza-700); min-width:140px; flex-shrink:0;
             white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.bar-label.sm { min-width:90px }
.bar-wrap { flex:1; height:8px; background:var(--cinza-100); border-radius:4px; overflow:hidden }
.bar-fill { height:100%; border-radius:4px; transition:width .45s cubic-bezier(.4,0,.2,1) }
.bar-val { font-size:.76rem; font-weight:600; color:var(--cinza-700); min-width:28px; text-align:right }
.chart-empty { font-size:.82rem; color:var(--cinza-400); padding:8px 0 }

/* ── Tabela de relatório ─────────────────────────────── */
.rel-table { width:100%; border-collapse:collapse; font-size:.82rem }
.rel-table th { padding:8px 10px; text-align:left; font-size:.72rem; font-weight:700;
                color:var(--cinza-500); text-transform:uppercase; letter-spacing:.05em;
                border-bottom:1.5px solid var(--borda) }
.rel-table td { padding:9px 10px; border-bottom:1px solid var(--cinza-100);
                color:var(--cinza-800) }
.rel-table tr:last-child td { border-bottom:none }
.rel-table tr:hover td { background:var(--cinza-50) }

/* ── Chip de natureza ────────────────────────────────── */
.nat-chip { display:inline-flex; align-items:center; gap:3px; padding:2px 8px;
            border-radius:999px; font-size:.72rem; font-weight:600 }
.nat-chip.prevencao   { background:var(--nat-prev-bg); color:var(--nat-prev) }
.nat-chip.combate     { background:var(--nat-comb-bg); color:var(--nat-comb) }
.nat-chip.monitoramento { background:var(--nat-moni-bg); color:var(--nat-moni) }

/* ── Exportar ────────────────────────────────────────── */
.btn-export { display:flex; align-items:center; gap:5px; padding:7px 14px;
              border-radius:8px; border:1.5px solid var(--borda); background:var(--branco);
              font-size:.82rem; font-weight:600; cursor:pointer; color:var(--cinza-700);
              font-family:inherit; white-space:nowrap }
.btn-export:hover { background:var(--cinza-50) }

/* ── Loading skeleton ────────────────────────────────── */
.skel { background:linear-gradient(90deg,#f3f4f6 25%,#e9eaec 50%,#f3f4f6 75%);
        background-size:200% 100%; animation:skel .9s infinite; border-radius:6px; height:14px }
@keyframes skel{ from{background-position:200% 0} to{background-position:-200% 0} }

/* ── Canvas charts ───────────────────────────────────── */
.chart-canvas-wrap { position:relative; width:100% }
.chart-grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px }
@media(max-width:640px){ .chart-grid-2{ grid-template-columns:1fr } }

/* ── Fauna tab ───────────────────────────────────────── */
.fauna-kpi-row { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:18px }
@media(max-width:640px){ .fauna-kpi-row{ grid-template-columns:repeat(2,1fr) } }

.fkpi { border-radius:12px; padding:16px 18px; display:flex; flex-direction:column; gap:2px;
        position:relative; overflow:hidden }
.fkpi::before { content:''; position:absolute; top:0; right:0; width:64px; height:64px;
                border-radius:50%; opacity:.08; transform:translate(20px,-20px) }
.fkpi-total  { background:#0A1A0F; color:#fff }
.fkpi-total::before  { background:#52B788 }
.fkpi-resg   { background:#1e3a5f; color:#fff }
.fkpi-resg::before   { background:#60a5fa }
.fkpi-cetas  { background:#3d1f6e; color:#fff }
.fkpi-cetas::before  { background:#c084fc }
.fkpi-obito  { background:#3d1510; color:#fff }
.fkpi-obito::before  { background:#f87171 }

.fkpi-n { font-size:2rem; font-weight:700; line-height:1; font-family:'Fraunces',Georgia,serif;
          letter-spacing:-.02em }
.fkpi-l { font-size:.72rem; font-weight:500; opacity:.65; text-transform:uppercase;
          letter-spacing:.06em; margin-top:4px }

.fauna-grid-2x2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px }
@media(max-width:680px){ .fauna-grid-2x2{ grid-template-columns:1fr } }

.fauna-chart-card { background:#fff; border:1px solid #e5e7eb; border-radius:14px;
                    padding:20px 20px 14px; box-shadow:0 1px 4px rgba(0,0,0,.04) }
.fcc-header { display:flex; justify-content:space-between; align-items:flex-start;
              margin-bottom:16px }
.fcc-title { font-size:.82rem; font-weight:700; color:#0A1A0F; letter-spacing:-.01em }
.fcc-sub { font-size:.72rem; color:#9ca3af; margin-top:2px }
.fcc-badge { font-size:.7rem; font-weight:600; padding:3px 9px; border-radius:999px;
             background:#f3f4f6; color:#374151 }
.fauna-full-card { margin-bottom:14px }
.fauna-full-card .fauna-chart-card { border-radius:14px }

/* ── Botão Álbum de Fauna ────────────────────────────────────── */
.btn-abrir-album { display:inline-flex; align-items:center; gap:10px;
  padding:15px 32px; border-radius:16px; border:none; cursor:pointer;
  background:linear-gradient(135deg,#0A1A0F 0%,#2D6A4F 100%); color:#fff;
  font-size:.95rem; font-weight:700; letter-spacing:-.01em;
  font-family:'Fraunces',Georgia,serif;
  box-shadow:0 6px 24px rgba(10,26,15,.28); transition:transform .15s,box-shadow .15s }
.btn-abrir-album:hover { transform:translateY(-2px); box-shadow:0 10px 32px rgba(10,26,15,.38) }
.btn-abrir-album:active { transform:translateY(0) }

/* ── Overlay do Álbum (tela cheia) ──────────────────────────── */
.album-ov { position:fixed; inset:0; background:#f9fafb; z-index:8000;
            display:flex; flex-direction:column; overflow:hidden }
.album-ov-head { display:flex; align-items:center; gap:12px;
                 padding:14px 18px; background:#0A1A0F; color:#fff; flex-shrink:0 }
.album-ov-close { width:36px; height:36px; border-radius:50%; border:none;
                  background:rgba(255,255,255,.15); color:#fff; font-size:20px;
                  cursor:pointer; display:flex; align-items:center; justify-content:center;
                  flex-shrink:0; transition:background .15s }
.album-ov-close:hover { background:rgba(255,255,255,.3) }
.album-ov-titulo { font-family:'Fraunces',Georgia,serif; font-size:1rem; font-weight:700; flex:1 }
.album-ov-count { font-size:.75rem; color:rgba(255,255,255,.6) }
.album-ov-body { flex:1; overflow-y:auto; padding:14px 16px }
.album-chips { display:flex; gap:7px; overflow-x:auto; padding-bottom:6px; margin-bottom:14px;
               scrollbar-width:none; -webkit-overflow-scrolling:touch }
.album-chips::-webkit-scrollbar { display:none }
.album-chip { padding:6px 14px; border-radius:999px; font-size:.76rem; font-weight:600;
              border:1.5px solid #e5e7eb; background:#fff; color:#374151; cursor:pointer;
              white-space:nowrap; transition:all .15s; display:flex; align-items:center; gap:5px }
.album-chip.ativo { background:#0A1A0F; color:#fff; border-color:#0A1A0F }
.album-chip img { width:13px; height:13px; object-fit:contain; filter:grayscale(1); opacity:.6 }
.album-chip.ativo img { filter:brightness(0) invert(1); opacity:1 }
.album-grupo { margin-bottom:22px }
.album-grupo-header { font-size:.75rem; font-weight:700; color:#374151; margin-bottom:8px;
                      display:flex; align-items:center; gap:6px;
                      text-transform:uppercase; letter-spacing:.05em }
.album-grupo-count { font-size:.7rem; font-weight:500; color:#9ca3af;
                     background:#f3f4f6; border-radius:99px; padding:1px 8px }
.album-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:3px }
@media(max-width:480px){ .album-grid { grid-template-columns:repeat(2,1fr) } }
.album-thumb { position:relative; aspect-ratio:1; overflow:hidden; cursor:pointer;
               border-radius:3px; background:#e5e7eb }
.album-thumb img { width:100%; height:100%; object-fit:cover; transition:transform .2s }
.album-thumb:hover img { transform:scale(1.05) }
.album-thumb-badge { position:absolute; bottom:4px; right:4px; width:20px; height:20px;
                     background:rgba(0,0,0,.5); border-radius:50%;
                     display:flex; align-items:center; justify-content:center }
.album-thumb-badge img { width:12px; height:12px; filter:brightness(0) invert(1) }
.album-empty { text-align:center; padding:3rem 1rem; color:#9ca3af; font-size:.85rem;
               border:1.5px dashed #e5e7eb; border-radius:12px }

/* ── Lightbox com flip de carta (acima do álbum) ────────────── */
.lb-overlay { position:fixed; inset:0; background:rgba(0,0,0,.95); z-index:9000;
              display:flex; flex-direction:column; align-items:center; justify-content:center }
.lb-topbar { width:100%; display:flex; align-items:center; justify-content:space-between;
             padding:12px 16px; flex-shrink:0 }
.lb-counter { font-size:.74rem; color:rgba(255,255,255,.6); letter-spacing:.05em }
.lb-close { width:40px; height:40px; border-radius:50%; border:2px solid rgba(255,255,255,.3);
            background:rgba(255,255,255,.12); color:#fff; font-size:22px; cursor:pointer;
            display:flex; align-items:center; justify-content:center; transition:background .15s;
            flex-shrink:0 }
.lb-close:hover { background:rgba(255,255,255,.3) }
.lb-mid { flex:1; display:flex; align-items:center; justify-content:center;
          gap:12px; width:100%; padding:0 8px; min-height:0 }
.lb-nav { background:rgba(255,255,255,.1); border:none; color:#fff; font-size:30px;
          width:44px; height:72px; border-radius:8px; cursor:pointer; flex-shrink:0;
          display:flex; align-items:center; justify-content:center; transition:background .15s }
.lb-nav:hover { background:rgba(255,255,255,.25) }
.lb-nav:disabled { opacity:.2; cursor:default }
.lb-img-wrap { flex:1; display:flex; align-items:center; justify-content:center; min-width:0 }
.lb-img-wrap img { max-width:100%; max-height:62vh; object-fit:contain; display:block;
                   border-radius:8px; box-shadow:0 24px 80px rgba(0,0,0,.7);
                   user-select:none; -webkit-user-drag:none }
.lb-img-wrap.flip-out { animation:lbFlipOut .2s ease-in forwards }
.lb-img-wrap.flip-in  { animation:lbFlipIn  .2s ease-out forwards }
@keyframes lbFlipOut {
  from { transform:perspective(900px) rotateY(0deg); opacity:1 }
  to   { transform:perspective(900px) rotateY(-90deg); opacity:0 }
}
@keyframes lbFlipIn {
  from { transform:perspective(900px) rotateY(90deg); opacity:0 }
  to   { transform:perspective(900px) rotateY(0deg); opacity:1 }
}
.lb-meta { width:100%; padding:16px 24px 20px; text-align:center; flex-shrink:0;
           background:linear-gradient(transparent,rgba(0,0,0,.6)); }
.lb-meta-nome { font-size:.95rem; font-weight:700; color:#fff;
                font-family:'Fraunces',Georgia,serif; margin-bottom:3px }
.lb-meta-cient { font-size:.73rem; color:#a1a1aa; font-style:italic; margin-bottom:8px }
.lb-meta-chips { display:flex; gap:6px; justify-content:center; flex-wrap:wrap }
.lb-meta-chip { font-size:.69rem; padding:3px 10px; border-radius:999px;
                background:rgba(255,255,255,.18); color:#fff }
</style>
</head>
<body>
<div id="app"></div>
<script>
// ════════════════════════════════════════════════════════════════
// Estado global
// ════════════════════════════════════════════════════════════════
let _usuario   = null
let _registros = []   // vw_registros_validacao no período
let _brigadas  = []   // brigadas
let _brists    = []   // brigadistas
let _faunaData = []   // registro_fauna enriquecido com regional/brigada
let _tabAtiva  = 'estado'
let _carregando = false

// ── Labels ─────────────────────────────────────────────────────
const NAT_LAB  = { prevencao:'Prevenção', combate:'Combate', monitoramento:'Monitoramento' }
const NAT_COR  = { prevencao:'#12A66A',   combate:'#EF5B3C', monitoramento:'#3B82C4' }
const NAT_ICON = { prevencao:'shield', combate:'flame', monitoramento:'binoculo' }
const natIco = n => bico(NAT_ICON[n] || '')
const ATIV_LAB = {
  fogo:'Combate a fogo', educacao_ambiental:'Educação ambiental',
  limpeza:'Limpeza/aceiro', reconhecimento:'Reconhecimento',
  plantio:'Plantio', primeiros_socorros:'Primeiros socorros',
  queima_controlada:'Queima controlada', outro:'Outro',
}
const REGIONAL_LAB = {
  baixo_acre:'Baixo Acre', purus:'Purus', jurua:'Juruá',
  tarauaca_envira:'Tarauacá-Envira', alto_acre:'Alto Acre',
}
const STATUS_LAB = {
  aguardando:'Aguardando', validado:'Validado',
  requer_correcao:'Requer correção', rejeitado:'Rejeitado',
}

// ════════════════════════════════════════════════════════════════
// Inicialização
// ════════════════════════════════════════════════════════════════
;(async function () {
  _usuario = await carregarUsuario()
  if (!_usuario) { window.location.href = '../index.html'; return }

  const perfisPermitidos = ['biologo','tecnico','gestor','super_admin']
  if (!perfisPermitidos.includes(_usuario.perfil)) {
    document.getElementById('app').innerHTML =
      gerarLayout('Relatórios de Brigadas','relatorios-brigadas') +
      '<div class="page-content"><div class="alert alert-danger">Acesso restrito.</div></div>'
    return
  }

  document.getElementById('app').innerHTML =
    gerarLayout('Relatórios de Brigadas','relatorios-brigadas') + htmlPagina()

  // Eventos de período
  document.getElementById('sel-periodo').addEventListener('change', e => {
    const custom = document.getElementById('periodo-custom')
    custom.style.display = e.target.value === 'custom' ? 'flex' : 'none'
    if (e.target.value !== 'custom') gerarRelatorio()
  })
  document.getElementById('btn-gerar').addEventListener('click', gerarRelatorio)
  document.getElementById('btn-exportar').addEventListener('click', exportarCSV)

  // Tabs
  document.querySelectorAll('.rel-tab').forEach(t => {
    t.addEventListener('click', () => {
      document.querySelectorAll('.rel-tab').forEach(x => x.classList.remove('ativo'))
      t.classList.add('ativo')
      _tabAtiva = t.dataset.tab
      renderTabAtiva()
    })
  })

  // Filtros de nível regional / UC
  document.getElementById('sel-regional').addEventListener('change', renderRegional)
  document.getElementById('sel-uc').addEventListener('change', renderUC)

  // Período padrão: mês atual
  setPeriodoMes()
  await gerarRelatorio()

  if (window._sigucBar) _sigucBarCompleta()
})()

// ════════════════════════════════════════════════════════════════
// HTML estático da página
// ════════════════════════════════════════════════════════════════
function htmlPagina() {
  const hoje = new Date()
  const m1   = new Date(hoje.getFullYear(), hoje.getMonth(), 1).toISOString().slice(0,10)
  const m2   = hoje.toISOString().slice(0,10)

  return `<div class="page-content">
  <div class="page-header" style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px">
    <div>
      <h1 class="page-title">Relatórios de Brigadas</h1>
      <p class="page-subtitle">Análise em 3 níveis: estado, regional e por unidade de conservação</p>
    </div>
    <button class="btn-export" id="btn-exportar">${bico('download')} Exportar CSV</button>
  </div>

  <!-- Filtro de período -->
  <div class="rel-topbar">
    <div>
      <label>Período</label>
      <select id="sel-periodo" style="margin-left:8px">
        <option value="mes">Mês atual</option>
        <option value="30d">Últimos 30 dias</option>
        <option value="90d">Últimos 90 dias</option>
        <option value="ano">Este ano</option>
        <option value="custom">Personalizado</option>
      </select>
    </div>
    <div class="periodo-custom" id="periodo-custom" style="display:none">
      <input type="date" id="periodo-ini" value="${m1}">
      <span style="font-size:.8rem;color:var(--cinza-400)">até</span>
      <input type="date" id="periodo-fim" value="${m2}">
      <button class="btn btn-sm btn-primary" id="btn-gerar">Gerar</button>
    </div>
    <span id="periodo-label" style="font-size:.82rem;color:var(--cinza-500)"></span>
  </div>

  <!-- Tabs -->
  <div class="rel-tabs">
    <button class="rel-tab ativo" data-tab="estado">${bico('map')} Estado do Acre</button>
    <button class="rel-tab" data-tab="regional">${bico('pin')} Por Regional</button>
    <button class="rel-tab" data-tab="uc">${bico('tree')} Por UC</button>
    <button class="rel-tab" data-tab="fauna">${bico('paw')} Fauna</button>
  </div>

  <!-- Loading -->
  <div id="rel-loading" hidden>
    <div style="display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));margin-bottom:18px">
      ${Array(6).fill('<div class="skel" style="height:70px;border-radius:10px"></div>').join('')}
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
      ${Array(4).fill('<div class="skel" style="height:180px;border-radius:12px"></div>').join('')}
    </div>
  </div>

  <!-- Conteúdo das tabs -->
  <div id="tab-estado"></div>

  <div id="tab-regional" hidden>
    <div class="nivel-sel">
      <label style="font-size:.84rem;font-weight:600;color:var(--cinza-600)">Regional:</label>
      <select id="sel-regional">
        <option value="">Selecione a regional…</option>
        ${Object.entries(REGIONAL_LAB).map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}
      </select>
    </div>
    <div id="conteudo-regional"></div>
  </div>

  <div id="tab-uc" hidden>
    <div class="nivel-sel">
      <label style="font-size:.84rem;font-weight:600;color:var(--cinza-600)">Unidade de Conservação:</label>
      <select id="sel-uc"><option value="">Selecione a UC…</option></select>
    </div>
    <div id="conteudo-uc"></div>
  </div>

  <div id="tab-fauna" hidden></div>
</div>`
}

// ════════════════════════════════════════════════════════════════
// Período
// ════════════════════════════════════════════════════════════════
function setPeriodoMes() {
  const hoje = new Date()
  const ini  = new Date(hoje.getFullYear(), hoje.getMonth(), 1)
  document.getElementById('periodo-ini').value = ini.toISOString().slice(0,10)
  document.getElementById('periodo-fim').value = hoje.toISOString().slice(0,10)
}

function getPeriodo() {
  const sel  = document.getElementById('sel-periodo').value
  const hoje = new Date()
  let ini, fim = hoje

  if (sel === 'custom') {
    return {
      ini: document.getElementById('periodo-ini').value,
      fim: document.getElementById('periodo-fim').value,
    }
  }
  if (sel === 'mes')  ini = new Date(hoje.getFullYear(), hoje.getMonth(), 1)
  if (sel === '30d')  ini = new Date(hoje - 30*86400*1000)
  if (sel === '90d')  ini = new Date(hoje - 90*86400*1000)
  if (sel === 'ano')  ini = new Date(hoje.getFullYear(), 0, 1)
  return {
    ini: ini.toISOString().slice(0,10),
    fim: fim.toISOString().slice(0,10),
  }
}

function exibirPeriodoLabel(ini, fim) {
  const fmt = d => new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'})
  document.getElementById('periodo-label').textContent = `${fmt(ini)} → ${fmt(fim)}`
}

// Carregamento de dados
// ════════════════════════════════════════════════════════════════
async function gerarRelatorio() {
  if (_carregando) return
  _carregando = true

  const { ini, fim } = getPeriodo()
  exibirPeriodoLabel(ini, fim)

  document.getElementById('rel-loading').hidden = false
  document.getElementById('tab-estado').innerHTML  = ''
  document.getElementById('conteudo-regional').innerHTML = ''
  document.getElementById('conteudo-uc').innerHTML = ''

  const [regRes, brigRes, bristRes] = await Promise.all([
    db.from('vw_registros_validacao')
      .select('id,natureza,atividade,status_validacao,data_hora_evento,regional,uc_id,uc_nome,brigada_id,brigada_nome,brigadista_id,brigadista_nome,equipe_id,equipe_nome,duracao_horas,n_fauna,n_fauna_pendente,n_fauna_resgatada,fotos_urls,area_estimada_ha,pessoas_alcancadas,integrada_cbmac')
      .gte('data_hora_evento', ini + 'T00:00:00')
      .lte('data_hora_evento', fim + 'T23:59:59')
      .order('data_hora_evento', { ascending: false })
      .limit(5000),
    db.from('brigadas').select('id,nome,regional,uc_id,ativa,num_brigadistas').eq('ativa', true),
    db.from('brigadistas').select('id,nome_completo,brigada_id,status').eq('status','ativo'),
  ])

  _registros = regRes.data  || []
  _brigadas  = brigRes.data || []
  _brists    = bristRes.data || []

  // Fauna: busca pelos IDs dos registros já filtrados por período/RLS e
  // enriquece regional/brigada a partir do próprio registro (evita filtro
  // embutido do PostgREST, que não propaga de forma confiável)
  _faunaData = await carregarFauna(_registros)

  // Preenche dropdown de UCs
  const ucs = {}
  _registros.forEach(r => { if (r.uc_id && r.uc_nome) ucs[r.uc_id] = r.uc_nome })
  _brigadas.forEach(b => { if (b.uc_id) ucs[b.uc_id] = ucs[b.uc_id] || b.nome })
  const selUC = document.getElementById('sel-uc')
  const ucAtual = selUC.value
  selUC.innerHTML = '<option value="">Selecione a UC…</option>' +
    Object.entries(ucs).sort((a,b)=>a[1].localeCompare(b[1]))
      .map(([id,nome]) => `<option value="${id}" ${id===ucAtual?'selected':''}>${esc(nome)}</option>`)
      .join('')

  document.getElementById('rel-loading').hidden = true
  _carregando = false

  renderTabAtiva()
}

// Carrega registro_fauna pelos IDs dos registros do período e enriquece
// com regional/brigada_nome do próprio registro (mapa em memória).
async function carregarFauna(registros) {
  const ids = registros.map(r => r.id).filter(Boolean)
  if (!ids.length) return []

  const regById = {}
  registros.forEach(r => { regById[r.id] = r })

  // Catálogo de espécies para resolver o nome popular (registro_fauna
  // costuma trazer só o nome científico). RLS: especies_fauna é leitura
  // pública. Indexa por especie_id e por nome científico normalizado.
  const popById = {}, popByNc = {}
  try {
    const { data: cat } = await db.from('especies_fauna').select('id,nome_cientifico,nomes_populares')
    ;(cat || []).forEach(e => {
      const pop = Array.isArray(e.nomes_populares) && e.nomes_populares.length ? e.nomes_populares[0] : null
      if (!pop) return
      if (e.id) popById[e.id] = pop
      if (e.nome_cientifico) popByNc[e.nome_cientifico.trim().toLowerCase()] = pop
    })
  } catch (e) { console.error('[fauna] catálogo de espécies', e) }

  // Chunk para não estourar o tamanho da URL (filtro .in com muitos UUIDs)
  const CHUNK = 150
  const linhas = []
  for (let i = 0; i < ids.length; i += CHUNK) {
    const fatia = ids.slice(i, i + CHUNK)
    const { data, error } = await db.from('registro_fauna')
      .select('classe,quantidade,tipo_evento,condicao,causa_aparente,destinacao,nome_popular,nome_cientifico,especie_id,registro_campo_id,fotos_urls')
      .in('registro_campo_id', fatia)
      .limit(5000)
    if (error) { console.error('[fauna] erro ao carregar', error); continue }
    if (data) linhas.push(...data)
  }

  return linhas.map(f => {
    const nc = (f.nome_cientifico || '').trim()
    const popResolvido = (f.nome_popular || '').trim() || popById[f.especie_id] || popByNc[nc.toLowerCase()] || null
    return {
      ...f,
      regional:         regById[f.registro_campo_id]?.regional,
      brigada_nome:     regById[f.registro_campo_id]?.brigada_nome,
      data_hora_evento: regById[f.registro_campo_id]?.data_hora_evento,
      nome_popular_cat: popResolvido,
    }
  })
}

// Gerenciamento de instâncias Chart.js
// ════════════════════════════════════════════════════════════════
let _charts = {}

function destroyCharts(...ids) {
  const alvo = ids.length ? ids : Object.keys(_charts)
  alvo.forEach(id => { if (_charts[id]) { _charts[id].destroy(); delete _charts[id] } })
}

// Plugin datalabels (CDN): registra uma vez e o deixa DESLIGADO por padrão;
// ligamos explicitamente só nos gráficos de fauna (não afeta as outras abas).
let _dlInit = false
function ensureDatalabels() {
  if (_dlInit || typeof ChartDataLabels === 'undefined') return
  Chart.register(ChartDataLabels)
  Chart.defaults.set('plugins.datalabels', { display: false })
  _dlInit = true
}

// Formatter "valor (%)" para datasets simples (% sobre o total do dataset)
function dlValPct(value, ctx) {
  if (!value) return ''
  const arr   = ctx.chart.data.datasets[ctx.datasetIndex].data
  const total = arr.reduce((a, b) => a + (Number(b) || 0), 0) || 1
  return `${value} (${Math.round(value / total * 100)}%)`
}
// Formatter "valor (%)" para barras empilhadas (% dentro da linha/regional)
function dlValPctStack(value, ctx) {
  if (!value) return ''
  const i     = ctx.dataIndex
  const total = ctx.chart.data.datasets.reduce((a, ds) => a + (Number(ds.data[i]) || 0), 0) || 1
  return `${value} (${Math.round(value / total * 100)}%)`
}

function initChart(id, config) {
  const canvas = document.getElementById(id)
  if (!canvas) return
  if (_charts[id]) _charts[id].destroy()
  ensureDatalabels()
  Chart.defaults.font.family = "'DM Sans', system-ui, sans-serif"
  Chart.defaults.font.size   = 11
  Chart.defaults.color       = '#6b7280'
  _charts[id] = new Chart(canvas.getContext('2d'), config)
}

// Clareia/escurece uma cor hex (#rrggbb). f<0 escurece, f>0 clareia.
function shadeCor(hex, f) {
  const n = parseInt(String(hex).replace('#',''), 16)
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255
  const aj = v => Math.max(0, Math.min(255, Math.round(v * (1 + f))))
  return `rgb(${aj(r)},${aj(g)},${aj(b)})`
}

// Plugin pseudo-3D para rosca: desenha camadas escurecidas deslocadas
// para baixo (extrusão), simulando profundidade. Inline = só na rosca
// onde é declarado (não afeta os outros gráficos).
const pseudo3DDoughnut = {
  id: 'pseudo3d',
  beforeDatasetsDraw(chart, _args, opts) {
    const meta = chart.getDatasetMeta(0)
    if (!meta || !meta.data || !meta.data.length) return
    const depth = (opts && opts.depth) || 16
    const ds = chart.data.datasets[0]
    const ctx = chart.ctx
    ctx.save()
    for (let d = depth; d >= 1; d--) {
      meta.data.forEach((arc, i) => {
        const p = arc.getProps(['x','y','startAngle','endAngle','innerRadius','outerRadius'], false)
        if (p.endAngle === p.startAngle) return
        ctx.beginPath()
        ctx.fillStyle = shadeCor(ds.backgroundColor[i] || '#888', -0.40)
        ctx.arc(p.x, p.y + d, p.outerRadius, p.startAngle, p.endAngle)
        ctx.arc(p.x, p.y + d, p.innerRadius, p.endAngle, p.startAngle, true)
        ctx.closePath()
        ctx.fill()
      })
    }
    ctx.restore()
  }
}

// ── Tempo: formata horas decimais como "2h 30min" ─────────────
function fmtHoras(h) {
  const min = Math.round((Number(h)||0) * 60)
  const hh = Math.floor(min/60), mm = min%60
  return hh && mm ? `${hh}h ${mm}min` : hh ? `${hh}h` : `${mm}min`
}

function chartAreaAcumulada(rows, sfx='') {
  return `<div class="chart-title">Área trabalhada por mês e acumulado (ha)</div>
    <div class="chart-canvas-wrap" style="height:240px">
      <canvas id="chart-area${sfx}"></canvas>
    </div>`
}
function initChartAreaAcumulada(rows, sfx='') {
  // Agrupa área por mês (YYYY-MM)
  const mensal = {}
  rows.forEach(r => {
    if (!r.data_hora_evento || !r.area_estimada_ha) return
    const key = r.data_hora_evento.slice(0,7)
    mensal[key] = (mensal[key]||0) + Number(r.area_estimada_ha)
  })

  // Últimos 12 meses (mesmo que zerados)
  const meses = []
  for (let i = 11; i >= 0; i--) {
    const d = new Date(); d.setMonth(d.getMonth()-i, 1)
    meses.push(d.toISOString().slice(0,7))
  }
  // Filtra apenas meses com dados ou o intervalo real dos dados
  const mesesComDados = meses.filter(m => mensal[m] != null)
  const mesesUsados   = mesesComDados.length ? meses.filter(m =>
    m >= mesesComDados[0] && m <= mesesComDados[mesesComDados.length-1]
  ) : meses

  const labels    = mesesUsados.map(m => {
    const [a, mes] = m.split('-')
    return new Date(+a, +mes-1, 1).toLocaleDateString('pt-BR',{month:'short',year:'2-digit'})
  })
  const areaMensal = mesesUsados.map(m => +(mensal[m]||0).toFixed(2))

  // Acumulado (running sum)
  let acc = 0
  const areaAcum = areaMensal.map(v => +(acc += v).toFixed(2))

  initChart('chart-area'+sfx, {
    type: 'bar',
    data: {
      labels,
      datasets: [
        {
          type: 'bar',
          label: 'Área mensal (ha)',
          data: areaMensal,
          backgroundColor: 'rgba(201,168,76,.75)',
          borderColor: '#C9A84C',
          borderWidth: 1.5,
          borderRadius: 5,
          yAxisID: 'y',
          order: 2,
        },
        {
          type: 'line',
          label: 'Acumulado (ha)',
          data: areaAcum,
          borderColor: '#EF5B3C',
          backgroundColor: 'rgba(239,91,60,.10)',
          fill: true,
          tension: 0.35,
          pointRadius: 5,
          pointBackgroundColor: '#EF5B3C',
          pointBorderColor: '#fff',
          pointBorderWidth: 2,
          pointHoverRadius: 7,
          yAxisID: 'yAcum',
          order: 1,
        },
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode:'index', intersect:false },
      plugins: {
        legend: { position:'bottom', labels:{ boxWidth:11, padding:14 } },
        tooltip: {
          callbacks: {
            label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y.toLocaleString('pt-BR',{minimumFractionDigits:1})} ha`
          }
        }
      },
      scales: {
        x: { grid:{ display:false }, ticks:{ maxRotation:35, font:{ size:10 } } },
        y: {
          beginAtZero: true, position:'left',
          title:{ display:true, text:'Mensal (ha)', font:{ size:10 }, color:'#C9A84C' },
          ticks:{ color:'#C9A84C', font:{ size:10 } },
          grid:{ color:'rgba(0,0,0,.05)' },
        },
        yAcum: {
          beginAtZero: true, position:'right',
          title:{ display:true, text:'Acumulado (ha)', font:{ size:10 }, color:'#EF5B3C' },
          ticks:{ color:'#EF5B3C', font:{ size:10 } },
          grid:{ drawOnChartArea:false },
        },
      }
    }
  })
}

// ── Ranking de equipes (desempenho) ──────────────────────────
let _equipeSort = 'n'   // n | area | fauna | horas
const EQUIPE_METRICA_LAB = { n: 'registros', area: 'área (ha)', fauna: 'fauna resgatada', horas: 'horas' }

function dadosEquipes(registros) {
  const cnt = agruparObj((registros || []).filter(r => r.equipe_id), 'equipe_id')
  return Object.entries(cnt).map(([id, regs]) => {
    const r0 = regs[0] || {}
    return {
      id,
      nome:    r0.equipe_nome ? `Equipe ${r0.equipe_nome}` : '—',
      brigada: r0.brigada_nome || '—',
      n:       regs.length,
      area:    regs.reduce((s, r) => s + (Number(r.area_estimada_ha) || 0), 0),
      fauna:   regs.reduce((s, r) => s + (Number(r.n_fauna_resgatada) || 0), 0),
      horas:   regs.reduce((s, r) => s + (Number(r.duracao_horas) || 0), 0),
    }
  })
}

function renderTabelaEquipes() {
  const cont = document.getElementById('tab-equipes-cont')
  if (!cont) return
  const rows = dadosEquipes(_registros).sort((a, b) => b[_equipeSort] - a[_equipeSort]).slice(0, 10)
  if (!rows.length) {
    cont.innerHTML = '<p class="chart-empty" style="padding:12px">Nenhuma equipe com registros no período</p>'
    return
  }
  const on = m => _equipeSort === m ? ' style="font-weight:700;color:#0A1A0F"' : ''
  cont.innerHTML = `<table class="rel-table">
    <thead><tr>
      <th>Equipe</th><th>Brigada</th>
      <th${on('n')}>Registros</th>
      <th${on('area')}>Área (ha)</th>
      <th${on('fauna')}>Fauna resg.</th>
      <th${on('horas')}>Horas</th>
    </tr></thead>
    <tbody>${rows.map((r, i) => `<tr>
      <td>${i === 0 ? bico('award') + ' ' : ''}<strong>${esc(r.nome)}</strong></td>
      <td style="font-size:.82rem;color:var(--cinza-500)">${esc(r.brigada)}</td>
      <td${on('n')}>${r.n}</td>
      <td${on('area')}>${r.area > 0 ? formatNum(r.area, 1) : '—'}</td>
      <td${on('fauna')}>${r.fauna > 0 ? `${bico('paw')} ${r.fauna}` : '—'}</td>
      <td${on('horas')}>${r.horas > 0 ? formatNum(r.horas, 1) : '—'}</td>
    </tr>`).join('')}</tbody>
  </table>`
}

function tabelaEquipes() {
  return `
    <div style="display:flex;align-items:center;gap:8px;padding:8px 12px;flex-wrap:wrap">
      <span style="font-size:.82rem;color:var(--cinza-500)">Melhor desempenho por:</span>
      <select id="sel-equipe-metrica" class="form-control" style="width:auto;min-width:170px"
              onchange="_equipeSort=this.value;renderTabelaEquipes()">
        <option value="n">Nº de registros</option>
        <option value="area">Área trabalhada (ha)</option>
        <option value="fauna">Fauna resgatada</option>
        <option value="horas">Horas de trabalho</option>
      </select>
    </div>
    <div id="tab-equipes-cont" style="overflow-x:auto"></div>`
}

function tabelaBrigadas(registros, brigadas) {
  const cnt = agruparObj(registros, 'brigada_id')
  const rows = Object.entries(cnt)
    .map(([brigId, regs]) => {
      const brig = brigadas.find(b=>b.id===brigId) || {}
      const nFauna = regs.reduce((s,r)=>s+(r.n_fauna||0),0)
      const pctVal = regs.length ? Math.round(regs.filter(r=>r.status_validacao==='validado').length/regs.length*100) : 0
      return { nome: regs[0]?.brigada_nome || brig.nome || '—', n: regs.length, fauna: nFauna, pct: pctVal, regional: brig.regional }
    })
    .sort((a,b)=>b.n-a.n).slice(0,10)

  if (!rows.length) return '<p class="chart-empty" style="padding:12px">Sem dados</p>'
  return `<table class="rel-table">
    <thead><tr>
      <th>Brigada</th><th>Regional</th><th>Registros</th><th>Fauna</th><th>% Validado</th>
    </tr></thead>
    <tbody>${rows.map(r=>`<tr>
      <td>${esc(r.nome)}</td>
      <td>${r.regional ? (REGIONAL_LAB[r.regional]||r.regional) : '—'}</td>
      <td><strong>${r.n}</strong></td>
      <td>${r.fauna > 0 ? `${bico('paw')} ${r.fauna}` : '—'}</td>
      <td>
        <div style="display:flex;align-items:center;gap:6px">
          <div class="bar-wrap" style="width:60px"><div class="bar-fill" style="width:${r.pct}%;background:${r.pct>70?'#059669':r.pct>40?'#f59e0b':'#ef4444'}"></div></div>
          <span style="font-size:.76rem">${r.pct}%</span>
        </div>
      </td>
    </tr>`).join('')}</tbody>
  </table>`
}

function tabelaBrigadistas(registros) {
  const cnt = agruparObj(registros, 'brigadista_id')
  const rows = Object.entries(cnt)
    .map(([id, regs]) => {
      const ultima = regs[0]?.data_hora_evento
      const fauna  = regs.reduce((s,r)=>s+(r.n_fauna||0),0)
      const nats   = [...new Set(regs.map(r=>r.natureza).filter(Boolean))]
      return { nome: regs[0]?.brigadista_nome || '—', n: regs.length, ultima, fauna, nats }
    })
    .sort((a,b)=>b.n-a.n).slice(0,10)

  if (!rows.length) return '<p class="chart-empty" style="padding:12px">Sem dados</p>'
  return `<table class="rel-table">
    <thead><tr>
      <th>Brigadista</th><th>Naturezas</th><th>Registros</th><th>Fauna</th><th>Última atividade</th>
    </tr></thead>
    <tbody>${rows.map(r=>`<tr>
      <td>${esc(r.nome)}</td>
      <td>${r.nats.map(n=>`<span class="nat-chip ${n}">${natIco(n)}</span>`).join(' ')}</td>
      <td><strong>${r.n}</strong></td>
      <td>${r.fauna > 0 ? `${bico('paw')} ${r.fauna}` : '—'}</td>
      <td style="font-size:.78rem;color:var(--cinza-500)">${r.ultima ? new Date(r.ultima).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',timeZone:'America/Rio_Branco'}) : '—'}</td>
    </tr>`).join('')}</tbody>
  </table>`
}

function tabelaRegional(registros) {
  const cnt = agruparObj(registros, 'regional')
  const rows = Object.entries(REGIONAL_LAB).map(([k,lab]) => {
    const regs = cnt[k] || []
    const fauna = regs.reduce((s,r)=>s+(r.n_fauna||0),0)
    const pct   = regs.length ? Math.round(regs.filter(r=>r.status_validacao==='validado').length/regs.length*100) : 0
    return { regional: lab, n: regs.length, fauna, pct, key: k }
  }).sort((a,b)=>b.n-a.n)

  return `<table class="rel-table">
    <thead><tr>
      <th>Regional</th><th>Registros</th><th>Prevenção</th><th>Combate</th><th>Monitoramento</th><th>Fauna</th><th>% Valid.</th>
    </tr></thead>
    <tbody>${rows.map(r=>{
      const regs = cnt[r.key]||[]
      const prev = regs.filter(x=>x.natureza==='prevencao').length
      const comb = regs.filter(x=>x.natureza==='combate').length
      const moni = regs.filter(x=>x.natureza==='monitoramento').length
      return `<tr>
        <td><strong>${esc(r.regional)}</strong></td>
        <td>${r.n||'—'}</td>
        <td>${prev||'—'}</td>
        <td>${comb||'—'}</td>
        <td>${moni||'—'}</td>
        <td>${r.fauna||'—'}</td>
        <td>${r.n?r.pct+'%':'—'}</td>
      </tr>`
    }).join('')}</tbody>
  </table>`
}

function tabelaBrigadasDetalhe(registros, brigadas, brists) {
  if (!brigadas.length) return '<p class="chart-empty" style="padding:12px">Nenhuma brigada nesta regional.</p>'
  const cnt = agruparObj(registros, 'brigada_id')

  return `<table class="rel-table">
    <thead><tr>
      <th>Brigada</th><th>Brigadistas</th><th>Registros</th><th>Fauna</th><th>% Validado</th>
    </tr></thead>
    <tbody>${brigadas.map(b=>{
      const regs = cnt[b.id]||[]
      const nbr  = brists.filter(x=>x.brigada_id===b.id).length
      const nfauna = regs.reduce((s,r)=>s+(r.n_fauna||0),0)
      const pct = regs.length ? Math.round(regs.filter(r=>r.status_validacao==='validado').length/regs.length*100) : 0
      return `<tr>
        <td>${esc(b.nome)}</td>
        <td>${nbr}</td>
        <td>${regs.length||'—'}</td>
        <td>${nfauna||'—'}</td>
        <td>${regs.length?pct+'%':'—'}</td>
      </tr>`
    }).join('')}</tbody>
  </table>`
}

function tabelaAtividades(rows) {
  if (!rows.length) return '<p class="chart-empty" style="padding:12px">Sem atividades.</p>'
  return `<table class="rel-table">
    <thead><tr>
      <th>Data</th><th>Natureza</th><th>Atividade</th><th>Brigadista</th><th>Fauna</th><th>Status</th>
    </tr></thead>
    <tbody>${rows.map(r=>{
      const dt = r.data_hora_evento
        ? new Date(r.data_hora_evento).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',timeZone:'America/Rio_Branco'})
        : '—'
      const statusCor = {aguardando:'#f59e0b',validado:'#059669',requer_correcao:'#e879f9',rejeitado:'#ef4444'}[r.status_validacao]||'#6b7280'
      return `<tr>
        <td style="font-size:.78rem;white-space:nowrap">${dt}</td>
        <td><span class="nat-chip ${r.natureza}">${natIco(r.natureza)} ${NAT_LAB[r.natureza]||r.natureza}</span></td>

        <td><span style="font-size:.72rem;font-weight:600;color:${statusCor}">${STATUS_LAB[r.status_validacao]||r.status_validacao}</span></td>
      </tr>`
    }).join('')}</tbody>
  </table>`
}

// Álbum inteligente de fotos de fauna
// ════════════════════════════════════════════════════════════════
const ALBUM_ICONE = {
  mamifero:'/pwa/icons/fauna/mamifero.png', ave:'/pwa/icons/fauna/ave.png',
  reptil:'/pwa/icons/fauna/reptil.png',     anfibio:'/pwa/icons/fauna/anfibio.png',
  peixe:'/pwa/icons/fauna/peixe.png',       invertebrado:'/pwa/icons/fauna/invertebrado.png',
}
let _albumClasseFiltro = ''
let _albumFotos = []
let _lbIdx = 0

// ── Overlay do álbum ──────────────────────────────────────────
function albumGetOverlay() {
  if (document.getElementById('album-overlay')) return
  const el = document.createElement('div')
  el.id = 'album-overlay'
  el.className = 'album-ov'
  el.setAttribute('hidden', '')
  el.innerHTML = `
    <div class="album-ov-head">
      <button class="album-ov-close" id="album-ov-close" title="Fechar">&#x2715;</button>
      <div class="album-ov-titulo">Álbum de Fauna</div>
      <div class="album-ov-count" id="album-total"></div>
    </div>
    <div class="album-ov-body">
      <div class="album-chips" id="album-chips"></div>
      <div id="album-corpo"></div>
    </div>
  `
  document.body.appendChild(el)
  document.getElementById('album-ov-close').addEventListener('click', fecharAlbumOverlay)
  document.addEventListener('keydown', e => {
    if (!document.getElementById('album-overlay') || document.getElementById('album-overlay').hidden) return
    if (e.key === 'Escape' && document.getElementById('lb-overlay')?.hidden !== false) fecharAlbumOverlay()
  })
}

function abrirAlbumOverlay() {
  albumGetOverlay()
  _albumClasseFiltro = ''
  renderAlbumFauna()
  document.getElementById('album-overlay').removeAttribute('hidden')
  document.body.style.overflow = 'hidden'
}

function fecharAlbumOverlay() {
  const el = document.getElementById('album-overlay')
  if (el) el.setAttribute('hidden', '')
  document.body.style.overflow = ''
}

function renderAlbumFauna() {
  _albumFotos = _faunaData.flatMap(f => {
    const urls = Array.isArray(f.fotos_urls) ? f.fotos_urls : []
    if (!urls.length) return []
    const especie    = f.nome_popular_cat || f.nome_popular || ''
    const cientifico = f.nome_cientifico || ''
    const label = especie || cientifico || FAUNA_CLASSE_LAB[f.classe] || f.classe || '—'
    return urls.map(url => ({
      url, label, cientifico,
      classe:   f.classe || 'nao_sei',
      condicao: f.condicao,
      tipo:     f.tipo_evento,
      brigada:  f.brigada_nome || '',
      data:     f.data_hora_evento ? new Date(f.data_hora_evento).toLocaleDateString('pt-BR') : '',
    }))
  })

  const classesComFoto = [...new Set(_albumFotos.map(p => p.classe))]
  const chips = document.getElementById('album-chips')
  if (chips) {
    chips.innerHTML =
      `<button class="album-chip${_albumClasseFiltro===''?' ativo':''}" data-c="">Todas</button>` +
      classesComFoto.map(c =>
        `<button class="album-chip${_albumClasseFiltro===c?' ativo':''}" data-c="${c}">
          ${ALBUM_ICONE[c] ? `<img src="${ALBUM_ICONE[c]}" alt="">` : ''}
          ${FAUNA_CLASSE_LAB[c] || c}
        </button>`
      ).join('')
    chips.querySelectorAll('.album-chip').forEach(btn =>
      btn.addEventListener('click', () => { _albumClasseFiltro = btn.dataset.c; renderAlbumFauna() })
    )
  }

  const fotos = _albumClasseFiltro ? _albumFotos.filter(p => p.classe === _albumClasseFiltro) : _albumFotos
  const total = document.getElementById('album-total')
  if (total) total.textContent = `${fotos.length} foto${fotos.length!==1?'s':''}`

  const corpo = document.getElementById('album-corpo')
  if (!corpo) return
  if (!fotos.length) {
    corpo.innerHTML = `<div class="album-empty">Nenhuma foto registrada neste período</div>`
    return
  }

  // Agrupa por espécie
  const grupos = {}
  fotos.forEach((p, i) => {
    if (!grupos[p.label]) grupos[p.label] = { label:p.label, classe:p.classe, fotos:[] }
    grupos[p.label].fotos.push({ ...p, _fi: i })   // _fi = índice dentro de fotos[]
  })

  corpo.innerHTML = Object.values(grupos).map(g => `
    <div class="album-grupo">
      <div class="album-grupo-header">
        ${ALBUM_ICONE[g.classe] ? `<img src="${ALBUM_ICONE[g.classe]}" style="width:14px;height:14px;object-fit:contain;opacity:.7" alt="">` : ''}
        ${esc(g.label)}
        <span class="album-grupo-count">${g.fotos.length}</span>
      </div>
      <div class="album-grid">
        ${g.fotos.map(p => `
          <div class="album-thumb" data-fi="${p._fi}">
            <img src="${esc(p.url)}" alt="${esc(p.label)}" loading="lazy">
            ${ALBUM_ICONE[p.classe]?`<div class="album-thumb-badge"><img src="${ALBUM_ICONE[p.classe]}" alt=""></div>`:''}
          </div>`).join('')}
      </div>
    </div>`).join('')

  corpo.querySelectorAll('.album-thumb').forEach(el =>
    el.addEventListener('click', () => lbAbrir(parseInt(el.dataset.fi), fotos))
  )
}

// ── Lightbox ──────────────────────────────────────────────────
function lbGetEl() {
  if (document.getElementById('lb-overlay')) return
  const el = document.createElement('div')
  el.id = 'lb-overlay'
  el.className = 'lb-overlay'
  el.setAttribute('hidden', '')
  el.innerHTML = `
    <div class="lb-topbar">
      <span class="lb-counter" id="lb-counter"></span>
      <button class="lb-close" id="lb-close" title="Fechar">&#x2715;</button>
    </div>
    <div class="lb-mid">
      <button class="lb-nav lb-prev" id="lb-prev">&#8249;</button>
      <div class="lb-img-wrap" id="lb-img-wrap"><img id="lb-img" src="" alt=""></div>
      <button class="lb-nav lb-next" id="lb-next">&#8250;</button>
    </div>
    <div class="lb-meta" id="lb-meta"></div>
  `
  document.body.appendChild(el)
  document.getElementById('lb-close').addEventListener('click', lbFechar)
  document.getElementById('lb-prev').addEventListener('click', () => lbNavegar(-1))
  document.getElementById('lb-next').addEventListener('click', () => lbNavegar(1))
  document.addEventListener('keydown', e => {
    if (document.getElementById('lb-overlay')?.hidden) return
    if (e.key === 'ArrowLeft')  lbNavegar(-1)
    if (e.key === 'ArrowRight') lbNavegar(1)
    if (e.key === 'Escape')     lbFechar()
  })
  let _tx = 0
  el.addEventListener('touchstart', e => { _tx = e.touches[0].clientX }, { passive:true })
  el.addEventListener('touchend',   e => {
    const dx = e.changedTouches[0].clientX - _tx
    if (Math.abs(dx) > 40) lbNavegar(dx < 0 ? 1 : -1)
  }, { passive:true })
}

function lbAbrir(idx, fotos) {
  lbGetEl()
  window._lbFotos = fotos
  _lbIdx = idx
  lbMostrar(false)
  document.getElementById('lb-overlay').removeAttribute('hidden')
}

function lbMostrar(animacao) {
  const fotos = window._lbFotos || []
  const p = fotos[_lbIdx]
  if (!p) return
  const wrap = document.getElementById('lb-img-wrap')
  const img  = document.getElementById('lb-img')
  const meta = document.getElementById('lb-meta')
  const cnt  = document.getElementById('lb-counter')
  const chips = [
    p.condicao ? (FAUNA_COND_LAB[p.condicao] || p.condicao) : null,
    p.tipo     ? (FAUNA_TIPO_LAB[p.tipo]     || p.tipo)     : null,
    p.brigada  || null,
    p.data     || null,
  ].filter(Boolean).map(t => `<span class="lb-meta-chip">${esc(t)}</span>`).join('')

  if (animacao) {
    wrap.classList.add('flip-out')
    setTimeout(() => {
      img.src = p.url
      wrap.classList.remove('flip-out')
      wrap.classList.add('flip-in')
      setTimeout(() => wrap.classList.remove('flip-in'), 220)
    }, 200)
  } else {
    img.src = p.url
  }
  img.alt = p.label
  meta.innerHTML = `
    <div class="lb-meta-nome">${esc(p.label)}</div>
    ${p.cientifico?`<div class="lb-meta-cient">${esc(p.cientifico)}</div>`:''}
    <div class="lb-meta-chips">${chips}</div>
  `
  cnt.textContent = `${_lbIdx + 1} / ${fotos.length}`
  document.getElementById('lb-prev').disabled = _lbIdx === 0
  document.getElementById('lb-next').disabled = _lbIdx === fotos.length - 1
}

function lbNavegar(delta) {
  const fotos = window._lbFotos || []
  const n = _lbIdx + delta
  if (n < 0 || n >= fotos.length) return
  _lbIdx = n
  lbMostrar(true)
}

function lbFechar() {
  const el = document.getElementById('lb-overlay')
  if (el) el.setAttribute('hidden', '')
}

// ── Rosca: Por Classe ─────────────────────────────────────────
function initFaunaClasse(f) {
  const classes = Object.keys(FAUNA_CLASSE_LAB)
  const qtd = classes.map(c => f.filter(x => x.classe === c).reduce((s, x) => s + (x.quantidade || 1), 0))
  const ativos = classes.filter((_, i) => qtd[i] > 0)
  const vals   = qtd.filter(v => v > 0)
  const total  = vals.reduce((a, b) => a + b, 0) || 1

  initChart('chart-fauna-classe', {
    type: 'doughnut',
    plugins: [pseudo3DDoughnut],
    data: {
      labels: ativos.map(c => FAUNA_CLASSE_LAB[c]),
      datasets: [{
        data: vals,
        backgroundColor: ativos.map(c => COR_CLASSE[c]),
        borderWidth: 2,
        borderColor: 'rgba(255,255,255,.85)',
        hoverBorderWidth: 0,
        hoverOffset: 10,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      cutout: '56%',
      layout: { padding: { bottom: 20 } },
      plugins: {
        pseudo3d: { depth: 16 },
        legend: {
          position: 'right',
          labels: { boxWidth: 10, boxHeight: 10, borderRadius: 3, useBorderRadius: true,
                    padding: 12, font: { size: 11 } }
        },
        tooltip: {
          backgroundColor: '#0A1A0F', padding: 10, cornerRadius: 8,
          callbacks: {
            label: ctx => `  ${ctx.label}: ${ctx.parsed} (${Math.round(ctx.parsed/total*100)}%)`
          }
        },
        datalabels: {
          // % dentro de cada fatia (esconde fatias muito pequenas p/ não sobrepor)
          display: ctx => {
            const arr = ctx.chart.data.datasets[0].data
            const tot = arr.reduce((a, b) => a + (Number(b) || 0), 0) || 1
            return (Number(arr[ctx.dataIndex]) || 0) / tot >= 0.05
          },
          formatter: (v) => `${Math.round(v / total * 100)}%`,
          color: '#fff', font: { size: 11, weight: '700' },
          textStrokeColor: 'rgba(0,0,0,.35)', textStrokeWidth: 3
        }
      }
    }
  })
}

// ── Barras verticais: Condição ────────────────────────────────
function initFaunaCond(f) {
  const conds  = Object.keys(FAUNA_COND_LAB)
  const vals   = conds.map(c => f.filter(x => x.condicao === c).reduce((s, x) => s + (x.quantidade || 1), 0))
  const cores  = conds.map(c => COR_COND[c])

  initChart('chart-fauna-cond', {
    type: 'bar',
    data: {
      labels: conds.map(c => FAUNA_COND_LAB[c]),
      datasets: [{
        data: vals,
        backgroundColor: cores.map(c => c + 'dd'),
        borderColor: cores,
        borderWidth: 0,
        borderRadius: 8,
        borderSkipped: false,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      layout: { padding: { top: 22 } },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#0A1A0F', padding: 10, cornerRadius: 8,
          callbacks: { label: ctx => `  ${ctx.parsed.y} animais` }
        },
        datalabels: {
          display: true, formatter: dlValPct,
          color: '#374151', anchor: 'end', align: 'end', offset: 2, clamp: true,
          font: { size: 10, weight: '600' }
        }
      },
      scales: {
        x: { grid: { display: false }, border: { display: false },
             ticks: { font: { size: 11 }, color: '#6b7280' } },
        y: { beginAtZero: true, ticks: { precision: 0, color: '#9ca3af', font: { size: 10 } },
             grid: { color: 'rgba(0,0,0,.05)' }, border: { display: false } }
      }
    }
  })
}

// ── Barras horizontais empilhadas: Por Regional ───────────────
function initFaunaRegional(f) {
  const regs  = Object.keys(REGIONAL_LAB).filter(r => f.some(x => x.regional === r))
  if (!regs.length) return

  const tipos  = ['resgate','avistamento','atropelamento','apreensao','encontrado_morto']
  const labels = regs.map(r => REGIONAL_LAB[r])

  // Altura dinâmica pelo nº de regionais
  const wrap = document.getElementById('chart-fauna-regional')?.parentElement
  if (wrap) wrap.style.height = (regs.length * 52 + 60) + 'px'

  initChart('chart-fauna-regional', {
    type: 'bar',
    data: {
      labels,
      datasets: tipos.map(tp => ({
        label: FAUNA_TIPO_LAB[tp],
        data: regs.map(r =>
          f.filter(x => x.regional === r && x.tipo_evento === tp)
           .reduce((s, x) => s + (x.quantidade || 1), 0)
        ),
        backgroundColor: COR_TIPO[tp] + 'cc',
        borderColor:     COR_TIPO[tp],
        borderWidth: 0,
        borderRadius: 4,
        borderSkipped: false,
      })).filter(ds => ds.data.some(v => v > 0))
    },
    options: {
      indexAxis: 'y',
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: 'bottom', labels: { boxWidth: 10, boxHeight: 10,
                   borderRadius: 3, useBorderRadius: true, padding: 14, font: { size: 11 } } },
        tooltip: {
          backgroundColor: '#0A1A0F', padding: 10, cornerRadius: 8, mode: 'index',
          callbacks: { label: ctx => ctx.parsed.x > 0 ? `  ${ctx.dataset.label}: ${ctx.parsed.x}` : null }
        },
        datalabels: {
          // valor + % da regional; só em segmentos largos o bastante (evita sobreposição)
          display: ctx => {
            const i = ctx.dataIndex, v = Number(ctx.dataset.data[i]) || 0
            const tot = ctx.chart.data.datasets.reduce((a, ds) => a + (Number(ds.data[i]) || 0), 0) || 1
            return v / tot >= 0.12
          },
          formatter: dlValPctStack, color: '#fff', align: 'center', anchor: 'center',
          font: { size: 9, weight: '700' }, textStrokeColor: 'rgba(0,0,0,.35)', textStrokeWidth: 3
        }
      },
      scales: {
        x: { stacked: true, beginAtZero: true, grid: { color: 'rgba(0,0,0,.05)' },
             border: { display: false }, ticks: { precision: 0, color: '#9ca3af', font: { size: 10 } } },
        y: { stacked: true, grid: { display: false }, border: { display: false },
             ticks: { color: '#374151', font: { size: 12, weight: '500' } } }
      }
    }
  })
}

// ── Barras horizontais: Ranking de resgates por brigada ───────
function initFaunaBrigada(f) {
  const por = {}
  f.filter(x => x.tipo_evento === 'resgate').forEach(x => {
    const k = x.brigada_nome || '—'
    por[k] = (por[k] || 0) + (x.quantidade || 1)
  })

  const sorted = Object.entries(por).sort((a, b) => b[1] - a[1]).slice(0, 10)
  if (!sorted.length) return

  // Altura dinâmica
  const wrap = document.getElementById('fauna-brigada-wrap')
  if (wrap) wrap.style.height = (sorted.length * 46 + 60) + 'px'

  // Escala de cor: mais resgates → mais escuro
  const max = sorted[0][1]
  const cores = sorted.map(([, v]) => {
    const t = v / max
    const r = Math.round(10  + t * (82  - 10))
    const g = Math.round(26  + t * (166 - 26))
    const b = Math.round(15  + t * (106 - 15))
    return `rgb(${r},${g},${b})`
  })

  initChart('chart-fauna-brigada', {
    type: 'bar',
    data: {
      labels: sorted.map(([k]) => k),
      datasets: [{
        data: sorted.map(([, v]) => v),
        backgroundColor: cores,
        borderWidth: 0,
        borderRadius: 6,
        borderSkipped: false,
      }]
    },
    options: {
      indexAxis: 'y',
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#0A1A0F', padding: 10, cornerRadius: 8,
          callbacks: { label: ctx => `  ${ctx.parsed.x} animais resgatados` }
        },
        datalabels: {
          display: true, formatter: dlValPct,
          color: '#374151', anchor: 'end', align: 'end', offset: 4, clamp: true,
          font: { size: 10, weight: '600' }
        }
      },
      scales: {
        x: { beginAtZero: true, grace: '18%', grid: { color: 'rgba(0,0,0,.05)' },
             border: { display: false }, ticks: { precision: 0, color: '#9ca3af', font: { size: 10 } } },
        y: { grid: { display: false }, border: { display: false },
             ticks: { color: '#374151', font: { size: 12, weight: '500' } } }
      }
    }
  })
}

// ── Barras horizontais: Ranking de espécies mais resgatadas (top 10) ───
function initFaunaEspecie(f) {
  // Agrupa por espécie. Chave consistente = nome científico (campo mais
  // preenchido); rótulo exibido prefere o NOME POPULAR (do catálogo),
  // capitalizado, com fallback para o científico/classe.
  const capitaliza = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s
  const por = {}
  f.filter(x => x.tipo_evento === 'resgate').forEach(x => {
    const cient = (x.nome_cientifico || '').trim()
    const pop   = (x.nome_popular_cat || x.nome_popular || '').trim()
    const key   = cient || pop || FAUNA_CLASSE_LAB[x.classe] || '—'
    const label = capitaliza(pop) || cient || FAUNA_CLASSE_LAB[x.classe] || '—'
    if (!por[key]) por[key] = { qtd: 0, label }
    por[key].qtd += (x.quantidade || 1)
    if (pop) por[key].label = capitaliza(pop)
  })

  const sorted = Object.values(por).sort((a, b) => b.qtd - a.qtd).slice(0, 10)
  if (!sorted.length) return

  // Altura dinâmica
  const wrap = document.getElementById('fauna-especie-wrap')
  if (wrap) wrap.style.height = (sorted.length * 46 + 60) + 'px'

  // Escala de cor violeta (tema fauna): mais resgates → mais escuro
  const max = sorted[0].qtd
  const cores = sorted.map(s => {
    const t = s.qtd / max
    const r = Math.round(221 - t * 145)
    const g = Math.round(214 - t * 185)
    const b = Math.round(254 - t * 105)
    return `rgb(${r},${g},${b})`
  })

  initChart('chart-fauna-especie', {
    type: 'bar',
    data: {
      labels: sorted.map(s => s.label),
      datasets: [{
        data: sorted.map(s => s.qtd),
        backgroundColor: cores,
        borderWidth: 0,
        borderRadius: 6,
        borderSkipped: false,
      }]
    },
    options: {
      indexAxis: 'y',
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#0A1A0F', padding: 10, cornerRadius: 8,
          callbacks: { label: ctx => `  ${ctx.parsed.x} resgatado(s)` }
        },
        datalabels: {
          display: true, formatter: dlValPct,
          color: '#374151', anchor: 'end', align: 'end', offset: 4, clamp: true,
          font: { size: 10, weight: '600' }
        }
      },
      scales: {
        x: { beginAtZero: true, grace: '18%', grid: { color: 'rgba(0,0,0,.05)' },
             border: { display: false }, ticks: { precision: 0, color: '#9ca3af', font: { size: 10 } } },
        y: { grid: { display: false }, border: { display: false },
             ticks: { color: '#374151', font: { size: 12, weight: '500' } } }
      }
    }
  })
}

// Exportar CSV
// ════════════════════════════════════════════════════════════════
function exportarCSV() {
  const { ini, fim } = getPeriodo()
  const cabecalho = ['Data','Natureza','Atividade','Status Validação','Brigadista','Brigada','UC','Regional','N Fauna','Área ha','Pessoas']
  const linhas = _registros.map(r => [
    r.data_hora_evento ? new Date(r.data_hora_evento).toLocaleDateString('pt-BR',{timeZone:'America/Rio_Branco'}) : '',
    NAT_LAB[r.natureza]||r.natureza||'',
    ATIV_LAB[r.atividade]||r.atividade||'',
    STATUS_LAB[r.status_validacao]||r.status_validacao||'',
    r.brigadista_nome||'',
    r.brigada_nome||'',
    r.uc_nome||'',
    REGIONAL_LAB[r.regional]||r.regional||'',
    r.n_fauna||0,
    r.area_estimada_ha||'',
    r.pessoas_alcancadas||'',
  ].map(v => `"${String(v).replace(/"/g,'""')}"`).join(','))

  const csv  = [cabecalho.join(','), ...linhas].join('\n')
  const blob = new Blob(['﻿'+csv], { type:'text/csv;charset=utf-8' })
  const url  = URL.createObjectURL(blob)
  const a    = Object.assign(document.createElement('a'), {
    href: url,
    download: `brigadas-${ini}_${fim}.csv`,
  })
  a.click()
  setTimeout(() => URL.revokeObjectURL(url), 3000)
}

// Utilidades
// ════════════════════════════════════════════════════════════════
function agrupar(arr, campo) {
  const r = {}
  arr.forEach(x => { const k = x[campo]; if (k) r[k] = (r[k]||0) + 1 })
  return r
}
function agruparObj(arr, campo) {
  const r = {}
  arr.forEach(x => { const k = x[campo]; if (k) { if (!r[k]) r[k]=[]; r[k].push(x) } })
  return r
}
