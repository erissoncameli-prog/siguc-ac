<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SIGUC-AC · Validação de Campo</title>
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
<script src="../js/observability.js"></script>
<script src="../js/queryLogger.js"></script>
<script src="../js/config.js"></script>
<script src="../js/mapa-camadas.js"></script>
<script src="../js/layout.js"></script>
<style>
/* ── Tokens de natureza (inline — brigada.css não está no shell principal) */
:root {
  --nat-prev : #12A66A;
  --nat-comb : #EF5B3C;
  --nat-moni : #3B82C4;
  --nat-prev-bg : rgba(18,166,106,.12);
  --nat-comb-bg : rgba(239,91,60,.12);
  --nat-moni-bg : rgba(59,130,196,.12);
}

/* ── KPIs ─────────────────────────────────────────── */
.kpi-row { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:18px }
.kpi-box { flex:1; min-width:130px; background:var(--card-bg,#fff);
           border:1.5px solid var(--border,#e5e7eb); border-radius:10px;
           padding:14px 16px; display:flex; flex-direction:column; gap:2px;
           cursor:pointer; transition:.15s; user-select:none }
.kpi-box:hover { border-color:var(--verde-c,#52B788); box-shadow:0 2px 8px rgba(0,0,0,.07) }
.kpi-box.kpi-ativo { border-color:var(--floresta,#0A1A0F);
                     box-shadow:0 0 0 3px rgba(10,26,15,.1) }
.kpi-n   { font-size:1.8rem; font-weight:700; line-height:1; color:var(--floresta,#0A1A0F) }
.kpi-l   { font-size:.78rem; color:var(--text-muted,#6b7280) }
.kpi-n.alerta { color:#EF5B3C }
.kpi-n.verde  { color:#12A66A }

/* ── Filtros ──────────────────────────────────────── */
.filtros-row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px }
.tab-btn { padding:6px 16px; border-radius:999px; border:1.5px solid var(--border,#e5e7eb);
           background:transparent; font-size:.83rem; cursor:pointer; font-weight:500;
           color:var(--text-muted,#6b7280); white-space:nowrap; transition:.15s }
.tab-btn.ativo { background:var(--floresta,#0A1A0F); color:#fff; border-color:var(--floresta,#0A1A0F) }
.search-wrap { flex:1; min-width:200px; position:relative }
.search-wrap input { width:100%; padding:7px 12px 7px 34px; border-radius:8px;
                     border:1.5px solid var(--border,#e5e7eb); font-size:.85rem;
                     background:var(--input-bg,#fff) }
.search-wrap svg { position:absolute; left:10px; top:50%; transform:translateY(-50%);
                   opacity:.45; pointer-events:none }

/* ── Cards de registro ───────────────────────────── */
#lista-registros { display:grid; gap:12px }

.rc-card { background:var(--card-bg,#fff); border:1px solid var(--border,#e5e7eb);
           border-radius:12px; padding:16px 18px; cursor:pointer;
           transition:.15s; display:grid; grid-template-columns:1fr auto;
           gap:8px; align-items:start }
.rc-card:hover { border-color:var(--verde-c,#52B788); box-shadow:0 2px 8px rgba(0,0,0,.06) }

.rc-top { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:6px }
.nat-chip { display:inline-flex; align-items:center; gap:4px; padding:3px 10px;
            border-radius:999px; font-size:.75rem; font-weight:600 }
.nat-chip.prevencao   { background:var(--nat-prev-bg); color:var(--nat-prev) }
.nat-chip.combate     { background:var(--nat-comb-bg); color:var(--nat-comb) }
.nat-chip.monitoramento { background:var(--nat-moni-bg); color:var(--nat-moni) }

.rc-titulo { font-size:.92rem; font-weight:600; color:var(--floresta,#0A1A0F) }
.rc-meta   { font-size:.8rem; color:var(--text-muted,#6b7280); display:flex; gap:12px; flex-wrap:wrap; margin-top:4px }
.rc-meta span { display:flex; align-items:center; gap:3px }

.rc-badges { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px }
.badge-sm  { padding:2px 8px; border-radius:999px; font-size:.72rem; font-weight:600 }

/* status validação */
.badge-aguardando     { background:#fef3c7; color:#92400e }
.badge-validado       { background:#d1fae5; color:#065f46 }
.badge-requer_correcao { background:#fce7f3; color:#9d174d }
.badge-rejeitado      { background:#fee2e2; color:#991b1b }

/* fauna pendente */
.badge-fauna-pend { background:rgba(59,130,196,.13); color:#1d4ed8 }
.badge-fauna-ok   { background:rgba(18,166,106,.13); color:#065f46 }

.rc-actions { display:flex; flex-direction:column; gap:6px; align-items:flex-end }
.btn-ver { padding:6px 14px; border-radius:8px; font-size:.8rem; font-weight:600;
           background:var(--floresta,#0A1A0F); color:#fff; border:none; cursor:pointer;
           white-space:nowrap }
.btn-ver:hover { opacity:.85 }

/* ── Modal ───────────────────────────────────────── */
#modal-detalhe .modal { max-width:780px; width:95vw }

.modal-natureza-bar { height:4px; border-radius:4px 4px 0 0; margin:-1px -1px 0 -1px }
.modal-natureza-bar.prevencao   { background:var(--nat-prev) }
.modal-natureza-bar.combate     { background:var(--nat-comb) }
.modal-natureza-bar.monitoramento { background:var(--nat-moni) }

.detail-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px 24px;
               margin-bottom:16px }
@media(max-width:520px){ .detail-grid{ grid-template-columns:1fr } }

.detail-field label { font-size:.73rem; color:var(--text-muted,#6b7280);
                      font-weight:600; text-transform:uppercase; letter-spacing:.04em }
.detail-field p     { margin:2px 0 0; font-size:.88rem; color:var(--floresta,#0A1A0F) }

/* Fotos */
.fotos-grid { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px }
.foto-thumb-val { width:90px; height:68px; object-fit:cover; border-radius:7px;
                  cursor:pointer; border:1.5px solid var(--border,#e5e7eb) }
.foto-thumb-val:hover { border-color:var(--verde-c,#52B788) }

/* ── Fauna cards ─────────────────────────────────────────────── */
.fauna-card { border:1px solid var(--border,#e5e7eb); border-radius:10px;
              margin-bottom:8px; overflow:hidden }
.fauna-card:last-child { margin-bottom:0 }

.fauna-card-head { display:grid; grid-template-columns:auto 1fr auto;
                   gap:10px; align-items:center; padding:10px 14px;
                   cursor:pointer; user-select:none; background:var(--card-bg,#fff);
                   transition:.12s }
.fauna-card-head:hover { background:var(--bg-light,#f9fafb) }
.fauna-card-head.expandido { background:var(--bg-light,#f9fafb);
                              border-bottom:1px solid var(--border,#e5e7eb) }

.fauna-icon-val { font-size:1.4rem; line-height:1 }
.fauna-det strong { font-size:.87rem; display:block }
.fauna-det span   { font-size:.78rem; color:var(--text-muted,#6b7280) }

.fauna-head-right { display:flex; flex-direction:column; align-items:flex-end; gap:4px }
.fauna-chevron { font-size:.75rem; color:var(--text-muted,#6b7280); transition:.2s }
.fauna-card-head.expandido .fauna-chevron { transform:rotate(180deg) }

.badge-conf   { background:#d1fae5; color:#065f46; padding:2px 9px;
                border-radius:999px; font-size:.72rem; font-weight:600 }
.badge-pend   { background:#fef3c7; color:#92400e; padding:2px 9px;
                border-radius:999px; font-size:.72rem; font-weight:600 }

/* corpo expandido */
.fauna-card-body { display:none; padding:14px; background:var(--bg-light,#f9fafb) }
.fauna-card-body.aberto { display:block }

/* fotos da fauna */
.fauna-fotos-grid { display:flex; gap:7px; flex-wrap:wrap; margin-bottom:12px }
.fauna-foto-thumb { width:82px; height:62px; object-fit:cover; border-radius:7px;
                    cursor:pointer; border:1.5px solid var(--border,#e5e7eb) }
.fauna-foto-thumb:hover { border-color:var(--verde-c,#52B788) }

/* formulário de edição inline */
.fauna-edit-form { background:#fff; border:1px solid var(--border,#e5e7eb);
                   border-radius:8px; padding:12px 14px; margin-top:8px; display:none }
.fauna-edit-form.aberto { display:block }
.fauna-edit-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px 16px; margin-bottom:10px }
@media(max-width:480px){ .fauna-edit-grid{ grid-template-columns:1fr } }
.fauna-edit-grid label { font-size:.72rem; font-weight:600; color:var(--text-muted,#6b7280);
                          text-transform:uppercase; letter-spacing:.04em; display:block; margin-bottom:2px }
.fauna-edit-grid select,
.fauna-edit-grid input,
.fauna-edit-form  textarea { width:100%; padding:5px 9px; border-radius:7px;
                              border:1.5px solid var(--border,#e5e7eb); font-size:.84rem;
                              background:var(--input-bg,#fff) }
.fauna-edit-form textarea { resize:vertical; min-height:52px }
.fauna-edit-actions { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap }
.btn-fauna-salvar { background:#12A66A; color:#fff; padding:6px 16px; border-radius:8px;
                    font-size:.82rem; font-weight:600; border:none; cursor:pointer }
.btn-fauna-salvar:hover { opacity:.88 }
.btn-fauna-cancelar { background:var(--border,#e5e7eb); color:#111; padding:6px 14px;
                      border-radius:8px; font-size:.82rem; font-weight:600; border:none; cursor:pointer }

/* Historico */
.hist-timeline { display:flex; flex-direction:column; gap:0 }
.hist-item { display:flex; gap:10px; padding:8px 0;
             border-left:2px solid var(--border,#e5e7eb); padding-left:14px;
             position:relative }
.hist-item::before { content:''; position:absolute; left:-5px; top:14px;
                     width:8px; height:8px; border-radius:50%;
                     background:var(--verde-c,#52B788); border:2px solid #fff }
.hist-data  { font-size:.74rem; color:var(--text-muted,#6b7280); white-space:nowrap }
.hist-body  { flex:1 }
.hist-body strong { font-size:.83rem; display:block }
.hist-body span   { font-size:.78rem; color:var(--text-muted,#6b7280) }

/* Ações do modal */
.modal-acoes { display:flex; gap:8px; flex-wrap:wrap; padding-top:12px;
               border-top:1px solid var(--border,#e5e7eb); margin-top:4px }
.btn-validar    { background:#12A66A; color:#fff }
.btn-correcao   { background:#f59e0b; color:#fff }
.btn-rejeitar   { background:#EF5B3C; color:#fff }
.btn-promover   { background:#3B82C4; color:#fff }
.btn-acao { padding:8px 16px; border-radius:8px; font-size:.84rem; font-weight:600;
            border:none; cursor:pointer }
.btn-acao:hover { opacity:.88 }

/* Motivo input (inline) */
.motivo-wrap { margin:10px 0; display:none }
.motivo-wrap.visivel { display:block }
.motivo-wrap textarea { width:100%; padding:8px 10px; border-radius:8px;
                        border:1.5px solid var(--border,#e5e7eb);
                        font-size:.85rem; resize:vertical; min-height:60px }
.veredito-row { display:flex; gap:8px; margin-bottom:6px }
.veredito-btn { padding:4px 12px; border-radius:999px; font-size:.78rem; font-weight:600;
                border:1.5px solid var(--border,#e5e7eb); background:transparent;
                cursor:pointer; transition:.12s }
.veredito-btn.sel { background:var(--floresta,#0A1A0F); color:#fff; border-color:var(--floresta,#0A1A0F) }

/* Confirmar espécie modal inline */
.confirmar-esp-wrap { background:var(--bg-light,#f9fafb); border-radius:8px;
                      padding:10px 12px; margin-top:6px; display:none }
.confirmar-esp-wrap.visivel { display:block }
.confirmar-esp-wrap input { width:100%; padding:6px 10px; border-radius:7px;
                            border:1.5px solid var(--border,#e5e7eb); font-size:.84rem }

/* GPS link */
.gps-link { font-size:.8rem; color:var(--verde-c,#52B788); text-decoration:none }
.gps-link:hover { text-decoration:underline }

/* Foto lightbox */
#lightbox { position:fixed; inset:0; background:rgba(0,0,0,.88); z-index:9999;
            display:flex; align-items:center; justify-content:center; cursor:zoom-out }
#lightbox img { max-width:92vw; max-height:92vh; border-radius:6px; object-fit:contain }
#lightbox.oculto { display:none }

/* ── Mapa de validação ── */
.val-map-head { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px }
.val-map-tools { display:flex; flex-wrap:wrap; gap:8px; align-items:center }
.val-map-chk { font-size:.78rem; display:flex; align-items:center; gap:5px; cursor:pointer }
.val-map-sel { font-size:.78rem; padding:4px 6px; border:1px solid var(--border,#e5e7eb); border-radius:6px; background:#fff }
.val-mapa { width:100%; height:320px; border-radius:10px; border:1px solid var(--border,#e5e7eb); overflow:hidden; background:#eaf0ea }
/* Blindagem: garante que nenhuma regra global de imagem encolha os tiles do Leaflet */
.val-mapa .leaflet-tile,
.val-mapa img.leaflet-image-layer,
.val-mapa .leaflet-marker-icon { max-width:none !important; max-height:none !important }
.val-map-foot { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px; margin-top:8px }
.val-evidencia { font-size:.8rem; font-weight:600; padding:4px 10px; border-radius:20px; background:#f3f4f6; color:#374151 }
.val-evidencia.tem-fogo { background:#fee2e2; color:#991b1b }
.val-evidencia.sem-fogo { background:#dcfce7; color:#166534 }
.val-map-acoes { display:flex; gap:8px }
.val-btn-edit { font-size:.78rem; font-weight:600; padding:6px 12px; border-radius:8px; cursor:pointer;
                border:1px solid var(--verde-c,#52B788); background:#fff; color:#166534 }
.val-btn-edit:hover { background:#f0fdf4 }
.val-area-info { font-size:.8rem; color:#374151; margin:8px 0 0; min-height:1em }
.val-area-info b { color:#166534 }
</style>
</head>
<body>
<div id="app"></div>

<!-- ── Modal de detalhe/validação ──────────────────────────── -->
<div class="modal-overlay" id="modal-detalhe" style="display:none">
  <div class="modal" style="max-width:780px;padding-bottom:0">
    <div class="modal-natureza-bar" id="modal-nat-bar"></div>
    <div class="modal-header">
      <div class="modal-title" id="modal-titulo-det">Registro de Campo</div>
      <button class="modal-close" onclick="fecharDetalhe()">×</button>
    </div>
    <div class="modal-body" style="overflow-y:auto;max-height:72vh">

      <!-- Cabeçalho resumido -->
      <div id="modal-cabecalho"></div>

      <!-- Grid de detalhes -->
      <div class="detail-grid" id="modal-detail-grid"></div>

      <!-- Mapa de validação (satélite + focos diários + editar polígono) -->
      <div id="modal-mapa-sec" hidden>
        <div class="val-map-head">
          <p class="form-label" style="margin:14px 0 6px">Área no satélite</p>
          <div class="val-map-tools">
            <label class="val-map-chk"><input type="checkbox" id="val-gibs-toggle"> Manchas/focos (NASA GIBS)</label>
            <select id="val-gibs-camada" class="val-map-sel"></select>
            <input type="date" id="val-gibs-data" class="val-map-sel" title="Data da imagem GIBS">
          </div>
        </div>
        <div id="val-mapa" class="val-mapa"></div>
        <div class="val-map-foot">
          <span id="val-evidencia" class="val-evidencia">Cruzando focos…</span>
          <span class="val-map-acoes">
            <button type="button" class="val-btn-edit" id="val-btn-editar">Editar polígono</button>
            <button type="button" class="val-btn-edit" id="val-btn-desfazer" hidden>Descartar edição</button>
          </span>
        </div>
        <p class="val-area-info" id="val-area-info"></p>
      </div>

      <!-- Fotos -->
      <div id="modal-fotos-sec" hidden>
        <p class="form-label" style="margin-bottom:6px">📷 Fotos</p>
        <div class="fotos-grid" id="modal-fotos-grid"></div>
      </div>

      <!-- Fauna -->
      <div id="modal-fauna-sec" hidden>
        <p class="form-label" style="margin-bottom:6px">🐾 Fauna Registrada</p>
        <div id="modal-fauna-lista"></div>
      </div>

      <!-- Histórico -->
      <div id="modal-hist-sec" hidden>
        <p class="form-label" style="margin:14px 0 6px">📋 Histórico</p>
        <div class="hist-timeline" id="modal-hist"></div>
      </div>

      <!-- Ações -->
      <div class="modal-acoes" id="modal-acoes">
        <!-- preenchido via JS -->
      </div>

      <!-- Motivo / veredito -->
      <div class="motivo-wrap" id="motivo-wrap">
        <div class="veredito-row" id="veredito-row" style="display:none">
          <span style="font-size:.78rem;font-weight:600;align-self:center">Veredito:</span>
          <button class="veredito-btn" data-v="confirmado">Confirmado</button>
          <button class="veredito-btn" data-v="falso_positivo">Falso positivo</button>
          <button class="veredito-btn" data-v="nao_localizado">Não localizado</button>
        </div>
        <textarea id="motivo-txt" placeholder="Motivo / observação (obrigatório para correção/rejeição)"></textarea>
        <div style="display:flex;gap:8px;margin-top:8px">
          <button class="btn-acao" id="btn-confirmar-acao" style="flex:1">Confirmar</button>
          <button class="btn-acao" onclick="cancelarAcao()" style="background:var(--border,#e5e7eb);color:#111">Cancelar</button>
        </div>
      </div>

      <!-- Modal promover a ocorrência -->
      <div class="motivo-wrap" id="promover-wrap">
        <p style="font-size:.82rem;margin-bottom:6px;font-weight:600">Nova Ocorrência</p>
        <input id="promover-titulo" class="form-control" placeholder="Título da ocorrência *" style="margin-bottom:6px">
        <select id="promover-sev" class="form-control" style="margin-bottom:8px">
          <option value="baixa">Baixa</option>
          <option value="media" selected>Média</option>
          <option value="alta">Alta</option>
          <option value="critica">Crítica</option>
        </select>
        <div style="display:flex;gap:8px">
          <button class="btn-acao btn-promover" id="btn-confirmar-promover" style="flex:1">Criar Ocorrência</button>
          <button class="btn-acao" onclick="cancelarAcao()" style="background:var(--border,#e5e7eb);color:#111">Cancelar</button>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Lightbox de foto -->
<div id="lightbox" class="oculto" onclick="this.classList.add('oculto')">
  <img id="lightbox-img" src="" alt="foto">
</div>

<script>
// ════════════════════════════════════════════════════════════════
// Estado
// ════════════════════════════════════════════════════════════════
let _usuario = null
let _registros = []
let _filtroStatus = 'aguardando'
let _filtroKpi    = null   // 'aguardando'|'correcao'|'fauna_pend'|'validado_hoje'
let _busca = ''
let _detalheId = null
let _faunaDetalhe = []
let _acaoPendente = null  // 'validar'|'correcao'|'rejeitar'|'promover'

// ── Cores / labels de referência ─────────────────────────────
const NAT = {
  prevencao:    { cor:'#12A66A', label:'Prevenção',    emoji:'🛡' },
  combate:      { cor:'#EF5B3C', label:'Combate',      emoji:'🔥' },
  monitoramento:{ cor:'#3B82C4', label:'Monitoramento', emoji:'🔭' },
}
const ATIV = {
  fogo:'Combate a fogo', educacao_ambiental:'Educação ambiental',
  limpeza:'Limpeza / aceiro', reconhecimento:'Reconhecimento',
  plantio:'Plantio', primeiros_socorros:'Primeiros socorros',
  queima_controlada:'Queima controlada', outro:'Outro',
}
const STATUS_VALID = {
  aguardando:'Aguardando', validado:'Validado',
  requer_correcao:'Requer correção', rejeitado:'Rejeitado',
}
const FAUNA_ICONE = {
  mamifero:'🦌', ave:'🦜', reptil:'🦎', anfibio:'🐸',
  peixe:'🐟', invertebrado:'🦋', nao_sei:'❓',
}
const CONDICAO = {
  integro:'Íntegro', ferido:'Ferido', debilitado:'Debilitado',
  queimado:'Queimado', obito:'Óbito',
}
const TIPO_EV = {
  resgate:'Resgate', avistamento:'Avistamento', atropelamento:'Atropelamento',
  apreensao:'Apreensão', encontrado_morto:'Encontrado morto',
}
const DESTIN = {
  solto_no_local:'Solto no local', encaminhado_cetas:'Encam. CETAS',
  obito:'Óbito', em_tratamento:'Em tratamento', outro:'Outro',
}

// ════════════════════════════════════════════════════════════════
// Inicialização
// ════════════════════════════════════════════════════════════════
;(async function () {
  _usuario = await carregarUsuario()
  if (!_usuario) { window.location.href = '../index.html'; return }

  const perfisPermitidos = ['biologo','tecnico','gestor','super_admin']
  if (!perfisPermitidos.includes(_usuario.perfil)) {
    document.getElementById('app').innerHTML =
      gerarLayout('Validação de Campo', 'validacao-campo') +
      '<div class="page-content"><div class="alert alert-danger">Acesso restrito.</div></div>'
    return
  }

  document.getElementById('app').innerHTML =
    gerarLayout('Validação de Campo', 'validacao-campo') + `
<div class="page-content">
  <div class="page-header">
    <div>
      <h1 class="page-title">Validação de Campo</h1>
      <p class="page-subtitle">Registros das brigadas aguardando análise</p>
    </div>
  </div>

  <!-- KPIs -->
  <div class="kpi-row" id="kpi-row">
    <div class="kpi-box" data-kpi="aguardando"><span class="kpi-n alerta" id="kpi-aguardando">—</span><span class="kpi-l">Aguardando</span></div>
    <div class="kpi-box" data-kpi="correcao"><span class="kpi-n alerta" id="kpi-correcao">—</span><span class="kpi-l">Requer correção</span></div>
    <div class="kpi-box" data-kpi="fauna_pend"><span class="kpi-n" id="kpi-fauna-pend">—</span><span class="kpi-l">Com fauna pendente</span></div>
    <div class="kpi-box" data-kpi="validado_hoje"><span class="kpi-n verde" id="kpi-validado">—</span><span class="kpi-l">Validados hoje</span></div>
  </div>

  <!-- Filtros -->
  <div class="filtros-row">
    <button class="tab-btn ativo" data-st="aguardando">Aguardando</button>
    <button class="tab-btn" data-st="requer_correcao">Requer correção</button>
    <button class="tab-btn" data-st="validado">Validados</button>
    <button class="tab-btn" data-st="rejeitado">Rejeitados</button>
    <button class="tab-btn" data-st="">Todos</button>
    <div class="search-wrap">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="search" id="busca-input" placeholder="Brigadista, brigada, UC…">
    </div>
  </div>

  <div id="lista-registros"></div>
</div>`

  // Eventos dos filtros (tabs)
  document.querySelectorAll('.tab-btn[data-st]').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn[data-st]').forEach(x => x.classList.remove('ativo'))
      b.classList.add('ativo')
      _filtroStatus = b.dataset.st
      _filtroKpi    = null
      document.querySelectorAll('.kpi-box[data-kpi]').forEach(k => k.classList.remove('kpi-ativo'))
      renderLista()
    })
  })

  // Eventos dos KPI cards
  document.querySelectorAll('.kpi-box[data-kpi]').forEach(k => {
    k.addEventListener('click', () => {
      const kpi = k.dataset.kpi
      if (_filtroKpi === kpi) {
        // segundo clique desfaz
        _filtroKpi = null
        k.classList.remove('kpi-ativo')
      } else {
        document.querySelectorAll('.kpi-box[data-kpi]').forEach(x => x.classList.remove('kpi-ativo'))
        k.classList.add('kpi-ativo')
        _filtroKpi = kpi
        // desfaz seleção das tabs
        document.querySelectorAll('.tab-btn[data-st]').forEach(x => x.classList.remove('ativo'))
        _filtroStatus = ''
      }
      renderLista()
    })
  })
  document.getElementById('busca-input').addEventListener('input', e => {
    _busca = e.target.value.toLowerCase()
    renderLista()
  })

  await carregarDados()
  if (window._sigucBar) _sigucBarCompleta()
})()

// ════════════════════════════════════════════════════════════════
// Dados
// ════════════════════════════════════════════════════════════════
async function carregarDados() {
  const { data, error } = await db
    .from('vw_registros_validacao')
    .select('*')
    .order('criado_em', { ascending: false })
    .limit(400)

  if (error) { toast('Erro ao carregar registros: ' + error.message, 'erro'); return }
  _registros = data || []
  renderKpis()
  renderLista()
}

function renderKpis() {
  const hoje = new Date().toISOString().slice(0,10)
  const ag  = _registros.filter(r => r.status_validacao === 'aguardando').length
  const cor = _registros.filter(r => r.status_validacao === 'requer_correcao').length
  const fp  = _registros.filter(r => r.n_fauna_pendente > 0 && r.status_validacao !== 'rejeitado').length
  const vhj = _registros.filter(r => r.status_validacao === 'validado' && r.validado_em?.startsWith(hoje)).length
  document.getElementById('kpi-aguardando').textContent  = ag
  document.getElementById('kpi-correcao').textContent    = cor
  document.getElementById('kpi-fauna-pend').textContent  = fp
  document.getElementById('kpi-validado').textContent    = vhj
}

function filtrados() {
  const hoje = new Date().toISOString().slice(0, 10)
  return _registros.filter(r => {
    // filtro do KPI card tem prioridade sobre o filtro de tab
    if (_filtroKpi) {
      if (_filtroKpi === 'aguardando'    && r.status_validacao !== 'aguardando') return false
      if (_filtroKpi === 'correcao'      && r.status_validacao !== 'requer_correcao') return false
      if (_filtroKpi === 'fauna_pend'    && !(r.n_fauna_pendente > 0 && r.status_validacao !== 'rejeitado')) return false
      if (_filtroKpi === 'validado_hoje' && !(r.status_validacao === 'validado' && r.validado_em?.startsWith(hoje))) return false
    } else {
      if (_filtroStatus && r.status_validacao !== _filtroStatus) return false
    }
    if (_busca) {
      const hay = [r.brigadista_nome, r.brigada_nome, r.uc_nome, r.atividade, r.natureza]
        .filter(Boolean).join(' ').toLowerCase()
      if (!hay.includes(_busca)) return false
    }
    return true
  })
}

// ════════════════════════════════════════════════════════════════
// Renderização
// ════════════════════════════════════════════════════════════════
function renderLista() {
  const lista = document.getElementById('lista-registros')
  if (!lista) return
  const rows = filtrados()

  if (!rows.length) {
    lista.innerHTML = `<div style="text-align:center;padding:3rem;opacity:.5">
      <div style="font-size:2rem">📭</div>
      <p style="margin-top:8px">Nenhum registro neste filtro</p>
    </div>`
    return
  }

  lista.innerHTML = rows.map(r => {
    const nat  = NAT[r.natureza] || { cor:'#888', label:r.natureza, emoji:'📋' }
    const ativ = ATIV[r.atividade] || r.atividade || '—'
    const dt   = r.data_hora_evento
      ? new Date(r.data_hora_evento).toLocaleString('pt-BR', { timeZone:'America/Rio_Branco', day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' })
      : '—'
    const faunaBadge = r.n_fauna > 0
      ? (r.n_fauna_pendente > 0
          ? `<span class="badge-sm badge-fauna-pend">🐾 ${r.n_fauna_pendente} fauna pendente</span>`
          : `<span class="badge-sm badge-fauna-ok">🐾 ${r.n_fauna} fauna confirmada</span>`)
      : ''
    const fotoBadge = (r.fotos_urls?.length > 0)
      ? `<span class="badge-sm" style="background:#f3f4f6;color:#374151">📷 ${r.fotos_urls.length}</span>`
      : ''

    return `
    <div class="rc-card" data-id="${r.id}" onclick="abrirDetalhe('${r.id}')">
      <div>
        <div class="rc-top">
          <span class="nat-chip ${r.natureza}">${nat.emoji} ${nat.label}</span>
          <span class="badge-sm badge-${r.status_validacao}">${STATUS_VALID[r.status_validacao] || r.status_validacao}</span>
          ${r.n_fauna_pendente > 0
            ? `<span class="badge-sm badge-fauna-pend">🐾 ${r.n_fauna_pendente} fauna pendente</span>`
            : r.n_fauna > 0
              ? `<span class="badge-sm badge-fauna-ok">🐾 ${r.n_fauna} fauna validada</span>`
              : ''}
        </div>
        <div class="rc-titulo">${esc(ativ)} · ${esc(r.brigada_nome || '—')}</div>
        <div class="rc-meta">
          <span>👤 ${esc(r.brigadista_nome || '—')}</span>
          ${r.uc_nome ? `<span>🌳 ${esc(r.uc_nome)}</span>` : ''}
          <span>🕐 ${dt}</span>
          ${r.lat ? `<span>📍 GPS</span>` : ''}
        </div>
        <div class="rc-badges">${faunaBadge}${fotoBadge}</div>
      </div>
      <div class="rc-actions">
        <button class="btn-ver">Ver →</button>
      </div>
    </div>`
  }).join('')
}

          <span>${tipo} · ${cond}${dest ? ' · '+dest : ''}${f.faixa_etaria && f.faixa_etaria !== 'indeterminada' ? ' · '+f.faixa_etaria : ''}</span>
          ${(f.ameacada || f.especie?.ameacada) ? `<span style="display:block;margin-top:2px">${ameac}</span>` : ''}
        </div>
        <div class="fauna-head-right">
          ${f.identificacao_confirmada
            ? `<span class="badge-conf">✓ Confirmado</span>`
            : `<span class="badge-pend">Pendente</span>`}
          ${f.fotos_urls?.length ? `<span style="font-size:.72rem;color:var(--text-muted,#6b7280)">${f.fotos_urls.length} foto${f.fotos_urls.length>1?'s':''}</span>` : ''}
          <span class="fauna-chevron">▼</span>
        </div>
      </div>
      <div class="fauna-card-body" id="fauna-body-${f.id}">
        ${fotosHtml}
        ${f.observacoes ? `<p style="font-size:.82rem;font-style:italic;color:var(--text-muted,#6b7280);margin-bottom:10px">${esc(f.observacoes)}</p>` : ''}
        ${editFormHtml}
      </div>
    </div>`
  }).join('')
}

function toggleFaunaCard(rfId) {
  const head = document.querySelector(`#fauna-card-${rfId} .fauna-card-head`)
  const body = document.getElementById(`fauna-body-${rfId}`)
  head?.classList.toggle('expandido')
  body?.classList.toggle('aberto')
}

function toggleFaunaEdit(rfId, ev) {
  ev?.stopPropagation()
  document.getElementById(`fedit-${rfId}`)?.classList.toggle('aberto')
}

async function salvarCorrecaoFauna(rfId, confirmar = false) {
  const v = n => document.getElementById(`fedit-${n}-${rfId}`)?.value || null
  const vb = n => document.getElementById(`fedit-${n}-${rfId}`)?.checked ?? false

  const payload = {
    classe:          v('classe'),
    quantidade:      parseInt(document.getElementById(`fedit-qtd-${rfId}`)?.value || '1'),
    nome_popular:    document.getElementById(`fedit-popular-${rfId}`)?.value.trim() || null,
    nome_cientifico: document.getElementById(`fedit-cient-${rfId}`)?.value.trim() || null,
    condicao:        v('cond'),
    tipo_evento:     v('tipo'),
    causa_aparente:  v('causa') || null,
    destinacao:      v('dest') || null,
    faixa_etaria:    v('faixa'),
    sexo:            v('sexo'),
    ameacada:        vb('ameacada'),
    observacoes:     document.getElementById(`fedit-obs-${rfId}`)?.value.trim() || null,
  }

  if (confirmar) {
    payload.identificacao_confirmada = true
    payload.identificado_por = _usuario.id
  }

  const { error } = await db.from('registro_fauna').update(payload).eq('id', rfId)
  if (error) { toast('Erro ao salvar: ' + error.message, 'erro'); return }

  toast(confirmar ? 'Correção salva e identificação confirmada' : 'Correção salva', 'ok')
  await carregarFaunaModal(_detalheId)
  const idx = _registros.findIndex(r => r.id === _detalheId)
  if (idx >= 0) {
    _registros[idx].n_fauna_pendente = _faunaDetalhe.filter(f => !f.identificacao_confirmada).length
    renderLista(); renderKpis()
  }
}

// ════════════════════════════════════════════════════════════════
// Ações de validação
// ════════════════════════════════════════════════════════════════
function renderAcoes(r) {
  const cont = document.getElementById('modal-acoes')
  const isBiologo = _usuario.perfil === 'biologo'
  const podeRejeitar = ['gestor','super_admin','tecnico'].includes(_usuario.perfil)
  const podePromover = ['gestor','super_admin','tecnico'].includes(_usuario.perfil)
  const jaOcorrencia = !!r.ocorrencia_id

  let html = ''

  if (r.status_validacao !== 'validado') {
    html += `<button class="btn-acao btn-validar" onclick="iniciarAcao('validar')">✓ Validar</button>`
  }
  if (r.status_validacao !== 'requer_correcao') {
    html += `<button class="btn-acao btn-correcao" onclick="iniciarAcao('correcao')">↩ Requer correção</button>`
  }
  if (podeRejeitar && r.status_validacao !== 'rejeitado') {
    html += `<button class="btn-acao btn-rejeitar" onclick="iniciarAcao('rejeitar')">✕ Rejeitar</button>`
  }
  if (podePromover && !jaOcorrencia && r.status_validacao === 'validado') {
    html += `<button class="btn-acao btn-promover" onclick="iniciarAcao('promover')">🔔 Criar Ocorrência</button>`
  }
  if (jaOcorrencia) {
    html += `<a class="btn-acao btn-promover" href="ocorrencias.html" style="text-decoration:none">🔗 Ver Ocorrência</a>`
  }

  cont.innerHTML = html || '<span style="opacity:.5;font-size:.84rem">Nenhuma ação disponível</span>'
}

function iniciarAcao(tipo) {
  _acaoPendente = tipo
  const mw = document.getElementById('motivo-wrap')
  const pw = document.getElementById('promover-wrap')
  const vr = document.getElementById('veredito-row')

  mw.classList.remove('visivel')
  pw.classList.remove('visivel')

  if (tipo === 'promover') {
    pw.classList.add('visivel')
    document.getElementById('promover-titulo').focus()
    return
  }

  mw.classList.add('visivel')
  document.getElementById('motivo-txt').value = ''

  // Veredito só aparece ao validar
  vr.style.display = tipo === 'validar' ? 'flex' : 'none'
  if (tipo === 'validar') {
    document.querySelectorAll('.veredito-btn').forEach(b => b.classList.remove('sel'))
  }

  // Motivo obrigatório em correção e rejeição
  const btnConf = document.getElementById('btn-confirmar-acao')
  const labels = { validar:'Confirmar Validação', correcao:'Solicitar Correção', rejeitar:'Rejeitar Registro' }
  btnConf.textContent = labels[tipo] || 'Confirmar'
  btnConf.className = 'btn-acao ' + (tipo === 'validar' ? 'btn-validar' : tipo === 'rejeitar' ? 'btn-rejeitar' : 'btn-correcao')
  btnConf.onclick = executarAcao
}

function cancelarAcao() {
  _acaoPendente = null
  document.getElementById('motivo-wrap').classList.remove('visivel')
  document.getElementById('promover-wrap').classList.remove('visivel')
}

// Veredito selectionado
document.querySelectorAll('.veredito-btn').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.veredito-btn').forEach(x => x.classList.remove('sel'))
    b.classList.add('sel')
  })
})

async function executarAcao() {
  if (!_acaoPendente || !_detalheId) return

  const motivo   = document.getElementById('motivo-txt').value.trim()
  const veresel  = document.querySelector('.veredito-btn.sel')?.dataset.v || null

  const statusMap = { validar:'validado', correcao:'requer_correcao', rejeitar:'rejeitado' }
  const novoStatus = statusMap[_acaoPendente]

  if (!novoStatus) return
  if (['correcao','rejeitar'].includes(_acaoPendente) && !motivo) {
    toast('Informe o motivo', 'warn'); return
  }

  // Polígono editado pelo técnico no mapa (satélite) → vira a geometria validada
  const pGeom = (_valEdicaoAtiva && _valPolyLayer) ? _valPolyLayer.toGeoJSON().geometry : null

  const { error } = await db.rpc('validar_registro_campo', {
    p_id:       _detalheId,
    p_status:   novoStatus,
    p_motivo:   motivo || null,
    p_veredito: veresel,
    p_geom:     pGeom,
  })

  if (error) { toast('Erro: ' + error.message, 'erro'); return }

  toast(STATUS_VALID[novoStatus] + ' com sucesso', 'ok')
  fecharDetalhe()
  await carregarDados()
}

async function confirmarPromover() {
  const titulo = document.getElementById('promover-titulo').value.trim()
  if (!titulo) { toast('Informe o título da ocorrência', 'warn'); return }
  const sev = document.getElementById('promover-sev').value

  const { error } = await db.rpc('promover_registro_a_ocorrencia', {
    p_rc_id:      _detalheId,
    p_titulo:     titulo,
    p_severidade: sev,
  })

  if (error) { toast('Erro: ' + error.message, 'erro'); return }
  toast('Ocorrência criada com sucesso', 'ok')
  fecharDetalhe()
  await carregarDados()
}
document.getElementById('btn-confirmar-promover')?.addEventListener('click', confirmarPromover)

// ════════════════════════════════════════════════════════════════
// Utilitários
// ════════════════════════════════════════════════════════════════
function fecharDetalhe() {
  document.getElementById('modal-detalhe').style.display = 'none'
  _valDestruirMapa()
  _detalheId = null
  _acaoPendente = null
}

// ════════════════════════════════════════════════════════════════
// Mapa de validação (satélite + focos diários GIBS + editar polígono)
// ════════════════════════════════════════════════════════════════
let _valMap = null, _valDrawn = null, _valPolyLayer = null
let _valFocosLayer = null, _valGibsLayer = null
let _valEdicaoAtiva = false, _valGeoCache = null

function _valDestruirMapa() {
  try { if (_valPolyLayer && _valPolyLayer.editing) _valPolyLayer.editing.disable() } catch (e) {}
  if (_valMap) { _valMap.remove(); _valMap = null }
  _valDrawn = _valPolyLayer = _valFocosLayer = _valGibsLayer = _valGeoCache = null
  _valEdicaoAtiva = false
  const dz = document.getElementById('val-btn-desfazer'); if (dz) dz.hidden = true
}

function _valPolyDeGeoJSON(poly) {
  const anel = (poly.coordinates && poly.coordinates[0]) ? poly.coordinates[0] : []
  const latlngs = anel.map(c => [c[1], c[0]])
  if (latlngs.length > 1) {
    const a = latlngs[0], b = latlngs[latlngs.length - 1]
    if (a[0] === b[0] && a[1] === b[1]) latlngs.pop()
  }
  return L.polygon(latlngs, { color: '#12A66A', weight: 2, fillColor: '#12A66A', fillOpacity: .2 })
}

function _valMostrarAreaEdicao() {
  if (!_valPolyLayer) return
  let ha = null
  try { ha = turf.area(_valPolyLayer.toGeoJSON()) / 10000 } catch (e) {}
  const el = document.getElementById('val-area-info')
  if (el && ha != null) el.innerHTML = `Área editada: <b>${ha.toFixed(2)} ha</b> (gravada ao validar)`
}

async function initMapaValidacao(r) {
  const sec = document.getElementById('modal-mapa-sec')
  if (typeof L === 'undefined' || typeof mapaBasemapSatelite !== 'function') { sec.hidden = true; return }
  _valDestruirMapa()

  const selCam = document.getElementById('val-gibs-camada')
  if (selCam && !selCam.options.length) {
    selCam.innerHTML = MAPA_GIBS_CAMADAS.map(c => `<option value="${c.id}">${c.label}</option>`).join('')
    selCam.value = (MAPA_GIBS_CAMADAS.find(c => c.id.includes('Thermal')) || MAPA_GIBS_CAMADAS[0]).id
  }
  document.getElementById('val-gibs-data').value = mapaGibsDataSegura()
  document.getElementById('val-gibs-toggle').checked = false
  document.getElementById('val-area-info').innerHTML = ''
  document.getElementById('val-btn-desfazer').hidden = true

  let geo = null
  try { const { data } = await db.rpc('registro_geojson', { p_id: r.id }); geo = data } catch (e) {}
  _valGeoCache = geo

  const pontoCoord = geo?.ponto?.coordinates || (r.lat != null ? [r.lng, r.lat] : null)
  const poly = geo?.perimetro_validado || geo?.perimetro
  if (!pontoCoord && !poly) { sec.hidden = true; return }
  sec.hidden = false

  const centro = pontoCoord ? [pontoCoord[1], pontoCoord[0]] : [-9.5, -70]
  _valMap = L.map('val-mapa', { zoomControl: true, zoomAnimation: false, fadeAnimation: false }).setView(centro, 15)
  // Base de satélite + fallback automático para ESRI se a fonte falhar
  const _base = mapaBasemapSatelite(L).addTo(_valMap)
  let _baseTrocada = false
  _base.on('tileerror', () => {
    if (_baseTrocada || typeof mapaBasemapSateliteEsri !== 'function') return
    _baseTrocada = true
    try { _valMap.removeLayer(_base) } catch (e) {}
    mapaBasemapSateliteEsri(L).addTo(_valMap)
  })
  _valDrawn = new L.FeatureGroup().addTo(_valMap)
  // Revalida o tamanho após o layout do modal assentar (evita tela em branco)
  requestAnimationFrame(() => { if (_valMap) _valMap.invalidateSize() })
  setTimeout(() => { if (_valMap) _valMap.invalidateSize() }, 200)
  setTimeout(() => { if (_valMap) _valMap.invalidateSize() }, 500)

  if (pontoCoord) {
    L.circleMarker([pontoCoord[1], pontoCoord[0]],
      { radius: 6, color: '#0A1A0F', weight: 2, fillColor: '#C9A84C', fillOpacity: 1 })
      .bindTooltip('Ponto do app (GPS)').addTo(_valMap)
  }
  if (poly) {
    _valPolyLayer = _valPolyDeGeoJSON(poly).addTo(_valDrawn)
    _valPolyLayer.on('edit', _valMostrarAreaEdicao)
    try { _valMap.fitBounds(_valDrawn.getBounds().pad(0.4)) } catch (e) {}
  }

  document.getElementById('val-btn-editar').textContent = poly ? 'Editar polígono' : 'Desenhar polígono'
  _atualizarAreaInfo(geo)
  _valCarregarFocos(r.id)
}

function _atualizarAreaInfo(geo) {
  const el = document.getElementById('val-area-info'); if (!el) return
  const p = []
  if (geo?.area_estimada_ha != null) p.push(`estimada ${geo.area_estimada_ha} ha`)
  if (geo?.area_medida_ha != null)   p.push(`medida no app ${geo.area_medida_ha} ha`)
  if (geo?.area_validada_ha != null) p.push(`<b>validada ${geo.area_validada_ha} ha</b>`)
  el.innerHTML = p.length ? 'Área: ' + p.join(' · ') : ''
}

async function _valCarregarFocos(id) {
  const ev = document.getElementById('val-evidencia')
  if (ev) { ev.className = 'val-evidencia'; ev.textContent = 'Cruzando focos…' }
  let res = null
  try {
    const { data } = await db.rpc('focos_proximos_registro', { p_registro_id: id, p_raio_m: 1000, p_dias: 10 })
    res = data
  } catch (e) {}
  if (_valFocosLayer && _valMap) { _valMap.removeLayer(_valFocosLayer); _valFocosLayer = null }
  const focos = res?.focos || []
  if (focos.length && _valMap) {
    _valFocosLayer = L.layerGroup()
    focos.forEach(f => L.circleMarker([f.lat, f.lon],
      { radius: 5, color: '#991b1b', weight: 1, fillColor: '#ef4444', fillOpacity: .85 })
      .bindTooltip(`${f.fonte} · ${String(f.data || '').slice(0, 10)} · ${f.dist_m} m${f.frp ? ` · FRP ${f.frp}` : ''}`)
      .addTo(_valFocosLayer))
    _valFocosLayer.addTo(_valMap)
  }
  if (ev) {
    const n = res?.total || 0
    if (res?.sem_geom) { ev.className = 'val-evidencia'; ev.textContent = 'Sem geometria para cruzar focos' }
    else if (n > 0)    { ev.className = 'val-evidencia tem-fogo'; ev.textContent = `${n} foco(s) de calor a ≤1 km (±10 dias)` }
    else               { ev.className = 'val-evidencia sem-fogo'; ev.textContent = 'Nenhum foco a ≤1 km (±10 dias)' }
  }
}

function _valToggleGibs() {
  if (!_valMap) return
  if (_valGibsLayer) { _valMap.removeLayer(_valGibsLayer); _valGibsLayer = null }
  if (document.getElementById('val-gibs-toggle').checked) {
    const cam = document.getElementById('val-gibs-camada').value
    const dt  = document.getElementById('val-gibs-data').value || mapaGibsDataSegura()
    _valGibsLayer = mapaGibsLayer(L, cam, dt, 75).addTo(_valMap)
  }
}

function _valEditarPoligono() {
  if (!_valMap) return
  _valEdicaoAtiva = true
  document.getElementById('val-btn-desfazer').hidden = false
  if (_valPolyLayer && _valPolyLayer.editing) {
    _valPolyLayer.editing.enable()
    toast('Arraste os vértices para corrigir. Valide para gravar.', 'info')
  } else {
    const dh = new L.Draw.Polygon(_valMap, { shapeOptions: { color: '#12A66A', weight: 2 } })
    dh.enable()
    _valMap.once(L.Draw.Event.CREATED, (e) => {
      _valPolyLayer = e.layer.addTo(_valDrawn)
      _valPolyLayer.on('edit', _valMostrarAreaEdicao)
      try { _valPolyLayer.editing.enable() } catch (er) {}
      _valMostrarAreaEdicao()
    })
    toast('Toque para marcar os vértices; feche no primeiro ponto.', 'info')
  }
}

function _valDesfazerEdicao() {
  _valEdicaoAtiva = false
  document.getElementById('val-btn-desfazer').hidden = true
  const r = _registros.find(x => x.id === _detalheId)
  if (r) initMapaValidacao(r)
}

document.getElementById('val-gibs-toggle').addEventListener('change', _valToggleGibs)
document.getElementById('val-gibs-camada').addEventListener('change', () => { if (document.getElementById('val-gibs-toggle').checked) _valToggleGibs() })
document.getElementById('val-gibs-data').addEventListener('change', () => { if (document.getElementById('val-gibs-toggle').checked) _valToggleGibs() })
document.getElementById('val-btn-editar').addEventListener('click', _valEditarPoligono)
document.getElementById('val-btn-desfazer').addEventListener('click', _valDesfazerEdicao)

function abrirLightbox(url) {
  document.getElementById('lightbox-img').src = url
  document.getElementById('lightbox').classList.remove('oculto')
}

// Fecha modal clicando no overlay
document.getElementById('modal-detalhe').addEventListener('click', function(e) {
  if (e.target === this) fecharDetalhe()
})

// Tecla ESC
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (!document.getElementById('lightbox').classList.contains('oculto')) {
      document.getElementById('lightbox').classList.add('oculto')
    } else {
      fecharDetalhe()
    }
  }
})
</script>
