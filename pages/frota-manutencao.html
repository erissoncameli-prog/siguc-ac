<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SIGUC-AC · Frota — Manutenção</title>
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/frota-wise-theme.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/observability.js"></script>
<script src="../js/queryLogger.js"></script>
<script src="../js/config.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/frota-wise.js"></script>
</head>
<body>
<div id="app"></div>

<!-- Modal Plano -->
<div class="modal-overlay" id="modal-plano">
  <div class="modal" style="max-width:560px">
    <div class="modal-header">
      <div class="modal-title" id="pl-titulo">Novo Plano Preventivo</div>
      <button class="modal-close" onclick="fecharModal('plano')">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group"><label class="form-label">Veículo <span class="obrig">*</span></label>
        <select class="form-control" id="pl-veiculo"><option value="">Selecione...</option></select></div>
      <div class="form-group"><label class="form-label">Item <span class="obrig">*</span></label>
        <input class="form-control" id="pl-item" placeholder="Ex.: Troca de óleo, Revisão geral..."></div>
      <div class="grid-2">
        <div class="form-group"><label class="form-label" id="pl-intervalo-uso-label">Intervalo (km)</label>
          <input class="form-control" id="pl-intervalo-uso" type="number" min="0" step="0.1" placeholder="10000"></div>
        <div class="form-group"><label class="form-label">Intervalo (meses)</label>
          <input class="form-control" id="pl-intervalo-meses" type="number" min="0" placeholder="6"></div>
      </div>
      <div class="grid-2">
        <div class="form-group"><label class="form-label" id="pl-ultima-uso-label">Última execução (km)</label>
          <input class="form-control" id="pl-ultima-uso" type="number" min="0" step="0.1"></div>
        <div class="form-group"><label class="form-label">Última execução (data)</label>
          <input class="form-control" id="pl-ultima-data" type="date"></div>
      </div>
      <div class="form-group"><label class="form-label">Observações</label>
        <textarea class="form-control" id="pl-obs" rows="2"></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="btn-excluir-plano" style="margin-right:auto;color:#DC2626;display:none" onclick="excluirPlano()" data-icon="trash">Inativar</button>
      <button class="btn btn-secondary" onclick="fecharModal('plano')">Cancelar</button>
      <button class="btn btn-primary" id="btn-salvar-plano" onclick="salvarPlano()">Salvar</button>
    </div>
  </div>
</div>

<!-- Modal Ordem de Serviço -->
<div class="modal-overlay" id="modal-os">
  <div class="modal" style="max-width:560px">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="os-titulo">Nova Ordem de Serviço</div>
        <div id="os-codigo-badge" style="font-size:11px;color:#9CA3AF;margin-top:2px"></div>
      </div>
      <button class="modal-close" onclick="fecharModal('os')">×</button>
    </div>
    <div class="modal-body">
      <div class="grid-2">
        <div class="form-group"><label class="form-label">Veículo <span class="obrig">*</span></label>
          <select class="form-control" id="os-veiculo" onchange="atualizarPlanosDoVeiculo()"><option value="">Selecione...</option></select></div>
        <div class="form-group"><label class="form-label">Tipo</label>
          <select class="form-control" id="os-tipo">
            <option value="corretiva">Corretiva</option>
            <option value="preventiva">Preventiva</option>
          </select></div>
      </div>
      <div class="form-group" id="wrap-os-plano"><label class="form-label">Plano preventivo vinculado (opcional)</label>
        <select class="form-control" id="os-plano"><option value="">—</option></select></div>
      <div class="form-group"><label class="form-label">Descrição do problema/serviço <span class="obrig">*</span></label>
        <textarea class="form-control" id="os-descricao" rows="2"></textarea></div>
      <div class="grid-2">
        <div class="form-group"><label class="form-label">Oficina/fornecedor</label>
          <input class="form-control" id="os-oficina"></div>
        <div class="form-group" id="os-km-wrap"><label class="form-label" id="os-km-label">Hodômetro no momento (km)</label>
          <input class="form-control" id="os-km" type="number" min="0" step="0.1"></div>
      </div>
      <div class="form-group"><label class="form-label">Código/Nº da OS do fornecedor</label>
        <input class="form-control" id="os-codigo-fornecedor" placeholder="Nº que a oficina usa no documento dela"></div>
      <div class="grid-2">
        <div class="form-group"><label class="form-label">Data de abertura</label>
          <input class="form-control" id="os-abertura" type="date"></div>
        <div class="form-group"><label class="form-label">Data de conclusão</label>
          <input class="form-control" id="os-conclusao" type="date"></div>
      </div>

      <div class="form-group">
        <label class="form-label">Peças/itens utilizados</label>
        <div id="os-itens-lista" style="margin-bottom:8px"></div>
        <div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap">
          <input class="form-control" id="oi-descricao" list="dl-pecas" placeholder="Descrição da peça/serviço" style="flex:2;min-width:160px">
          <input class="form-control" id="oi-marca" list="dl-marcas" placeholder="Marca (opcional)" style="flex:1;min-width:110px">
          <input class="form-control" id="oi-qtd" type="number" min="0.01" step="0.01" value="1" placeholder="Qtd" style="width:70px">
          <input class="form-control" id="oi-valor" type="number" min="0" step="0.01" placeholder="Valor unit. (R$)" style="width:110px">
          <button type="button" class="btn btn-secondary btn-sm" onclick="adicionarItemOS()">Adicionar</button>
        </div>
        <datalist id="dl-pecas"></datalist>
        <datalist id="dl-marcas"></datalist>
      </div>

      <div class="grid-2">
        <div class="form-group"><label class="form-label">Mão de obra (R$)</label>
          <input class="form-control" id="os-custo" type="number" min="0" step="0.01" oninput="recalcularTotalOS()"></div>
        <div class="form-group"><label class="form-label">Status</label>
          <select class="form-control" id="os-status" onchange="ajustarDataConclusao()">
            <option value="aberta">Aberta</option>
            <option value="em_andamento">Em andamento</option>
            <option value="concluida">Concluída</option>
            <option value="cancelada">Cancelada</option>
          </select></div>
      </div>
      <div class="form-group" style="text-align:right;font-size:14px">
        Peças: <strong id="os-total-pecas">R$ 0,00</strong> · Mão de obra: <strong id="os-total-mo">R$ 0,00</strong> ·
        Total da OS: <strong id="os-total" style="color:var(--verde-c,#52B788);font-size:16px">R$ 0,00</strong>
      </div>
      <div class="form-group"><label class="form-label">Observações</label>
        <textarea class="form-control" id="os-obs" rows="2"></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="fecharModal('os')">Cancelar</button>
      <button class="btn btn-primary" id="btn-salvar-os" onclick="salvarOS()">Salvar</button>
    </div>
  </div>
</div>

<script>
let _podeEditar = false
let _veiculos = [], _planos = [], _ordens = []
let _editPlanoId = null, _editOsId = null
let _osItensAtual = []

const TIPO_OS_LABEL = { preventiva:'Preventiva', corretiva:'Corretiva' }
const TIPO_OS_BADGE = { preventiva:'badge-verde', corretiva:'badge-ouro' }
const STATUS_OS_LABEL = { aberta:'Aberta', em_andamento:'Em andamento', concluida:'Concluída', cancelada:'Cancelada' }
const STATUS_OS_BADGE = { aberta:'fw-badge fw-badge-inativo', em_andamento:'fw-badge fw-badge-manutencao', concluida:'fw-badge fw-badge-disponivel', cancelada:'badge-cinza' }

;(async function () {
  const usuario = await carregarUsuario()
  if (!usuario) { window.location.href = '../index.html'; return }

  const { data: nivel } = await db.rpc('nivel_efetivo', { p_usuario: usuario.id, p_modulo_chave: 'frota' })
  if (!nivel || nivel === 'sem_acesso') {
    document.body.innerHTML = '<div style="padding:60px;text-align:center;font-family:\'DM Sans\',sans-serif;color:#6B7280">Você não tem acesso ao módulo Frota.</div>'
    return
  }
  _podeEditar = nivel === 'editar'

  document.getElementById('app').innerHTML =
    gerarLayout('Frota — Manutenção', 'frota-manutencao') +
    `<div class="fade-in fw-theme">
      <div class="kpi-grid">
        <div class="fw-kpi-card"><div class="fw-kpi-label">OS abertas</div><div class="fw-kpi-value" id="k-os-abertas">0</div></div>
        <div class="fw-kpi-card"><div class="fw-kpi-label">Planos próximos do vencimento</div><div class="fw-kpi-value" id="k-plano-prox">0</div></div>
        <div class="fw-kpi-card"><div class="fw-kpi-label">Planos vencidos</div><div class="fw-kpi-value" id="k-plano-venc">0</div></div>
        <div class="fw-kpi-card"><div class="fw-kpi-label">Custo (últimos 30 dias)</div><div class="fw-kpi-value" id="k-custo" style="font-size:1.4rem">—</div></div>
      </div>

      <div class="card" style="margin-bottom:16px" id="card-comunicados">
        <div class="form-section-label" style="padding:0 0 10px">Comunicados de defeito (reportados pelos motoristas)</div>
        <div id="lista-comunicados"></div>
      </div>

      <div class="card" style="margin-bottom:16px">
        <div style="display:flex;gap:4px;padding:4px;background:rgba(0,0,0,.06);border-radius:10px;width:fit-content">
          <button class="tab-btn ativo" id="tab-planos" onclick="mudarAba('planos')">Planos Preventivos</button>
          <button class="tab-btn" id="tab-os" onclick="mudarAba('os')">Ordens de Serviço</button>
        </div>
      </div>

      <div id="aba-planos">
        <div class="filter-bar">
          <input class="form-control search-input" id="busca-pl" placeholder="Buscar veículo, item..." oninput="renderPlanos()">
          ${_podeEditar ? `<button class="btn btn-primary" onclick="abrirModalPlano()">${bico('clock')} Novo Plano</button>` : ''}
        </div>
        <div class="card">
          <div class="table-wrap"><div class="table-scroll">
            <table>
              <thead><tr><th>Veículo</th><th>Item</th><th>Intervalo</th><th>Última execução</th><th>Situação</th>${_podeEditar?'<th>Ações</th>':''}</tr></thead>
              <tbody id="tbody-planos"><tr><td colspan="6" style="text-align:center;padding:32px;color:#9CA3AF">Carregando...</td></tr></tbody>
            </table>
          </div></div>
        </div>
      </div>

      <div id="aba-os" style="display:none">
        <div class="filter-bar">
          <input class="form-control search-input" id="busca-os" placeholder="Buscar veículo, descrição..." oninput="renderOS()">
          <select class="form-control" id="fil-os-status" style="width:160px" onchange="renderOS()">
            <option value="">Status</option>
            ${Object.entries(STATUS_OS_LABEL).map(([v,l]) => `<option value="${v}">${l}</option>`).join('')}
          </select>
          ${_podeEditar ? `<button class="btn btn-primary" onclick="abrirModalOS()">${bico('edit')} Nova OS</button>` : ''}
        </div>
        <div class="card">
          <div class="table-wrap"><div class="table-scroll">
            <table>
              <thead><tr><th>Código</th><th>Veículo</th><th>Tipo</th><th>Descrição</th><th>Oficina</th><th>Custo</th><th>Status</th><th>Datas</th>${_podeEditar?'<th>Ações</th>':''}</tr></thead>
              <tbody id="tbody-os"><tr><td colspan="9" style="text-align:center;padding:32px;color:#9CA3AF">Carregando...</td></tr></tbody>
            </table>
          </div></div>
        </div>
      </div>
    </div>` +
    '</div></div></div>'

  carregarLogosSidebar()
  bIconsAplicar()
  await carregarVeiculos()
  await Promise.all([carregarPlanos(), carregarOS(), carregarSugestoes(), carregarComunicados()])
})()

function mudarAba(aba) {
  document.getElementById('aba-planos').style.display = aba === 'planos' ? '' : 'none'
  document.getElementById('aba-os').style.display     = aba === 'os'     ? '' : 'none'
  document.getElementById('tab-planos').classList.toggle('ativo', aba === 'planos')
  document.getElementById('tab-os').classList.toggle('ativo', aba === 'os')
}

// ── Cargas ────────────────────────────────────────────────────
async function carregarVeiculos() {
  const { data } = await db.from('frota_veiculos').select('id,placa,modelo,medidor,hodometro_km,horimetro_horas')
    .eq('ativo', true).order('placa')
  _veiculos = data || []
  const opts = _veiculos.map(v => `<option value="${v.id}">${esc(v.placa)} — ${esc(v.modelo)}</option>`).join('')
  document.getElementById('pl-veiculo').insertAdjacentHTML('beforeend', opts)
  document.getElementById('os-veiculo').insertAdjacentHTML('beforeend', opts)
}

async function carregarPlanos() {
  const { data } = await db.from('vw_frota_manutencoes_pendentes').select('*').order('placa')
  _planos = data || []
  renderPlanos()
  renderKpis()
}

async function carregarOS() {
  const { data } = await db.from('vw_frota_os_detalhe')
    .select('*')
    .order('data_abertura', { ascending: false })
  _ordens = data || []
  renderOS()
  renderKpis()
}

// ── Comunicados de defeito (reportados pelo motorista no app) ──
// O motorista só reporta (frota-app.html); abrir a OS de verdade
// (formulário completo — oficina, peças, custo) é só aqui na mesa.
let _comunicados = []
async function carregarComunicados() {
  const { data } = await db.from('vw_frota_comunicados_manutencao').select('*')
    .eq('status', 'pendente').order('criado_em', { ascending: false })
  _comunicados = data || []
  renderComunicados()
}

function renderComunicados() {
  const card = document.getElementById('card-comunicados')
  const el = document.getElementById('lista-comunicados')
  if (!_comunicados.length) { card.style.display = 'none'; return }
  card.style.display = ''
  el.innerHTML = _comunicados.map(c => `
    <div class="card" style="margin-bottom:8px;padding:12px 14px;border:1px solid #F3F4F6">
      <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap">
        <div>
          <div style="font-weight:600;font-size:13px">${esc(c.veiculo_placa)} · ${esc(c.veiculo_modelo)}</div>
          <div style="font-size:11px;color:#9CA3AF">${esc(c.motorista_nome)} · ${formatDataHora(c.criado_em)}</div>
        </div>
        ${_podeEditar ? `<div style="display:flex;gap:8px">
          <button class="btn btn-xs btn-secondary" onclick="abrirOSDoComunicado('${c.id}')">${bico('edit')} Abrir OS</button>
          <button class="btn btn-xs btn-ghost" style="color:#DC2626" onclick="descartarComunicado('${c.id}')">Descartar</button>
        </div>` : ''}
      </div>
      <div style="font-size:13px;color:#374151;margin-top:8px">${esc(c.descricao)}</div>
    </div>`).join('')
}

// Pré-preenche a Nova OS com veículo + descrição do comunicado; ao
// salvar (salvarOS), o comunicado é vinculado e marcado como validado.
let _comunicadoAbrindoOS = null
async function abrirOSDoComunicado(id) {
  const c = _comunicados.find(x => x.id === id)
  if (!c) return
  await abrirModalOS()
  _comunicadoAbrindoOS = c
  document.getElementById('os-veiculo').value = c.veiculo_id
  atualizarPlanosDoVeiculo()
  document.getElementById('os-tipo').value = 'corretiva'
  document.getElementById('os-descricao').value = c.descricao
}

async function descartarComunicado(id) {
  const motivo = prompt('Motivo do descarte (opcional):')
  if (motivo === null) return
  try {
    const { error } = await db.from('frota_comunicados_manutencao')
      .update({ status: 'descartado', motivo_descarte: motivo || null, validado_por: appState.usuario.id, validado_em: new Date().toISOString() })
      .eq('id', id)
    if (error) throw error
    toast('Comunicado descartado', 'success')
    await carregarComunicados()
  } catch (e) { toast(e.message || 'Erro ao descartar', 'error') }
}

// ── Sugestões de peças/marcas (autocompletar — cresce sozinha) ─
async function carregarSugestoes() {
  const { data } = await db.from('frota_sugestoes').select('tipo,valor').order('uso_count', { ascending: false })
  const pecas = (data || []).filter(s => s.tipo === 'peca')
  const marcas = (data || []).filter(s => s.tipo === 'marca')
  document.getElementById('dl-pecas').innerHTML = pecas.map(s => `<option value="${esc(s.valor)}">`).join('')
  document.getElementById('dl-marcas').innerHTML = marcas.map(s => `<option value="${esc(s.valor)}">`).join('')
}

function renderKpis() {
  const set = (id, v) => { const el = document.getElementById(id); if (el) fwAnimateNumber(el, v) }
  const setTexto = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v }
  set('k-os-abertas', _ordens.filter(o => o.status === 'aberta' || o.status === 'em_andamento').length)
  set('k-plano-venc', _planos.filter(p => situacaoPlano(p) === 'vencido').length)
  set('k-plano-prox', _planos.filter(p => situacaoPlano(p) === 'proximo').length)
  const desde = new Date(); desde.setDate(desde.getDate() - 30)
  const custo30 = _ordens
    .filter(o => o.status === 'concluida' && o.data_conclusao && new Date(o.data_conclusao) >= desde)
    .reduce((acc, o) => acc + (Number(o.custo_total) || 0), 0)
  setTexto('k-custo', formatBRL(custo30))
}

// ── Situação do plano (ok / próximo / vencido) ─────────────────
function situacaoPlano(p) {
  const usoVencido = p.restante_uso != null && p.restante_uso <= 0
  const usoProximo  = p.restante_uso != null && p.restante_uso > 0 && p.restante_uso <= (p.intervalo_km * 0.1)
  const diasVencido = p.restante_dias != null && p.restante_dias <= 0
  const diasProximo = p.restante_dias != null && p.restante_dias > 0 && p.restante_dias <= 15
  if (usoVencido || diasVencido) return 'vencido'
  if (usoProximo || diasProximo) return 'proximo'
  return 'ok'
}
const SITUACAO_LABEL = { ok:'Em dia', proximo:'Próximo', vencido:'Vencido' }
const SITUACAO_BADGE = { ok:'fw-badge fw-badge-disponivel', proximo:'fw-badge fw-badge-doc-vencendo', vencido:'fw-badge fw-badge-inativo' }

// ── Render Planos ────────────────────────────────────────────
function renderPlanos() {
  const q = (document.getElementById('busca-pl')?.value || '').toLowerCase()
  const lista = _planos.filter(p => (!q || `${p.placa} ${p.modelo} ${p.item}`.toLowerCase().includes(q)))
  const tbody = document.getElementById('tbody-planos')
  if (!tbody) return
  const cols = _podeEditar ? 6 : 5
  if (!lista.length) { tbody.innerHTML = `<tr><td colspan="${cols}" style="text-align:center;padding:32px;color:#9CA3AF">Nenhum plano cadastrado</td></tr>`; return }
  tbody.innerHTML = lista.map(p => {
    const unidade = p.medidor === 'horimetro' ? 'h' : 'km'
    const intervalo = [
      p.intervalo_km != null ? `${formatNum(p.intervalo_km,1)} ${unidade}` : null,
      p.intervalo_meses != null ? `${p.intervalo_meses} meses` : null
    ].filter(Boolean).join(' ou ')
    const ultima = [
      p.ultima_execucao_km != null ? `${formatNum(p.ultima_execucao_km,1)} ${unidade}` : null,
      p.ultima_execucao_data ? formatData(p.ultima_execucao_data) : null
    ].filter(Boolean).join(' · ') || '—'
    const sit = situacaoPlano(p)
    const detalhe = sit === 'vencido'
      ? (p.restante_uso != null && p.restante_uso <= 0 ? `${formatNum(Math.abs(p.restante_uso),1)} ${unidade} atrasado` : `${Math.abs(p.restante_dias)}d atrasado`)
      : sit === 'proximo'
        ? (p.restante_uso != null && p.restante_uso <= (p.intervalo_km*0.1) ? `faltam ${formatNum(p.restante_uso,1)} ${unidade}` : `faltam ${p.restante_dias}d`)
        : ''
    return `<tr>
      <td style="font-size:12px"><strong>${esc(p.placa)}</strong><br>${esc(p.modelo)}</td>
      <td style="font-size:12px">${esc(p.item)}</td>
      <td class="mono" style="font-size:12px">${intervalo || '—'}</td>
      <td class="mono" style="font-size:12px">${ultima}</td>
      <td><span class="badge ${SITUACAO_BADGE[sit]}">${SITUACAO_LABEL[sit]}</span>${detalhe ? `<div style="font-size:11px;color:#9CA3AF;margin-top:2px">${detalhe}</div>` : ''}</td>
      ${_podeEditar ? `<td><button class="btn btn-xs btn-ghost" onclick="abrirModalPlano('${p.id}')">Editar</button></td>` : ''}
    </tr>`
  }).join('')
}

// ── Render OS ─────────────────────────────────────────────────
function renderOS() {
  const q = (document.getElementById('busca-os')?.value || '').toLowerCase()
  const status = document.getElementById('fil-os-status')?.value
  const lista = _ordens.filter(o =>
    (!q || `${o.placa||''} ${o.modelo||''} ${o.descricao}`.toLowerCase().includes(q)) &&
    (!status || o.status === status))
  const tbody = document.getElementById('tbody-os')
  if (!tbody) return
  const cols = _podeEditar ? 9 : 8
  if (!lista.length) { tbody.innerHTML = `<tr><td colspan="${cols}" style="text-align:center;padding:32px;color:#9CA3AF">Nenhuma ordem de serviço encontrada</td></tr>`; return }
  tbody.innerHTML = lista.map(o => `
    <tr>
      <td class="mono" style="font-size:12px">${esc(o.codigo||'—')}</td>
      <td style="font-size:12px"><strong>${esc(o.placa||'—')}</strong><br>${esc(o.modelo||'')}</td>
      <td><span class="badge ${TIPO_OS_BADGE[o.tipo]}">${TIPO_OS_LABEL[o.tipo]}</span></td>
      <td style="font-size:12px;max-width:220px">${esc(o.descricao)}</td>
      <td style="font-size:12px">${esc(o.oficina||'—')}</td>
      <td class="mono" style="font-size:12px">${o.custo_total != null ? formatBRL(o.custo_total) : '—'}${o.custo_pecas > 0 ? `<div style="font-size:10px;color:#9CA3AF">peças ${formatBRL(o.custo_pecas)}</div>` : ''}</td>
      <td><span class="badge ${STATUS_OS_BADGE[o.status]}">${STATUS_OS_LABEL[o.status]}</span></td>
      <td style="font-size:12px">${formatData(o.data_abertura)}${o.data_conclusao ? `<br>até ${formatData(o.data_conclusao)}` : ''}</td>
      ${_podeEditar ? `<td><button class="btn btn-xs btn-ghost" onclick="abrirModalOS('${o.id}')">Editar</button></td>` : ''}
    </tr>`).join('')
}

// ── Modal Plano ───────────────────────────────────────────────
function _medidorDoVeiculo(veiculoId) {
  return _veiculos.find(v => v.id === veiculoId)?.medidor || 'hodometro'
}
function _ajustarLabelsPlano() {
  const medidor = _medidorDoVeiculo(document.getElementById('pl-veiculo').value)
  const unidade = medidor === 'horimetro' ? 'horas' : 'km'
  document.getElementById('pl-intervalo-uso-label').textContent = `Intervalo (${unidade})`
  document.getElementById('pl-ultima-uso-label').textContent = `Última execução (${unidade})`
}

function abrirModalPlano(id = null) {
  const p = id ? _planos.find(x => x.id === id) : null
  _editPlanoId = p?.id || null
  document.getElementById('pl-titulo').textContent = p ? 'Editar Plano' : 'Novo Plano Preventivo'
  document.getElementById('btn-excluir-plano').style.display = p ? '' : 'none'
  document.getElementById('pl-veiculo').value = p?.veiculo_id || ''
  document.getElementById('pl-item').value = p?.item || ''
  document.getElementById('pl-intervalo-uso').value = p?.intervalo_km ?? ''
  document.getElementById('pl-intervalo-meses').value = p?.intervalo_meses ?? ''
  document.getElementById('pl-ultima-uso').value = p?.ultima_execucao_km ?? ''
  document.getElementById('pl-ultima-data').value = p?.ultima_execucao_data || ''
  document.getElementById('pl-obs').value = p?.observacoes || ''
  _ajustarLabelsPlano()
  document.getElementById('modal-plano').classList.add('aberto')
}
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('pl-veiculo')?.addEventListener('change', _ajustarLabelsPlano)
})

async function salvarPlano() {
  const veiculo_id = document.getElementById('pl-veiculo').value
  const item = document.getElementById('pl-item').value.trim()
  const intervalo_km = document.getElementById('pl-intervalo-uso').value
  const intervalo_meses = document.getElementById('pl-intervalo-meses').value
  if (!veiculo_id || !item) { toast('Veículo e item são obrigatórios', 'error'); return }
  if (!intervalo_km && !intervalo_meses) { toast('Informe ao menos um intervalo (uso ou tempo)', 'error'); return }
  const payload = {
    veiculo_id, item,
    intervalo_km: intervalo_km ? parseFloat(intervalo_km) : null,
    intervalo_meses: intervalo_meses ? parseInt(intervalo_meses) : null,
    ultima_execucao_km: document.getElementById('pl-ultima-uso').value ? parseFloat(document.getElementById('pl-ultima-uso').value) : null,
    ultima_execucao_data: document.getElementById('pl-ultima-data').value || null,
    observacoes: document.getElementById('pl-obs').value.trim() || null,
  }
  const btn = document.getElementById('btn-salvar-plano')
  btn.disabled = true; btn.textContent = 'Salvando...'
  try {
    if (_editPlanoId) {
      const { error } = await db.from('frota_planos_manutencao').update(payload).eq('id', _editPlanoId)
      if (error) throw error
      toast('Plano atualizado!', 'success')
    } else {
      const { error } = await db.from('frota_planos_manutencao').insert(payload)
      if (error) throw error
      toast('Plano cadastrado!', 'success')
    }
    fecharModal('plano'); await carregarPlanos()
  } catch (e) { toast(e.message || 'Erro ao salvar', 'error') }
  finally { btn.disabled = false; btn.textContent = 'Salvar' }
}

async function excluirPlano() {
  if (!_editPlanoId) return
  if (!confirm('Inativar este plano preventivo?')) return
  const { error } = await db.from('frota_planos_manutencao').update({ ativo: false }).eq('id', _editPlanoId)
  if (error) { toast(error.message, 'error'); return }
  toast('Plano inativado', 'success')
  fecharModal('plano'); await carregarPlanos()
}

// ── Modal OS ──────────────────────────────────────────────────
function atualizarPlanosDoVeiculo() {
  const veiculoId = document.getElementById('os-veiculo').value
  const medidor = _medidorDoVeiculo(veiculoId)
  document.getElementById('os-km-label').textContent =
    medidor === 'horimetro' ? 'Horímetro no momento (horas)' : 'Hodômetro no momento (km)'
  const planosDoVeiculo = _planos.filter(p => p.veiculo_id === veiculoId)
  document.getElementById('os-plano').innerHTML = '<option value="">—</option>' +
    planosDoVeiculo.map(p => `<option value="${p.id}">${esc(p.item)}</option>`).join('')
}

function ajustarDataConclusao() {
  const status = document.getElementById('os-status').value
  if (status === 'concluida' && !document.getElementById('os-conclusao').value) {
    document.getElementById('os-conclusao').value = new Date().toISOString().slice(0,10)
  }
}

// ── Itens/peças da OS ───────────────────────────────────────────
function renderItensOS() {
  const el = document.getElementById('os-itens-lista')
  el.innerHTML = !_osItensAtual.length
    ? '<div style="font-size:12px;color:#9CA3AF">Nenhum item adicionado</div>'
    : _osItensAtual.map((it, i) => `
      <div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #F3F4F6;font-size:13px">
        <span style="flex:2">${esc(it.descricao)}${it.marca ? `<span style="color:#9CA3AF"> · ${esc(it.marca)}</span>` : ''}</span>
        <span class="mono" style="width:60px;text-align:right">${formatNum(it.quantidade,2)}×</span>
        <span class="mono" style="width:90px;text-align:right">${formatBRL(it.valor_unitario)}</span>
        <span class="mono" style="width:90px;text-align:right;font-weight:600">${formatBRL(it.quantidade * it.valor_unitario)}</span>
        <button type="button" class="btn btn-xs btn-ghost" style="color:#DC2626" onclick="removerItemOS(${i})">${bico('trash')}</button>
      </div>`).join('')
  recalcularTotalOS()
}

function adicionarItemOS() {
  const descricao = document.getElementById('oi-descricao').value.trim()
  const marca = document.getElementById('oi-marca').value.trim()
  const quantidade = parseFloat(document.getElementById('oi-qtd').value)
  const valor_unitario = parseFloat(document.getElementById('oi-valor').value)
  if (!descricao || !quantidade || isNaN(valor_unitario)) { toast('Preencha descrição, quantidade e valor do item', 'error'); return }
  _osItensAtual.push({ descricao, marca: marca || null, quantidade, valor_unitario })
  document.getElementById('oi-descricao').value = ''
  document.getElementById('oi-marca').value = ''
  document.getElementById('oi-qtd').value = '1'
  document.getElementById('oi-valor').value = ''
  renderItensOS()
  db.rpc('frota_registrar_sugestao', { p_tipo: 'peca', p_valor: descricao })
  if (marca) db.rpc('frota_registrar_sugestao', { p_tipo: 'marca', p_valor: marca })
}

function removerItemOS(i) {
  _osItensAtual.splice(i, 1)
  renderItensOS()
}

function recalcularTotalOS() {
  const totalPecas = _osItensAtual.reduce((acc, it) => acc + it.quantidade * it.valor_unitario, 0)
  const maoObra = parseFloat(document.getElementById('os-custo').value) || 0
  document.getElementById('os-total-pecas').textContent = formatBRL(totalPecas)
  document.getElementById('os-total-mo').textContent = formatBRL(maoObra)
  document.getElementById('os-total').textContent = formatBRL(totalPecas + maoObra)
}

async function abrirModalOS(id = null) {
  const o = id ? _ordens.find(x => x.id === id) : null
  _editOsId = o?.id || null
  _comunicadoAbrindoOS = null
  document.getElementById('os-titulo').textContent = o ? 'Editar Ordem de Serviço' : 'Nova Ordem de Serviço'
  document.getElementById('os-codigo-badge').textContent = o?.codigo ? `Código ${o.codigo}` : 'Código gerado automaticamente ao salvar'
  document.getElementById('os-veiculo').value = o?.veiculo_id || ''
  atualizarPlanosDoVeiculo()
  document.getElementById('os-plano').value = o?.plano_id || ''
  document.getElementById('os-tipo').value = o?.tipo || 'corretiva'
  document.getElementById('os-descricao').value = o?.descricao || ''
  document.getElementById('os-oficina').value = o?.oficina || ''
  document.getElementById('os-codigo-fornecedor').value = o?.codigo_fornecedor || ''
  document.getElementById('os-km').value = o?.km_veiculo ?? ''
  document.getElementById('os-abertura').value = o?.data_abertura || new Date().toISOString().slice(0,10)
  document.getElementById('os-conclusao').value = o?.data_conclusao || ''
  document.getElementById('os-custo').value = o?.custo_mao_obra ?? ''
  document.getElementById('os-status').value = o?.status || 'aberta'
  document.getElementById('os-obs').value = o?.observacoes || ''
  document.getElementById('oi-descricao').value = ''
  document.getElementById('oi-marca').value = ''
  document.getElementById('oi-qtd').value = '1'
  document.getElementById('oi-valor').value = ''
  _osItensAtual = []
  if (o) {
    const { data } = await db.from('frota_os_itens').select('*').eq('os_id', o.id).order('criado_em')
    _osItensAtual = (data || []).map(it => ({ descricao: it.descricao, marca: it.marca || null, quantidade: Number(it.quantidade), valor_unitario: Number(it.valor_unitario) }))
  }
  renderItensOS()
  document.getElementById('modal-os').classList.add('aberto')
}

async function salvarOS() {
  const veiculo_id = document.getElementById('os-veiculo').value
  const descricao = document.getElementById('os-descricao').value.trim()
  if (!veiculo_id || !descricao) { toast('Veículo e descrição são obrigatórios', 'error'); return }
  const payload = {
    veiculo_id,
    plano_id: document.getElementById('os-plano').value || null,
    tipo: document.getElementById('os-tipo').value,
    descricao,
    oficina: document.getElementById('os-oficina').value.trim() || null,
    codigo_fornecedor: document.getElementById('os-codigo-fornecedor').value.trim() || null,
    km_veiculo: document.getElementById('os-km').value ? parseFloat(document.getElementById('os-km').value) : null,
    data_abertura: document.getElementById('os-abertura').value || new Date().toISOString().slice(0,10),
    data_conclusao: document.getElementById('os-conclusao').value || null,
    custo_mao_obra: document.getElementById('os-custo').value ? parseFloat(document.getElementById('os-custo').value) : null,
    status: document.getElementById('os-status').value,
    observacoes: document.getElementById('os-obs').value.trim() || null,
  }
  const btn = document.getElementById('btn-salvar-os')
  btn.disabled = true; btn.textContent = 'Salvando...'
  try {
    let osId = _editOsId
    if (_editOsId) {
      const { error } = await db.from('frota_ordens_servico').update(payload).eq('id', _editOsId)
      if (error) throw error
    } else {
      const { data, error } = await db.from('frota_ordens_servico').insert(payload).select('id').single()
      if (error) throw error
      osId = data.id
    }
    await db.from('frota_os_itens').delete().eq('os_id', osId)
    if (_osItensAtual.length) {
      const { error: itensErr } = await db.from('frota_os_itens').insert(
        _osItensAtual.map(it => ({ os_id: osId, descricao: it.descricao, marca: it.marca || null, quantidade: it.quantidade, valor_unitario: it.valor_unitario }))
      )
      if (itensErr) throw itensErr
    }
    // Nasceu de um comunicado de defeito (abrirOSDoComunicado): vincula
    // e marca como validado — some da lista de pendentes.
    if (_comunicadoAbrindoOS && !_editOsId) {
      await db.from('frota_comunicados_manutencao')
        .update({ status: 'validado', os_id: osId, validado_por: appState.usuario.id, validado_em: new Date().toISOString() })
        .eq('id', _comunicadoAbrindoOS.id)
      _comunicadoAbrindoOS = null
      await carregarComunicados()
    }
    toast(_editOsId ? 'Ordem de serviço atualizada!' : 'Ordem de serviço aberta!', 'success')
    fecharModal('os')
    await Promise.all([carregarOS(), carregarPlanos(), carregarVeiculos()])
  } catch (e) { toast(e.message || 'Erro ao salvar', 'error') }
  finally { btn.disabled = false; btn.textContent = 'Salvar' }
}

function fecharModal(qual) {
  document.getElementById(`modal-${qual}`).classList.remove('aberto')
  if (qual === 'plano') _editPlanoId = null
  if (qual === 'os') _editOsId = null
}
</script>
