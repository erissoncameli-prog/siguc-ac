<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">

<style>
.tabs { display:flex; gap:4px; margin-bottom:20px; border-bottom:2px solid #E5E7EB; flex-wrap:wrap; }
.tab-btn {
  padding:10px 20px; font-size:13px; font-weight:600; border:none; min-height:40px;
  background:none; color:#6B7280; cursor:pointer; border-bottom:2px solid transparent;
  margin-bottom:-2px; transition:color .15s,border-color .15s;
}
/* --verde-c NÃO existe em css/global.css (lá é --verde-claro): usado aqui, a aba ativa,
   a barra e o contador ficavam sem cor. */
.tab-btn.ativo { color:var(--verde-medio); border-bottom-color:var(--verde-claro); }
.tab-btn:hover:not(.ativo) { color:#374151; }
.tab-panel[hidden] { display:none; }
/* .main-content é item flex com min-width:auto: sem isto ele cresce até
   a largura mínima da tabela de imóveis e a PÁGINA inteira rola de lado
   no celular (medido: 1.410px em 390px), apesar do .table-wrap. Com 0,
   quem rola é só o .table-wrap, como a regra de estados de interface pede. */
.main-content { min-width:0; }

.caruc-form { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px 20px; align-items:start; }
.caruc-form label.caruc-rot { display:block; font-size:11px; font-weight:700; color:#374151; text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px; }
.caruc-check { display:flex; align-items:flex-start; gap:8px; font-size:13px; color:#374151; margin-bottom:8px; min-height:24px; cursor:pointer; }
.caruc-check input { width:18px; height:18px; margin-top:1px; flex-shrink:0; }
.caruc-check small { display:block; color:#9CA3AF; font-size:11px; }
.caruc-check.desab { opacity:.55; cursor:not-allowed; }
.caruc-periodo { display:flex; align-items:center; gap:8px; margin:0 0 8px 26px; font-size:12px; color:#6B7280; }
.caruc-periodo select { width:auto; min-width:90px; }
.caruc-info { font-size:12px; color:#6B7280; line-height:1.5; margin-top:6px; }
.caruc-prog { margin-top:14px; font-size:12px; color:#374151; }
.caruc-prog-barra { height:6px; background:#E5E7EB; border-radius:99px; overflow:hidden; margin-top:6px; }
.caruc-prog-barra > div { height:100%; background:var(--verde-claro); width:0; transition:width .2s; }
.caruc-kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-bottom:16px; }
.caruc-kpis .kpi-valor { font-family:var(--font-sans); font-size:26px; }
.caruc-kpis .kpi-sub { font-size:11px; color:#6B7280; margin-top:6px; }
.caruc-enq { border-left:4px solid var(--cinza-400); padding:10px 14px; background:#F9FAFB; border-radius:6px; font-size:13px; line-height:1.55; color:#374151; }
.caruc-enq.conflito { border-left-color:#B91C1C; background:#FEF2F2; }
.caruc-enq.verificar { border-left-color:#B45309; background:#FFFBEB; }
.caruc-enq.admitido { border-left-color:#15803D; background:#F0FDF4; }
.caruc-grid4 { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:14px; }
.caruc-mini { width:100%; border-collapse:collapse; font-size:12px; }
.caruc-mini th { text-align:left; font-size:10px; color:#6B7280; text-transform:uppercase; letter-spacing:.05em; padding:6px 8px; border-bottom:2px solid #E5E7EB; }
.caruc-mini td { padding:6px 8px; border-bottom:1px solid #F3F4F6; }
.caruc-mini td.num, .caruc-mini th.num { text-align:right; white-space:nowrap; }
.caruc-zona { display:inline-block; font-size:10.5px; padding:2px 7px; border-radius:99px; margin:1px 2px 1px 0; border:1px solid #D1D5DB; background:#fff; white-space:nowrap; }
.caruc-zona.protecao { border-color:#B91C1C; color:#991B1B; background:#FEF2F2; }
.caruc-zona.uso { border-color:#B45309; color:#92400E; background:#FFFBEB; }
.caruc-atencao { display:block; font-size:10.5px; color:#991B1B; line-height:1.4; margin-top:3px; }
#caruc-tabela td:nth-child(2) { min-width:170px; }
.caruc-filtros { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
.caruc-filtros input[type=search] { flex:1; min-width:200px; }
.caruc-nota { font-size:11px; color:#6B7280; line-height:1.55; margin:4px 0; }
.caruc-aviso { font-size:12px; color:#92400E; background:#FFFBEB; border:1px solid #FDE68A; border-radius:6px; padding:8px 12px; margin-bottom:12px; }
#caruc-tabela td { font-size:12px; vertical-align:top; }
.caruc-filtros-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px 14px; padding:12px; background:#F9FAFB; border:1px solid #E5E7EB; border-radius:8px; margin-bottom:10px; }
.caruc-filtros-grid[hidden] { display:none; }
.caruc-chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px; }
.caruc-chip { display:inline-flex; align-items:center; gap:4px; min-height:28px; padding:3px 10px; font-size:12px; border-radius:99px; border:1px solid var(--verde-claro); background:#F0FDF4; color:#14532D; cursor:pointer; font-family:inherit; }
.caruc-chip:hover { background:#DCFCE7; }
.btn .caruc-contador { display:inline-block; min-width:18px; padding:0 5px; border-radius:99px; background:var(--verde-medio); color:#fff; font-size:11px; line-height:18px; text-align:center; margin-left:4px; }
.btn .caruc-contador[hidden] { display:none; }
#caruc-tabela td:first-child { min-width:130px; }
.caruc-prio { display:inline-block; font-size:11px; font-weight:700; padding:2px 9px; border-radius:99px; white-space:nowrap; }
.caruc-prio.alta { background:#B91C1C; color:#fff; }
.caruc-prio.media { background:#FFFBEB; color:#92400E; border:1px solid #D97706; }
.caruc-prio.baixa { background:#F3F4F6; color:#4B5563; border:1px solid #D1D5DB; }
.caruc-cod { font-family:ui-monospace,monospace; font-size:11px; display:block; }
.caruc-tit { display:block; font-size:10.5px; color:#1E3A8A; margin-top:2px; }
#caruc-tabela td.num { text-align:right; white-space:nowrap; }
</style>
</head>
<body>
<div id="app"></div>
<script>
;(async function () {
  const usuario = await carregarUsuario()
  if (!usuario) { window.location.href = '../index.html'; return }

  document.getElementById('app').innerHTML =
    gerarLayout('Relatórios', 'relatorios') +
    `<div class="fade-in">
      <div class="tabs" role="tablist">
        <button class="tab-btn ativo" role="tab" id="aba-btn-geral" aria-selected="true" aria-controls="aba-geral" onclick="ativarAbaRel('geral')">Visão geral</button>
        <button class="tab-btn" role="tab" id="aba-btn-car" aria-selected="false" aria-controls="aba-car" onclick="ativarAbaRel('car')">CAR na UC</button>
      </div>

      <div class="tab-panel" id="aba-car" role="tabpanel" aria-labelledby="aba-btn-car" hidden>
        <div class="card" style="margin-bottom:20px">
          <div class="card-header">
            <div><div class="card-title">Imóveis do CAR registrados numa UC</div>
            <div class="card-subtitle">Número, situação, titular, área sobreposta e zonas de manejo — com dados ambientais opcionais</div></div>
          </div>
          <div class="card-body">
            <div class="caruc-form">
              <div>
                <label class="caruc-rot" for="caruc-uc">Unidade de conservação</label>
                <select class="form-control" id="caruc-uc" onchange="carucUcAlterada()">
                  <option value="">Selecione uma UC...</option>
                </select>
                <div class="caruc-info" id="caruc-uc-info"></div>
                <label class="caruc-check desab" id="caruc-za-rot" style="margin-top:10px">
                  <input type="checkbox" id="caruc-za" disabled>
                  <span>Incluir imóveis só na zona de amortecimento<small id="caruc-za-dica">Escolha uma UC.</small></span>
                </label>
              </div>
              <div>
                <span class="caruc-rot">Dados ambientais (opcional)</span>
                <label class="caruc-check"><input type="checkbox" id="caruc-focos"><span>Focos de calor<small>Temporada de fogo (jul–nov), série do sistema</small></span></label>
                <div class="caruc-periodo"><label for="caruc-focos-de">De</label><select class="form-control" id="caruc-focos-de"></select><label for="caruc-focos-ate">até</label><select class="form-control" id="caruc-focos-ate"></select></div>
                <label class="caruc-check"><input type="checkbox" id="caruc-deter"><span>Alertas DETER<small>Base do sistema, desde jun/2026</small></span></label>
                <label class="caruc-check"><input type="checkbox" id="caruc-prodes"><span>Desmatamento PRODES<small>Consulta o INPE na hora — mais lento em UC grande</small></span></label>
              </div>
            </div>
            <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center">
              <button class="btn btn-primary" id="caruc-gerar" onclick="carucGerar()" disabled>Gerar relatório</button>
              <span class="caruc-nota">CPF/CNPJ sai sempre mascarado. A consulta fica registrada no log de acesso a dado de terceiro (LGPD).</span>
            </div>
            <div class="caruc-prog" id="caruc-prog" hidden>
              <div id="caruc-prog-txt" aria-live="polite"></div>
              <div class="caruc-prog-barra" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="caruc-prog-barra"><div></div></div>
            </div>
          </div>
        </div>
        <div id="caruc-resultado"></div>
      </div>

      <div class="tab-panel" id="aba-geral" role="tabpanel" aria-labelledby="aba-btn-geral">
      <div class="grid-2" style="gap:16px;margin-bottom:20px">

        <div class="card" id="card-resumo">
          <div class="card-header"><div class="card-title">Resumo Geral do Sistema</div><button class="btn btn-sm btn-secondary" onclick="gerarResumoGeral()">Atualizar</button></div>
          <div class="card-body" id="resumo-geral"><div style="color:#9CA3AF;font-size:13px">Clique em Atualizar</div></div>
        </div>

        <div class="card">
          <div class="card-header"><div class="card-title">Ocorrências por Tipo</div></div>
          <div class="card-body" id="chart-tipo-oc"><div style="color:#9CA3AF;font-size:13px">Carregando...</div></div>
        </div>

      </div>

      <div class="card" style="margin-bottom:20px" id="card-fontes">
        <div class="card-header"><div class="card-title">Informações Cartográficas e Fontes</div></div>
        <div class="card-body" id="cart-fontes-body"></div>

      <div class="card" style="margin-bottom:20px">
        <div class="card-header">

  carregarLogosSidebar()
  carucIniciar()

async function carregarUCsOpcoes() {
  const { data } = await db.from('unidades_conservacao').select('id,nome,codigo').eq('ativo',true).order('codigo')
  const sel = document.getElementById('sel-uc')
  data?.forEach(u => { const o = document.createElement('option'); o.value = u.id; o.textContent = `${u.codigo} — ${u.nome}`; sel.appendChild(o) })
}

async function gerarResumoGeral() {
  const el = document.getElementById('resumo-geral')
  el.innerHTML = '<div style="color:#9CA3AF">Carregando...</div>'
  const [{ data: ucs }, { data: ocs }, { data: monit }, { data: docs }] = await Promise.all([
    db.from('unidades_conservacao').select('area_ha,categoria').eq('ativo',true),
    db.from('ocorrencias').select('status,severidade'),
    db.from('monitoramento_registros').select('id'),
    db.from('documentos').select('id'),
  ])
  const areaTotal = ucs?.reduce((s,u)=>s+(u.area_ha||0),0)||0
  const ocAbertas = ocs?.filter(o=>o.status==='aberta').length||0
  const ocCrit = ocs?.filter(o=>['critica','alta'].includes(o.severidade)&&o.status!=='resolvida').length||0
  el.innerHTML = `
    <div class="kpi-grid" style="grid-template-columns:repeat(2,1fr);gap:12px;margin:0">
      <div class="kpi-card" style="padding:14px 16px"><div class="kpi-label">Total de UCs</div><div class="kpi-valor">${ucs?.length||0}</div></div>
      <div class="kpi-card ouro" style="padding:14px 16px"><div class="kpi-label">Área Protegida</div><div class="kpi-valor" style="font-size:18px">${formatNum(areaTotal,0)} ha</div></div>
      <div class="kpi-card azul" style="padding:14px 16px"><div class="kpi-label">Registros Monit.</div><div class="kpi-valor">${monit?.length||0}</div></div>
      <div class="kpi-card ${ocCrit>0?'erro':''}" style="padding:14px 16px"><div class="kpi-label">Oc. Críticas/Altas</div><div class="kpi-valor">${ocCrit}</div></div>
    </div>
    <div style="margin-top:14px;font-size:12px;color:#6B7280">
      <strong>${docs?.length||0}</strong> documentos · <strong>${ocAbertas}</strong> ocorrências abertas
    </div>`
}

async function carregarGraficos() {
  const { data: ocs } = await db.from('ocorrencias').select('tipo,severidade,status')
  const porTipo = {}
  ocs?.forEach(o => { porTipo[o.tipo] = (porTipo[o.tipo]||0)+1 })
  const total = ocs?.length || 1
  const el = document.getElementById('chart-tipo-oc')
  const TIPOS = { incendio:'Incêndio', desmatamento:'Desmatamento', invasao:'Invasão', caca_pesca_ilegal:'Caça/Pesca', mineracao_ilegal:'Mineração', contaminacao:'Contaminação', especie_invasora:'Esp. Invasora', outro:'Outro' }
  if (!ocs?.length) { el.innerHTML = '<div style="color:#9CA3AF;font-size:13px">Sem ocorrências</div>'; return }
  el.innerHTML = Object.entries(porTipo).sort((a,b)=>b[1]-a[1]).map(([tipo,n]) => `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
      <span style="font-size:12px;width:120px;flex-shrink:0;color:#374151">${TIPOS[tipo]||tipo}</span>
      <div class="prog-bar" style="flex:1"><div class="prog-fill" style="width:${Math.round(n/total*100)}%"></div></div>
      <span class="prog-pct">${n}</span>
    </div>`).join('')
}

async function gerarRelatorioUC() {
  const uc_id = document.getElementById('sel-uc').value
  const el = document.getElementById('relatorio-uc')
  if (!uc_id) { el.innerHTML = ''; return }
  el.innerHTML = '<div style="color:#9CA3AF;padding:16px">Carregando...</div>'

  const [{ data: uc }, { data: ocs }, { data: monit }, { data: docs }, { data: equipe }] = await Promise.all([
    db.from('unidades_conservacao').select('*').eq('id',uc_id).single(),
    db.from('ocorrencias').select('*').eq('uc_id',uc_id).order('data_ocorrencia',{ascending:false}),
    db.from('monitoramento_registros').select('*').eq('uc_id',uc_id).order('data_referencia',{ascending:false}).limit(5),
    db.from('documentos').select('*').eq('uc_id',uc_id),
    db.from('equipe_servidores').select('*').eq('uc_id',uc_id).eq('ativo',true),
  ])

  const ocAb = ocs?.filter(o=>o.status!=='arquivada'&&o.status!=='resolvida').length||0
  el.innerHTML = `
    <div class="grid-3" style="gap:12px;margin-bottom:16px">
      <div class="kpi-card" style="padding:14px"><div class="kpi-label">Área</div><div class="kpi-valor" style="font-size:20px">${uc?.area_ha ? formatNum(uc.area_ha,0)+' ha' : '—'}</div></div>
      <div class="kpi-card ${ocAb>0?'erro':''}" style="padding:14px"><div class="kpi-label">Oc. Abertas</div><div class="kpi-valor" style="font-size:20px">${ocAb}</div></div>
      <div class="kpi-card azul" style="padding:14px"><div class="kpi-label">Servidores</div><div class="kpi-valor" style="font-size:20px">${equipe?.length||0}</div></div>
    </div>
    <div class="grid-2" style="gap:14px">
      <div>
        <div style="font-size:12px;font-weight:700;color:#374151;margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em">Últimas Ocorrências</div>
        ${ocs?.length ? ocs.slice(0,5).map(o=>`
          <div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #F3F4F6">
            <span class="badge ${BADGE_SEVERIDADE[o.severidade]||'badge-cinza'}">${o.severidade}</span>
            <span style="flex:1;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(o.titulo)}</span>
            <span class="badge ${BADGE_STATUS_OC[o.status]||'badge-cinza'}">${o.status}</span>
          </div>`).join('') : '<div style="color:#9CA3AF;font-size:13px">Nenhuma ocorrência</div>'}
      </div>
      <div>
        <div style="font-size:12px;font-weight:700;color:#374151;margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em">Monitoramento Recente</div>
        ${monit?.length ? monit.map(r=>`
          <div style="padding:7px 0;border-bottom:1px solid #F3F4F6">
            <div style="font-size:12px;font-weight:500">${esc(r.nome_indicador||'—')}</div>
            <div style="font-size:11px;color:#9CA3AF">${r.valor!=null?formatNum(r.valor,2)+' '+(r.unidade||''):'—'} · ${formatData(r.data_referencia)}</div>
          </div>`).join('') : '<div style="color:#9CA3AF;font-size:13px">Sem registros</div>'}
        <div style="margin-top:12px;font-size:12px;color:#6B7280"><strong>${docs?.length||0}</strong> documento(s) associado(s)</div>
      </div>
    </div>
    ${CART.rodapeHTML('Relatório UC: ' + (uc?.nome||''))}`
}

// ══════════════════════════════════════════════════════════════════════
// Aba "CAR na UC" — cálculo em js/car-uc-relatorio.js, exportação em
// js/car-uc-relatorio-export.js (carregado só quando exporta). A página
// só junta as fontes, chama carucGerarRelatorio() e desenha.
// ══════════════════════════════════════════════════════════════════════
function ativarAbaRel(id) {
  for (const k of ['geral', 'car']) {
    const on = k === id
    document.getElementById('aba-' + k).hidden = !on
    const b = document.getElementById('aba-btn-' + k)
    b.classList.toggle('ativo', on)
    b.setAttribute('aria-selected', on ? 'true' : 'false')
  }
  history.replaceState(null, '', id === 'car' ? '#car' : location.pathname + location.search)
}

let _carucUCs = new Map()
let _carucArquivoZonas = null
const _carucCamadasPorUC = new Map()
let _carucRel = null
let _carucZonasUC = null

async function carucIniciar() {
  const anoAtual = new Date().getFullYear()
  const de = document.getElementById('caruc-focos-de'), ate = document.getElementById('caruc-focos-ate')
  for (let a = 2012; a <= anoAtual; a++) {
    de.add(new Option(String(a), String(a), false, a === anoAtual - 4))
    ate.add(new Option(String(a), String(a), false, a === anoAtual))
  }
  const { data, error } = await db.from('unidades_conservacao')
    .select('id,codigo,nome,sigla,categoria,grupo,esfera,area_ha,data_criacao')
    .eq('ativo', true).order('nome')
  if (error) { toast('Não foi possível carregar as UCs: ' + error.message, 'error'); return }
  const sel = document.getElementById('caruc-uc')
  for (const u of (data || [])) {
    _carucUCs.set(u.id, u)
    sel.add(new Option(u.nome, u.id))
  }
}

async function _carucCarregarArquivoZonas() {
  if (!_carucArquivoZonas) {
    _carucArquivoZonas = fetch('../data/uc_zonas_acre.geojson')
      .then(r => r.ok ? r.json() : { features: [] })
      .catch(() => { _carucArquivoZonas = null; return { features: [] } })
  }
  return _carucArquivoZonas
}

async function _carucCarregarCamadas(ucId) {
  if (_carucCamadasPorUC.has(ucId)) return _carucCamadasPorUC.get(ucId)
  const { data, error } = await db.from('camadas_mapa').select('nome,uc_id,geojson')
    .eq('uc_id', ucId).or('nome.ilike.%zoneamento%,nome.ilike.%amortec%')
  const lista = error ? [] : (data || [])
  _carucCamadasPorUC.set(ucId, lista)
  return lista
}

async function carucUcAlterada() {
  const id = document.getElementById('caruc-uc').value
  const info = document.getElementById('caruc-uc-info')
  const za = document.getElementById('caruc-za'), zaRot = document.getElementById('caruc-za-rot'), zaDica = document.getElementById('caruc-za-dica')
  const btn = document.getElementById('caruc-gerar')
  _carucZonasUC = null
  btn.disabled = true
  za.checked = false; za.disabled = true; zaRot.classList.add('desab')
  if (!id) { info.textContent = ''; zaDica.textContent = 'Escolha uma UC.'; return }
  const uc = _carucUCs.get(id)
  info.innerHTML = skeletonBlocoHTML(2)
  const [arquivo, camadas] = await Promise.all([_carucCarregarArquivoZonas(), _carucCarregarCamadas(id)])
  if (document.getElementById('caruc-uc').value !== id) return // trocou no meio
  _carucZonasUC = { arquivo, camadas }
  const z = carucZonasDaUC(uc, arquivo, camadas)
  const enq = carucEnquadrarCategoria(uc)
  info.innerHTML = `
    <div><strong>${esc(uc.sigla || uc.categoria || '')}</strong> · ${esc(uc.esfera || '')} · ${uc.area_ha ? formatNum(uc.area_ha, 0) + ' ha' : 'área não informada'} · ${esc(enq.rotulo)}</div>
    <div>Zoneamento: ${z.zonas.length
      ? `${esc(z.fonteZonas)} (${z.zonas.length} polígono${z.zonas.length > 1 ? 's' : ''})`
      : '<strong>UC sem zoneamento cadastrado</strong> — o relatório sai sem a comparação por zona.'}</div>`
  if (z.za.length) {
    za.disabled = false; zaRot.classList.remove('desab')
    zaDica.textContent = 'Fonte: ' + z.fonteZa
  } else {
    zaDica.textContent = 'Esta UC não tem zona de amortecimento cadastrada.'
  }
  btn.disabled = false
}

function _carucProgresso(texto, feito, total) {
  const box = document.getElementById('caruc-prog')
  box.hidden = false
  const pct = total ? Math.round(feito / total * 100) : null
  document.getElementById('caruc-prog-txt').textContent = texto + (total ? ` ${formatNum(feito, 0)} de ${formatNum(total, 0)}` : '')
  const barra = document.getElementById('caruc-prog-barra')
  barra.firstElementChild.style.width = (pct == null ? 0 : pct) + '%'
  if (pct == null) barra.removeAttribute('aria-valuenow'); else barra.setAttribute('aria-valuenow', String(pct))
}

async function carucGerar() {
  const id = document.getElementById('caruc-uc').value
  if (!id || !_carucZonasUC) return
  const uc = _carucUCs.get(id)
  const opcoes = {
    incluirZa: document.getElementById('caruc-za').checked,
    focos: document.getElementById('caruc-focos').checked,
    deter: document.getElementById('caruc-deter').checked,
    prodes: document.getElementById('caruc-prodes').checked,
    focosDe: Number(document.getElementById('caruc-focos-de').value),
    focosAte: Number(document.getElementById('caruc-focos-ate').value),
  }
  if (opcoes.focos && opcoes.focosDe > opcoes.focosAte) { toast('O ano inicial dos focos é maior que o final.', 'warning'); return }
  if (typeof turf === 'undefined' || typeof turf.intersect !== 'function') { toast('Biblioteca de cálculo espacial não carregou. Recarregue a página.', 'error'); return }

  const restaurar = btnEspera(document.getElementById('caruc-gerar'))
  const res = document.getElementById('caruc-resultado')
  res.innerHTML = `<div class="card"><div class="card-body">${skeletonBlocoHTML(4)}</div></div>`
  try {
    _carucProgresso('Lendo o limite da UC…')
    const { data: g, error } = await db.from('unidades_conservacao').select('geom').eq('id', id).single()
    if (error || !g?.geom?.coordinates) throw new Error('Limite da UC indisponível' + (error ? ': ' + error.message : '.'))
    _carucRel = await carucGerarRelatorio(uc, g.geom, _carucZonasUC, opcoes, _carucProgresso)
    carucRender(_carucRel)
  } catch (e) {
    console.error('[caruc]', e)
    res.innerHTML = `<div class="card"><div class="card-body"><div class="caruc-aviso">Não foi possível gerar o relatório: ${esc(e.message)}</div></div></div>`
  } finally {
    document.getElementById('caruc-prog').hidden = true
    restaurar()
  }
}

function _carucMiniTabela(titulo, lista, rotulo) {
  if (!lista?.length) return ''
  return `<div class="card"><div class="card-header"><div class="card-title" style="font-size:13px">${esc(titulo)}</div></div>
    <div class="card-body" style="padding-top:4px"><div class="table-wrap"><table class="caruc-mini">
      <thead><tr><th>${esc(rotulo)}</th><th class="num">Imóveis</th><th class="num">Área (ha)</th></tr></thead>
      <tbody>${lista.map(g => `<tr><td>${esc(g.rotulo)}</td><td class="num">${formatNum(g.n, 0)}</td><td class="num">${formatNum(g.ha, 2)}</td></tr>`).join('')}</tbody>
    </table></div></div></div>`
}

// ── Filtros: estado da tela ─────────────────────────────────────────
// Definição, contagem e recorte vêm de js/car-uc-relatorio.js
// (CARUC_FILTROS / carucOpcoesFiltro / carucRelFiltrado). A tela só
// guarda o que está escolhido e redesenha.
let _carucFiltro = {}
let _carucBusca = ''
let _carucBuscaTimer = null

function carucRender(rel) {
  _carucFiltro = {}
  _carucBusca = ''
  const avisos = []
  if (rel.falhas.prodes) avisos.push(`${rel.falhas.prodes} de ${rel.falhas.prodes_quadrantes} quadrantes do PRODES não responderam — os valores de PRODES podem estar incompletos.`)
  if (rel.falhas.ambiental) avisos.push(`Focos/DETER não puderam ser calculados para ${rel.falhas.ambiental} imóvel(is).`)
  if (rel.resumo.sem_planilha) avisos.push(`${rel.resumo.sem_planilha} imóvel(is) do SICAR não estão na planilha local — aparecem sem titular, classe e módulos.`)

  document.getElementById('caruc-resultado').innerHTML = `
    ${avisos.map(a => `<div class="caruc-aviso">${esc(a)}</div>`).join('')}
    <div class="card" style="margin-bottom:16px">
      <div class="card-header">
        <div><div class="card-title">${esc(rel.uc.nome)}</div><div class="card-subtitle">SICAR consultado em ${esc(new Date(rel.gerado_em).toLocaleString('pt-BR'))} · ${formatNum(rel.sicar_no_retangulo, 0)} imóveis no entorno avaliados</div></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-sm btn-secondary" onclick="carucExportar('pdf', this)"><span data-icon="download"></span> PDF</button>
          <button class="btn btn-sm btn-secondary" onclick="carucExportar('xlsx', this)"><span data-icon="download"></span> Excel</button>
          <button class="btn btn-sm btn-secondary" onclick="carucExportar('csv', this)"><span data-icon="download"></span> CSV</button>
        </div>
      </div>
      <div class="card-body">
        <div class="caruc-filtros">
          <input type="search" class="form-control" id="caruc-busca" placeholder="Buscar por nº do CAR, imóvel, titular ou município" oninput="carucBuscaAlterada(this.value)" aria-label="Buscar imóveis">
          <button class="btn btn-sm btn-secondary" id="caruc-btn-filtros" aria-expanded="false" aria-controls="caruc-filtros-grid" onclick="carucAlternarFiltros()">Filtros <span id="caruc-filtros-n" class="caruc-contador" hidden></span></button>
          <button class="btn btn-sm btn-secondary" id="caruc-limpar" onclick="carucLimparFiltros()" hidden>Limpar filtros</button>
        </div>
        <div class="caruc-filtros-grid" id="caruc-filtros-grid" hidden></div>
        <div class="caruc-chips" id="caruc-chips"></div>
        <div class="caruc-nota" id="caruc-recorte" aria-live="polite"></div>
        <p class="caruc-nota" style="margin-top:6px">A exportação sai com o recorte atual; os filtros aplicados vão escritos no documento.</p>
      </div>
    </div>
    <div id="caruc-conteudo"></div>`
  if (typeof bIconsAplicar === 'function') bIconsAplicar(document.getElementById('caruc-resultado'))
  carucAtualizar()
}

function carucAlternarFiltros() {
  const g = document.getElementById('caruc-filtros-grid'), b = document.getElementById('caruc-btn-filtros')
  g.hidden = !g.hidden
  b.setAttribute('aria-expanded', g.hidden ? 'false' : 'true')
}

function carucBuscaAlterada(v) {
  clearTimeout(_carucBuscaTimer)
  _carucBuscaTimer = setTimeout(() => { _carucBusca = v; carucAtualizar() }, 200)
}

function carucFiltroAlterado(chave, valor) {
  if (valor) _carucFiltro[chave] = valor; else delete _carucFiltro[chave]
  carucAtualizar(chave)
}

function carucLimparFiltros() {
  _carucFiltro = {}
  _carucBusca = ''
  const b = document.getElementById('caruc-busca'); if (b) b.value = ''
  carucAtualizar()
}

function _carucRelAtual() {
  return carucRelFiltrado(_carucRel, _carucFiltro, _carucBusca)
}

function carucAtualizar(focarChave) {
  if (!_carucRel) return
  const relF = _carucRelAtual()

  // Selects com contagem por opção (facetas: cada filtro conta dentro dos OUTROS).
  const grade = document.getElementById('caruc-filtros-grid')
  grade.innerHTML = carucOpcoesFiltro(_carucRel.imoveis, _carucFiltro, _carucBusca)
    .filter(f => f.opcoes.length > 1 || _carucFiltro[f.chave])
    .map(f => `<div>
      <label class="caruc-rot" for="caruc-f-${f.chave}">${esc(f.rotulo)}</label>
      <select class="form-control" id="caruc-f-${f.chave}" onchange="carucFiltroAlterado('${f.chave}', this.value)">
        <option value="">Todos</option>
        ${f.opcoes.map(o => `<option value="${esc(o.valor)}"${_carucFiltro[f.chave] === o.valor ? ' selected' : ''}>${esc(o.valor)} (${formatNum(o.n, 0)})</option>`).join('')}
      </select></div>`).join('')
  if (focarChave) document.getElementById('caruc-f-' + focarChave)?.focus()

  const nAtivos = Object.keys(_carucFiltro).length
  const cont = document.getElementById('caruc-filtros-n')
  cont.hidden = !nAtivos; cont.textContent = nAtivos
  document.getElementById('caruc-limpar').hidden = !(nAtivos || _carucBusca)
  document.getElementById('caruc-chips').innerHTML = CARUC_FILTROS.filter(d => _carucFiltro[d.chave]).map(d =>
    `<button class="caruc-chip" onclick="carucFiltroAlterado('${d.chave}', '')" aria-label="Remover filtro ${esc(d.rotulo)}: ${esc(_carucFiltro[d.chave])}">${esc(d.rotulo)}: <strong>${esc(_carucFiltro[d.chave])}</strong> <span aria-hidden="true">×</span></button>`).join('')
  document.getElementById('caruc-recorte').textContent = (nAtivos || _carucBusca)
    ? `Filtrado: ${formatNum(relF.imoveis.length, 0)} de ${formatNum(_carucRel.imoveis.length, 0)} imóveis — resumo, tabelas e exportação seguem o recorte.`
    : `${formatNum(_carucRel.imoveis.length, 0)} imóveis, sem filtro.`

  document.getElementById('caruc-conteudo').innerHTML = _carucConteudoHTML(relF)
}

  const nCols = 9 + (o.focos ? 1 : 0) + (o.deter ? 1 : 0) + (o.prodes ? 1 : 0)

function _carucLinhaHTML(i, o) {
  const zonas = (i.zonas || []).map(z => `<span class="caruc-zona ${z.nivel}" title="${esc(formatNum(z.ha, 2))} ha">${esc(z.nome)}</span>`).join('')
  // Um parágrafo só, separado por " · ": um por linha deixava a linha da tabela alta demais.
  const aten = (i.atencoes || []).length ? `<span class="caruc-atencao">${i.atencoes.map(esc).join(' · ')}</span>` : ''
  const sob = (i.sobreposicoes || []).slice(0, 3).map(s => `${esc(s.cod)} (${formatNum(s.ha, 1)} ha${s.mesmo_titular ? ', mesmo titular' : ''})`).join('<br>')
    + ((i.sobreposicoes || []).length > 3 ? `<br>+ ${i.sobreposicoes.length - 3}` : '')
  const tit = i.titular_grupo != null && (i.titular_cars_relatorio > 1 || i.titular_cars_estado > 1)
    ? `<span class="caruc-tit">Titular nº ${i.titular_grupo} · ${formatNum(i.titular_cars_relatorio, 0)} CAR(s) nesta UC · ${formatNum(i.titular_cars_estado, 0)} no Acre</span>` : ''
  const prio = i.prioridade || { nivel: 'baixa', motivos: [] }
  const amb = (o.focos ? `<td class="num">${i.ambiental ? formatNum(i.ambiental.focos_periodo, 0) : '—'}</td>` : '')
    + (o.deter ? `<td class="num">${i.ambiental ? `${formatNum(i.ambiental.deter_alertas, 0)}${i.ambiental.deter_alertas ? ` · ${formatNum(i.ambiental.deter_ha, 1)} ha` : ''}` : '—'}</td>` : '')
    + (o.prodes ? `<td class="num">${i.prodes ? formatNum(i.prodes.pos_marco_ha, 2) : '—'}</td>` : '')
  return `<tr>
    <td><span class="caruc-prio ${prio.nivel}">${esc(CARUC_PRIORIDADE_ROTULO[prio.nivel])}</span>${prio.motivos.length ? `<span class="caruc-nota" style="display:block;max-width:180px">${esc(prio.motivos.join('; '))}</span>` : ''}</td>
    <td><span class="caruc-cod">${esc(i.cod)}</span>${i.local === 'za' ? '<br><span class="caruc-nota">só na zona de amortecimento</span>' : ''}${aten}${sob ? `<span class="caruc-nota" style="display:block">Sobrepõe: ${sob}</span>` : ''}</td>
    <td>${esc(i.nome_imovel || '—')}<br><span class="caruc-nota">${esc(i.titular || 'sem dados na planilha local')}${i.documento ? ' · ' + esc(i.documento) : ''}</span>${tit}${i.homonimo ? '<span class="caruc-tit">mesmo nome de outro titular — verificar</span>' : ''}</td>
    <td>${esc(i.municipio || '—')}</td>
    <td>${esc(i.situacao || '—')}${i.classe ? `<br><span class="caruc-nota">${esc(i.classe)}</span>` : ''}</td>
    <td>${esc(carucTipoImovel(i.tipo_imovel))}</td>
    <td class="num">${formatNum(i.area_analise_ha, 2)}<br><span class="caruc-nota">${i.pct_analise != null ? formatNum(i.pct_analise, 1) + '% do imóvel' : ''}</span></td>
    <td>${zonas || '<span class="caruc-nota">—</span>'}</td>
    <td>${i.data_inscricao ? formatData(i.data_inscricao) : '—'}</td>
    ${amb}
  </tr>`
}

// Scripts de exportação só entram quando alguém exporta (as fontes do
// PDF sozinhas têm 150 KB).
let _carucExportPromise = null
function _carucCarregarExportacao() {
  if (typeof carucMontarPdf === 'function') return Promise.resolve()
  if (_carucExportPromise) return _carucExportPromise
  const carregar = src => new Promise((res, rej) => {
    const s = document.createElement('script')
    s.src = src; s.onload = res; s.onerror = () => rej(new Error('Falha ao carregar ' + src))
    document.head.appendChild(s)
  })
  _carucExportPromise = ['../js/biomonitor-pdf-fonts.js', '../js/relatorio-cabecalho-pdf.js', '../js/agua-relatorio-pdf.js', '../js/car-uc-relatorio-export.js']
    .reduce((p, src) => p.then(() => carregar(src)), Promise.resolve())
    .catch(e => { _carucExportPromise = null; throw e })
  return _carucExportPromise
}

async function carucExportar(tipo, btn) {
  if (!_carucRel) return
  const restaurar = btnEspera(btn)
  try {
    // Exporta o RECORTE atual (decisão do usuário); os filtros vão
    // escritos no PDF/Excel e no nome do arquivo.
    const rel = _carucRelAtual()
    if (tipo === 'csv') {
      const sufixo = rel.filtros.length ? '_filtrado' : ''
      const nome = `car-na-uc_${carucNorm(rel.uc.nome).replace(/[^a-z0-9]+/g, '-')}_${rel.gerado_em.slice(0, 10)}${sufixo}.csv`
      const url = URL.createObjectURL(new Blob([carucCsv(rel)], { type: 'text/csv;charset=utf-8' }))
      const a = document.createElement('a'); a.href = url; a.download = nome
      document.body.appendChild(a); a.click(); a.remove()
      setTimeout(() => URL.revokeObjectURL(url), 30000)
      return
    }
    await _carucCarregarExportacao()
    if (tipo === 'xlsx') {
      const buf = await carucMontarXlsx(rel)
      carucBaixarBlob(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), carucNomeArquivo(rel, 'xlsx'))
    } else {
      const protocolo = await gerarProtocolo()
      const pdf = await carucMontarPdf(rel, protocolo)
      carucBaixarBlob(pdf.output('blob'), carucNomeArquivo(rel, 'pdf'))
    }
  } catch (e) {
    console.error('[caruc] exportar', e)
    toast('Não foi possível exportar: ' + e.message, 'error')
  } finally {
    restaurar()
  }
}
