<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SIGUC-AC · Validação de Ninhos</title>
<link rel="stylesheet" href="../css/global.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/observability.js"></script>
<script src="../js/queryLogger.js"></script>
<script src="../js/config.js"></script>
<script src="../js/layout.js"></script>
</head>
<body>
<div id="app"></div>

<!-- ── Modal: Rejeitar / Em correção ───────────────────── -->
<div class="modal-overlay" id="modal-rejeitar">
  <div class="modal" style="max-width:460px">
    <div class="modal-header">
      <div class="modal-title" id="rej-titulo">Rejeitar ninho</div>
      <button class="modal-close" onclick="fecharModalRejeitar()">×</button>
    </div>
    <div class="modal-body">
      <p style="margin:0 0 12px;font-size:.9rem;color:var(--cinza-500)">
        Ninho: <strong id="rej-numero"></strong>
      </p>
      <div class="form-group">
        <label class="form-label">Motivo <span class="obrig">*</span></label>
        <textarea class="form-control" id="rej-motivo" rows="3" placeholder="Descreva o motivo da rejeição ou da correção solicitada..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="fecharModalRejeitar()">Cancelar</button>
      <button class="btn btn-primary" id="rej-btn" onclick="confirmarRejeicao()">Confirmar</button>
    </div>
  </div>
</div>

<!-- ── Modal: GPS ─────────────────────────────────────── -->
<div class="modal-overlay" id="modal-gps">
  <div class="modal" style="max-width:420px">
    <div class="modal-header">
      <div class="modal-title">Adicionar coordenadas GPS</div>
      <button class="modal-close" onclick="fecharModalGPS()">×</button>
    </div>
    <div class="modal-body">
      <p style="margin:0 0 14px;font-size:.9rem;color:var(--cinza-500)">
        Ninho: <strong id="gps-numero"></strong>
      </p>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
        <div class="form-group" style="margin:0">
          <label class="form-label">Latitude <span class="obrig">*</span></label>
          <input class="form-control" id="gps-lat" type="number" step="0.00001" min="-90" max="90" placeholder="-9.97560">
        </div>
        <div class="form-group" style="margin:0">
          <label class="form-label">Longitude <span class="obrig">*</span></label>
          <input class="form-control" id="gps-lng" type="number" step="0.00001" min="-180" max="180" placeholder="-67.80890">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Precisão GPS (m) <span style="opacity:.5;font-weight:400">opcional</span></label>
        <input class="form-control" id="gps-precisao" type="number" step="0.1" min="0" placeholder="Ex.: 5.2">
      </div>
      <p style="font-size:.78rem;color:var(--cinza-500);margin:4px 0 0">
        Use coordenadas em graus decimais (WGS 84). Negativo para Sul / Oeste.
      </p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="fecharModalGPS()">Cancelar</button>
      <button class="btn btn-primary" onclick="salvarGPS()">Salvar coordenadas</button>
    </div>
  </div>
</div>

<!-- ── Modal: Fotos ────────────────────────────────────── -->
<div class="modal-overlay" id="modal-fotos">
  <div class="modal" style="max-width:700px">
    <div class="modal-header">
      <div class="modal-title">Fotos do ninho</div>
      <button class="modal-close" onclick="document.getElementById('modal-fotos').classList.remove('aberto')">×</button>
    </div>
    <div class="modal-body">
      <div id="fotos-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px"></div>
    </div>
  </div>
</div>

<script>
;(async function () {
  const usuario = await carregarUsuario()
  if (!usuario) { window.location.href = '../index.html'; return }
  if (!['super_admin','gestor','tecnico'].includes(usuario.perfil)) {
    window.location.href = '../pages/dashboard.html'; return
  }

  document.getElementById('app').innerHTML =
    gerarLayout('Validação de Ninhos', 'biomonitor-validacao') +
    `<div class="fade-in">
      <div class="filter-bar">
        <input class="form-control search-input" id="busca" placeholder="Buscar ninho, monitor, praia..." oninput="renderLista()">
        <select class="form-control" id="fil-praia" style="width:200px" onchange="renderLista()">
          <option value="">Todas as praias</option>
        </select>
        <select class="form-control" id="fil-especie" style="width:160px" onchange="renderLista()">
          <option value="">Todas as espécies</option>
          <option value="tracaja">Tracajá</option>
          <option value="tartaruga">Tartaruga</option>
          <option value="cabecudo">Cabeçudo</option>
          <option value="pitiU">Pitiú</option>
          <option value="cupido">Cupido</option>
          <option value="jabuti_pe_elefante">Jabuti-pé-elefante</option>
          <option value="jabuti_piranga">Jabuti-piranga</option>
          <option value="mucua">Muçuã</option>
          <option value="outro">Outro</option>
        </select>
        <select class="form-control" id="fil-status" style="width:160px" onchange="renderLista()">
          <option value="" selected>Todos</option>
          <option value="pendente">Pendentes</option>
          <option value="validado">Validados</option>
          <option value="rejeitado">Rejeitados</option>
          <option value="em_correcao">Em correção</option>
        </select>
        <select class="form-control" id="fil-temporada" style="width:180px" onchange="renderLista()">
          <option value="">Todas as temporadas</option>
        </select>
      </div>

      <div id="stats-bar" style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap"></div>

      <div id="lista-ninhos" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px">
        <p style="color:var(--cinza-500)">Carregando...</p>
      </div>
    </div>`

  bIconsAplicar(document.getElementById('app'))

  let _ninhos = [], _rejeitar = null, _rejTipo = null, _alertasPorNinho = {}, _gpsNinhoId = null

  // ── Carregar dados ─────────────────────────────────────────────
  async function carregarDados() {
    const { data, error } = await db.from('vw_ninhos_validacao').select('*').order('criado_em', { ascending: false })
    if (error) { toast(error.message, 'error'); return }
    _ninhos = data || []
    await carregarAlertas()
    popularFiltros()
    renderStats()
    renderLista()
  }

  // Alertas científicos de incubação (migration 093), agrupados por ninho
  async function carregarAlertas() {
    _alertasPorNinho = {}
    const { data } = await db.from('vw_alertas_quelonios')
      .select('id,ninho_id,parametro,faixa,severidade,titulo,providencia,status')
      .in('status', ['aberto', 'ciente'])
      .not('ninho_id', 'is', null)
    ;(data || []).forEach(a => {
      (_alertasPorNinho[a.ninho_id] = _alertasPorNinho[a.ninho_id] || []).push(a)
    })
  }

  function popularFiltros() {
    const praias = [...new Set(_ninhos.map(n => n.praia_nome).filter(Boolean))].sort()
    const sel = document.getElementById('fil-praia')
    sel.innerHTML = `<option value="">Todas as praias</option>` +
      praias.map(p => `<option value="${p}">${p}</option>`).join('')

    // Temporadas: default na atual (uma vez)
    const selT = document.getElementById('fil-temporada')
    if (selT && !selT._init) {
      const temps = [...new Map(_ninhos.filter(n => n.temporada_id).map(n => [n.temporada_id, n])).values()]
        .sort((a, b) => (b.temporada_ano || 0) - (a.temporada_ano || 0))
      const atual = temps.find(n => n.temporada_atual)
      selT.innerHTML = `<option value="">Todas as temporadas</option>` +
        temps.map(n => `<option value="${n.temporada_id}"${atual && n.temporada_id === atual.temporada_id ? ' selected' : ''}>${esc(n.temporada_nome || ('Temporada ' + n.temporada_ano))}</option>`).join('')
      if (temps.length) selT._init = true
    }
  }

  function renderStats() {
    const stats = {
      pendente:    _ninhos.filter(n => n.status_validacao === 'pendente').length,
      validado:    _ninhos.filter(n => n.status_validacao === 'validado').length,
      rejeitado:   _ninhos.filter(n => n.status_validacao === 'rejeitado').length,
      em_correcao: _ninhos.filter(n => n.status_validacao === 'em_correcao').length,
    }
    document.getElementById('stats-bar').innerHTML = [
      ['Pendentes',    stats.pendente,    '#f59e0b'],
      ['Validados',    stats.validado,    '#10b981'],
      ['Rejeitados',   stats.rejeitado,   '#ef4444'],
      ['Em correção',  stats.em_correcao, '#6366f1'],
    ].map(([l, v, c]) => `
      <div style="background:var(--branco);border-radius:10px;padding:10px 16px;min-width:110px;border-left:3px solid ${c};border-top:1px solid var(--borda);border-right:1px solid var(--borda);border-bottom:1px solid var(--borda);box-shadow:var(--sombra)">
        <div style="font-size:1.5rem;font-weight:700;color:${c}">${v}</div>
        <div style="font-size:.78rem;color:var(--cinza-500)">${l}</div>
      </div>`).join('')
  }

  window.renderLista = function() {
    const busca   = document.getElementById('busca')?.value.toLowerCase() || ''
    const praia   = document.getElementById('fil-praia')?.value || ''
    const especie = document.getElementById('fil-especie')?.value || ''
    const status  = document.getElementById('fil-status')?.value
    const temp    = document.getElementById('fil-temporada')?.value || ''

    const lista = _ninhos.filter(n =>
      (!busca   || n.numero_ninho?.toLowerCase().includes(busca) ||
                   n.monitor_nome?.toLowerCase().includes(busca) ||
                   n.praia_nome?.toLowerCase().includes(busca)) &&
      (!praia   || n.praia_nome === praia) &&
      (!especie || n.especie === especie) &&
      (!temp    || n.temporada_id === temp) &&
      (status === undefined || status === '' || n.status_validacao === status)
    )

    const cont = document.getElementById('lista-ninhos')
    if (!lista.length) { cont.innerHTML = `<p style="color:var(--cinza-500);grid-column:1/-1">Nenhum ninho encontrado com esses filtros.</p>`; return }

    const SPECIES_NOME = {
      tracaja: 'Tracajá', tartaruga: 'Tartaruga', cabecudo: 'Cabeçudo',
      pitiU: 'Pitiú', cupido: 'Cupido', jabuti_pe_elefante: 'Jabuti-pé-de-elefante',
      jabuti_piranga: 'Jabuti-piranga', mucua: 'Muçuã', outro: 'Outro'
    }
    const STATUS_CLR = { pendente:'#f59e0b', validado:'#10b981', rejeitado:'#ef4444', em_correcao:'#6366f1' }
    const STATUS_LBL = { pendente:'Pendente', validado:'Validado', rejeitado:'Rejeitado', em_correcao:'Em correção' }
    const NINHO_CLR  = { encontrado:'#3b82f6', transferido:'#8b5cf6', eclodido:'#10b981', perdido:'#ef4444' }

    cont.innerHTML = lista.map(n => {
      const sclr = STATUS_CLR[n.status_validacao] || '#888'
      const nclr = NINHO_CLR[n.status] || '#888'
      const temFotos = n.foto_urls?.length > 0
      const alertas = _alertasPorNinho[n.id] || []
      const borda = alertas.some(a => a.severidade === 'critica') ? '#ef4444'
                  : alertas.length ? '#f59e0b' : 'var(--borda)'
      return `<div style="background:var(--branco);border-radius:12px;padding:16px;border:1px solid ${borda};box-shadow:var(--sombra)">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
          <div>
            <div style="font-weight:600;font-size:1rem;color:var(--cinza-900)">${n.numero_ninho}</div>
            <div style="font-size:.83rem;color:var(--cinza-500)">${SPECIES_NOME[n.especie] || n.especie}</div>
          </div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">
            <span style="font-size:.75rem;padding:2px 8px;border-radius:6px;background:${nclr}22;color:${nclr};font-weight:600">${n.status}</span>
            <span style="font-size:.75rem;padding:2px 8px;border-radius:6px;background:${sclr}22;color:${sclr};font-weight:600">${STATUS_LBL[n.status_validacao]}</span>
          </div>
        </div>

        ${alertas.length ? `
        <div style="display:flex;flex-direction:column;gap:5px;margin-bottom:10px">
          ${alertas.map(a => {
            const c = a.severidade === 'critica' ? '#ef4444' : a.severidade === 'alta' ? '#f59e0b' : '#eab308'
            return `<div title="${esc(a.providencia || '')}" style="background:${c}1a;border-left:3px solid ${c};border-radius:6px;padding:6px 9px;font-size:.78rem">
              <strong style="color:${c}">${esc(a.faixa)}</strong>
              <span style="color:var(--cinza-500)"> — ${esc(a.titulo)}</span>
            </div>`
          }).join('')}
        </div>` : ''}

        ${n.alerta_campo ? `
        <div title="${esc((n.alerta_campo.faixas||[]).map(f=>f.f).join(', '))}" style="display:inline-flex;align-items:center;gap:5px;background:rgba(245,158,11,.14);color:#f59e0b;border-radius:6px;padding:3px 8px;font-size:.74rem;font-weight:600;margin-bottom:10px">
          ⚠ Alerta reconhecido em campo${n.alerta_campo.severidade_max ? ` (${esc(n.alerta_campo.severidade_max)})` : ''}
        </div>` : ''}

        <div style="font-size:.83rem;color:var(--cinza-500);display:grid;gap:3px;margin-bottom:10px">
          <div>Praia: <span style="color:var(--cinza-900)">${n.praia_nome || '—'}</span></div>
          <div>Monitor: <span style="color:var(--cinza-900)">${n.monitor_nome || '—'}</span></div>
          <div>Data: <span style="color:var(--cinza-900)">${formatData(n.data_encontro)}</span></div>
          ${n.lat
            ? `<div>GPS: <span style="color:var(--cinza-900)">${Number(n.lat).toFixed(5)}, ${Number(n.lng).toFixed(5)}</span> ${n.precisao_gps_m ? `(±${n.precisao_gps_m}m)` : ''}</div>`
            : `<div style="color:#f59e0b;font-size:.78rem">Sem GPS — não aparece no mapa</div>`}
          ${n.dist_rio_m != null ? `<div>Dist. ao rio: <span style="color:var(--cinza-900)">${n.dist_rio_m} m</span> <span style="opacity:.6;font-size:.85em">(${n.dist_rio_metodo === 'tracker' ? 'GPS tracker' : 'estimativa'})</span></div>` : ''}
        </div>

        ${(n.qtd_ovos != null || n.ovos_integros != null || n.ovos_descartados != null) ? `
        <div style="background:rgba(201,168,76,.10);border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:.82rem;display:flex;gap:16px;flex-wrap:wrap">
          <span><strong style="color:#C9A84C">Ovos</strong></span>
          ${n.qtd_ovos        != null ? `<span>Total: <strong>${n.qtd_ovos}</strong></span>` : ''}
          ${n.ovos_integros   != null ? `<span>Íntegros: <strong style="color:#4ade80">${n.ovos_integros}</strong></span>` : ''}
          ${n.ovos_descartados != null ? `<span>Descartados: <strong style="color:#f87171">${n.ovos_descartados}</strong></span>` : ''}
        </div>` : ''}

        ${(n.temperatura_c != null || n.umidade_pct != null || n.profundidade_cm != null) ? `
        <div style="background:rgba(82,183,136,.10);border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:.82rem;display:flex;gap:16px;flex-wrap:wrap">
          <span><strong style="color:#52B788">Condições</strong></span>
          ${n.temperatura_c   != null ? `<span>Temp.: <strong>${n.temperatura_c}°C</strong></span>` : ''}
          ${n.umidade_pct     != null ? `<span>Umidade: <strong>${n.umidade_pct}%</strong></span>` : ''}
          ${n.profundidade_cm != null ? `<span>Prof.: <strong>${n.profundidade_cm} cm</strong></span>` : ''}
        </div>` : ''}

        ${n.status === 'transferido' || n.data_transferencia ? `
        <div style="background:rgba(139,92,246,.12);border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:.82rem">
          <strong style="color:#8b5cf6">Transferência:</strong>
          ${n.data_transferencia ? `${formatData(n.data_transferencia)} · ${n.qtd_ovos} ovos` : ''}
          ${n.local_destino ? ` → ${n.local_destino}` : ''}
        </div>` : ''}

        ${n.status === 'eclodido' || n.data_nascimento ? `
        <div style="background:rgba(16,185,129,.12);border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:.82rem">
          <strong style="color:#10b981">Eclosão:</strong>
          ${n.data_nascimento ? formatData(n.data_nascimento) : ''}
          · Vivos: ${n.filhotes_vivos ?? 0}
          · Mortos: ${n.filhotes_mortos ?? 0}
          · Não nascidos: ${n.ovos_nao_nascidos ?? 0}
          ${n.predacao && n.predacao !== 'nenhuma' ? `· Predação: ${n.predacao}` : ''}
        </div>` : ''}

        ${n.observacoes ? `<p style="font-size:.82rem;color:var(--cinza-500);margin:0 0 10px;font-style:italic">${n.observacoes}</p>` : ''}
        ${n.motivo_rejeicao ? `<p style="font-size:.82rem;color:#ef4444;margin:0 0 10px">Motivo: ${n.motivo_rejeicao}</p>` : ''}

        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px solid var(--borda)">
          ${temFotos ? `<button class="btn btn-sm btn-secondary" onclick='verFotos(${JSON.stringify(n.foto_urls)})'>Fotos (${n.foto_urls.length})</button>` : ''}
          ${!n.lat ? `<button class="btn btn-sm" style="background:rgba(245,158,11,.15);color:#f59e0b;border:1px solid rgba(245,158,11,.3);border-radius:6px;padding:4px 10px;cursor:pointer" onclick="abrirModalGPS('${n.id}','${esc(n.numero_ninho)}')">+ GPS</button>` : ''}
          ${n.status_validacao !== 'validado'   ? `<button class="btn btn-sm btn-primary"   onclick="validar('${n.id}')">Validar</button>` : ''}
          ${n.status_validacao !== 'rejeitado'  ? `<button class="btn btn-sm" style="background:#ef444433;color:#ef4444;border:none;border-radius:6px;padding:4px 10px;cursor:pointer" onclick="abrirRejeitar('${n.id}','${esc(n.numero_ninho)}','rejeitado')">Rejeitar</button>` : ''}
          ${n.status_validacao !== 'em_correcao'? `<button class="btn btn-sm" style="background:#6366f133;color:#6366f1;border:none;border-radius:6px;padding:4px 10px;cursor:pointer" onclick="abrirRejeitar('${n.id}','${esc(n.numero_ninho)}','em_correcao')">Correção</button>` : ''}
        </div>
      </div>`
    }).join('')
  }

  // ── Ações de validação ─────────────────────────────────────────
  window.validar = async function(id) {
    const { error } = await db.from('ninhos_quelonios').update({
      status_validacao: 'validado',
      validado_por: usuario.id,
      validado_em:  new Date().toISOString(),
      motivo_rejeicao: null,
    }).eq('id', id)
    if (error) { toast(error.message, 'error'); return }
    toast('Ninho validado.', 'success')
    await carregarDados()
  }

  window.abrirRejeitar = function(id, numero, tipo) {
    _rejeitar = id
    _rejTipo  = tipo
    document.getElementById('rej-titulo').textContent = tipo === 'rejeitado' ? 'Rejeitar ninho' : 'Solicitar correção'
    document.getElementById('rej-numero').textContent = numero
    document.getElementById('rej-motivo').value = ''
    document.getElementById('rej-btn').textContent = tipo === 'rejeitado' ? 'Rejeitar' : 'Solicitar correção'
    document.getElementById('modal-rejeitar').classList.add('aberto')
  }

  window.fecharModalRejeitar = () => document.getElementById('modal-rejeitar').classList.remove('aberto')

  window.confirmarRejeicao = async function() {
    const motivo = document.getElementById('rej-motivo').value.trim()
    if (!motivo) { toast('Informe o motivo.', 'error'); return }
    const { error } = await db.from('ninhos_quelonios').update({
      status_validacao: _rejTipo,
      motivo_rejeicao:  motivo,
      validado_por:     usuario.id,
      validado_em:      new Date().toISOString(),
    }).eq('id', _rejeitar)
    if (error) { toast(error.message, 'error'); return }
    toast(_rejTipo === 'rejeitado' ? 'Ninho rejeitado.' : 'Correção solicitada.', 'success')
    fecharModalRejeitar()
    await carregarDados()
  }

  window.verFotos = function(urls) {
    document.getElementById('fotos-grid').innerHTML = urls.map(u =>
      `<img src="${u}" style="width:100%;border-radius:8px;object-fit:cover;aspect-ratio:4/3" loading="lazy">`
    ).join('')
    document.getElementById('modal-fotos').classList.add('aberto')
  }

  window.abrirModalGPS = function(id, numero) {
    _gpsNinhoId = id
    document.getElementById('gps-numero').textContent = numero
    document.getElementById('gps-lat').value = ''
    document.getElementById('gps-lng').value = ''
    document.getElementById('gps-precisao').value = ''
    document.getElementById('modal-gps').classList.add('aberto')
  }

  window.fecharModalGPS = () => document.getElementById('modal-gps').classList.remove('aberto')

  window.salvarGPS = async function() {
    const lat = parseFloat(document.getElementById('gps-lat').value)
    const lng = parseFloat(document.getElementById('gps-lng').value)
    const prec = document.getElementById('gps-precisao').value.trim()

    if (isNaN(lat) || lat < -90 || lat > 90)  { toast('Latitude inválida (−90 a 90).', 'error'); return }
    if (isNaN(lng) || lng < -180 || lng > 180) { toast('Longitude inválida (−180 a 180).', 'error'); return }

    const update = { localizacao: `POINT(${lng} ${lat})` }
    if (prec !== '') update.precisao_gps_m = parseFloat(prec)

    const { error } = await db.from('ninhos_quelonios').update(update).eq('id', _gpsNinhoId)
    if (error) { toast(error.message, 'error'); return }
    toast('Coordenadas salvas. O ninho agora aparecerá no mapa.', 'success')
    fecharModalGPS()
    await carregarDados()
  }

  await carregarDados()
})()
</script>
