<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SIGUC-AC · Qualidade da Água — Laudos</title>
<link rel="stylesheet" href="../css/global.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/observability.js"></script>
<script src="../js/queryLogger.js"></script>
<script src="../js/config.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/fotos-privadas.js"></script>
<script src="../js/reautenticar.js"></script>
<script src="../js/agua-alertas.js"></script>
<script src="../js/agua-laudo-ocr.js"></script>
</head>
<body>
<div id="app"></div>

<!-- Modal de lançamento de laudo -->
<div class="modal-overlay" id="modal-laudo">
  <div class="modal" style="max-width:760px">
    <div class="modal-header">
      <div class="modal-title">Lançar laudo — <span id="lz-contexto"></span></div>
      <button class="modal-close" onclick="fecharModalLaudo()">×</button>
    </div>
    <div class="modal-body">
      <div id="lz-alertas"></div>
      <div class="form-group"><label class="form-label">Laboratório <span class="obrig">*</span></label>
        <select class="form-control" id="lz-laboratorio"><option value="">Selecione...</option></select></div>

      <div class="form-section-label" style="margin-top:8px">Laudo (PDF ou imagem)</div>
      <div class="form-group">
        <input type="file" id="lz-arquivo" accept="application/pdf,image/*" onchange="lzArquivoEscolhido()">
        <div class="form-hint">Anexado ao lançar. Fica disponível para conferência posterior (leitura só de quem tem acesso ao módulo).</div>
        <a id="lz-arquivo-atual" style="display:none;font-size:12px" target="_blank" rel="noopener">Ver laudo já anexado</a>
      </div>
      <div class="form-group" id="lz-parser-area" style="display:none">
        <button class="btn btn-sm btn-secondary" type="button" id="btn-ler-laudo" onclick="lzLerLaudoAutomatico()">Ler laudo automaticamente</button>
        <span id="lz-parser-status" style="font-size:12px;color:#6B7280;margin-left:8px"></span>
      </div>
      <div id="lz-identidade-alerta"></div>
      <div id="lz-conferencia-parser"></div>

      <div class="form-section-label">Campo (conferir/corrigir se necessário)</div>
      <div class="grid-3" id="lz-campo"></div>

      <div class="form-section-label" style="margin-top:8px">Laboratório</div>
      <div class="grid-3" id="lz-lab"></div>

      <div class="form-group"><label class="form-label">Observações</label>
        <textarea class="form-control" id="lz-observacoes" rows="2"></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="fecharModalLaudo()">Cancelar</button>
      <button class="btn btn-primary" id="btn-salvar-laudo" onclick="salvarLaudo()">Salvar laudo</button>
    </div>
  </div>
</div>

<script>
// ── Qualidade da Água · fila de laudos + lançamento ─────────────
// Fase 2 do plano em docs/qualidade-agua/plano.md, itens 3 e 5.
//
// A fila é toda coleta com status='aguardando_lab' — o "campo" já foi
// preenchido (Fase 3 vai alimentar isso pelo app; até lá a fila fica
// vazia, e está correto ficar: não é escopo desta fase criar coleta do
// zero pela mesa). Lançar o laudo preenche os parâmetros de
// laboratório, anexa o PDF e muda o status para 'completo'.
//
// ALERTAS: nenhum limite é reimplementado aqui. A malha inteira vive
// em `agua_avaliar_coleta` (migrations 254 e 302/302b) e é aplicada
// por js/agua-alertas.js — físico, faixa da série, atípico para o
// ponto, erro de unidade, coerência entre parâmetros e contexto de
// campanha. Nível 'bloqueio' impede salvar; 'confirmar' pede
// confirmação explícita (confirm(), padrão do projeto) sem travar
// quem está digitando; 'informar' só aparece.
//
// A avaliação é da COLETA INTEIRA, com debounce — nunca uma chamada
// por campo. Dois motivos: as regras de coerência (ortofosfato ×
// fósforo total, E. coli × termotolerantes) só existem olhando o
// conjunto, e uma chamada por campo multiplicaria por 20 o custo de
// uma RPC que agrega a série histórica (~750 ms medidos).
//
// Conformidade CONAMA continua FORA desta malha, de propósito: é
// resultado do rio, não erro de digitação (ver cabeçalho da 302).
//
// PDF: bucket privado agua-laudos (migration 255). Upload e
// referência gravada seguem o MESMO padrão do resto do projeto —
// getPublicUrl() grava o endereço (bucket+caminho), e quem exibe
// assina na hora com js/fotos-privadas.js. Não reimplementar.

const CAMPO_FIELDS = [
  ['temp_ar', 'Temp. ar (°C)'], ['temp_amostra', 'Temp. amostra (°C)'],
  ['ph', 'pH'], ['od', 'OD (mg/L)'],
  ['turbidez', 'Turbidez (UNT)'], ['condutividade_eletrica', 'Condutividade (µS/cm)'],
]
const LAB_FIELDS = [
  ['dbo', 'DBO (mg/L)'], ['nitrogenio_total', 'Nitrogênio total'], ['nitrogenio_amoniacal', 'Nitrogênio amoniacal'],
  ['nitratos', 'Nitratos'], ['fosforo_total', 'Fósforo total'], ['ortofosfato_dissolvido', 'Ortofosfato dissolvido'],
  ['solidos_dissolvidos_totais', 'Sólidos dissolvidos totais'], ['solidos_suspensao_totais', 'Sólidos em suspensão totais'],
  ['coliformes_termotolerantes', 'Coliformes termotolerantes'], ['coliformes_totais', 'Coliformes totais'],
  ['escherichia_coli', 'Escherichia coli'], ['alcalinidade_total', 'Alcalinidade total'],
  ['carbono_organico_total', 'Carbono orgânico total'], ['cloreto', 'Cloreto'],
  ['condutividade_especifica', 'Condutividade específica'], ['descarga_liquida', 'Descarga líquida'],
]
const TODOS_OS_CAMPOS = [...CAMPO_FIELDS, ...LAB_FIELDS].map(([c]) => c)

let _fila = [], _labs = [], _editandoId = null, _podeEditar = false

;(async function () {
  const usuario = await carregarUsuario()
  if (!usuario) { window.location.href = '../index.html'; return }

  const { data: nivel } = await db.rpc('nivel_efetivo', { p_usuario: usuario.id, p_modulo_chave: 'agua' })
  if (!nivel || nivel === 'sem_acesso') {
    document.body.innerHTML = '<div style="padding:60px;text-align:center;font-family:\'DM Sans\',sans-serif;color:#6B7280">Você não tem acesso ao módulo Qualidade da Água.</div>'
    return
  }
  _podeEditar = nivel === 'editar'

  document.getElementById('app').innerHTML =
    gerarLayout('Qualidade da Água — Laudos', 'agua-laudos') +
    `<div class="fade-in">
      <p style="color:#6B7280;font-size:13px;margin:0 0 16px">
        Coletas com o campo já preenchido, aguardando o laudo do laboratório. Ordenadas pela mais antiga primeiro.
      </p>
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap">
        <input class="form-control" id="lz-filtro" placeholder="Filtrar por ponto, código ANA..." style="max-width:340px" oninput="renderFila()">
        <span id="lz-contador" style="font-size:12px;color:#6B7280"></span>
      </div>
      <div class="card"><div class="table-wrap"><div class="table-scroll">
        <table>
          <thead><tr><th>Código</th><th>Ponto</th><th>Campanha</th><th>Data da coleta</th><th>Aguardando há</th><th>Ações</th></tr></thead>
          <tbody id="tbody-fila"><tr><td colspan="5" style="text-align:center;padding:24px;color:#9CA3AF">Carregando...</td></tr></tbody>
        </table>
      </div></div></div>
    </div>` +
    '</div></div></div>'

  carregarLogosSidebar()
  await Promise.all([carregarLabsAtivos(), carregarFila()])
})()

async function carregarLabsAtivos() {
  const { data } = await db.from('agua_laboratorios').select('id,nome').eq('ativo', true).order('nome')
  _labs = data || []
  const sel = document.getElementById('lz-laboratorio')
  if (sel) sel.innerHTML = '<option value="">Selecione...</option>' + _labs.map(l => `<option value="${l.id}">${esc(l.nome)}</option>`).join('')
}

async function carregarFila() {
  const { data, error } = await db.from('vw_agua_coletas_detalhe')
    .select('*')
    .eq('status', 'aguardando_lab')
    .order('data_coleta')
  if (error) { toast(error.message || 'Erro ao carregar fila', 'error'); return }
  _fila = data || []
  renderFila()
}

function diasEsperando(dataColeta) {
  const ms = Date.now() - new Date(dataColeta + 'T00:00:00').getTime()
  return Math.max(0, Math.floor(ms / 86400000))
}

function renderFila() {
  const termo = (document.getElementById('lz-filtro')?.value || '').trim().toLowerCase()
  const tbody = document.getElementById('tbody-fila')
  const lista = _fila.filter(c => !termo
    || (c.ponto_nome || '').toLowerCase().includes(termo)
    || (c.codigo_ana || '').includes(termo))
  document.getElementById('lz-contador').textContent = `${lista.length} de ${_fila.length} aguardando laudo`
  if (!lista.length) { tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:24px;color:#9CA3AF">Nenhuma coleta aguardando laudo</td></tr>'; return }
  tbody.innerHTML = lista.map(c => {
    const dias = diasEsperando(c.data_coleta)
    return `
    <tr>
      <td class="mono" style="font-size:11px">${esc(c.codigo_amostra || '—')}</td>
      <td>${esc(c.ponto_nome)} <span style="color:#9CA3AF;font-size:11px">(${esc(c.codigo_ana)})</span></td>
      <td style="font-size:12px">${c.campanha_ano}/${c.campanha_ordem === 'segunda' ? '2ª' : '1ª'}</td>
      <td style="font-size:12px">${formatData(c.data_coleta)}</td>
      <td><span class="badge ${dias > 30 ? 'badge-erro' : dias > 15 ? 'badge-ouro' : 'badge-cinza'}">${dias} dia${dias === 1 ? '' : 's'}</span></td>
      <td>${_podeEditar ? `<button class="btn btn-xs btn-primary" onclick="abrirLaudo('${c.id}')">Lançar laudo</button>` : '—'}</td>
    </tr>`
  }).join('')
}

function abrirLaudo(id) {
  _editandoId = id
  const c = _fila.find(x => x.id === id)
  if (!c) return
  document.getElementById('lz-contexto').textContent =
    `${c.codigo_amostra ? c.codigo_amostra + ' · ' : ''}${c.ponto_nome} (${c.codigo_ana}) · campanha ${c.campanha_ano}/${c.campanha_ordem === 'segunda' ? '2ª' : '1ª'} · coletado em ${formatData(c.data_coleta)}`
  document.getElementById('lz-laboratorio').value = c.laboratorio_id || ''
  document.getElementById('lz-observacoes').value = c.observacoes || ''
  document.getElementById('lz-arquivo').value = ''

  const linkAtual = document.getElementById('lz-arquivo-atual')
  const ref = c.laudo_url ? fotoRef(c.laudo_url) : null
  if (ref) {
    linkAtual.style.display = 'inline'
    linkAtual.textContent = 'Ver laudo já anexado'
    linkAtual.setAttribute('data-foto-privada', `${ref.bucket}|${ref.path}`)
  } else {
    linkAtual.style.display = 'none'
    linkAtual.removeAttribute('data-foto-privada')
  }

  document.getElementById('lz-campo').innerHTML = CAMPO_FIELDS.map(([campo, rotulo]) => `
    <div class="form-group"><label class="form-label">${esc(rotulo)}</label>
      <input class="form-control" id="lz-f-${campo}" type="number" step="any" value="${c[campo] ?? ''}" oninput="lzAgendarAvaliacao()">
      <div class="form-hint" id="lz-h-${campo}"></div></div>`).join('')
  document.getElementById('lz-lab').innerHTML = LAB_FIELDS.map(([campo, rotulo]) => `
    <div class="form-group"><label class="form-label">${esc(rotulo)}</label>
      <input class="form-control" id="lz-f-${campo}" type="number" step="any" value="${c[campo] ?? ''}" oninput="lzAgendarAvaliacao()">
      <div class="form-hint" id="lz-h-${campo}"></div></div>`).join('')

  if (c.laudo_url) assinarFotos(document.getElementById('modal-laudo'))
  document.getElementById('modal-laudo').classList.add('aberto')
  _alertas = []
  lzPintarAlertas()
  lzAvaliar()   // o campo já vem preenchido da coleta — avalia de saída

  _origemDados = {}
  _resultadoParser = null
  document.getElementById('lz-parser-area').style.display = 'none'
  document.getElementById('lz-identidade-alerta').innerHTML = ''
  document.getElementById('lz-conferencia-parser').innerHTML = ''
  document.getElementById('lz-parser-status').textContent = ''
}

// ── Leitura assistida do laudo (Entrega 2) ─────────────────────
// js/agua-laudo-ocr.js faz TUDO: renderiza o PDF, recorta cada célula
// pela posição do gabarito, roda OCR, insere a vírgula na casa
// decimal do TEMPLATE (nunca a que o OCR "achou"). Esta tela só chama
// e desenha — nenhuma regra de extração mora aqui.
let _origemDados = {}       // {parametro: 'parser'|'digitado'|'corrigido_apos_parser'}
let _resultadoParser = null
let _valoresPropostos = {}  // {parametro: valor} — o que foi ACEITO do parser, para detectar edição manual depois

function lzArquivoEscolhido() {
  const arquivo = document.getElementById('lz-arquivo').files[0]
  const ehPdf = arquivo && /pdf$/i.test(arquivo.type || arquivo.name)
  document.getElementById('lz-parser-area').style.display = ehPdf ? 'block' : 'none'
  document.getElementById('lz-identidade-alerta').innerHTML = ''
  document.getElementById('lz-conferencia-parser').innerHTML = ''
  _resultadoParser = null
}

async function lzLerLaudoAutomatico() {
  const arquivo = document.getElementById('lz-arquivo').files[0]
  const laboratorioId = document.getElementById('lz-laboratorio').value
  const c = _fila.find(x => x.id === _editandoId)
  if (!arquivo || !c) return
  if (!laboratorioId) { toast('Selecione o laboratório antes de ler o laudo', 'error'); return }

  const btn = document.getElementById('btn-ler-laudo')
  const status = document.getElementById('lz-parser-status')
  btn.disabled = true
  document.getElementById('lz-identidade-alerta').innerHTML = ''
  document.getElementById('lz-conferencia-parser').innerHTML = ''

  try {
    const { data: tpl, error } = await db.from('agua_laudo_templates')
      .select('campos, campos_identidade')
      .eq('laboratorio_id', laboratorioId).eq('ativo', true)
      .order('versao', { ascending: false }).limit(1).maybeSingle()
    if (error) throw error
    if (!tpl) {
      status.textContent = 'Sem gabarito cadastrado para este laboratório — lance os valores manualmente.'
      return
    }

    const ponto = { nome: c.ponto_nome, rio: c.ponto_rio, municipio: c.ponto_municipio, codigos_alias: c.codigos_alias || [] }
    const coletaAberta = { data_coleta: c.data_coleta }

    _resultadoParser = await aguaLaudoProcessarPdf(arquivo, {
      template: tpl, coletaAberta, ponto,
      onProgresso: (m) => { status.textContent = m },
    })
    status.textContent = ''
    lzMontarConferenciaParser()
  } catch (e) {
    status.textContent = 'Não foi possível ler o laudo automaticamente — lance manualmente.'
    console.warn('[lz-parser]', e)
  } finally {
    btn.disabled = false
  }
}

function lzMontarConferenciaParser() {
  const r = _resultadoParser
  if (!r) return

  const alertaEl = document.getElementById('lz-identidade-alerta')
  if (!r.identidade.ok) {
    alertaEl.innerHTML = `<div style="background:#FEF2F2;border:1px solid #FECACA;border-radius:8px;padding:10px 12px;font-size:12.5px;color:#991B1B;margin:8px 0">
      <div style="font-weight:600;margin-bottom:4px">O laudo parece ser de outra amostra — nada foi preenchido automaticamente</div>
      <ul style="margin:4px 0 0;padding-left:18px">
        ${r.identidade.problemas.map(p => `<li>${esc(p.campo === 'data_coleta' ? 'Data da coleta' : 'Procedência')}: o laudo diz "${esc(p.pdf)}", a coleta aberta é "${esc(p.tela)}"</li>`).join('')}
      </ul>
      <div style="margin-top:6px">Confira se escolheu o laudo certo antes de digitar manualmente.</div>
    </div>`
    document.getElementById('lz-conferencia-parser').innerHTML = ''
    return
  }

  alertaEl.innerHTML = `<div style="background:#F0FDF4;border:1px solid #BBF7D0;border-radius:8px;padding:8px 12px;font-size:12.5px;color:#166534;margin:8px 0">
    Identidade da amostra confere com o laudo (${esc(r.numeroLaudo || 'nº não lido')}). Confira cada valor abaixo antes de aceitar — o recorte da imagem é a prova, o texto lido pode errar um dígito.
  </div>`

  const TODOS = [...CAMPO_FIELDS, ...LAB_FIELDS]
  const linhas = TODOS.filter(([campo]) => _resultadoParser.campos[campo]).map(([campo, rotulo]) => {
    const c = r.campos[campo]
    const semLeitura = c.valor == null
    const corConf = c.confianca >= 80 ? 'var(--sucesso,#059669)' : c.confianca >= 60 ? 'var(--alerta,#D97706)' : '#9CA3AF'
    return `<div style="display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid #F3F4F6">
      <img src="${c.recorteDataURL}" alt="recorte do laudo" style="height:28px;border:1px solid #E5E7EB;border-radius:4px;background:#fff">
      <div style="flex:1;font-size:12.5px">${esc(rotulo)}</div>
      <div style="font-size:12.5px;min-width:70px;text-align:right">
        ${semLeitura ? '<span style="color:#9CA3AF">sem leitura</span>' : `<strong>${esc(String(c.valor))}</strong>${c.censurado ? ' <span title="valor censurado no laudo">(&lt;LQ)</span>' : ''}`}
      </div>
      <span style="font-size:10.5px;color:${corConf};min-width:36px;text-align:right">${semLeitura ? '' : c.confianca + '%'}</span>
      <button class="btn btn-xs btn-secondary" type="button" ${semLeitura ? 'disabled' : ''} onclick="lzAceitarCampo('${campo}')">Aceitar</button>
    </div>`
  }).join('')

  document.getElementById('lz-conferencia-parser').innerHTML = `
    <div class="form-section-label" style="margin-top:8px">Conferência do laudo lido</div>
    <div style="border:1px solid #E5E7EB;border-radius:8px;padding:8px 12px">${linhas}</div>
    <button class="btn btn-xs btn-primary" type="button" style="margin-top:8px" onclick="lzAceitarTodosAltaConfianca()">Aceitar todos os de alta confiança (≥80%)</button>
  `
}

function lzAceitarCampo(campo) {
  const c = _resultadoParser?.campos?.[campo]
  if (!c || c.valor == null) return
  const input = document.getElementById(`lz-f-${campo}`)
  if (!input) return
  input.value = c.valor
  _origemDados[campo] = 'parser'
  _valoresPropostos[campo] = c.valor
  lzAgendarAvaliacao()
}

function lzAceitarTodosAltaConfianca() {
  const r = _resultadoParser
  if (!r) return
  for (const campo of Object.keys(r.campos)) {
    const c = r.campos[campo]
    if (c.valor != null && c.confianca >= 80) lzAceitarCampo(campo)
  }
  toast('Valores de alta confiança preenchidos — confira campo a campo antes de salvar', 'info')
}

function lzValor(campo) {
  const v = document.getElementById(`lz-f-${campo}`)?.value
  return v === '' || v == null ? null : parseFloat(v)
}

let _alertas = [], _timerAval = null

// Debounce de 500 ms: o técnico digita 20 campos seguidos e não
// precisa de uma ida ao servidor por tecla.
function lzAgendarAvaliacao() {
  // Se o campo tinha vindo do parser e o técnico alterou o número à
  // mão, a proveniência vira "corrigido" — não é mais o que o OCR
  // leu. Comparado por valor (não por evento), porque o mesmo evento
  // dispara tanto ao ACEITAR quanto ao editar depois.
  for (const campo of Object.keys(_valoresPropostos)) {
    if (_origemDados[campo] === 'parser' && lzValor(campo) !== _valoresPropostos[campo]) {
      _origemDados[campo] = 'corrigido_apos_parser'
    }
  }
  clearTimeout(_timerAval)
  _timerAval = setTimeout(() => { lzAvaliar() }, 500)
}

function lzValoresAtuais() {
  const v = {}
  for (const campo of TODOS_OS_CAMPOS) v[campo] = lzValor(campo)
  return v
}

async function lzAvaliar() {
  const c = _fila.find(x => x.id === _editandoId)
  if (!c) return []
  _alertas = await aguaAlertasAvaliar(db, {
    pontoId: c.ponto_id, ordem: c.campanha_ordem, valores: lzValoresAtuais(),
    campanhaId: c.campanha_id, coletaId: c.id,
  })
  lzPintarAlertas()
  return _alertas
}

function lzPintarAlertas() {
  document.getElementById('lz-alertas').innerHTML = aguaAlertasResumoHTML(_alertas)
  for (const campo of TODOS_OS_CAMPOS) {
    const hint = document.getElementById(`lz-h-${campo}`)
    if (hint) hint.innerHTML = aguaAlertaHintHTML(aguaAlertaDoCampo(_alertas, campo))
  }
}

async function salvarLaudo() {
  if (!_editandoId) return
  const laboratorioId = document.getElementById('lz-laboratorio').value
  if (!laboratorioId) { toast('Selecione o laboratório', 'error'); return }

  // Reavalia no momento de salvar — não confia no debounce (colar
  // valor ou salvar rápido pode chegar antes da última avaliação).
  clearTimeout(_timerAval)
  const alertas = await lzAvaliar()

  const bloqueios = aguaAlertasBloqueios(alertas)
  if (bloqueios.length) {
    toast(`Corrija antes de salvar: ${bloqueios.map(a => AGUA_ALERTA_PARAM_ROTULO[a.parametro] || a.parametro).join(', ')}`, 'error')
    return
  }
  const texto = aguaAlertasTextoConfirmacao(alertas)
  if (texto && !confirm(texto)) return

  const payload = {
    laboratorio_id: laboratorioId,
    observacoes: document.getElementById('lz-observacoes').value.trim() || null,
    status: 'completo',
  }
  const origemFinal = {}
  for (const campo of TODOS_OS_CAMPOS) {
    const valor = lzValor(campo)
    payload[campo] = valor
    if (valor == null) continue
    // Campo sem passagem pelo parser e com valor: foi digitado à mão.
    origemFinal[campo] = _origemDados[campo] || 'digitado'
  }
  payload.origem_dados = origemFinal

  // Por registro (não janela): lançar laudo é ação isolada, diferente
  // da edição em lote da conferência. docs/qualidade-agua/plano-seguranca-dados.md.
  const r = await reautenticar({ motivo: 'lançar este laudo' })
  if (!r) return

  const btn = document.getElementById('btn-salvar-laudo')
  btn.disabled = true
  try {
    const arquivo = document.getElementById('lz-arquivo').files[0]
    if (arquivo) {
      if (arquivo.size > 10 * 1024 * 1024) throw new Error('Arquivo deve ter no máximo 10 MB')
      const ext = (arquivo.name.split('.').pop() || 'pdf').toLowerCase()
      const path = `${_editandoId}/${Date.now()}.${ext}`
      const { error: upErr } = await db.storage.from('agua-laudos').upload(path, arquivo, { contentType: arquivo.type || 'application/pdf' })
      if (upErr) throw upErr
      const { data: { publicUrl } } = db.storage.from('agua-laudos').getPublicUrl(path)
      payload.laudo_url = publicUrl
    }

    const { error } = await db.rpc('agua_atualizar_coleta', {
      p_id: _editandoId, p_campos: payload, p_justificativa: r.justificativa,
    })
    if (error) throw error
    toast('Laudo lançado — coleta marcada como completa!', 'success')
    fecharModalLaudo()
    await carregarFila()
  } catch (e) {
    toast(e.message?.includes('REAUTH_NECESSARIA') ? 'Sessão de confirmação expirou — tente novamente.' : (e.message || 'Erro ao salvar laudo'), 'error')
  }
  finally { btn.disabled = false }
}

function fecharModalLaudo() {
  document.getElementById('modal-laudo').classList.remove('aberto')
  _editandoId = null
}
</script>
