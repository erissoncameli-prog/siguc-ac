<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SIGUC-AC · Biomonitor — Equipamentos</title>
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/biomonitor.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/observability.js"></script>
<script src="../js/queryLogger.js"></script>
<script src="../js/config.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/fotos-privadas.js"></script>
<script>
// Rede de segurança para js/fotos-privadas.js — ver mesmo comentário em
// frota-inspecoes.html. Degradar para "sem foto" é melhor que quebrar a lista.
window.fotoAttr = window.fotoAttr || function () { return '' }
window.assinarFotos = window.assinarFotos || function () {}
</script>
</head>
<body>
<div id="app"></div>

<!-- Modal: cadastro/edição de equipamento -->
<div class="modal-overlay" id="modal-equip">
  <div class="modal" style="max-width:480px">
    <div class="modal-header">
      <div class="modal-title" id="eq-titulo">Novo equipamento</div>
      <button class="modal-close" onclick="fecharModal('equip')">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group"><label class="form-label">Descrição do bem <span class="obrig">*</span></label>
        <input class="form-control" id="eq-descricao" placeholder="Ex.: GPS Garmin eTrex 22x"></div>
      <div class="grid-2">
        <div class="form-group"><label class="form-label">Categoria <span class="obrig">*</span></label>
          <select class="form-control" id="eq-categoria" onchange="renderEspecificacoesForm()"></select></div>
        <div class="form-group"><label class="form-label">Grupo de monitoramento <span class="obrig">*</span></label>
          <select class="form-control" id="eq-grupo"></select></div>
      </div>
      <div class="grid-2">
        <div class="form-group"><label class="form-label">Marca</label>
          <input class="form-control" id="eq-marca" placeholder="Ex.: Garmin"></div>
        <div class="form-group"><label class="form-label">Modelo</label>
          <input class="form-control" id="eq-modelo" placeholder="Ex.: eTrex 22x"></div>
      </div>
      <div class="grid-2">
        <div class="form-group"><label class="form-label">Nº de série (fabricante)</label>
          <input class="form-control" id="eq-numero-serie" placeholder="Número de série do bem"></div>
        <div class="form-group"><label class="form-label">Plaqueta de patrimônio</label>
          <input class="form-control" id="eq-plaqueta" placeholder="Nº da plaqueta física (se houver)"></div>
      </div>
      <div class="grid-2">
        <div class="form-group"><label class="form-label">Data de aquisição</label>
          <input class="form-control" type="date" id="eq-data-aquisicao"></div>
        <div class="form-group"><label class="form-label">Fornecedor</label>
          <input class="form-control" id="eq-fornecedor" placeholder="De quem foi adquirido"></div>
      </div>
      <div class="form-group"><label class="form-label">Código interno</label>
        <input class="form-control" id="eq-codigo" disabled placeholder="Gerado automaticamente"></div>
      <div id="eq-especificacoes-wrap"></div>
      <div class="form-group"><label class="form-label">Foto</label>
        <input class="form-control" type="file" accept="image/*" id="eq-foto-input" onchange="prevFotoEquip(event)">
        <img id="eq-foto-preview" style="display:none;max-width:160px;border-radius:8px;margin-top:8px">
      </div>
      <div class="form-group"><label class="form-label">Status</label>
        <select class="form-control" id="eq-status">
          <option value="disponivel">Disponível</option>
          <option value="manutencao">Em manutenção</option>
          <option value="baixado">Baixado</option>
        </select></div>
      <div class="form-group"><label class="form-label">Observações</label>
        <textarea class="form-control" id="eq-observacoes" rows="2"></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="fecharModal('equip')">Cancelar</button>
      <button class="btn btn-primary" id="btn-salvar-equip" onclick="salvarEquipamento()">Salvar</button>
    </div>
  </div>
</div>

<!-- Modal: devolver equipamento(s) de uma cautela -->
<div class="modal-overlay" id="modal-devolucao">
  <div class="modal" style="max-width:480px">
    <div class="modal-header">
      <div class="modal-title">Devolver equipamento(s)</div>
      <button class="modal-close" onclick="fecharModal('devolucao')">×</button>
    </div>
    <div class="modal-body">
      <div id="dev-itens" style="display:flex;flex-direction:column;gap:8px;margin-bottom:12px"></div>
      <div class="form-group"><label class="form-label">Observação</label>
        <textarea class="form-control" id="dev-observacao" rows="2" placeholder="Estado de conservação, avaria, etc. (opcional)"></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="fecharModal('devolucao')">Cancelar</button>
      <button class="btn btn-primary" id="btn-confirmar-devolucao" onclick="confirmarDevolucao()">Confirmar devolução</button>
    </div>
  </div>
</div>

<!-- Modal: validar cautela (confirma/ajusta prazo) -->
<div class="modal-overlay" id="modal-validar">
  <div class="modal" style="max-width:420px">
    <div class="modal-header">
      <div class="modal-title">Validar cautela</div>
      <button class="modal-close" onclick="fecharModal('validar')">×</button>
    </div>
    <div class="modal-body">
      <p style="font-size:13px;color:#6B7280;margin:0 0 12px">
        Ao validar, você passa a ser o responsável por acompanhar o prazo desta cautela — os avisos de vencimento chegam para você.
      </p>
      <div class="form-group"><label class="form-label">Data prevista de devolução</label>
        <input class="form-control" type="date" id="val-data-prevista"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="fecharModal('validar')">Cancelar</button>
      <button class="btn btn-primary" id="btn-confirmar-validacao" onclick="confirmarValidacao()">Validar</button>
    </div>
  </div>
</div>

<!-- Modal: tratar ocorrência de equipamento -->
<div class="modal-overlay" id="modal-ocorrencia">
  <div class="modal" style="max-width:480px">
    <div class="modal-header">
      <div class="modal-title">Ocorrência de equipamento</div>
      <button class="modal-close" onclick="fecharModal('ocorrencia')">×</button>
    </div>
    <div class="modal-body" id="ocorr-corpo"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="fecharModal('ocorrencia')">Fechar</button>
      <button class="btn btn-primary" id="btn-resolver-ocorrencia" onclick="resolverOcorrencia()">Marcar como resolvida</button>
    </div>
  </div>
</div>

<script>
let _equipamentos = [], _cautelas = [], _grupos = [], _ocorrencias = [], _editEquipId = null, _fotoEquipFile = null
let _devCautelaId = null, _valCautelaId = null, _ocorrOcorrenciaId = null

const TIPO_OCORRENCIA_LABEL = { dano: 'Dano', defeito: 'Defeito', extravio: 'Extravio', perda: 'Perda', outro: 'Outro' }

const CATEGORIA_LABEL = {
  gps: 'GPS', camera: 'Câmera', equip_medicao: 'Equipamento de medição',
  equip_mergulho: 'Equipamento de mergulho', embarcacao: 'Embarcação',
  radio_comunicacao: 'Rádio de comunicação', informatica: 'Informática',
  mobiliario_campo: 'Mobiliário de campo', outro: 'Outro',
}

// Campos específicos por categoria, gravados em `especificacoes` (jsonb).
// Adicionar categoria nova = só mexer aqui + no enum do banco, sem tocar
// no restante do formulário (mesmo espírito do catálogo de checklist do Frota).
const ESPEC_CAMPOS = {
  gps:               [{ key: 'imei', label: 'IMEI' }, { key: 'capacidade_bateria', label: 'Capacidade da bateria' }, { key: 'precisao_m', label: 'Precisão (m)' }],
  camera:            [{ key: 'resolucao', label: 'Resolução' }, { key: 'tipo_bateria', label: 'Tipo de bateria' }, { key: 'cartao_memoria_gb', label: 'Cartão de memória (GB)' }],
  equip_medicao:     [{ key: 'unidade_medida', label: 'Unidade de medida' }, { key: 'faixa_medicao', label: 'Faixa de medição' }],
  equip_mergulho:    [{ key: 'tamanho', label: 'Tamanho/numeração' }],
  embarcacao:        [{ key: 'motor_potencia_hp', label: 'Potência do motor (HP)' }, { key: 'capacidade_pessoas', label: 'Capacidade (pessoas)' }, { key: 'combustivel', label: 'Combustível' }],
  radio_comunicacao: [{ key: 'frequencia', label: 'Frequência' }, { key: 'alcance_km', label: 'Alcance (km)' }],
  informatica:       [{ key: 'sistema_operacional', label: 'Sistema operacional' }, { key: 'armazenamento_gb', label: 'Armazenamento (GB)' }],
  mobiliario_campo:  [],
  outro:             [],
}

;(async function () {
  const usuario = await carregarUsuario()
  if (!usuario) { window.location.href = '../index.html'; return }
  if (!['super_admin','gestor','tecnico'].includes(usuario.perfil)) {
    window.location.href = '../pages/dashboard.html'; return
  }

  document.getElementById('app').innerHTML =
    gerarLayout('Biomonitor — Equipamentos', 'biomonitor-equipamentos') + htmlPagina()

  await Promise.all([carregarEquipamentos(), carregarCautelas(), carregarGrupos(), carregarOcorrencias()])
  bIconsAplicar()
})()

async function carregarGrupos() {
  const { data } = await db.from('grupos_biomonitor').select('id,nome').eq('ativo', true).order('nome')
  _grupos = data || []
}

function htmlPagina() {
  return `<div class="fade-in">
    <div class="kpi-grid">
      <div class="card" style="padding:14px"><div style="font-size:12px;color:#6B7280">Total de equipamentos</div><div style="font-size:22px;font-weight:700" id="k-total">0</div></div>
      <div class="card" style="padding:14px"><div style="font-size:12px;color:#6B7280">Disponíveis</div><div style="font-size:22px;font-weight:700" id="k-disp">0</div></div>
      <div class="card" style="padding:14px"><div style="font-size:12px;color:#6B7280">Em cautela</div><div style="font-size:22px;font-weight:700" id="k-cautela">0</div></div>
      <div class="card" style="padding:14px"><div style="font-size:12px;color:#6B7280">Manutenção/baixado</div><div style="font-size:22px;font-weight:700" id="k-outros">0</div></div>
    </div>

    <div class="card" style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px">
        <div>
          <div style="font-weight:700;font-size:14px">Catálogo de equipamentos</div>
          <div style="font-size:12px;color:#6B7280">Cadastro na mesa. A cautela (entrega ao monitor) é assinada no app de campo.</div>
        </div>
        <button class="btn btn-primary btn-sm" onclick="abrirModalEquip()">${bico('plus')} Novo equipamento</button>
      </div>
      <div class="table-wrap"><table class="table">
        <thead><tr>
          <th style="width:56px">Foto</th><th>Descrição</th><th>Categoria</th><th>Grupo</th><th>Código</th><th>Plaqueta</th>
          <th style="width:110px">Status</th><th>Com monitor</th><th style="width:80px"></th>
        </tr></thead>
        <tbody id="tbody-equip"><tr><td colspan="9" style="padding:12px 14px" aria-busy="true" aria-label="Carregando"><div class="skeleton skeleton-linha" style="width:86%"></div><div class="skeleton skeleton-linha" style="width:72%"></div><div class="skeleton skeleton-linha" style="width:90%"></div><div class="skeleton skeleton-linha" style="width:64%"></div></td></tr></tbody>
      </table></div>
    </div>

    <div class="card" style="margin-bottom:16px">
      <div style="font-weight:700;font-size:14px;margin-bottom:6px">Cautelas — relatório de patrimônio</div>
      <div class="table-wrap"><table class="table">
        <thead><tr>
          <th>Assinado em</th><th>Monitor</th><th>Itens</th><th>Devolução prevista</th>
          <th style="width:130px">Validação</th><th style="width:110px">Status</th><th style="width:170px"></th>
        </tr></thead>
        <tbody id="tbody-cautelas"><tr><td colspan="7" style="padding:12px 14px" aria-busy="true" aria-label="Carregando"><div class="skeleton skeleton-linha" style="width:86%"></div><div class="skeleton skeleton-linha" style="width:72%"></div><div class="skeleton skeleton-linha" style="width:90%"></div><div class="skeleton skeleton-linha" style="width:64%"></div></td></tr></tbody>
      </table></div>
    </div>

    <div class="card">
      <div style="font-weight:700;font-size:14px;margin-bottom:6px">Ocorrências em equipamentos</div>
      <div class="table-wrap"><table class="table">
        <thead><tr>
          <th>Data</th><th>Equipamento</th><th>Monitor</th><th>Tipo</th><th>Descrição</th>
          <th style="width:110px">Status</th><th style="width:80px"></th>
        </tr></thead>
        <tbody id="tbody-ocorrencias"><tr><td colspan="7" style="padding:12px 14px" aria-busy="true" aria-label="Carregando"><div class="skeleton skeleton-linha" style="width:86%"></div><div class="skeleton skeleton-linha" style="width:72%"></div><div class="skeleton skeleton-linha" style="width:90%"></div><div class="skeleton skeleton-linha" style="width:64%"></div></td></tr></tbody>
      </table></div>
    </div>
  </div>`
}

function formatDataHora(str) {
  if (!str) return '—'
  return new Date(str).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit' })
}

const STATUS_EQUIP_LABEL = { disponivel: 'Disponível', em_cautela: 'Em cautela', manutencao: 'Manutenção', baixado: 'Baixado' }
const STATUS_EQUIP_BADGE = { disponivel: 'badge-verde', em_cautela: 'badge-ouro', manutencao: 'badge-cinza', baixado: 'badge-red' }

// ── Catálogo ───────────────────────────────────────────────────
async function carregarEquipamentos() {
  const { data } = await db.from('vw_biomonitor_equipamentos_status').select('*').order('descricao')
  _equipamentos = data || []
  renderEquipamentos()
}

function renderEquipamentos() {
  const tbody = document.getElementById('tbody-equip')
  if (!tbody) return
  document.getElementById('k-total').textContent = _equipamentos.length
  document.getElementById('k-disp').textContent = _equipamentos.filter(e => e.status === 'disponivel').length
  document.getElementById('k-cautela').textContent = _equipamentos.filter(e => e.status === 'em_cautela').length
  document.getElementById('k-outros').textContent = _equipamentos.filter(e => e.status === 'manutencao' || e.status === 'baixado').length

  if (!_equipamentos.length) {
    tbody.innerHTML = `<tr><td colspan="9" style="text-align:center;padding:32px;color:#9CA3AF">Nenhum equipamento cadastrado</td></tr>`
    return
  }
  tbody.innerHTML = _equipamentos.map(e => `<tr>
    <td>${e.foto_url ? `<img ${fotoAttr(e.foto_url)} style="width:36px;height:36px;object-fit:cover;border-radius:6px;display:block">` : '—'}</td>
    <td><strong>${esc(e.descricao)}</strong>${e.marca || e.modelo ? `<br><span style="font-size:11px;color:#9CA3AF">${esc([e.marca, e.modelo].filter(Boolean).join(' · '))}</span>` : ''}</td>
    <td style="font-size:12px">${esc(CATEGORIA_LABEL[e.categoria] || e.categoria)}</td>
    <td style="font-size:12px">${esc(e.grupo_nome || '—')}</td>
    <td class="mono">${esc(e.codigo || '—')}</td>
    <td>${esc(e.plaqueta || '—')}</td>
    <td><span class="badge ${STATUS_EQUIP_BADGE[e.status] || 'badge-cinza'}">${STATUS_EQUIP_LABEL[e.status] || e.status}</span></td>
    <td style="font-size:12px">${esc(e.com_monitor || '—')}</td>
    <td><button class="btn btn-xs btn-ghost" onclick="abrirModalEquip('${e.id}')">Editar</button></td>
  </tr>`).join('')
  assinarFotos(tbody)
}

function abrirModalEquip(id) {
  _editEquipId = id || null
  _fotoEquipFile = null
  const e = id ? _equipamentos.find(x => x.id === id) : null
  document.getElementById('eq-titulo').textContent = e ? 'Editar equipamento' : 'Novo equipamento'
  document.getElementById('eq-descricao').value = e?.descricao || ''

  document.getElementById('eq-categoria').innerHTML = Object.entries(CATEGORIA_LABEL)
    .map(([v, l]) => `<option value="${v}">${l}</option>`).join('')
  document.getElementById('eq-categoria').value = e?.categoria || 'outro'

  document.getElementById('eq-grupo').innerHTML =
    `<option value="">Selecione...</option>` +
    _grupos.map(g => `<option value="${g.id}">${esc(g.nome)}</option>`).join('')
  document.getElementById('eq-grupo').value = e?.grupo_id || ''

  document.getElementById('eq-marca').value = e?.marca || ''
  document.getElementById('eq-modelo').value = e?.modelo || ''
  document.getElementById('eq-numero-serie').value = e?.numero_serie || ''
  document.getElementById('eq-plaqueta').value = e?.plaqueta || ''
  document.getElementById('eq-data-aquisicao').value = e?.data_aquisicao || ''
  document.getElementById('eq-fornecedor').value = e?.fornecedor || ''
  document.getElementById('eq-codigo').value = e?.codigo || ''
  document.getElementById('eq-status').value = (e && e.status !== 'em_cautela') ? e.status : 'disponivel'
  document.getElementById('eq-status').disabled = e?.status === 'em_cautela'
  document.getElementById('eq-observacoes').value = e?.observacoes || ''

  renderEspecificacoesForm(e?.especificacoes || {})

  const prev = document.getElementById('eq-foto-preview')
  if (e?.foto_url) { prev.src = e.foto_url; prev.style.display = 'block' } else { prev.style.display = 'none' }
  document.getElementById('eq-foto-input').value = ''
  document.getElementById('modal-equip').classList.add('aberto')
}

function renderEspecificacoesForm(valoresAtuais) {
  const categoria = document.getElementById('eq-categoria').value
  const campos = ESPEC_CAMPOS[categoria] || []
  const wrap = document.getElementById('eq-especificacoes-wrap')
  if (!campos.length) { wrap.innerHTML = ''; return }
  const valores = valoresAtuais || {}
  wrap.innerHTML = `
    <div class="form-group"><label class="form-label">Especificações — ${CATEGORIA_LABEL[categoria]}</label></div>
    <div class="grid-2">
      ${campos.map(c => `
        <div class="form-group">
          <label class="form-label" style="font-size:11px">${c.label}</label>
          <input class="form-control eq-espec-campo" data-key="${c.key}" value="${esc(valores[c.key] || '')}">
        </div>`).join('')}
    </div>`
}

function coletarEspecificacoes() {
  const out = {}
  document.querySelectorAll('.eq-espec-campo').forEach(inp => {
    const v = inp.value.trim()
    if (v) out[inp.dataset.key] = v
  })
  return out
}

function prevFotoEquip(ev) {
  const file = ev.target.files[0]
  if (!file) return
  _fotoEquipFile = file
  const prev = document.getElementById('eq-foto-preview')
  prev.src = URL.createObjectURL(file)
  prev.style.display = 'block'
}

async function salvarEquipamento() {
  const descricao = document.getElementById('eq-descricao').value.trim()
  if (!descricao) { toast('Informe a descrição do bem', 'error'); return }
  const grupo_id = document.getElementById('eq-grupo').value
  if (!grupo_id) { toast('Selecione o grupo de monitoramento', 'error'); return }
  const btn = document.getElementById('btn-salvar-equip')
  const _btnRest0 = btnEspera(btn)
  try {
    let foto_url
    if (_fotoEquipFile) {
      const ext = (_fotoEquipFile.name.split('.').pop() || 'jpg').toLowerCase()
      const path = `equipamentos/${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`
      const { error: upErr } = await db.storage.from('biomonitor-fotos').upload(path, _fotoEquipFile)
      if (upErr) throw upErr
      foto_url = db.storage.from('biomonitor-fotos').getPublicUrl(path).data.publicUrl
    }
    const payload = {
      descricao,
      categoria: document.getElementById('eq-categoria').value,
      grupo_id,
      marca: document.getElementById('eq-marca').value.trim() || null,
      modelo: document.getElementById('eq-modelo').value.trim() || null,
      numero_serie: document.getElementById('eq-numero-serie').value.trim() || null,
      plaqueta: document.getElementById('eq-plaqueta').value.trim() || null,
      data_aquisicao: document.getElementById('eq-data-aquisicao').value || null,
      fornecedor: document.getElementById('eq-fornecedor').value.trim() || null,
      especificacoes: coletarEspecificacoes(),
      status: document.getElementById('eq-status').value,
      observacoes: document.getElementById('eq-observacoes').value.trim() || null,
      ...(foto_url ? { foto_url } : {}),
    }
    const { error } = _editEquipId
      ? await db.from('biomonitor_equipamentos').update(payload).eq('id', _editEquipId)
      : await db.from('biomonitor_equipamentos').insert(payload)
    if (error) throw error
    toast('Equipamento salvo', 'success')
    fecharModal('equip')
    await carregarEquipamentos()
  } catch (e) { toast(e.message || 'Erro ao salvar', 'error') }
  finally {  _btnRest0() }
}

// ── Cautelas / devolução ─────────────────────────────────────────
async function carregarCautelas() {
  const { data } = await db.from('vw_biomonitor_cautelas_detalhe').select('*')
    .order('assinado_em', { ascending: false }).limit(200)
  _cautelas = data || []
  renderCautelas()
}

function renderCautelas() {
  const tbody = document.getElementById('tbody-cautelas')
  if (!tbody) return
  if (!_cautelas.length) {
    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:32px;color:#9CA3AF">Nenhuma cautela registrada</td></tr>`
    return
  }
  const STATUS_LABEL = { aberta: 'Aberta', parcial: 'Devolução parcial', devolvida: 'Devolvida' }
  const STATUS_BADGE = { aberta: 'badge-ouro', parcial: 'badge-ouro', devolvida: 'badge-verde' }
  const hoje = new Date().toISOString().slice(0, 10)
  tbody.innerHTML = _cautelas.map(c => {
    const venceu = c.status !== 'devolvida' && c.data_prevista_devolucao && c.data_prevista_devolucao < hoje
    const prazoFmt = c.data_prevista_devolucao
      ? new Date(c.data_prevista_devolucao + 'T00:00:00').toLocaleDateString('pt-BR') : '—'
    return `<tr>
    <td style="font-size:12px">${formatDataHora(c.assinado_em)}</td>
    <td style="font-size:12px">${esc(c.monitor_nome || '—')}</td>
    <td style="font-size:12px">${(c.itens || []).map(i => esc(i.descricao) + (i.devolvido_em ? ' <span style="color:#9CA3AF">(devolvido)</span>' : '')).join(', ')}</td>
    <td style="font-size:12px${venceu ? ';color:#DC2626;font-weight:700' : ''}">${prazoFmt}${venceu ? ' (vencida)' : ''}</td>
    <td>${c.validado_por ? '<span class="badge badge-verde">Validada</span>' : `<button class="btn btn-xs btn-ghost" onclick="abrirValidacao('${c.id}')">Validar</button>`}</td>
    <td><span class="badge ${STATUS_BADGE[c.status] || 'badge-cinza'}">${STATUS_LABEL[c.status] || c.status}</span></td>
    <td>${c.status !== 'devolvida' ? `<button class="btn btn-xs btn-ghost" onclick="abrirDevolucao('${c.id}')">Devolver</button>` : ''}</td>
  </tr>`
  }).join('')
}

function abrirValidacao(cautelaId) {
  const c = _cautelas.find(x => x.id === cautelaId)
  if (!c) return
  _valCautelaId = cautelaId
  document.getElementById('val-data-prevista').value = c.data_prevista_devolucao || ''
  document.getElementById('modal-validar').classList.add('aberto')
}

async function confirmarValidacao() {
  const btn = document.getElementById('btn-confirmar-validacao')
  const _btnRest1 = btnEspera(btn)
  try {
    const { error } = await db.rpc('biomonitor_validar_cautela', {
      p_cautela_id: _valCautelaId,
      p_nova_data_prevista: document.getElementById('val-data-prevista').value || null,
    })
    if (error) throw error
    toast('Cautela validada', 'success')
    fecharModal('validar')
    await carregarCautelas()
  } catch (e) { toast(e.message || 'Erro ao validar', 'error') }
  finally {  _btnRest1() }
}

// ── Ocorrências de equipamento ───────────────────────────────────
async function carregarOcorrencias() {
  const { data } = await db.from('vw_biomonitor_ocorrencias_equipamento').select('*')
    .order('criado_em', { ascending: false }).limit(200)
  _ocorrencias = data || []
  renderOcorrencias()
}

function renderOcorrencias() {
  const tbody = document.getElementById('tbody-ocorrencias')
  if (!tbody) return
  if (!_ocorrencias.length) {
    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:32px;color:#9CA3AF">Nenhuma ocorrência registrada</td></tr>`
    return
  }
  const STATUS_LABEL = { aberta: 'Aberta', em_analise: 'Em análise', resolvida: 'Resolvida' }
  const STATUS_BADGE = { aberta: 'badge-red', em_analise: 'badge-ouro', resolvida: 'badge-verde' }
  tbody.innerHTML = _ocorrencias.map(o => `<tr>
    <td style="font-size:12px">${formatDataHora(o.criado_em)}</td>
    <td style="font-size:12px">${esc(o.equipamento_descricao)}${o.equipamento_codigo ? ` <span class="mono" style="color:#9CA3AF">(${esc(o.equipamento_codigo)})</span>` : ''}</td>
    <td style="font-size:12px">${esc(o.monitor_nome || '—')}</td>
    <td style="font-size:12px">${esc(TIPO_OCORRENCIA_LABEL[o.tipo] || o.tipo)}</td>
    <td style="font-size:12px;max-width:220px">${esc(o.descricao)}</td>
    <td><span class="badge ${STATUS_BADGE[o.status] || 'badge-cinza'}">${STATUS_LABEL[o.status] || o.status}</span></td>
    <td>${o.status !== 'resolvida' ? `<button class="btn btn-xs btn-ghost" onclick="abrirOcorrencia('${o.id}')">Tratar</button>` : ''}</td>
  </tr>`).join('')
}

function abrirOcorrencia(ocorrenciaId) {
  const o = _ocorrencias.find(x => x.id === ocorrenciaId)
  if (!o) return
  _ocorrOcorrenciaId = ocorrenciaId
  document.getElementById('ocorr-corpo').innerHTML = `
    <div style="font-size:13px;line-height:1.8;margin-bottom:12px">
      <div><strong>Equipamento:</strong> ${esc(o.equipamento_descricao)}${o.equipamento_codigo ? ` (${esc(o.equipamento_codigo)})` : ''}</div>
      <div><strong>Monitor:</strong> ${esc(o.monitor_nome || '—')}</div>
      <div><strong>Tipo:</strong> ${esc(TIPO_OCORRENCIA_LABEL[o.tipo] || o.tipo)}</div>
      <div><strong>Descrição:</strong> ${esc(o.descricao)}</div>
    </div>
    ${(o.fotos_urls || []).map(url => `<a ${fotoAttr(url)} target="_blank" rel="noopener"><img ${fotoAttr(url)} style="width:80px;height:80px;object-fit:cover;border-radius:8px;margin:0 6px 6px 0"></a>`).join('')}
    <div class="form-group" style="margin-top:12px"><label class="form-label">Status do equipamento após tratar</label>
      <select class="form-control" id="ocorr-status-equip">
        <option value="">Manter como está</option>
        <option value="disponivel">Disponível</option>
        <option value="manutencao">Enviar para manutenção</option>
        <option value="baixado">Baixar (perda/extravio confirmado)</option>
      </select></div>
  `
  document.getElementById('modal-ocorrencia').classList.add('aberto')
  assinarFotos(document.getElementById('ocorr-corpo'))
}

async function resolverOcorrencia() {
  const btn = document.getElementById('btn-resolver-ocorrencia')
  const _btnRest2 = btnEspera(btn)
  try {
    const statusEquip = document.getElementById('ocorr-status-equip').value || null
    const { error } = await db.rpc('biomonitor_tratar_ocorrencia_equipamento', {
      p_ocorrencia_id: _ocorrOcorrenciaId,
      p_novo_status: 'resolvida',
      p_novo_status_equipamento: statusEquip,
    })
    if (error) throw error
    toast('Ocorrência tratada', 'success')
    fecharModal('ocorrencia')
    await Promise.all([carregarOcorrencias(), carregarEquipamentos()])
  } catch (e) { toast(e.message || 'Erro ao tratar ocorrência', 'error') }
  finally {  _btnRest2() }
}

function abrirDevolucao(cautelaId) {
  const c = _cautelas.find(x => x.id === cautelaId)
  if (!c) return
  _devCautelaId = cautelaId
  const pendentes = (c.itens || []).filter(i => !i.devolvido_em)
  document.getElementById('dev-itens').innerHTML = pendentes.map(i => `
    <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer">
      <input type="checkbox" class="dev-item-chk" value="${i.equipamento_id}" style="width:auto" checked>
      ${esc(i.descricao)}${i.codigo ? ` <span class="mono" style="color:#9CA3AF">(${esc(i.codigo)})</span>` : ''}
    </label>`).join('')
  document.getElementById('dev-observacao').value = ''
  document.getElementById('modal-devolucao').classList.add('aberto')
}

async function confirmarDevolucao() {
  const ids = Array.from(document.querySelectorAll('.dev-item-chk:checked')).map(c => c.value)
  if (!ids.length) { toast('Selecione ao menos um equipamento', 'error'); return }
  const btn = document.getElementById('btn-confirmar-devolucao')
  const _btnRest3 = btnEspera(btn)
  try {
    const { error } = await db.rpc('biomonitor_devolver_equipamentos', {
      p_cautela_id: _devCautelaId,
      p_equipamento_ids: ids,
      p_observacao: document.getElementById('dev-observacao').value.trim() || null,
    })
    if (error) throw error
    toast('Devolução registrada', 'success')
    fecharModal('devolucao')
    await Promise.all([carregarEquipamentos(), carregarCautelas()])
  } catch (e) { toast(e.message || 'Erro ao devolver', 'error') }
  finally {  _btnRest3() }
}

function fecharModal(qual) {
  document.getElementById(`modal-${qual}`).classList.remove('aberto')
  if (qual === 'equip') { _editEquipId = null; _fotoEquipFile = null }
  if (qual === 'devolucao') _devCautelaId = null
  if (qual === 'validar') _valCautelaId = null
  if (qual === 'ocorrencia') _ocorrOcorrenciaId = null
}
</script>
</body>
</html>
