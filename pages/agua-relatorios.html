<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SIGUC-AC · Qualidade da Água — Painel e Relatórios</title>
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="../js/observability.js"></script>
<script src="../js/queryLogger.js"></script>
<script src="../js/config.js"></script>
<script src="../js/config-sistema.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/mapa-recorte.js"></script>
<script src="../js/biomonitor-pdf-fonts.js"></script>
<script src="../js/relatorio-cabecalho-pdf.js"></script>
<script src="../js/agua-iqa-visual.js"></script>
<script src="../js/agua-relatorio-dados.js"></script>
<script src="../js/agua-painel.js"></script>
<script src="../js/agua-relatorio-pdf.js"></script>
<script src="../js/agua-relatorio-pptx.js"></script>
<style>
/* ── Painel da Qualidade da Água ───────────────────────────────────
   Layout de cards inspirado no modelo de dashboard aprovado pelo
   usuário (cabeçalho com pílulas à direita, coluna estreita de KPIs,
   medidor semicircular, barras com valor rotulado, card de lista).
   As CORES são as do design system do projeto (nunca as do modelo) e
   os gráficos saem de js/agua-iqa-visual.js — a página não desenha
   SVG nem classifica faixa nenhuma. */

.adash { --adash-raio: 18px; --adash-azul: #2563A8; --adash-azul-esc: #164070; }

.adash-head { display:flex; flex-wrap:wrap; gap:14px; align-items:flex-start; margin-bottom:18px }
.adash-titulo { font-family:'Source Serif 4', Georgia, serif; font-size:30px; line-height:1.15; font-weight:700; color:var(--cinza-900); margin:0 }
.adash-sub { font-size:12.5px; color:var(--cinza-500); margin:4px 0 0; max-width:60ch }
.adash-head-acoes { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-left:auto }

.adash-pill {
  display:inline-flex; align-items:center; gap:7px; height:38px; padding:0 15px;
  border-radius:999px; border:1px solid var(--borda); background:var(--branco);
  color:var(--cinza-700); font-family:var(--font-sans); font-size:13px; font-weight:600;
  box-shadow:var(--sombra); cursor:pointer; transition:border-color .15s, box-shadow .15s;
}
.adash-pill:hover:not(:disabled) { border-color:var(--borda-forte); box-shadow:var(--sombra-md) }
.adash-pill:disabled { opacity:.5; cursor:not-allowed }
.adash-pill svg { width:16px; height:16px; flex-shrink:0 }
.adash-pill-primary { background:var(--adash-azul); border-color:var(--adash-azul); color:#fff }
.adash-pill-primary:hover:not(:disabled) { background:var(--adash-azul-esc); border-color:var(--adash-azul-esc) }
.adash-pill-ativo { border-color:var(--adash-azul); color:var(--adash-azul) }
.adash-pill-n {
  display:inline-flex; align-items:center; justify-content:center; min-width:18px; height:18px;
  padding:0 5px; border-radius:9px; background:var(--verde-medio); color:#fff; font-size:11px; font-weight:700;
}
.adash-pill-n[hidden] { display:none } /* idem .adash-filtros[hidden] abaixo */
.adash-pill-select { position:relative; padding-right:34px }
.adash-pill-select select {
  appearance:none; border:none; background:none; font:inherit; color:inherit;
  padding:0; margin:0; cursor:pointer; max-width:260px; outline:none;
}
.adash-pill-select .adash-chev { position:absolute; right:13px; pointer-events:none; color:var(--cinza-400) }

.adash-export { position:relative }
.adash-menu {
  position:absolute; right:0; top:44px; z-index:60; min-width:216px; padding:6px;
  background:var(--branco); border:1px solid var(--borda); border-radius:14px; box-shadow:var(--sombra-lg);
}
.adash-menu button {
  display:flex; align-items:center; gap:9px; width:100%; padding:9px 11px; border:none; background:none;
  border-radius:9px; font:inherit; font-size:13px; color:var(--cinza-700); text-align:left; cursor:pointer;
}
.adash-menu button:hover:not(:disabled) { background:var(--cinza-100) }
.adash-menu button:disabled { opacity:.45; cursor:not-allowed }
.adash-menu button svg { width:16px; height:16px; color:var(--cinza-500) }

.adash-filtros {
  display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end;
  background:var(--branco); border:1px solid var(--borda); border-radius:var(--adash-raio);
  padding:14px 16px; margin-bottom:16px; box-shadow:var(--sombra);
}
.adash-filtros label { display:flex; flex-direction:column; gap:4px; font-size:11.5px; color:var(--cinza-500); font-weight:600 }
.adash-filtros select {
  background:var(--branco); border:1px solid var(--borda-forte); color:var(--cinza-900);
  border-radius:10px; padding:8px 10px; font-size:13px; font-family:var(--font-sans); min-width:170px;
}
.adash-filtros select:disabled { opacity:.5; cursor:not-allowed }
/* `display:flex` acima vence o `[hidden]` de global.css (mesma
   especificidade, esta folha vem depois) — sem isto o painel de
   filtros nasce aberto e o botão nunca o fecha. */
.adash-filtros[hidden] { display:none }
.adash-filtros-limpar {
  margin-left:auto; align-self:center; background:none; border:none; color:var(--verde-medio);
  font-size:12px; font-weight:700; text-decoration:underline; cursor:pointer; padding:0;
}

/* Mapa — card de largura total, sempre visível (não depende de haver
   coleta no recorte: mostra onde os pontos ficam mesmo com 0 resultado). */
.adash-mapa-card { margin-bottom:16px }
.adash-mapa-wrap {
  height:380px; border-radius:14px; overflow:hidden; border:1px solid var(--borda);
  background:var(--cinza-50);
}
.adash-mapa-wrap #rl-mapa { height:100%; width:100% }
.leaflet-container { font-family:var(--font-sans); background:var(--cinza-50) }
.leaflet-tooltip { font-size:12px }

/* Grade de cards — proporções do modelo: coluna de KPIs estreita,
   dois cards grandes ao lado, faixa inferior 2:1. */
.adash-grid { display:grid; grid-template-columns:.86fr 1.05fr 1.2fr; gap:16px; align-items:stretch }
.adash-card {
  background:var(--branco); border:1px solid var(--borda); border-radius:var(--adash-raio);
  padding:18px 20px; box-shadow:var(--sombra); display:flex; flex-direction:column; min-width:0;
}
/* O card é um flex-column esticado até a altura da linha da grade; sem
   isto os filhos ENCOLHEM (flex-shrink padrão 1) e o conteúdo vaza por
   cima do vizinho — foi o que fazia o rótulo do medidor aparecer atrás
   dos chips de conformidade. */
.adash-card > * { flex-shrink:0 }
.adash-kpis { display:flex; flex-direction:column; gap:16px; min-width:0 }
.adash-card-escuro { background:linear-gradient(160deg,var(--adash-azul) 0%,var(--adash-azul-esc) 100%); border-color:var(--adash-azul-esc); color:#fff }
.adash-card-escuro .adash-card-tit, .adash-card-escuro .adash-card-pe { color:rgba(255,255,255,.72) }
.adash-card-escuro .adash-num { color:#fff }
.adash-card-topo { display:flex; align-items:flex-start; gap:10px; margin-bottom:12px }
.adash-card-tit { font-size:14.5px; font-weight:700; color:var(--cinza-900); margin:0 }
.adash-card-tit-sub { font-size:11.5px; color:var(--cinza-500); margin:2px 0 0 }
.adash-card-mais { margin-left:auto; color:var(--cinza-300); font-size:16px; letter-spacing:1px; line-height:1; user-select:none }
.adash-num { font-family:var(--font-display); font-size:38px; font-weight:700; line-height:1.05; color:var(--cinza-900) }
.adash-num-sm { font-size:30px }
.adash-num-linha { display:flex; align-items:baseline; flex-wrap:wrap; gap:10px }
.adash-card-pe { font-size:11.5px; color:var(--cinza-500); margin-top:auto; padding-top:12px }

.adash-delta {
  display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:999px;
  font-size:11.5px; font-weight:700; background:var(--sucesso-bg); color:var(--sucesso);
}
.adash-delta svg { width:12px; height:12px }
.adash-delta.baixa { background:var(--erro-bg); color:var(--erro) }
.adash-delta.neutro { background:var(--cinza-100); color:var(--cinza-600) }
.adash-card-escuro .adash-delta { background:rgba(255,255,255,.14); color:#D8F3DC }
.adash-card-escuro .adash-delta.baixa { background:rgba(252,165,165,.2); color:#FECACA }

.adash-chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px }
.adash-chip {
  border:1px solid var(--borda); background:var(--branco); color:var(--cinza-600);
  border-radius:999px; padding:5px 12px; font:inherit; font-size:11.5px; font-weight:600; cursor:pointer;
}
.adash-chip:hover { border-color:var(--borda-forte) }
.adash-chip.ativo { background:var(--adash-azul); border-color:var(--adash-azul); color:#fff }

.adash-lista { display:flex; flex-direction:column; gap:8px }
.adash-lista-linha {
  display:flex; align-items:center; gap:10px; padding:9px 12px;
  background:var(--cinza-50); border:1px solid var(--borda); border-radius:12px; font-size:12.5px;
}
.adash-lista-rank {
  display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; flex-shrink:0;
  border-radius:50%; background:var(--branco); border:1px solid var(--borda-forte);
  font-size:11px; font-weight:700; color:var(--cinza-600);
}
.adash-lista-nome { font-weight:600; color:var(--cinza-900); overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.adash-lista-sub { font-size:11px; color:var(--cinza-500) }
.adash-lista-val {
  margin-left:auto; flex-shrink:0; padding:4px 10px; border-radius:999px;
  background:var(--branco); border:1px solid var(--borda); font-size:11.5px; font-weight:700; color:var(--cinza-700);
}

.adash-barras { display:flex; gap:18px; align-items:stretch; min-width:0 }
.adash-barras-resumo { flex:0 0 168px; display:flex; flex-direction:column; justify-content:center }
.adash-barras-plot { flex:1; min-width:0; overflow-x:auto }
.adash-span2 { grid-column:span 2 }
.adash-span3 { grid-column:1 / -1 }

.adash-tabela { display:flex; flex-direction:column }
.adash-tabela-linha {
  display:grid; grid-template-columns:1.6fr .9fr .8fr .8fr; gap:10px; align-items:center;
  padding:9px 4px; border-top:1px solid var(--borda); font-size:12.5px;
}
.adash-tabela-linha:first-child { border-top:none }
.adash-vazio { text-align:center; padding:44px 20px; color:var(--cinza-400); font-size:13px }
.adash-aviso {
  display:flex; align-items:center; gap:8px; padding:10px 13px; border-radius:12px;
  background:var(--aviso-bg); border:1px solid #FDE68A; color:var(--aviso); font-size:12px; margin-bottom:14px;
}
.adash-aviso svg { width:16px; height:16px; flex-shrink:0 }

/* Base Legal e Conformidade */
.adash-legal-item { display:flex; flex-direction:column; gap:4px; padding:12px 14px; border-radius:10px; background:var(--cinza-50); border:1px solid var(--borda); margin-top:10px }
.adash-legal-norma { font-size:12.5px; font-weight:700; color:var(--cinza-900) }
.adash-legal-ementa { font-size:12px; color:var(--cinza-600); line-height:1.5 }
.adash-legal-fonte { font-size:11px; color:var(--cinza-500); font-style:italic }
.adash-legal-fonte a { color:var(--adash-azul); font-style:normal; font-weight:600; text-decoration:none }
.adash-legal-fonte a:hover { text-decoration:underline }

/* Entenda o cálculo do IQA (popup) */
.adash-iqa-p { font-size:12.5px; color:var(--cinza-700); line-height:1.6; margin:0 0 4px }
.adash-iqa-pesos { display:flex; flex-direction:column; gap:8px; margin-top:10px }
.adash-iqa-peso-linha { display:grid; grid-template-columns:1.5fr 2fr auto; align-items:center; gap:10px; font-size:12px }
.adash-iqa-peso-label { color:var(--cinza-700) }
.adash-iqa-peso-barra { height:8px; border-radius:4px; background:var(--cinza-100); overflow:hidden }
.adash-iqa-peso-fill { height:100%; background:var(--adash-azul); border-radius:4px }
.adash-iqa-peso-valor { font-weight:700; color:var(--cinza-900); text-align:right; min-width:32px }
.adash-iqa-faixas { display:flex; flex-direction:column; gap:6px; margin-top:8px }
.adash-iqa-faixa-linha { display:flex; align-items:center; gap:8px; font-size:12.5px }
.adash-iqa-faixa-dot { width:11px; height:11px; border-radius:50%; flex-shrink:0 }
.adash-iqa-faixa-nome { font-weight:600; color:var(--cinza-900); width:70px }
.adash-iqa-faixa-valor { color:var(--cinza-500) }

@media (max-width: 1180px) {
  .adash-grid { grid-template-columns:1fr 1fr }
  .adash-span2 { grid-column:span 2 }
}
@media (max-width: 760px) {
  .adash-grid { grid-template-columns:1fr }
  .adash-span2, .adash-span3 { grid-column:span 1 }
  .adash-head-acoes { margin-left:0; width:100% }
  .adash-barras { flex-direction:column }
  .adash-barras-resumo { flex:none }
  .adash-tabela-linha { grid-template-columns:1.4fr .8fr; row-gap:2px }
  .adash-mapa-wrap { height:280px }
}
</style>
</head>
<body>
<div id="app"></div>
<script>
;(async function () {
  const usuario = await carregarUsuario()
  if (!usuario) { window.location.href = '../index.html'; return }

  const { data: nivel } = await db.rpc('nivel_efetivo', { p_usuario: usuario.id, p_modulo_chave: 'agua' })
  if (!nivel || nivel === 'sem_acesso') {
    document.body.innerHTML = '<div style="padding:60px;text-align:center;font-family:\'DM Sans\',sans-serif;color:#6B7280">Você não tem acesso ao módulo Qualidade da Água.</div>'
    return
  }

  document.getElementById('app').innerHTML =
    gerarLayout('Qualidade da Água — Relatórios', 'agua-relatorios') +
    `<div class="fade-in adash">
      <div class="adash-head">
        <div>
          <h1 class="adash-titulo">Painel da Qualidade da Água</h1>
          <p class="adash-sub">Panorama do Acre inteiro ou de uma bacia hidrográfica, no recorte de campanhas
            escolhido — por padrão, todo o período disponível. IQA e conformidade CONAMA vêm prontos do
            banco — nunca recalculados aqui — e coleta em conferência aparece marcada, nunca escondida.</p>
        </div>
        <div class="adash-head-acoes">
          <div class="adash-pill adash-pill-select">
            <select id="rl-bacia" aria-label="Bacia hidrográfica"><option value="">Carregando...</option></select>
            <span class="adash-chev" data-icon="chevron-down"></span>
          </div>
          <button class="adash-pill" type="button" onclick="alternarExplicacaoIqa()" data-icon="help">Entenda o cálculo</button>
          <button class="adash-pill" id="rl-btn-filtros" type="button" onclick="alternarFiltros()" data-icon="sliders">
            Filtros <span class="adash-pill-n" id="rl-filtros-n" hidden>0</span>
          </button>
          <div class="adash-export">
            <button class="adash-pill adash-pill-primary" id="rl-btn-export" type="button" onclick="alternarExport()" disabled data-icon="download">Exportar</button>
            <div class="adash-menu" id="rl-export-menu" hidden>
              <button type="button" id="rl-btn-pdf" onclick="gerarPdf()" data-icon="file-text">Relatório em PDF</button>
              <button type="button" id="rl-btn-pptx" onclick="gerarPptx()" data-icon="monitor">Apresentação em PPTX</button>
            </div>
          </div>
        </div>
      </div>

      <div class="adash-filtros" id="rl-filtros" hidden>
        <label>Bacia<select id="rl-bacia-filtro" disabled><option value="">Todas</option></select></label>
        <label>Campanha inicial<select id="rl-de" disabled><option value="">—</option></select></label>
        <label>Campanha final<select id="rl-ate" disabled><option value="">—</option></select></label>
        <label>Rio<select id="rl-rio" disabled><option value="">Todos</option></select></label>
        <label>Status<select id="rl-status" disabled><option value="">Todos</option></select></label>
        <label>Faixa do IQA<select id="rl-iqa-faixa" disabled><option value="">Todas</option></select></label>
        <label>Conformidade CONAMA<select id="rl-conama" disabled><option value="">Todas</option></select></label>
        <button type="button" class="adash-filtros-limpar" onclick="limparFiltrosBusca()">Limpar filtros</button>
      </div>

      <div class="adash-card adash-mapa-card">
        <div class="adash-card-topo">
          <div><p class="adash-card-tit">Mapa dos pontos de coleta</p>
            <p class="adash-card-tit-sub" id="rl-mapa-sub">Carregando pontos...</p></div>
          <span class="adash-card-mais">•••</span>
        </div>
        <div class="adash-mapa-wrap"><div id="rl-mapa"></div></div>
      </div>

      <div id="rl-conteudo"><div class="adash-vazio">Carregando painel...</div></div>
    </div>
    <div class="modal-overlay" id="rl-iqa-modal"><div class="modal" style="max-width:560px">${aguaPainelExplicacaoIqaHTML()}</div></div>`

  bIconsAplicar(document.getElementById('app'))

  window.alternarExplicacaoIqa = function () {
    document.getElementById('rl-iqa-modal').classList.toggle('aberto')
  }

  const sel = id => document.getElementById(id)
  let _todasColetasResumo = []
  let _coletasBaciaAtual = []
  let _relatorioAtual = null
  let _labelBaciaAtual = ''
  // Estado só de EXIBIÇÃO (não altera o recorte do relatório exportado):
  // qual campanha o card de distribuição está mostrando e qual ponto o
  // gráfico de evolução está traçando.
  let _chipCampanha = null
  let _pontoSerie = null
  // Base legal adicional (Configurações → Qualidade da Água) — some
  // fica igual com qualquer filtro. A Resolução CONAMA 357/2005 é
  // texto fixo, sempre mostrada por js/agua-painel.js.
  let _baseLegal = []
  let _filtrosAbertos = false

  // ── Mapa ───────────────────────────────────────────────────────
  // Criação/atualização do mapa: js/agua-painel.js, compartilhado com
  // pages/agua-publico.html — nunca reimplementado aqui.
  const _mapaPainelCtl = aguaPainelMapaCriar('rl-mapa', 'rl-mapa-sub')

  let _pontosGeomPorId = {}
  try {
    const { data, error } = await db.from('agua_pontos_coleta').select('id,geom').eq('ativo', true)
    if (error) throw error
    ;(data || []).forEach(p => {
      const ll = geoLatLngDeGeom(p.geom)
      if (ll) _pontosGeomPorId[p.id] = ll
    })
  } catch (e) {
    console.warn('[agua-relatorios] pontos (coordenadas) indisponíveis:', e.message)
  }

  function atualizarMapaPainel(rel) { _mapaPainelCtl.atualizar(rel, _pontosGeomPorId) }

  // ── Carrega o seletor de bacias ──────────────────────────────────
  try {
    _todasColetasResumo = await aguaRelBuscarResumoBacias(db)
  } catch (e) {
    sel('rl-conteudo').innerHTML = `<div class="adash-vazio">Erro ao carregar bacias: ${esc(e.message)}</div>`
    return
  }
  const bacias = aguaRelListarBacias(_todasColetasResumo)
  const totalPontos = new Set(_todasColetasResumo.map(c => c.ponto_id)).size
  // "Acre todo" é o valor vazio ('') — mesmo valor que, no modelo
  // anterior, era "nenhuma bacia selecionada ainda". Aqui deixa de ser
  // um placeholder: é o escopo padrão, carregado de cara (regra pedida
  // pelo usuário — não obrigar a escolher bacia antes de ver algo).
  sel('rl-bacia').innerHTML = `<option value="">Acre todo (${totalPontos} ponto${totalPontos !== 1 ? 's' : ''})</option>` +
    bacias.map(b => `<option value="${esc(b.bacia)}">${esc(b.label)} (${b.nPontos} ponto${b.nPontos !== 1 ? 's' : ''})</option>`).join('')

  sel('rl-status').innerHTML += Object.entries(AGUA_REL_STATUS_LABEL)
    .map(([v, l]) => `<option value="${v}">${esc(l)}</option>`).join('')
  sel('rl-iqa-faixa').innerHTML += AGUA_IQA_FAIXA_ORDEM
    .map(f => `<option value="${esc(f)}">${esc(f)}</option>`).join('')
  sel('rl-conama').innerHTML += Object.entries(AGUA_REL_CONAMA_LABEL)
    .map(([v, l]) => `<option value="${v}">${esc(l)}</option>`).join('')

  sel('rl-bacia').addEventListener('change', carregarBacia)
  ;['rl-de', 'rl-ate', 'rl-bacia-filtro', 'rl-rio', 'rl-status', 'rl-iqa-faixa', 'rl-conama']
    .forEach(id => sel(id).addEventListener('change', recalcularRelatorio))

  // Fecha o menu de exportar ao clicar fora (mesma cortesia de qualquer
  // popover do projeto) — o painel de filtros NÃO fecha assim: é área
  // de trabalho, não menu.
  document.addEventListener('click', ev => {
    if (!ev.target.closest('.adash-export')) sel('rl-export-menu').hidden = true
  })

  window.alternarFiltros = function () {
    _filtrosAbertos = !_filtrosAbertos
    sel('rl-filtros').hidden = !_filtrosAbertos
    sel('rl-btn-filtros').classList.toggle('adash-pill-ativo', _filtrosAbertos)
  }
  window.alternarExport = function () {
    const m = sel('rl-export-menu'); m.hidden = !m.hidden
  }

  async function carregarBacia() {
    const chave = sel('rl-bacia').value // '' = Acre todo
    _relatorioAtual = null; _chipCampanha = null; _pontoSerie = null
    atualizarBotoes()
    const ehAcreTodo = !chave
    _labelBaciaAtual = ehAcreTodo ? 'Acre (todas as bacias)' : (chave === AGUA_REL_SEM_BACIA ? 'Sem bacia definida' : chave)
    sel('rl-conteudo').innerHTML = '<div class="adash-vazio">Carregando coletas...</div>'
    try {
      _coletasBaciaAtual = ehAcreTodo
        ? await aguaRelBuscarTodasColetas(db)
        : await aguaRelBuscarColetasDaBacia(db, chave === AGUA_REL_SEM_BACIA ? null : chave)
    } catch (e) {
      sel('rl-conteudo').innerHTML = `<div class="adash-vazio">Erro ao carregar coletas: ${esc(e.message)}</div>`
      return
    }
    const campanhas = aguaRelCampanhasDe(_coletasBaciaAtual)
    const opts = campanhas.map(c => `<option value="${c.campanha_id}">${esc(aguaRelLabelCampanha(c))}</option>`).join('')
    sel('rl-de').innerHTML = opts; sel('rl-ate').innerHTML = opts
    if (campanhas.length) {
      // Padrão = todo o período disponível (do 1º ao último campanha) —
      // o filtro de campanha é seletivo, mas nasce mostrando tudo.
      sel('rl-de').value = campanhas[0].campanha_id
      sel('rl-ate').value = campanhas[campanhas.length - 1].campanha_id
    }
    sel('rl-rio').innerHTML = '<option value="">Todos</option>' +
      aguaRelRiosDe(_coletasBaciaAtual).map(r => `<option value="${esc(r)}">${esc(r)}</option>`).join('')

    // Filtro de bacia da gaveta: só existe (e só habilita) quando o
    // cabeçalho está em "Acre todo" — se o cabeçalho já restringiu a
    // uma bacia, filtrar de novo por bacia seria redundante. É por
    // aqui que "quero mais detalhe" vira "aplico bacia + rio na gaveta"
    // sem precisar voltar ao cabeçalho.
    const camposBacia = sel('rl-bacia-filtro')
    if (ehAcreTodo) {
      camposBacia.innerHTML = '<option value="">Todas</option>' +
        aguaRelListarBacias(_coletasBaciaAtual).map(b => `<option value="${esc(b.bacia)}">${esc(b.label)}</option>`).join('')
      camposBacia.value = ''
      camposBacia.disabled = false
    } else {
      camposBacia.innerHTML = '<option value="">Todas</option>'
      camposBacia.value = ''
      camposBacia.disabled = true
    }

    sel('rl-status').value = ''; sel('rl-iqa-faixa').value = ''; sel('rl-conama').value = ''
    ;['rl-de', 'rl-ate', 'rl-rio', 'rl-status', 'rl-iqa-faixa', 'rl-conama'].forEach(id => { sel(id).disabled = false })
    recalcularRelatorio()
  }

  function recalcularRelatorio() {
    _relatorioAtual = aguaRelMontar(_coletasBaciaAtual, {
      campanhaDeId: sel('rl-de').value || null,
      campanhaAteId: sel('rl-ate').value || null,
      bacia: sel('rl-bacia-filtro').disabled ? null : (sel('rl-bacia-filtro').value || null),
      rio: sel('rl-rio').value || null,
      status: sel('rl-status').value || null,
      iqaFaixa: sel('rl-iqa-faixa').value || null,
      conamaStatus: sel('rl-conama').value || null,
    })
    // Estado de exibição que não sobrevive ao novo recorte é zerado —
    // um chip apontando para campanha que saiu do período mostraria
    // "0 coletas" sem explicação.
    const ids = new Set(_relatorioAtual.campanhas.map(c => c.campanha_id))
    if (_chipCampanha && !ids.has(_chipCampanha)) _chipCampanha = null
    if (_pontoSerie && !_relatorioAtual.pontos.some(p => p.ponto_id === _pontoSerie)) _pontoSerie = null
    renderPainel(_relatorioAtual)
    atualizarMapaPainel(_relatorioAtual)
    atualizarBotoes()
  }

  window.limparFiltrosBusca = function () {
    sel('rl-bacia-filtro').value = ''; sel('rl-rio').value = ''; sel('rl-status').value = ''
    sel('rl-iqa-faixa').value = ''; sel('rl-conama').value = ''
    recalcularRelatorio()
  }
  window.selecionarChipCampanha = function (id) { _chipCampanha = id || null; renderPainel(_relatorioAtual) }
  window.selecionarPontoSerie = function (id) { _pontoSerie = id || null; renderPainel(_relatorioAtual) }

  // Label da bacia que efetivamente vale para exportação — se o
  // cabeçalho está em "Acre todo" mas a gaveta narrowed por uma bacia,
  // é essa bacia narrowed que descreve o recorte, não "Acre todo".
  function labelBaciaExportacao() {
    const f = _relatorioAtual && _relatorioAtual.filtros.bacia
    if (f) return f === AGUA_REL_SEM_BACIA ? 'Sem bacia definida' : f
    return _labelBaciaAtual
  }

  function atualizarBotoes() {
    const tem = !!(_relatorioAtual && _relatorioAtual.coletas.length)
    sel('rl-btn-export').disabled = !tem
    sel('rl-btn-pdf').disabled = !tem
    sel('rl-btn-pptx').disabled = !tem
    if (!tem) sel('rl-export-menu').hidden = true
    const nFiltros = _relatorioAtual
      ? Object.values(_relatorioAtual.filtros).filter(Boolean).length : 0
    const chip = sel('rl-filtros-n')
    chip.hidden = nFiltros === 0
    chip.textContent = nFiltros
  }

  // ── Render do painel ────────────────────────────────────────────
  // Desenho dos cards: js/agua-painel.js, compartilhado com
  // pages/agua-publico.html — esta função só encaixa a string no DOM.
  function renderPainel(rel) {
    sel('rl-conteudo').innerHTML = aguaPainelHTML(rel, { chipCampanha: _chipCampanha, pontoSerie: _pontoSerie, baseLegal: _baseLegal })
    bIconsAplicar(sel('rl-conteudo'))
  }

  function periodoTxt(rel) {
    if (!rel.campanhas.length) return 'Sem campanhas no período'
    const ini = aguaRelLabelCampanha(rel.campanhas[0])
    const fim = aguaRelLabelCampanha(rel.campanhas[rel.campanhas.length - 1])
    return ini === fim ? ini : `${ini} — ${fim}`
  }

  async function prepararCabecalho() {
    const [cab, protocolo] = await Promise.all([getCabecalhoRelatorio(), gerarProtocolo()])
    cab.responsavel = {
      nome: appState.usuario?.nome_completo || appState.usuario?.email || 'Usuário',
      cargo: appState.perfil || '', orgao: cab.siglaSecr,
    }
    return { cab, protocolo }
  }

  function nomeArquivo() {
    return `qualidade-agua-${labelBaciaExportacao()}`.toLowerCase()
      .normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w-]+/g, '-')
  }

  window.gerarPdf = async function () {
    if (!_relatorioAtual) return
    sel('rl-export-menu').hidden = true
    const btn = sel('rl-btn-pdf')
    btn.disabled = true; const htmlOrig = btn.innerHTML
    btn.textContent = 'Gerando PDF...'
    try {
      const { cab, protocolo } = await prepararCabecalho()
      const pdf = await aguaRelMontarPdf(_relatorioAtual, labelBaciaExportacao(), periodoTxt(_relatorioAtual), cab, protocolo)
      aguaRelBaixarPdf(pdf, `${nomeArquivo()}.pdf`)
      toast('PDF gerado.', 'success')
    } catch (e) {
      toast('Erro ao gerar PDF: ' + e.message, 'error')
    } finally {
      btn.disabled = false; btn.innerHTML = htmlOrig; bIconsAplicar(btn)
    }
  }

  window.gerarPptx = async function () {
    if (!_relatorioAtual) return
    sel('rl-export-menu').hidden = true
    const btn = sel('rl-btn-pptx')
    btn.disabled = true; const htmlOrig = btn.innerHTML
    btn.textContent = 'Gerando PPTX...'
    try {
      const { protocolo } = await prepararCabecalho()
      const blob = await aguaRelMontarPptx(_relatorioAtual, labelBaciaExportacao(), periodoTxt(_relatorioAtual), protocolo)
      aguaRelBaixarPptx(blob, `${nomeArquivo()}.pptx`)
      toast('PPTX gerado.', 'success')
    } catch (e) {
      toast('Erro ao gerar PPTX: ' + e.message, 'error')
    } finally {
      btn.disabled = false; btn.innerHTML = htmlOrig; bIconsAplicar(btn)
    }
  }

  // Boot: escopo padrão = Acre todo, carregado de cara (sem exigir
  // escolha prévia de bacia — pedido do usuário). Base legal adicional
  // buscada antes do 1º render, pra não aparecer incompleta e depois
  // "pular" no card.
  try { _baseLegal = (await getConfigSistema()).agua?.base_legal || [] } catch (e) { console.warn('[agua-relatorios] base legal indisponível:', e.message) }
  await carregarBacia()
})()
</script>
</body>
</html>
