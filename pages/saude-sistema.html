<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SIGUC-AC · Saúde do Sistema</title>
<link rel="stylesheet" href="../css/global.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/observability.js"></script>
<script src="../js/queryLogger.js"></script>
<script src="../js/config.js"></script>
<script src="../js/layout.js"></script>
<style>
/* ── Cabeçalho de status geral ─────────────────────────── */
.saude-head {
  display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  padding:20px 22px; margin-bottom:20px;
}
.saude-head-dot {
  width:16px; height:16px; border-radius:50%; flex-shrink:0;
  box-shadow:0 0 0 5px rgba(82,183,136,.18);
}
.saude-head-info { flex:1; min-width:200px; }
.saude-head-label { font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:#9CA3AF; }
.saude-head-status { font-family:'Fraunces',Georgia,serif; font-size:24px; font-weight:700; color:#111827; line-height:1.1; }
.saude-head-meta { font-size:12px; color:#6B7280; margin-top:4px; }
.saude-head-acoes { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.saude-auto { display:inline-flex; align-items:center; gap:7px; font-size:12px; color:#6B7280; cursor:pointer; user-select:none; }
.saude-auto input { accent-color:var(--verde-c); width:15px; height:15px; }

/* ── Seções e linhas ───────────────────────────────────── */
.saude-secao-titulo {
  font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
  color:#6B7280; margin:0 0 10px 2px; display:flex; align-items:center; gap:8px;
}
.saude-secao-titulo svg { color:#9CA3AF; }
.saude-lista { display:flex; flex-direction:column; }
.saude-linha {
  display:flex; align-items:center; gap:12px; padding:13px 6px;
  border-bottom:1px solid #F3F4F6;
}
.saude-linha:last-child { border-bottom:none; }
.saude-dot { width:11px; height:11px; border-radius:50%; flex-shrink:0; }
.saude-nome { flex:1; font-size:13px; font-weight:600; color:#374151; }
.saude-nome small { display:block; font-weight:400; color:#9CA3AF; font-size:11px; margin-top:1px; }
.saude-pill {
  font-size:11px; font-weight:700; letter-spacing:.03em; text-transform:uppercase;
  padding:3px 9px; border-radius:20px; flex-shrink:0;
}
.saude-lat { font-size:12px; color:#6B7280; min-width:64px; text-align:right; font-variant-numeric:tabular-nums; }

/* estados */
.st-ok   { background:var(--verde-c); }
.st-lento{ background:var(--ouro); }
.st-fora { background:#EF4444; }
.st-load { background:#D1D5DB; animation:saude-pulse 1s ease-in-out infinite; }
@keyframes saude-pulse { 0%,100%{opacity:.35} 50%{opacity:1} }

.pill-ok   { background:#ECFDF5; color:#047857; }
.pill-lento{ background:#FEF7E6; color:#92722A; }
.pill-fora { background:#FEF2F2; color:#B91C1C; }
.pill-load { background:#F3F4F6; color:#9CA3AF; }

.head-ok   { background:var(--verde-c); box-shadow:0 0 0 5px rgba(82,183,136,.18); }
.head-lento{ background:var(--ouro);    box-shadow:0 0 0 5px rgba(201,168,76,.20); }
.head-fora { background:#EF4444;        box-shadow:0 0 0 5px rgba(239,68,68,.18); }
.head-load { background:#D1D5DB;        box-shadow:0 0 0 5px rgba(209,213,219,.25); }

/* ── Métricas ──────────────────────────────────────────── */
.saude-metricas { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; }
.saude-metrica { background:#F9FAFB; border:1px solid #F3F4F6; border-radius:10px; padding:12px 14px; }
.saude-metrica-label { font-size:11px; color:#9CA3AF; font-weight:600; letter-spacing:.04em; text-transform:uppercase; }
.saude-metrica-valor { font-family:'Fraunces',Georgia,serif; font-size:22px; font-weight:700; color:#111827; margin-top:3px; }
.saude-metrica-valor small { font-size:13px; font-weight:600; color:#6B7280; }

.saude-nota {
  margin-top:8px; background:#F0FDF4; border:1px solid #BBF7D0; border-radius:8px;
  padding:9px 12px; font-size:11px; color:#166534; line-height:1.5;
  display:flex; gap:7px; align-items:flex-start;
}
.saude-nota svg { flex-shrink:0; margin-top:1px; color:#16A34A; }
.saude-cards { display:flex; flex-direction:column; gap:16px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
// ── Limites de latência (ms) ────────────────────────────────────
const LIMITE_LENTO = 1500;     // serviços essenciais
const LIMITE_LENTO_EXT = 4000; // integrações externas (toleram mais)
const AUTO_MS = 30000;
let _autoTimer = null;

// Estado de cada verificação (preenchido pelos probes)
const VERIF = {
  database: null, auth: null, live: null, dbnav: null,
  car: null, prodes: null, focos: null, dof: null,
};
let _health = null; // resposta completa de /api/health

// ── Probe genérico ──────────────────────────────────────────────
async function probe(url, { method = 'GET', body = null, timeout = 8000, okFn = null, limite = LIMITE_LENTO, rota } = {}) {
  const start = performance.now();
  try {
    const ctrl = new AbortController();
    const tid = setTimeout(() => ctrl.abort(), timeout);
    const r = await fetch(url, {
      method,
      headers: body ? { 'Content-Type': 'application/json' } : undefined,
      body: body ? JSON.stringify(body) : undefined,
      signal: ctrl.signal,
      cache: 'no-store',
    });
    clearTimeout(tid);
    const ms = Math.round(performance.now() - start);
    const ok = okFn ? okFn(r) : r.ok;
    try { Observability?.recordLatency?.(rota || url, ms, r.status); } catch (_) {}
    if (!ok) return { status: 'fora', ms, detalhe: `HTTP ${r.status}` };
    return { status: ms > limite ? 'lento' : 'ok', ms };
  } catch (e) {
    const ms = Math.round(performance.now() - start);
    try { Observability?.recordLatency?.(rota || url, ms, 0); } catch (_) {}
    return { status: 'fora', ms, detalhe: e.name === 'AbortError' ? 'timeout' : (e.message || 'falha de rede') };
  }
}

// ── /api/health (banco + auth em uma chamada) ───────────────────
async function checarHealth() {
  const start = performance.now();
  try {
    const r = await fetch('/api/health', { cache: 'no-store' });
    const ms = Math.round(performance.now() - start);
    const j = await r.json();
    _health = { ...j, _ms: ms, _http: r.status };
    const mapear = (c) => {
      if (!c) return { status: 'fora', ms, detalhe: 'sem resposta' };
      if (c.status === 'healthy') return { status: c.latency > LIMITE_LENTO ? 'lento' : 'ok', ms: c.latency };
      return { status: 'fora', ms: c.latency, detalhe: c.error || 'unhealthy' };
    };
    VERIF.database = mapear(j.checks?.database);
    VERIF.auth = mapear(j.checks?.auth);
  } catch (e) {
    _health = null;
    VERIF.database = { status: 'fora', detalhe: 'endpoint /api/health indisponível' };
    VERIF.auth = { status: 'fora', detalhe: 'endpoint /api/health indisponível' };
  }
}

// ── Conexão direta navegador → Supabase ─────────────────────────
async function checarDbNav() {
  const start = performance.now();
  try {
    const { error } = await db.from('unidades_conservacao').select('id').limit(1);
    const ms = Math.round(performance.now() - start);
    if (error) return { status: 'fora', ms, detalhe: error.message };
    return { status: ms > LIMITE_LENTO ? 'lento' : 'ok', ms };
  } catch (e) {
    return { status: 'fora', ms: Math.round(performance.now() - start), detalhe: e.message };
  }
}

// ── Executa todas as verificações ───────────────────────────────
async function rodarVerificacoes() {
  marcarCarregando();
  // proxies: requisição mínima inválida → 400/403 = função no ar; 5xx/timeout = fora
  const proxyOk = (r) => r.status < 500;
  const [, live, dbnav, car, prodes, focos, dof] = await Promise.all([
    checarHealth(),
    probe('/api/health/live', { rota: '/api/health/live' }),
    checarDbNav(),
    probe('/api/car-proxy', { okFn: proxyOk, limite: LIMITE_LENTO_EXT, rota: 'car-proxy' }),
    probe('/api/prodes-proxy', { method: 'POST', body: {}, okFn: proxyOk, limite: LIMITE_LENTO_EXT, rota: 'prodes-proxy' }),
    probe('/api/focos-proxy', { okFn: proxyOk, limite: LIMITE_LENTO_EXT, rota: 'focos-proxy' }),
    probe('/api/dof-proxy', { okFn: proxyOk, limite: LIMITE_LENTO_EXT, rota: 'dof-proxy' }),
  ]);
  VERIF.live = live; VERIF.dbnav = dbnav;
  VERIF.car = car; VERIF.prodes = prodes; VERIF.focos = focos; VERIF.dof = dof;
  renderResultados();
}

// ── Render ──────────────────────────────────────────────────────
const ROTULO = {
  ok: 'Operacional', lento: 'Lento', fora: 'Fora do ar', load: 'Verificando',
};
function pillHtml(estado) {
  const st = estado?.status || 'load';
  const lat = estado?.ms != null ? `${estado.ms < 1000 ? estado.ms + ' ms' : (estado.ms / 1000).toFixed(1) + ' s'}` : '';
  const detalhe = estado?.detalhe ? esc(estado.detalhe) : '';
  return `
    <span class="saude-dot st-${st}"></span>
    <span class="saude-nome">__NOME__${detalhe ? `<small>${detalhe}</small>` : ''}</span>
    <span class="saude-pill pill-${st}">${ROTULO[st]}</span>
    <span class="saude-lat">${lat}</span>`;
}
function linha(nome, sub, estado) {
  const corpo = pillHtml(estado).replace('__NOME__', esc(nome) + (sub ? `<small>${esc(sub)}</small>` : ''));
  return `<div class="saude-linha">${corpo}</div>`;
}

function piorEstado(...estados) {
  if (estados.some(e => e?.status === 'fora')) return 'fora';
  if (estados.some(e => !e || e.status === 'load')) return 'load';
  if (estados.some(e => e?.status === 'lento')) return 'lento';
  return 'ok';
}

function marcarCarregando() {
  Object.keys(VERIF).forEach(k => { VERIF[k] = null; });
  renderResultados(true);
  const upd = document.getElementById('saude-update');
  if (upd) upd.textContent = 'Verificando serviços…';
}

function renderResultados(carregando) {
  // Cabeçalho geral (só pelos serviços essenciais)
  const geral = piorEstado(VERIF.database, VERIF.auth, VERIF.live, VERIF.dbnav);
  const statusTxt = { ok: 'Operacional', lento: 'Degradado', fora: 'Instável', load: 'Verificando…' }[geral];
  const dot = document.getElementById('saude-head-dot');
  const stt = document.getElementById('saude-head-status');
  if (dot) dot.className = `saude-head-dot head-${geral}`;
  if (stt) stt.textContent = statusTxt;

  const meta = document.getElementById('saude-head-meta');
  if (meta) {
    if (_health) {
      const up = _health.uptime != null ? formatarUptime(_health.uptime) : '—';
      meta.textContent = `versão ${_health.version || '—'} · uptime ${up} · latência ${_health.totalLatency ?? _health._ms}ms`;
    } else if (!carregando) {
      meta.textContent = 'Endpoint /api/health não respondeu';
    } else {
      meta.textContent = '';
    }
  }

  // Serviços essenciais
  const ess = document.getElementById('saude-essenciais');
  if (ess) ess.innerHTML =
    linha('Banco de dados', 'Supabase REST (servidor)', VERIF.database) +
    linha('Autenticação', 'Supabase Auth', VERIF.auth) +
    linha('API — liveness', '/api/health/live', VERIF.live) +
    linha('Conexão do navegador', 'Cliente Supabase desta sessão', VERIF.dbnav);

  // Integrações externas
  const ext = document.getElementById('saude-externas');
  if (ext) ext.innerHTML =
    linha('CAR / SICAR', 'Proxy geoserver.car.gov.br', VERIF.car) +
    linha('PRODES / TerraBrasilis', 'Proxy INPE', VERIF.prodes) +
    linha('Focos de calor', 'Proxy FIRMS / Supabase', VERIF.focos) +
    linha('DOF / IBAMA', 'Proxy dados abertos', VERIF.dof);

  // Métricas (sessão atual)
  const mt = document.getElementById('saude-metricas');
  if (mt) {
    let m = {};
    try { m = Observability?.getMetricsSummary?.() || {}; } catch (_) {}
    const erroPct = m.errorRate != null ? (parseFloat(m.errorRate) * 100).toFixed(1) : '0,0';
    const cachePct = m.cacheHitRate != null ? (parseFloat(m.cacheHitRate) * 100).toFixed(0) : '—';
    const fmtMs = (v) => v == null ? '—' : (v < 1000 ? `${v}<small> ms</small>` : `${(v / 1000).toFixed(1)}<small> s</small>`);
    mt.innerHTML = `
      <div class="saude-metrica"><div class="saude-metrica-label">Requisições</div><div class="saude-metrica-valor">${formatNum(m.requestsTotal || 0)}</div></div>
      <div class="saude-metrica"><div class="saude-metrica-label">Taxa de erro</div><div class="saude-metrica-valor">${erroPct.replace('.', ',')}<small> %</small></div></div>
      <div class="saude-metrica"><div class="saude-metrica-label">Latência p50</div><div class="saude-metrica-valor">${fmtMs(m.latencyP50)}</div></div>
      <div class="saude-metrica"><div class="saude-metrica-label">Latência p95</div><div class="saude-metrica-valor">${fmtMs(m.latencyP95)}</div></div>
      <div class="saude-metrica"><div class="saude-metrica-label">Latência p99</div><div class="saude-metrica-valor">${fmtMs(m.latencyP99)}</div></div>
      <div class="saude-metrica"><div class="saude-metrica-label">Cache hit-rate</div><div class="saude-metrica-valor">${cachePct}<small> %</small></div></div>`;
  }

  if (!carregando) {
    const upd = document.getElementById('saude-update');
    if (upd) upd.textContent = 'Última verificação: ' + new Date().toLocaleTimeString('pt-BR');
  }
}

function formatarUptime(seg) {
  seg = Math.floor(seg);
  const d = Math.floor(seg / 86400); seg %= 86400;
  const h = Math.floor(seg / 3600); seg %= 3600;
  const m = Math.floor(seg / 60);
  if (d) return `${d}d ${h}h`;
  if (h) return `${h}h ${m}m`;
  return `${m}m`;
}

// ── Auto-refresh ────────────────────────────────────────────────
function alternarAuto(ativo) {
  clearInterval(_autoTimer);
  if (ativo) _autoTimer = setInterval(rodarVerificacoes, AUTO_MS);
}

// ── Bootstrap ───────────────────────────────────────────────────
;(async function () {
  const usuario = await carregarUsuario();
  if (!usuario) { window.location.href = '../index.html'; return; }
  if (!['super_admin', 'gestor'].includes(usuario.perfil)) {
    document.getElementById('app').innerHTML =
      gerarLayout('Saúde do Sistema', 'saude-sistema') +
      `<div class="card" style="text-align:center;padding:48px"><p style="color:#9CA3AF">Acesso restrito a administradores e gestores.</p></div></div></div></div>`;
    carregarLogosSidebar();
    return;
  }

  document.getElementById('app').innerHTML =
    gerarLayout('Saúde do Sistema', 'saude-sistema') +
    `<div class="fade-in saude-cards">
      <div class="card saude-head">
        <span id="saude-head-dot" class="saude-head-dot head-load"></span>
        <div class="saude-head-info">
          <div class="saude-head-label">Status geral</div>
          <div id="saude-head-status" class="saude-head-status">Verificando…</div>
          <div id="saude-head-meta" class="saude-head-meta"></div>
        </div>
        <div class="saude-head-acoes">
          <label class="saude-auto"><input type="checkbox" id="saude-auto-chk" checked onchange="alternarAuto(this.checked)"> Atualizar a cada 30s</label>
          <button class="btn btn-primary" onclick="rodarVerificacoes()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
            Atualizar
          </button>
        </div>
      </div>

      <div class="card">
        <div class="saude-secao-titulo">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
          Serviços essenciais
        </div>
        <div id="saude-essenciais" class="saude-lista"></div>
      </div>

      <div class="card">
        <div class="saude-secao-titulo">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          Integrações externas
        </div>
        <div id="saude-externas" class="saude-lista"></div>
        <div class="saude-nota">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
          As integrações externas verificam a disponibilidade do <em>proxy</em> (endpoint no ar), sem consultar os serviços de origem a cada atualização para não sobrecarregá-los.
        </div>
      </div>

      <div class="card">
        <div class="saude-secao-titulo">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          Métricas (sessão atual)
        </div>
        <div id="saude-metricas" class="saude-metricas"></div>
      </div>

      <div id="saude-update" style="text-align:center;font-size:12px;color:#9CA3AF;padding:2px 0 8px"></div>
    </div>` +
    '</div></div></div>';

  carregarLogosSidebar();
  await rodarVerificacoes();
  alternarAuto(true);
})();
</script>
</body>
</html>
