name: Meio físico do Acre (IBGE + ANA)

# Fase 4 do plano em docs/mapa-ucs/plano-medicao-comparacao.md: camadas de
# geologia, geomorfologia, pedologia, vegetação, clima (IBGE) e drenagem/
# ottobacias (ANA) para o Mapa das UCs. Roda FORA das sessões de
# desenvolvimento porque os servidores do IBGE e da ANA respondem 403 no
# proxy delas; o runner do GitHub alcança os dois.

on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'gerar = baixa, recorta e grava data/meio_fisico; descobrir/descobrir-ana = só lista'
        type: choice
        options: [gerar, descobrir, descobrir-ana]
        default: gerar
  push:
    # Mudar o script ou o workflow já roda — é como se testa de uma branch
    # (workflow_dispatch só existe na main).
    paths:
      - 'scripts/meio_fisico.py'
      - '.github/workflows/meio-fisico.yml'

concurrency:
  group: meio-fisico
  cancel-in-progress: false

jobs:
  meio-fisico:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write   # grava data/meio_fisico/ no próprio branch (commit do bot)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - name: Dependências
        run: pip install 'requests==2.32.5' 'shapely==2.1.2' 'pyproj==3.7.2'
      - name: Autoteste (sem rede)
        run: python scripts/meio_fisico.py --autoteste
      - name: Rodar
        env:
          MODO: ${{ inputs.modo || 'gerar' }}
        run: |
          case "$MODO" in
            gerar)         python scripts/meio_fisico.py --gerar ;;
            descobrir)     python scripts/meio_fisico.py --descobrir ;;
            descobrir-ana) python scripts/meio_fisico.py --descobrir-ana ;;
          esac
      - name: Gravar no branch
        if: ${{ (inputs.modo || 'gerar') == 'gerar' }}
        # Commit feito com GITHUB_TOKEN não dispara workflow — sem laço.
        run: |
          git add data/meio_fisico
          if git diff --cached --quiet; then echo "Sem mudança nos arquivos."; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "dados: meio físico do Acre (IBGE), gerado por scripts/meio_fisico.py"
          # o branch pode ter andado enquanto a geração rodava
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

