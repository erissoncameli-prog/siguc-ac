# ── SIGUC Frota — build do APK Android (Capacitor) ───────
# Dispara:
#   • manualmente (workflow_dispatch) → SEMPRE publica um Release com o
#     .apk anexado (link direto, sem ZIP, sem login). Informe a versão
#     no input; se deixar vazio, auto-incrementa o patch do último Release.
#   • tag frota-v* (ex.: frota-v1.0.0) → APK anexado a um Release
#
# (o .apk também é salvo como artifact do run, para download interno)
#
# Assinatura: reutiliza os secrets do Brigadas (ANDROID_KEYSTORE_B64,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD).
# Como o applicationId é diferente (br.gov.ac.sema.siguc.frota), os
# dois apps convivem no mesmo aparelho. Sem os secrets, o APK sai assinado
# com a chave de debug do runner (instala, mas a assinatura muda a cada build).

name: Frota APK

on:
  workflow_dispatch:
    inputs:
      versao:
        description: 'Versão do Release (ex.: 1.1.0). Vazio = auto-incrementa o patch do último Release.'
        required: false
        default: ''
  push:
    tags:
      - 'frota-v*'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-frota/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        working-directory: app-frota
        run: npm ci

      - name: Definir versão
        env:
          VERSAO_INPUT: ${{ inputs.versao }}
          GH_TOKEN: ${{ github.token }}
        run: |
          REF="${GITHUB_REF_NAME}"
          if [[ "$REF" == frota-v* ]]; then
            # disparo por tag
            VER="${REF#frota-v}"
          elif [ -n "$VERSAO_INPUT" ]; then
            # versão informada no disparo manual
            VER="$VERSAO_INPUT"
          else
            # disparo manual sem versão → auto-incrementa o patch do último Release
            ULTIMA=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
                       --json tagName,isDraft,isPrerelease \
                       --jq '.[] | select(.isDraft==false and .isPrerelease==false) | .tagName' \
                     | grep -E '^frota-v[0-9]+\.[0-9]+\.[0-9]+$' \
                     | sed 's/^frota-v//' | sort -V | tail -1)
            [ -z "$ULTIMA" ] && ULTIMA="0.0.0"
            IFS=. read -r MA MI PA <<< "$ULTIMA"
            VER="$MA.$MI.$((PA + 1))"
          fi
          echo "APP_VERSION_NAME=$VER" >> "$GITHUB_ENV"
          # disparo manual e tag sempre publicam Release (link direto do .apk)
          echo "PUBLICAR_RELEASE=true" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "Versão definida: $VER (build ${GITHUB_RUN_NUMBER})"

      - name: Montar www/ e sincronizar Android
        working-directory: app-frota
        run: |
          node scripts/build-www.mjs
          npx cap sync android

      - name: Preparar keystore (se configurada)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Keystore de release configurada."
          else
            echo "::warning::Secrets de assinatura ausentes — APK sairá com chave de debug."
          fi

      - name: Compilar APK (release)
        working-directory: app-frota/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/siguc-frota.apk"

      - name: Publicar APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: siguc-frota-apk
          path: ${{ runner.temp }}/siguc-frota.apk
          if-no-files-found: error

      - name: Publicar Release (tag ou dispatch com versão)
        if: env.PUBLICAR_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="frota-v$APP_VERSION_NAME"
          # gh release create cria a tag no commit atual se ela não existir
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "SIGUC Frota $APP_VERSION_NAME" \
            --notes "APK do app de campo SIGUC Frota (versão $APP_VERSION_NAME, build $APP_VERSION_CODE)." \
            "$RUNNER_TEMP/siguc-frota.apk" || \
          gh release upload "$TAG" "$RUNNER_TEMP/siguc-frota.apk" --clobber
