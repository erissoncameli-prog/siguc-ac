name: TerraClass por UC

# Recorte do TerraClass pelo limite de cada UC (migration 348) e o
# diagnóstico do acumulado 2007 por município. Roda FORA do banco de
# propósito: geometria de camada grande pelo pg_net reiniciou a produção
# (ver CLAUDE.md, 25/09/2026). Grava só totais, pela API de
# gerenciamento, com o mesmo SUPABASE_ACCESS_TOKEN do deploy.
#
# Uma UC por job: o WFS do TerraClass é lento (~1.000 polígonos a cada
# 1,5 min no 1º run) e a RESEX Chico Mendes tem ~26 mil — todas num job
# só não caberiam no limite de tempo. max-parallel 3 para não martelar o
# servidor do INPE.

on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'ucs = calcula e grava; seco = calcula sem gravar; d2007 = diagnóstico do acumulado 2007'
        type: choice
        options: [ucs, seco, d2007]
        default: ucs
      uc:
        description: 'id da UC (vazio = todas)'
        required: false
        default: ''
  schedule:
    # TerraClass sai a cada 2 anos; conferir 1×/mês é folga de sobra.
    - cron: '17 6 6 * *'

concurrency:
  group: terraclass-uc
  cancel-in-progress: false

permissions:
  contents: read

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ucs: ${{ steps.lista.outputs.ucs }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - name: Dependências
        run: pip install 'shapely==2.1.2' 'pyproj==3.7.2' 'requests==2.32.5'
      - name: Autoteste (sem rede)
        run: python scripts/terraclass_uc.py --autoteste
      - name: Lista de UCs
        id: lista
        env:
          UC: ${{ inputs.uc }}
          MODO: ${{ inputs.modo || 'ucs' }}
        run: |
          if [ "$MODO" = "d2007" ]; then echo 'ucs=[]' >> "$GITHUB_OUTPUT"
          elif [ -n "$UC" ]; then
            [[ "$UC" =~ ^[0-9a-f-]{36}$ ]] || { echo "id de UC inválido"; exit 1; }
            echo "ucs=[\"$UC\"]" >> "$GITHUB_OUTPUT"
          else echo "ucs=$(python scripts/terraclass_uc.py --listar)" >> "$GITHUB_OUTPUT"; fi

  recorte:
    needs: preparar
    if: needs.preparar.outputs.ucs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        uc: ${{ fromJSON(needs.preparar.outputs.ucs) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - name: Dependências
        run: pip install 'shapely==2.1.2' 'pyproj==3.7.2' 'requests==2.32.5'
      - name: Recortar e gravar
        env:
          UC: ${{ matrix.uc }}
          MODO: ${{ inputs.modo || 'ucs' }}
        run: |
          if [ "$MODO" = "seco" ]; then python scripts/terraclass_uc.py --seco --uc "$UC"
          else python scripts/terraclass_uc.py --uc "$UC"; fi

  d2007:
    needs: preparar
    if: inputs.modo == 'd2007'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - name: Dependências
        run: pip install 'shapely==2.1.2' 'pyproj==3.7.2' 'requests==2.32.5'
      - name: Diagnóstico
        run: python scripts/terraclass_uc.py --d2007
