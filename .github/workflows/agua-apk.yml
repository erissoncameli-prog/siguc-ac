# ── SIGUC Qualidade da Água — build do APK Android (Capacitor) ─
# Dispara:
#   • manualmente (workflow_dispatch) → SEMPRE publica um Release com o
#     .apk anexado (link direto, sem ZIP, sem login). Informe a versão
#     no input; se deixar vazio, auto-incrementa o patch do último Release.
#   • tag agua-v* (ex.: agua-v1.0.0) → APK anexado a um Release
#
# (o .apk também é salvo como artifact do run, para download interno)
#
# Assinatura: configure os secrets ANDROID_KEYSTORE_B64,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS e ANDROID_KEY_PASSWORD
# (mesmos secrets dos outros 2 apps). Sem eles, o APK sai assinado com a
# chave de debug do runner (instala, mas a assinatura muda a cada build).
#
# Molde de .github/workflows/brigadas-apk.yml. Infraestrutura pronta,
# NÃO disparada nesta entrega (regra do projeto: só gerar quando pedido
# ou já houver acúmulo suficiente).

name: Água APK

on:
  workflow_dispatch:
    inputs:
      versao:
        description: 'Versão do Release (ex.: 1.0.0). Vazio = auto-incrementa o patch do último Release.'
        required: false
        default: ''
  push:
    tags:
      - 'agua-v*'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-agua/package-lock.json

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        working-directory: app-agua
        run: npm ci

      - name: Definir versão
        env:
          VERSAO_INPUT: ${{ inputs.versao }}
          GH_TOKEN: ${{ github.token }}
        run: |
          REF="${GITHUB_REF_NAME}"
          if [[ "$REF" == agua-v* ]]; then
            VER="${REF#agua-v}"
          elif [ -n "$VERSAO_INPUT" ]; then
            VER="$VERSAO_INPUT"
          else
            ULTIMA=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
                       --json tagName,isDraft,isPrerelease \
                       --jq '.[] | select(.isDraft==false and .isPrerelease==false) | .tagName' \
                     | grep -E '^agua-v[0-9]+\.[0-9]+\.[0-9]+$' \
                     | sed 's/^agua-v//' | sort -V | tail -1)
            [ -z "$ULTIMA" ] && ULTIMA="0.0.0"
            IFS=. read -r MA MI PA <<< "$ULTIMA"
            VER="$MA.$MI.$((PA + 1))"
          fi
          echo "APP_VERSION_NAME=$VER" >> "$GITHUB_ENV"
          echo "PUBLICAR_RELEASE=true" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "Versão definida: $VER (build ${GITHUB_RUN_NUMBER})"

      - name: Montar www/ e sincronizar Android
        working-directory: app-agua
        run: |
          node scripts/build-www.mjs
          npx cap sync android

      - name: Preparar keystore (se configurada)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Keystore de release configurada."
          else
            echo "::warning::Secrets de assinatura ausentes — APK sairá com chave de debug."
          fi

      - name: Compilar APK (release)
        working-directory: app-agua/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/siguc-agua.apk"

      - name: Publicar APK como artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: siguc-agua-apk
          path: ${{ runner.temp }}/siguc-agua.apk
          if-no-files-found: error

      - name: Publicar Release (tag ou dispatch com versão)
        if: env.PUBLICAR_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="agua-v$APP_VERSION_NAME"
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "SIGUC Água $APP_VERSION_NAME" \
            --notes "APK do app de campo SIGUC Qualidade da Água (versão $APP_VERSION_NAME, build $APP_VERSION_CODE)." \
            "$RUNNER_TEMP/siguc-agua.apk" || \
          gh release upload "$TAG" "$RUNNER_TEMP/siguc-agua.apk" --clobber
