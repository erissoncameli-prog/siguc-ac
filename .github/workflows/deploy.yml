name: Deploy SIGUC-AC

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: atqtybcsvepdabsvgaly

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Aplicar migrations pendentes
        run: supabase db push --project-ref $SUPABASE_PROJECT_ID

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref $SUPABASE_PROJECT_ID

      - name: Configurar cron de alertas (06h BRT = 09h UTC)
        run: |
          supabase db execute --project-ref $SUPABASE_PROJECT_ID --command "
            SELECT cron.schedule(
              'monitorar-alertas-diario',
              '0 9 * * *',
              \$\$
                SELECT net.http_post(
                  url := 'https://atqtybcsvepdabsvgaly.supabase.co/functions/v1/monitorar-alertas',
                  headers := json_build_object(
                    'Authorization', 'Bearer ' || current_setting('app.service_role_key', true),
                    'Content-Type', 'application/json'
                  )::jsonb,
                  body := '{}'::jsonb
                );
              \$\$
            ) ON CONFLICT (jobname) DO NOTHING;
          "
