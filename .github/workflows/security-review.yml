name: Revisão de segurança por IA (Claude)

# Action oficial da Anthropic: o Claude analisa o diff em busca de
# vulnerabilidades (RLS, exposição de PII, SECURITY DEFINER, injeção,
# vazamento de chave, etc.) e comenta no PR.
#
# DESATIVADO (consumo de créditos da API Anthropic) — só roda se
# disparado manualmente via workflow_dispatch. Para reativar o
# gatilho automático em PRs, trocar o bloco `on:` de volta para:
#   pull_request:
#     types: [opened, synchronize, reopened]
#
# Requer o secret ANTHROPIC_API_KEY. Sem ele, o job se autodesativa.

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  security-review:
    runs-on: ubuntu-latest
    env:
      TEM_CHAVE: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Aviso se sem chave
        if: ${{ env.TEM_CHAVE != 'true' }}
        run: echo "::notice::ANTHROPIC_API_KEY ausente — revisão de segurança por IA desativada. Adicione o secret para ativar."

      - name: Claude Security Review
        if: ${{ env.TEM_CHAVE == 'true' }}
        uses: anthropics/claude-code-security-review@main
        with:
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          comment-pr: true
          exclude-directories: 'data,docs'
